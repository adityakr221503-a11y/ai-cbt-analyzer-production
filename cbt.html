<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.timer{
background:#eef2ff;
color:#3730a3;
padding:9px 14px;
border-radius:9px;
font-weight:800;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
color:#64748b;
font-weight:700;
margin-bottom:12px;
}

.question{
font-size:21px;
font-weight:800;
line-height:1.55;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:11px;
text-align:left;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
font-family:inherit;
border:0;
border-radius:10px;
padding:13px;
font-weight:700;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.palette button{
background:#e2e8f0;
padding:10px 5px;
}

.palette .answered{
background:#bbf7d0;
}

.palette .review{
background:#fde68a;
}

.palette .current{
outline:3px solid #4f46e5;
}

#result{
display:none;
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:10px 0;
}

.result-actions{
margin-top:10px;
}

.result-actions button{
width:100%;
margin-top:8px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.skipped{
border-left:5px solid #f59e0b;
}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.analysis-type{
font-weight:800;
color:#3730a3;
}

.status-correct{
color:#15803d;
font-weight:800;
}

.status-incorrect{
color:#dc2626;
font-weight:800;
}

.status-skipped{
color:#d97706;
font-weight:800;
}

.info{
padding:12px;
background:#f8fafc;
border-radius:10px;
line-height:1.5;
}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.question{
font-size:19px;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<div id="timer" class="timer">
30:00
</div>

</div>

</header>
<div class="container">

<main class="card">

<section id="testScreen">

<div id="questionNumber"
class="question-number">
Loading...
</div>

<div id="question"
class="question">
Loading question...
</div>

<div id="options">
</div>

<div class="buttons">

<button
class="secondary"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
onclick="markReview()">
Mark Review
</button>

<button
class="secondary"
onclick="clearAnswer()">
Clear
</button>

<button
id="nextButton"
class="primary"
onclick="nextQuestion()">
Next
</button>

</div>

</section>


<section id="result">

<h2>🎯 Test Completed</h2>

<div
id="score"
class="score">
</div>

<p id="summary"></p>

<div class="result-actions">

<button
id="retryButton"
class="primary"
style="display:none"
onclick="openRetry()">
🔄 Retry Mistakes
</button>

<button
class="secondary"
onclick="location.href='mistake.html'">
🧠 Mistake Bank
</button>

<button
class="secondary"
onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

<div id="review"></div>

</section>

</main>


<aside class="card">

<h3>Question Palette</h3>

<div
id="palette"
class="palette">
</div>

<button
class="danger"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>

<script>
"use strict";
    /* =====================================================
   PDF → CBT QUESTION LOADING
===================================================== */

let questions = [];


function loadQuestions(){

    const saved =
        localStorage.getItem("pdfCbtQuestions");

    if(!saved){

        return false;
    }

    try{

        const data =
            JSON.parse(saved);

        if(!Array.isArray(data)){

            return false;
        }


        questions =
            data
            .filter(function(q){

                return q &&
                    q.question &&
                    Array.isArray(q.options) &&
                    q.options.length >= 2 &&
                    Number.isInteger(
                        Number(q.answer)
                    );

            })
            .map(function(q){

                return {

                    id:
                        q.id ||
                        "pdf-" +
                        Date.now(),

                    subject:
                        q.subject ||
                        "Imported",

                    topic:
                        q.topic ||
                        q.section ||
                        "PDF Import",

                    question:
                        String(q.question),

                    options:
                        q.options.map(
                            String
                        ),

                    answer:
                        Number(q.answer),

                    solution:
                        q.solution ||
                        q.explanation ||
                        "Review this question.",

                    explanation:
                        q.explanation ||
                        "",

                    pdfPage:
                        q.pdfPage ||
                        "",

                    source:
                        q.source ||
                        "PDF Import"

                };

            });


        return questions.length > 0;

    }
    catch(error){

        console.error(
            "PDF CBT loading error:",
            error
        );

        return false;
    }
}


/* =====================================================
   TEST STATE
===================================================== */

let current = 0;

let answers = [];

let marked = [];

let submitted = false;

let timeLeft = 1800;

let timerInterval = null;


/* =====================================================
   INITIALIZE TEST
===================================================== */

function initialize(){

    answers =
        new Array(
            questions.length
        ).fill(null);

    marked =
        new Array(
            questions.length
        ).fill(false);

    current = 0;

    submitted = false;

    timeLeft = 1800;

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        );

    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        );
}


function startTimer(){

    clearInterval(
        timerInterval
    );

    updateTimer();


    timerInterval =
        setInterval(function(){

            if(submitted){

                clearInterval(
                    timerInterval
                );

                return;
            }


            timeLeft--;


            if(timeLeft <= 0){

                timeLeft = 0;

                updateTimer();

                clearInterval(
                    timerInterval
                );

                submitTest();

                return;
            }


            updateTimer();

        },1000);
}
    /* ==============================
SUBMIT TEST
============================== */

function submitTest(){

    if(submitted){
        return;
    }

    if(questions.length === 0){
        alert("No questions are available.");
        return;
    }

    const unanswered =
        answers.filter(function(a){
            return a === null;
        }).length;

    if(unanswered > 0){

        const confirmSubmit =
            confirm(
                "You still have " +
                unanswered +
                " unanswered question(s).\n\n" +
                "Do you want to submit the test?"
            );

        if(!confirmSubmit){
            return;
        }
    }

    submitted = true;

    clearInterval(timerInterval);

    let correct = 0;
    let incorrect = 0;
    let skipped = 0;

    const wrongQueue = [];

    const reviewBox =
        document.getElementById("review");

    reviewBox.innerHTML = "";

    questions.forEach(function(q,index){

        const selected =
            answers[index];

        let status = "";
        let statusClass = "";
        let itemClass = "";

        if(selected === null){

            skipped++;

            status = "Skipped";
            statusClass = "status-skipped";
            itemClass = "skipped";

        }
        else if(selected === q.answer){

            correct++;

            status = "Correct";
            statusClass = "status-correct";
            itemClass = "correct";

        }
        else{

            incorrect++;

            status = "Incorrect";
            statusClass = "status-incorrect";
            itemClass = "incorrect";

            const mistake =
                classifyMistake(
                    q,
                    selected
                );

            wrongQueue.push({

                id:
                    q.id ||
                    "retry-" +
                    Date.now() +
                    "-" +
                    index,

                question:
                    q.question,

                options:
                    q.options,

                subject:
                    q.subject ||
                    "Imported",

                topic:
                    q.topic ||
                    "PDF Import",

                correctIndex:
                    q.answer,

                correctAnswer:
                    q.options[q.answer],

                selectedIndex:
                    selected,

                selectedAnswer:
                    q.options[selected],

                solution:
                    q.solution ||
                    q.explanation ||
                    "",

                mistakeType:
                    mistake.type,

                mistakeReason:
                    mistake.reason,

                source:
                    "CBT"

            });

        }

        const item =
            document.createElement("div");

        item.className =
            "review-item " +
            itemClass;

        let html = "";

        html +=
            "<strong>Question " +
            (index + 1) +
            "</strong>";

        html +=
            "<div style='margin-top:8px'>" +
            q.question +
            "</div>";

        html +=
            "<p class='" +
            statusClass +
            "'>" +
            status +
            "</p>";

        if(selected !== null){

            html +=
                "<div><strong>Your answer:</strong> " +
                q.options[selected] +
                "</div>";

        }
        else{

            html +=
                "<div><strong>Your answer:</strong> Not answered</div>";

        }

        if(selected !== q.answer){

            html +=
                "<div style='margin-top:6px'>" +
                "<strong>Correct answer:</strong> " +
                q.options[q.answer] +
                "</div>";

        }

        if(q.solution){

            html +=
                "<div class='analysis'>" +
                "<div class='analysis-type'>Solution</div>" +
                "<div style='margin-top:6px'>" +
                q.solution +
                "</div>" +
                "</div>";

        }

        if(
            selected !== null &&
            selected !== q.answer
        ){

            const mistake =
                classifyMistake(
                    q,
                    selected
                );

            html +=
                "<div class='analysis'>" +
                "<div class='analysis-type'>" +
                mistake.type +
                "</div>" +
                "<div style='margin-top:6px'>" +
                mistake.reason +
                "</div>" +
                "</div>";

        }

        item.innerHTML = html;

        reviewBox.appendChild(item);

    });


    const total =
        questions.length;

    const percentage =
        total > 0
        ? Math.round(
            (correct / total) * 100
          )
        : 0;


    document.getElementById(
        "score"
    ).textContent =
        correct +
        " / " +
        total;


    document.getElementById(
        "summary"
    ).textContent =
        "Correct: " +
        correct +
        " • Incorrect: " +
        incorrect +
        " • Skipped: " +
        skipped +
        " • Accuracy: " +
        percentage +
        "%";


    /*
    ==============================
    SAVE RETRY QUEUE
    ==============================
    */

    if(wrongQueue.length > 0){

        localStorage.setItem(
            "cbtAnalyzer.retryQueue",
            JSON.stringify(wrongQueue)
        );

        localStorage.setItem(
            "cbtRetryQuestion",
            JSON.stringify(wrongQueue[0])
        );

        localStorage.setItem(
            "cbtRetryStartedAt",
            String(Date.now())
        );

    }
    else{

        localStorage.removeItem(
            "cbtAnalyzer.retryQueue"
        );

        localStorage.removeItem(
            "cbtRetryQuestion"
        );

    }


    /*
    ==============================
    SAVE MISTAKE BANK
    ==============================
    */

    saveMistakes(wrongQueue);


    /*
    ==============================
    SAVE TEST HISTORY
    ==============================
    */

    saveTestHistory(
        correct,
        incorrect,
        skipped,
        percentage
    );


    /*
    ==============================
    SHOW RESULT
    ==============================
    */

    document.getElementById(
        "testScreen"
    ).style.display = "none";

    document.getElementById(
        "result"
    ).style.display = "block";


    updateRetryButton(
        incorrect
    );

}


/* ==============================
SAVE MISTAKES
============================== */

function saveMistakes(wrongQueue){

    let existing = [];

    try{

        existing =
            JSON.parse(
                localStorage.getItem(
                    "cbtMistakeBank"
                )
            ) || [];

        if(!Array.isArray(existing)){
            existing = [];
        }

    }
    catch(error){

        existing = [];

    }


    wrongQueue.forEach(function(mistake){

        const item = {
            ...mistake,

            createdAt:
                new Date().toISOString(),

            mastered:false,

            retryCount:0
        };


        const existingIndex =
            existing.findIndex(function(old){

                return old.id === item.id ||
                    (
                        old.question === item.question &&
                        old.correctIndex === item.correctIndex
                    );

            });


        if(existingIndex >= 0){

            existing[existingIndex] = {
                ...existing[existingIndex],
                ...item
            };

        }
        else{

            existing.push(item);

        }

    });


    localStorage.setItem(
        "cbtMistakeBank",
        JSON.stringify(existing)
    );

}


/* ==============================
SAVE TEST HISTORY
============================== */

function saveTestHistory(
    correct,
    incorrect,
    skipped,
    percentage
){

    let history = [];

    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "cbtTestHistory"
                )
            ) || [];

        if(!Array.isArray(history)){
            history = [];
        }

    }
    catch(error){

        history = [];

    }


    const record = {

        id:
            "test-" +
            Date.now(),

        date:
            new Date().toISOString(),

        total:
            questions.length,

        correct:
            correct,

        incorrect:
            incorrect,

        skipped:
            skipped,

        percentage:
            percentage,

        source:
            "PDF CBT",

        subject:
            questions[0]?.subject ||
            "Imported",

        duration:
            1800 - timeLeft

    };


    history.push(record);


    localStorage.setItem(
        "cbtTestHistory",
        JSON.stringify(history)
    );


    /*
    Keep a simple latest result
    for the dashboard.
    */

    localStorage.setItem(
        "cbtLastResult",
        JSON.stringify(record)
    );

}


/* ==============================
SAFE PAGE START
============================== */

function startCBT(){

    const loaded =
        loadQuestions();


    if(!loaded){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No questions available";

        document.getElementById(
            "question"
        ).textContent =
            "No PDF CBT questions were found. Please import a PDF first.";

        document.getElementById(
            "options"
        ).innerHTML =
            "<div class='info'>" +
            "Import a PDF from the PDF → CBT page, then open CBT Test again." +
            "</div>";

        document.getElementById(
            "timer"
        ).textContent =
            "00:00";

        return;

    }


    initialize();

    renderQuestion();

    startTimer();

}


/* ==============================
START
============================== */

document.addEventListener(
    "DOMContentLoaded",
    startCBT
);

</script>

</body>
</html>
