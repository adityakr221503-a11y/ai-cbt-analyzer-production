<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:700
}

.timer{
background:#eef2ff;
padding:9px 14px;
border-radius:9px;
font-weight:700
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px
}

.card{
background:#fff;
border-radius:15px;
padding:22px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.question-number{
color:#64748b;
font-weight:600;
margin-bottom:12px
}

.question{
font-size:20px;
line-height:1.5;
font-weight:700;
margin-bottom:20px
}

.option{
width:100%;
padding:15px;
margin:8px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:10px;
text-align:left;
font-size:16px;
cursor:pointer
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
font-weight:700
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px
}

button{
border:0;
border-radius:10px;
padding:13px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.primary{background:#4f46e5;color:white}
.secondary{background:#e2e8f0;color:#0f172a}
.warning{background:#f59e0b;color:white}
.danger{background:#dc2626;color:white}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px
}

.palette button{
background:#e2e8f0;
padding:10px 5px
}

.palette .answered{
background:#bbf7d0
}

.palette .review{
background:#fde68a
}

.palette .current{
outline:3px solid #4f46e5
}

.legend{
margin-top:15px;
color:#64748b;
font-size:13px;
line-height:1.8
}

#result{
display:none
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:20px
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px
}

.correct{
border-left:5px solid #16a34a
}

.incorrect{
border-left:5px solid #dc2626
}

.skipped{
border-left:5px solid #f59e0b
}

.analysis{
margin-top:10px;
padding:12px;
background:#eef2ff;
border-radius:9px;
line-height:1.5
}

.bookmark{
margin-top:10px;
background:#fef3c7;
padding:10px;
border-radius:8px;
font-weight:700
}

.reason-title{
font-weight:800;
margin-top:15px;
margin-bottom:8px
}

.reason-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px
}

.reason-button{
background:#fff;
border:2px solid #e2e8f0;
color:#0f172a;
text-align:left;
padding:11px;
border-radius:9px;
font-size:14px
}

.reason-button.selected-reason{
border-color:#4f46e5;
background:#eef2ff;
color:#3730a3;
font-weight:800
}

.reason-status{
font-size:13px;
color:#64748b;
margin-top:8px
}

@media(max-width:800px){

.container{
grid-template-columns:1fr
}

.reason-options{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer Pro
</div>

<div class="timer" id="timer">
30:00
</div>

</div>

</header>


<div class="container">

<main class="card">

<section id="testScreen">

<div
class="question-number"
id="questionNumber">
Loading...
</div>

<div
class="question"
id="question">
</div>

<div id="options"></div>

<div class="buttons">

<button
class="secondary"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
onclick="markReview()">
Mark for Review
</button>

<button
class="secondary"
onclick="clearAnswer()">
Clear Answer
</button>

<button
class="primary"
id="nextButton"
onclick="nextQuestion()">
Next
</button>

</div>

</section>


<section id="result">

<h2>
Test Completed
</h2>

<div
class="score"
id="score">
</div>

<p id="summary"></p>

<div id="review"></div>

<br>

<button
class="primary"
onclick="location.href='mistake.html'">
Open Mistake Bank
</button>

</section>

</main>


<aside class="card">

<h3>
Question Palette
</h3>

<div
class="palette"
id="palette">
</div>

<div class="legend">
🟩 Answered<br>
🟨 Marked for review<br>
⬜ Not answered<br>
🟦 Current question
</div>

<button
class="danger"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>


<script>

/* =========================
QUESTIONS
========================= */

const questions=[

{
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1,
solution:"Mars appears reddish because iron minerals in its surface have oxidized.",
mistakeReason:"Review the basic identification and characteristics of planets.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Basic Mathematics",
question:"What is 2 + 2?",
options:["3","4","5","6"],
answer:1,
solution:"Adding 2 and 2 gives 4.",
mistakeReason:"Recheck the basic arithmetic operation.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Environment",
question:"Which gas is most abundant in Earth's atmosphere?",
options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],
answer:2,
solution:"Nitrogen makes up approximately 78% of Earth's atmosphere.",
mistakeReason:"Revise the approximate composition of Earth's atmosphere.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is the newton (N).",
mistakeReason:"Carefully distinguish force from energy, power and pressure units.",
mistakeType:"Misread Question"
},

{
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of aerobic cellular respiration and ATP production.",
mistakeReason:"Revise the functions of major cell organelles.",
mistakeType:"Concept Gap"
},

{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol for sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The chemical symbol of sodium is Na, derived from its Latin name natrium.",
mistakeReason:"Revise symbols of common elements.",
mistakeType:"Concept Gap"
},

{
subject:"Biology",
topic:"Cellular Respiration",
question:"Which process produces ATP in mitochondria?",
options:["Photosynthesis","Cellular respiration","Transcription","Translation"],
answer:1,
solution:"Cellular respiration in mitochondria generates ATP through oxidative phosphorylation and related processes.",
mistakeReason:"Differentiate cellular respiration from other cellular processes.",
mistakeType:"Misread Question"
},

{
subject:"Physics",
topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],
answer:1,
solution:"The standard approximate value of gravitational acceleration near Earth's surface is 9.8 m/s².",
mistakeReason:"Revise standard physical constants and check numerical values carefully.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:["Protein","Lipid","DNA","Glucose"],
answer:2,
solution:"DNA stores and transmits hereditary genetic information in most organisms.",
mistakeReason:"Revise the roles of DNA, RNA, proteins and other biomolecules.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:["Proton","Neutron","Electron","Photon"],
answer:2,
solution:"An electron carries one unit of negative elementary charge.",
mistakeReason:"Revise the basic properties of subatomic particles.",
mistakeType:"Concept Gap"
}

];


/* =========================
STATE
========================= */

let current=0;

let answers=
new Array(questions.length).fill(null);

let marked=
new Array(questions.length).fill(false);

let mistakeReasons=
new Array(questions.length).fill(null);

let submitted=false;

let timeLeft=1800;


/* =========================
TIMER
========================= */

function updateTimer(){

let m=Math.floor(timeLeft/60);

let s=timeLeft%60;

document.getElementById("timer").textContent=
String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0");

}


const timerInterval=setInterval(function(){

if(submitted)return;

timeLeft--;

if(timeLeft<=0){

timeLeft=0;

updateTimer();

clearInterval(timerInterval);

submitTest();

return;

}

updateTimer();

},1000);


/* =========================
QUESTION
========================= */

function renderQuestion(){

const q=questions[current];

document.getElementById("questionNumber").textContent=
"Question "+
(current+1)+
" of "+
questions.length+
" • "+
q.subject;

document.getElementById("question").textContent=q.question;

const box=document.getElementById("options");

box.innerHTML="";

q.options.forEach(function(option,index){

const button=document.createElement("button");

button.className="option";

if(answers[current]===index){
button.classList.add("selected");
}

button.textContent=
String.fromCharCode(65+index)+
". "+
option;

button.onclick=function(){

answers[current]=index;

renderQuestion();

};

box.appendChild(button);

});

document.getElementById("nextButton").textContent=
current===questions.length-1
?
"Finish"
:
"Next";

renderPalette();

}


/* =========================
PALETTE
========================= */

function renderPalette(){

const palette=document.getElementById("palette");

palette.innerHTML="";

questions.forEach(function(q,index){

const button=document.createElement("button");

button.textContent=index+1;

if(answers[index]!==null){
button.classList.add("answered");
}

if(marked[index]){
button.classList.add("review");
}

if(index===current){
button.classList.add("current");
}

button.onclick=function(){

current=index;

renderQuestion();

};

palette.appendChild(button);

});

}


/* =========================
NAVIGATION
========================= */

function nextQuestion(){

if(current<questions.length-1){

current++;

renderQuestion();

}
else{

submitTest();

}

}


function previousQuestion(){

if(current>0){

current--;

renderQuestion();

}

}


function clearAnswer(){

answers[current]=null;

renderQuestion();

}


function markReview(){

marked[current]=!marked[current];

renderPalette();

}


/* =========================
DEFAULT MISTAKE REASON
========================= */

function getMistakeReason(q,selected){

if(selected===null){

return "Question was skipped. Review the concept before attempting it again.";

}

return q.mistakeReason ||
"Review the concept and analyze why the selected option was incorrect.";

}


/* =========================
SELECT MISTAKE REASON
========================= */

function selectMistakeReason(index,reason){

mistakeReasons[index]=reason;

saveSelectedReasons();

generateReview();

}


/* =========================
SAVE SELECTED REASONS
========================= */

function saveSelectedReasons(){

try{

localStorage.setItem(
"cbtCurrentMistakeReasons",
JSON.stringify(mistakeReasons)
);

}catch(e){}

}


/* =========================
SAVE TEST
========================= */

function saveTest(correct,incorrect,skipped,score){

let history=[];

try{

history=
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)){
history=[];
}

}catch(e){

history=[];

}


const questionData=
questions.map(function(q,index){

let status;

if(answers[index]===null){

status="skipped";

}
else if(answers[index]===q.answer){

status="correct";

}
else{

status="wrong";

}


const selectedAnswer=
answers[index]===null
?
null
:
q.options[answers[index]];


const chosenReason=
mistakeReasons[index] ||
q.mistakeType ||
"Not Classified";


return {

question:q.question,

options:q.options,

subject:q.subject,

topic:q.topic,

status:status,

selectedIndex:answers[index],

selectedAnswer:selectedAnswer,

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

bookmarked:marked[index],

mistakeType:
status==="wrong"
?
chosenReason
:
null,

mistakeReason:
status==="wrong"
?
getMistakeReason(q,answers[index])
:
"Correct answer.",

solution:q.solution,

markedForReview:marked[index]

};

});


const testRecord={

date:new Date().toLocaleString(),

score:score,

correct:correct,

incorrect:incorrect,

wrong:incorrect,

skipped:skipped,

questions:questionData

};


history.push(testRecord);

localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}


/* =========================
SUBMIT
========================= */

function submitTest(){

if(submitted)return;


let correct=0;

let incorrect=0;

let skipped=0;


questions.forEach(function(q,index){

if(answers[index]===null){

skipped++;

}
else if(answers[index]===q.answer){

correct++;

}
else{

incorrect++;

}

});


const score=(correct*4)-incorrect;


saveTest(
correct,
incorrect,
skipped,
score
);


submitted=true;

clearInterval(timerInterval);


document.getElementById("testScreen").style.display="none";

document.querySelector("aside").style.display="none";

document.getElementById("result").style.display="block";


document.getElementById("score").textContent=
score+
" / "+
(questions.length*4);


document.getElementById("summary").textContent=
"Correct: "+
correct+
" | Incorrect: "+
incorrect+
" | Skipped: "+
skipped;


generateReview();

}


/* =========================
REASON BUTTONS
========================= */

function reasonButton(index,reason,icon){

const selected=
mistakeReasons[index]===reason
?
" selected-reason"
:
"";

return `
<button
type="button"
class="reason-button${selected}"
onclick="selectMistakeReason(${index},'${reason}')">

${icon} ${reason}

</button>
`;

}


/* =========================
REVIEW
========================= */

function generateReview(){

const box=document.getElementById("review");

box.innerHTML="<h3>Question Analysis</h3>";


questions.forEach(function(q,index){

const item=document.createElement("div");

let status;

if(answers[index]===null){

status="skipped";

}
else if(answers[index]===q.answer){

status="correct";

}
else{

status="incorrect";

}


item.className=
"review-item "+
status;


const selected=
answers[index]===null
?
"Not answered"
:
q.options[answers[index]];


item.innerHTML=

"<strong>Question "+
(index+1)+
" • "+
q.subject+
"</strong>"+

"<p>"+
q.question+
"</p>"+

"<p><strong>Your answer:</strong> "+
selected+
"</p>"+

"<p><strong>Correct answer:</strong> "+
q.options[q.answer]+
"</p>";


if(marked[index]){

item.innerHTML+=
'<div class="bookmark">🔖 Bookmarked for review</div>';

}


if(status==="incorrect"){

const selectedReason=
mistakeReasons[index] ||
"";


item.innerHTML+=`

<div class="analysis">

<strong>❌ Why did you get this wrong?</strong>

<div class="reason-options">

${reasonButton(index,"Concept Gap","🧠")}

${reasonButton(index,"Calculation Error","🧮")}

${reasonButton(index,"Misread Question","👀")}

${reasonButton(index,"Guessing","🎲")}

${reasonButton(index,"Time Pressure","⏱️")}

</div>

<div class="reason-status">

${
selectedReason
?
"Selected: "+selectedReason
:
"Select the reason that best describes your mistake."
}

</div>

<br>

<strong>💡 Solution:</strong><br>

${q.solution}

</div>
`;

}


if(status==="skipped"){

item.innerHTML+=`

<div class="analysis">

<strong>⏭️ Skipped Question</strong>

<br><br>

<strong>💡 Solution:</strong><br>

${q.solution}

</div>

`;

}


box.appendChild(item);

});

}


/* =========================
START
========================= */

updateTimer();

renderQuestion();

</script>

</body>
</html>
