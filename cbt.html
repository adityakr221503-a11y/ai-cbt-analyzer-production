<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — CBT Test</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{color:#4f46e5}

.timer{
background:#eef2ff;
color:#3730a3;
padding:9px 14px;
border-radius:9px;
font-weight:800;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
color:#64748b;
font-weight:700;
margin-bottom:12px;
}

.question{
font-size:21px;
font-weight:800;
line-height:1.55;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:11px;
text-align:left;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
font-family:inherit;
border:0;
border-radius:10px;
padding:13px;
font-weight:700;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.palette button{
background:#e2e8f0;
padding:10px 5px;
}

.palette .answered{
background:#bbf7d0;
}

.palette .review{
background:#fde68a;
}

.palette .current{
outline:3px solid #4f46e5;
}

#result{
display:none;
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:10px 0;
}

.result-actions{
margin-top:10px;
}

.result-actions button{
width:100%;
margin-top:8px;
padding:14px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.skipped{
border-left:5px solid #f59e0b;
}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.analysis-type{
font-weight:800;
color:#3730a3;
}

.meta{
margin-top:10px;
padding:10px;
background:#f8fafc;
border-radius:8px;
font-size:13px;
color:#64748b;
}

@media(max-width:800px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<div id="timer" class="timer">
30:00
</div>

</div>
</header>

<div class="container">

<main class="card">

<section id="testScreen">

<div id="questionNumber"
class="question-number">
Loading...
</div>

<div id="question"
class="question">
</div>

<div id="options"></div>

<div class="buttons">

<button
class="secondary"
type="button"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
type="button"
onclick="markReview()">
Mark Review
</button>

<button
class="secondary"
type="button"
onclick="clearAnswer()">
Clear
</button>

<button
id="nextButton"
class="primary"
type="button"
onclick="nextQuestion()">
Next
</button>

</div>

</section>

<section id="result">

<h2>🎯 Test Completed</h2>

<div id="score" class="score"></div>

<p id="summary"></p>

<div class="result-actions">

<button
id="retryButton"
class="primary"
type="button"
style="display:none"
onclick="openRetry()">
🔄 Retry Mistakes
</button>

<button
class="secondary"
type="button"
onclick="location.href='mistake.html'">
🧠 Mistake Bank
</button>

<button
class="secondary"
type="button"
onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

<div id="review"></div>

</section>

</main>

<aside class="card">

<h3>Question Palette</h3>

<div id="palette" class="palette"></div>

<button
class="danger"
type="button"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>

<script>
"use strict";

/* =====================================================
QUESTIONS
===================================================== */

let questions=[
{
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1,
solution:"Mars is called the Red Planet."
},
{
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is newton."
},
{
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of ATP production."
},
{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol of sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The symbol Na comes from natrium."
},
{
subject:"Biology",
topic:"Environment",
question:"Which gas is most abundant in Earth's atmosphere?",
options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],
answer:2,
solution:"Nitrogen makes up about 78% of Earth's atmosphere."
},
{
subject:"Physics",
topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],
answer:1,
solution:"The approximate value is 9.8 m/s²."
},
{
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:["Protein","Lipid","DNA","Glucose"],
answer:2,
solution:"DNA stores hereditary genetic information."
},
{
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:["Proton","Neutron","Electron","Photon"],
answer:2,
solution:"An electron has a negative electric charge."
},
{
subject:"Chemistry",
topic:"Atomic Structure",
question:"Which particle has no electric charge?",
options:["Proton","Electron","Neutron","Positron"],
answer:2,
solution:"A neutron is electrically neutral."
},
{
subject:"Biology",
topic:"Human Physiology",
question:"Which organ pumps blood throughout the human body?",
options:["Liver","Kidney","Heart","Lung"],
answer:2,
solution:"The heart pumps blood through the circulatory system."
}
];


/* =====================================================
PDF IMPORT
===================================================== */

(function(){

try{

const saved=localStorage.getItem("pdfCbtQuestions");

if(!saved)return;

const imported=JSON.parse(saved);

if(!Array.isArray(imported)||!imported.length)return;

const valid=imported.filter(function(q){

return q &&
typeof q.question==="string" &&
q.question.trim() &&
Array.isArray(q.options) &&
q.options.length>=2 &&
typeof q.answer==="number" &&
q.answer>=0 &&
q.answer<q.options.length;

});

if(!valid.length)return;

questions=valid.map(function(q){

return{
id:q.id||("pdf-"+Date.now()),
subject:q.subject||"Imported",
topic:q.topic||"PDF Import",
question:q.question,
options:q.options,
answer:q.answer,
solution:q.solution||q.explanation||"Review the original PDF solution.",
pdfPage:q.pdfPage||"",
chapter:q.chapter||"",
section:q.section||""
};

});

localStorage.removeItem("pdfCbtQuestions");

}catch(error){

console.error(error);

}

})();


/* =====================================================
STATE
===================================================== */

let current=0;

let answers=new Array(questions.length).fill(null);

let marked=new Array(questions.length).fill(false);

let submitted=false;

let timeLeft=1800;


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

const m=Math.floor(timeLeft/60);

const s=timeLeft%60;

document.getElementById("timer").textContent=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}

updateTimer();

const timerInterval=setInterval(function(){

if(submitted)return;

timeLeft--;

if(timeLeft<=0){

timeLeft=0;

clearInterval(timerInterval);

submitTest();

return;

}

updateTimer();

},1000);


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

const q=questions[current];

if(!q){

document.getElementById("questionNumber").textContent=
"No question available";

return;

}

document.getElementById("questionNumber").textContent=
"Question "+
(current+1)+
" of "+
questions.length+
" • "+
(q.subject||"Imported");

document.getElementById("question").textContent=
q.question;

const box=document.getElementById("options");

box.innerHTML="";

q.options.forEach(function(option,index){

const button=document.createElement("button");

button.type="button";

button.className="option";

if(answers[current]===index){

button.classList.add("selected");

}

button.textContent=
String.fromCharCode(65+index)+". "+option;

button.onclick=function(){

if(submitted)return;

answers[current]=index;

renderQuestion();

};

box.appendChild(button);

});

document.getElementById("nextButton").textContent=
current===questions.length-1
?"Finish"
:"Next";

renderPalette();

}


/* =====================================================
PALETTE
===================================================== */

function renderPalette(){

const palette=document.getElementById("palette");

palette.innerHTML="";

questions.forEach(function(q,index){

const button=document.createElement("button");

button.type="button";

button.textContent=index+1;

if(answers[index]!==null)
button.classList.add("answered");

if(marked[index])
button.classList.add("review");

if(index===current)
button.classList.add("current");

button.onclick=function(){

if(submitted)return;

current=index;

renderQuestion();

};

palette.appendChild(button);

});

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

if(submitted)return;

if(current<questions.length-1){

current++;

renderQuestion();

}else{

submitTest();

}

}

function previousQuestion(){

if(submitted)return;

if(current>0){

current--;

renderQuestion();

}

}

function clearAnswer(){

if(submitted)return;

answers[current]=null;

renderQuestion();

}

function markReview(){

if(submitted)return;

marked[current]=!marked[current];

renderPalette();

}


/* =====================================================
MISTAKE CLASSIFICATION
===================================================== */

function classifyMistake(q,selectedIndex){

const text=String(q.question||"").toLowerCase();

const topic=String(q.topic||"").toLowerCase();

const calculation=[
"calculate",
"calculation",
"numerical",
"velocity",
"acceleration",
"force",
"work",
"energy",
"power",
"current",
"voltage",
"resistance",
"mass",
"momentum"
];

if(calculation.some(function(x){
return text.includes(x);
})){

return{
type:"🔢 Calculation Error",
reason:"Recheck the formula, units and calculation steps."
};

}

const memory=[
"what is",
"which",
"who",
"symbol",
"unit",
"known as",
"called",
"most abundant",
"organ",
"organelle"
];

if(memory.some(function(x){
return text.includes(x);
})){

return{
type:"📚 Memory / Recall Gap",
reason:"This is mainly a factual or definition-based question. Revise the key fact and test recall again."
};

}

const concept=[
"why",
"principle",
"mechanism",
"process",
"function",
"relationship",
"reason",
"concept"
];

if(
concept.some(function(x){
return text.includes(x);
})||
topic.includes("concept")
){

return{
type:"🧠 Concept Gap",
reason:"The underlying concept needs revision."
};

}

return{
type:"⚠️ Concept Gap",
reason:"Review the question carefully and compare your answer with the correct concept."
};

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
SAVE HISTORY
===================================================== */

function saveHistory(correct,incorrect,skipped,score){

let history=[];

try{

history=JSON.parse(
localStorage.getItem("cbtHistory")||"[]"
);

if(!Array.isArray(history))
history=[];

}catch(e){

history=[];

}

const record={

date:new Date().toLocaleString(),

timestamp:Date.now(),

score:score,

correct:correct,

incorrect:incorrect,

wrong:incorrect,

skipped:skipped,

questions:questions.map(function(q,index){

let status="skipped";

if(answers[index]!==null){

status=
answers[index]===q.answer
?"correct"
:"wrong";

}

let intelligence=null;

if(status==="wrong"){

intelligence=
classifyMistake(q,answers[index]);

}

return{

question:q.question,

options:q.options,

subject:q.subject,

topic:q.topic,

status:status,

selectedIndex:answers[index],

selectedAnswer:
answers[index]===null
?"Not answered"
:q.options[answers[index]],

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

mistakeType:
intelligence?intelligence.type:null,

mistakeReason:
intelligence?intelligence.reason:null,

solution:q.solution||"",

pdfPage:q.pdfPage||"",

chapter:q.chapter||"",

section:q.section||"",

bookmarked:marked[index],

markedForReview:marked[index]

};

})

};

history.push(record);

localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}/* =====================================================
REACTIVATE MISTAKES
===================================================== */

function reactivateMistakes(){

let mastery=[];

try{

mastery=JSON.parse(
localStorage.getItem("cbtMasteryV2")||"[]"
);

if(!Array.isArray(mastery))
mastery=[];

}catch(e){

mastery=[];

}

const wrongQuestions=new Set();

questions.forEach(function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

wrongQuestions.add(
normalize(q.question)
);

}

});

mastery=mastery.filter(function(item){

if(!item||!item.question)
return true;

return !wrongQuestions.has(
normalize(item.question)
);

});

localStorage.setItem(
"cbtMasteryV2",
JSON.stringify(mastery)
);

}


/* =====================================================
CREATE RETRY QUEUE
===================================================== */

function openRetry(){

const wrong=[];

questions.forEach(function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

const intelligence=
classifyMistake(
q,
answers[index]
);

wrong.push({

id:
"retry-"+Date.now()+"-"+index,

question:q.question,

options:q.options,

subject:q.subject||"",

topic:q.topic||"",

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

solution:q.solution||"",

selectedIndex:answers[index],

selectedAnswer:q.options[answers[index]],

mistakeType:intelligence.type,

mistakeReason:intelligence.reason,

source:"CBT",

pdfPage:q.pdfPage||"",

chapter:q.chapter||"",

section:q.section||""

});

}

});


if(wrong.length===0){

alert("There are no mistakes to retry.");

return;

}


/*
Save complete retry queue.
*/

localStorage.setItem(
"cbtAnalyzer.retryQueue",
JSON.stringify(wrong)
);


/*
Compatibility with retry page.
*/

localStorage.setItem(
"cbtRetryQuestion",
JSON.stringify(wrong[0])
);

localStorage.setItem(
"cbtRetryStartedAt",
String(Date.now())
);


/*
Open retry page.
*/

window.location.href="retry.html";

}


/* =====================================================
RETRY BUTTON
===================================================== */

function updateRetryButton(incorrect){

const button=
document.getElementById("retryButton");

if(incorrect>0){

button.style.display="block";

button.textContent=
"🔄 Retry "+
incorrect+
" Mistake"+
(incorrect===1?"":"s");

}else{

button.style.display="none";

}

}


/* =====================================================
SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted)
return;


let correct=0;

let incorrect=0;

let skipped=0;


questions.forEach(function(q,index){

if(answers[index]===null){

skipped++;

}
else if(answers[index]===q.answer){

correct++;

}
else{

incorrect++;

}

});


/*
NEET-style scoring:
+4 correct
-1 incorrect
0 skipped
*/

const score=
(correct*4)-incorrect;


/*
Remove mastered questions from
the active mastery pool when they
are answered incorrectly again.
*/

reactivateMistakes();


/*
Save complete test history.
*/

saveHistory(
correct,
incorrect,
skipped,
score
);


submitted=true;

clearInterval(timerInterval);


/*
Hide test UI.
*/

document.getElementById("testScreen")
.style.display="none";

document.querySelector("aside")
.style.display="none";


/*
Show result.
*/

document.getElementById("result")
.style.display="block";


document.getElementById("score")
.textContent=
score+
" / "+
(questions.length*4);


document.getElementById("summary")
.textContent=
"Correct: "+
correct+
" | Incorrect: "+
incorrect+
" | Skipped: "+
skipped;


/*
Retry button.
*/

updateRetryButton(incorrect);


/*
Generate full analysis.
*/

generateReview();

}


/* =====================================================
GENERATE REVIEW
===================================================== */

function generateReview(){

const box=
document.getElementById("review");

box.innerHTML=
"<h3>🧠 Question Analysis</h3>";


questions.forEach(function(q,index){

const item=
document.createElement("div");


let status;

if(answers[index]===null){

status="skipped";

}
else if(answers[index]===q.answer){

status="correct";

}
else{

status="incorrect";

}


item.className=
"review-item "+
status;


const yourAnswer=
answers[index]===null
?"Not answered"
:q.options[answers[index]];


let html="";


html+=
"<strong>Question "+
(index+1)+
"</strong>";


html+=
"<p>"+
escapeHTML(q.question)+
"</p>";


html+=
"<p><strong>Your answer:</strong> "+
escapeHTML(yourAnswer)+
"</p>";


html+=
"<p><strong>Correct answer:</strong> "+
escapeHTML(q.options[q.answer])+
"</p>";


/*
Correct question.
*/

if(status==="correct"){

html+=
"<div class='analysis'>"+
"✅ <strong>Correct</strong><br>"+
"Good work. You selected the correct answer."+
(q.solution
?"<br><br><strong>💡 Solution:</strong><br>"+
escapeHTML(q.solution)
:"")+
"</div>";

}


/*
Skipped question.
*/

if(status==="skipped"){

html+=
"<div class='analysis'>"+
"🟡 <strong>Skipped</strong><br>"+
"The question was not answered. Review it before attempting the next test."+
(q.solution
?"<br><br><strong>💡 Solution:</strong><br>"+
escapeHTML(q.solution)
:"")+
"</div>";

}


/*
Incorrect question.
*/

if(status==="incorrect"){

const intelligence=
classifyMistake(
q,
answers[index]
);


html+=
"<div class='analysis'>"+

"<strong>🧠 Mistake Intelligence</strong>"+

"<br><br>"+

"<strong>Mistake Type:</strong>"+

"<div class='analysis-type'>"+
escapeHTML(intelligence.type)+
"</div>"+

"<br>"+

"<strong>Why:</strong><br>"+
escapeHTML(intelligence.reason)+

"<br><br>"+

"<strong>💡 Solution</strong><br>"+
escapeHTML(
q.solution||
"Review the underlying concept and retry the question."
)+

"</div>";

}


/*
PDF metadata.
*/

if(
q.pdfPage||
q.chapter||
q.section
){

html+=
"<div class='meta'>";

if(q.pdfPage){

html+=
"📄 PDF Page: "+
escapeHTML(q.pdfPage);

}

if(q.chapter){

html+=
"<br>📚 Chapter: "+
escapeHTML(q.chapter);

}

if(q.section){

html+=
"<br>📌 Section: "+
escapeHTML(q.section);

}

html+="</div>";

}


item.innerHTML=html;

box.appendChild(item);

});

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value??"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
START
===================================================== */

if(!Array.isArray(questions))
questions=[];


if(questions.length===0){

document.getElementById("questionNumber")
.textContent=
"No questions available";

document.getElementById("question")
.textContent=
"Please import a PDF or add questions.";

}else{

renderQuestion();

}

</script>

</body>
</html>
