<script>

"use strict";


/* =====================================================
   PDF.JS WORKER
===================================================== */

if(typeof pdfjsLib !== "undefined"){

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

}
   /* =====================================================
   CBT ANALYZER PRO
   STATE
===================================================== */

let questions = [];

let current = 0;

let answers = [];

let marked = [];

let submitted = false;

let initialized = false;

let timeLeft = 1800;

let timerInterval = null;

let testSource = "Fallback";

let testStartedAt = Date.now();


/* =====================================================
   STORAGE
===================================================== */

const STORAGE = {

PDF:"pdfCbtQuestions",

HISTORY:"cbtHistory",

RETRY_QUEUE:"cbtAnalyzer.retryQueue",

RETRY_QUESTION:"cbtRetryQuestion",

RETRY_STARTED:"cbtRetryStartedAt"

};


/* =====================================================
   FALLBACK QUESTIONS
===================================================== */

const fallbackQuestions = [

{

],

},

question:"Which gas is most abundant in Earth's atmosphere?",
options:[

],
answer:2,

},

{
id:"fallback-6",

topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:[
"4.9 m/s²",
"9.8 m/s²",

],

},

{
id:"fallback-7",
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:[
"Protein",

"DNA",
"Glucose"
],
answer:2,
solution:"DNA stores hereditary information."
},

{
id:"fallback-8",
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:[
"Proton",
"Neutron",
"Electron",
"Photon"
],
answer:2,
solution:"The electron has a negative charge."
},

{
id:"fallback-9",
subject:"Chemistry",
topic:"Atomic Structure",
question:"Which particle has no electric charge?",
options:[
"Proton",
"Electron",
"Neutron",
"Positron"
],
answer:2,
solution:"The neutron is electrically neutral."
},

{
id:"fallback-10",
subject:"Biology",
topic:"Human Physiology",
question:"Which organ pumps blood throughout the human body?",
options:[
"Liver",
"Kidney",
"Heart",
"Lung"
],
answer:2,
solution:"The heart pumps blood through the circulatory system."
}

];
   /* =====================================================
   SAFE JSON READER
===================================================== */

function readJSON(key, fallback){

try{

const value =
localStorage.getItem(key);

if(!value){
return fallback;
}

return JSON.parse(value);

}catch(error){

console.error(
"Storage read error:",
key,
error
);

return fallback;

}

}


/* =====================================================
   ANSWER NORMALIZER
===================================================== */

function normalizeAnswer(answer, options){

if(
answer === null ||
answer === undefined ||
answer === ""
){

return null;

}


/* Number */

if(typeof answer === "number"){

if(
Number.isInteger(answer) &&
answer >= 0 &&
answer < options.length
){

return answer;

}

}


/* String */

const value =
String(answer).trim();


/* A / B / C / D */

if(/^[A-Za-z]$/.test(value)){

const index =
value
.toUpperCase()
.charCodeAt(0) - 65;

if(
index >= 0 &&
index < options.length
){

return index;

}

}


/* Numeric string */

if(/^\d+$/.test(value)){

const number =
Number(value);


/* 1-based answer */

if(
number >= 1 &&
number <= options.length
){

return number - 1;

}


/* 0-based answer */

if(
number >= 0 &&
number < options.length
){

return number;

}

}


/* Exact option text */

const lower =
value.toLowerCase();

const found =
options.findIndex(
function(option){

return String(option)
.trim()
.toLowerCase() === lower;

}
);

if(found >= 0){

return found;

}


return null;

}


/* =====================================================
   NORMALIZE QUESTION
===================================================== */

function normalizeQuestion(q,index){

if(
!q ||
typeof q !== "object"
){

return null;

}


/* Question text */

const questionText =
String(
q.question ??
q.questionText ??
q.text ??
q.question_text ??
""
).trim();


if(!questionText){

return null;

}


/* =====================================================
   OPTIONS
===================================================== */

let options = [];


if(Array.isArray(q.options)){

options = q.options;

}
else if(Array.isArray(q.choices)){

options = q.choices;

}
else if(Array.isArray(q.answers)){

options = q.answers;

}
else{

options = [

q.optionA,
q.optionB,
q.optionC,
q.optionD

].filter(function(x){

return(
x !== undefined &&
x !== null &&
String(x).trim() !== ""
);

});

}


options =
options
.map(function(option){

if(
option &&
typeof option === "object" &&
option.text !== undefined
){

return String(
option.text
).trim();

}

return String(
option ?? ""
).trim();

})
.filter(function(option){

return option !== "";

});


if(options.length < 2){

return null;

}


/* =====================================================
   CORRECT ANSWER
===================================================== */

let rawAnswer = q.answer;


if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correctAnswer;

}


if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correctIndex;

}


if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correct;

}


if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.answerIndex;

}


const answer =
normalizeAnswer(
rawAnswer,
options
);


if(answer === null){

console.warn(
"Skipping question without valid answer:",
questionText
);

return null;

}


/* =====================================================
   NORMALIZED OBJECT
===================================================== */

return{

id:
q.id ||
"pdf-" +
Date.now() +
"-" +
index,

subject:
q.subject ||
q.subjectName ||
"PDF Import",

topic:
q.topic ||
q.section ||
q.chapter ||
"PDF Import",

question:
questionText,

options:
options,

answer:
answer,

solution:
String(
q.solution ??
q.explanation ??
q.detailedSolution ??
""
),

explanation:
String(
q.explanation ??
q.solution ??
""
),

pdfPage:
q.pdfPage ??
q.page ??
"",

pdfPageEnd:
q.pdfPageEnd ??
q.pageEnd ??
q.pdfPage ??
q.page ??
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"PDF",

source:
q.source ||
"PDF Import",

sourceType:
"PDF",

bookmarked:
Boolean(q.bookmarked)

};

}


/* =====================================================
   EXTRACT QUESTION ARRAY
===================================================== */

function extractQuestionArray(data){

if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.questions)
){

return data.questions;

}


if(
data &&
Array.isArray(data.data)
){

return data.data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
Array.isArray(data.questionBank)
){

return data.questionBank;

}


return [];

}
   /* =====================================================
   LOAD PDF QUESTIONS
   PDF IS ALWAYS TRIED FIRST
===================================================== */

function loadPDFQuestions(){

const possibleKeys = [

STORAGE.PDF,

"pdfQuestions",

"cbtQuestions",

"importedQuestions",

"pdfQuestionBank",

"questionBank"

];


for(
const key of possibleKeys
){

const saved =
localStorage.getItem(key);


if(!saved){

continue;

}


try{

const data =
JSON.parse(saved);


const imported =
extractQuestionArray(data);


if(
!Array.isArray(imported) ||
imported.length === 0
){

console.warn(
"Question key is empty:",
key
);

continue;

}


const normalized =
imported
.map(function(q,index){

return normalizeQuestion(
q,
index
);

})
.filter(Boolean);


if(normalized.length === 0){

console.warn(
"No valid questions found in:",
key
);

continue;

}


/* =====================================================
   PDF SUCCESS
===================================================== */

questions =
normalized;

testSource =
"PDF Import";


console.log(
"================================"
);

console.log(
"PDF CBT SUCCESSFULLY LOADED"
);

console.log(
"Storage key:",
key
);

console.log(
"Total questions:",
questions.length
);

console.log(
"================================"
);


return true;


}catch(error){

console.error(
"PDF loading error:",
key,
error
);

}

}


/* =====================================================
   NO PDF FOUND
===================================================== */

console.warn(
"No valid PDF question bank found."
);

return false;

}


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

if(initialized){

return;

}

initialized = true;

testStartedAt =
Date.now();


/* =====================================================
   PDF FIRST
===================================================== */

const pdfLoaded =
loadPDFQuestions();


/* =====================================================
   FALLBACK ONLY IF PDF FAILED
===================================================== */

if(!pdfLoaded){

questions =
fallbackQuestions.map(
function(q){

return{

...q,

options:[
...q.options
]

};

}
);

testSource =
"Demo Test";


console.log(
"Using fallback questions:",
questions.length
);

}


/* =====================================================
   SAFETY CHECK
===================================================== */

if(!questions.length){

showFatalError(
"No questions are available for this test."
);

return;

}


/* =====================================================
   INITIAL ARRAYS
===================================================== */

answers =
new Array(
questions.length
).fill(null);


marked =
new Array(
questions.length
).fill(false);


current = 0;

submitted = false;


/* =====================================================
   SOURCE BADGE
===================================================== */

const badge =
document.getElementById(
"sourceBadge"
);


if(badge){

if(testSource === "PDF Import"){

badge.textContent =
"📄 PDF CBT — " +
questions.length +
" Questions";

}else{

badge.textContent =
"📝 Demo CBT — " +
questions.length +
" Questions";

}

}


/* =====================================================
   FIRST RENDER
===================================================== */

renderQuestion();

renderPalette();

startTimer();

}


/* =====================================================
   FATAL ERROR
===================================================== */

function showFatalError(message){

const screen =
document.getElementById(
"testScreen"
);


if(!screen){

return;

}


screen.innerHTML =

'<div class="error-box">' +

"<strong>⚠️ CBT could not start</strong>" +

"<br><br>" +

String(message) +

"<br><br>" +

"Please import a PDF question bank first." +

"</div>";

}
   /* =====================================================
   START TIMER
===================================================== */

function startTimer(){

clearInterval(timerInterval);

timeLeft = 1800;

updateTimer();


timerInterval =
setInterval(function(){

if(submitted){

clearInterval(timerInterval);

return;

}


timeLeft--;

updateTimer();


if(timeLeft <= 0){

clearInterval(timerInterval);

submitTest();

}

},1000);

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

const timer =
document.getElementById("timer");


if(!timer){

return;

}


const minutes =
Math.floor(timeLeft / 60);

const seconds =
timeLeft % 60;


timer.textContent =
String(minutes).padStart(2,"0") +
":" +
String(seconds).padStart(2,"0");


timer.classList.remove(
"warning",
"danger"
);


if(timeLeft <= 300){

timer.classList.add("danger");

}
else if(timeLeft <= 600){

timer.classList.add("warning");

}

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

if(submitted){

return;

}


const q =
questions[current];


if(!q){

return;

}


/* =====================================================
   QUESTION NUMBER
===================================================== */

const questionNumber =
document.getElementById(
"questionNumber"
);


if(questionNumber){

questionNumber.textContent =
"Question " +
(current + 1) +
" of " +
questions.length +
" • " +
(q.subject || "PDF");

}


/* =====================================================
   QUESTION TEXT
===================================================== */

const question =
document.getElementById(
"question"
);


if(question){

question.textContent =
q.question;

}


/* =====================================================
   OPTIONS
===================================================== */

const box =
document.getElementById(
"options"
);


if(!box){

return;

}


box.innerHTML = "";


q.options.forEach(
function(option,index){

const button =
document.createElement("button");


button.type =
"button";


button.className =
"option";


/* Selected answer */

if(
answers[current] === index
){

button.classList.add(
"selected"
);

}


/* Option text */

button.textContent =
String.fromCharCode(
65 + index
) +
". " +
option;


/* =================================================
   SELECT ANSWER
================================================= */

button.onclick =
function(){

if(submitted){

return;

}


answers[current] =
index;


renderQuestion();

};


box.appendChild(button);

});


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

<button
id="previousButton"
class="secondary"
onclick="previousQuestion()">
Previous
</button>

<script>

function previousQuestion(){

if(submitted){
return;
}

if(current > 0){

current--;

renderQuestion();

}


/* =====================================================
   CLEAR ANSWER
===================================================== */

function clearAnswer(){

if(submitted){
return;
}

answers[current] = null;

renderQuestion();

}


/* =====================================================
   MARK FOR REVIEW
===================================================== */

function markReview(){

if(submitted){
return;
}

marked[current] =
!marked[current];

renderQuestion();

}


/* =====================================================
   CONFIRM SUBMIT
===================================================== */

function confirmSubmit(){

if(submitted){
return;
}

const unanswered =
answers.filter(function(answer){

return answer === null;

}).length;


if(unanswered > 0){

const message =
"There are " +
unanswered +
" unanswered question(s).\n\n" +
"Do you still want to submit?";


if(!confirm(message)){
return;
}

}

submitTest();

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted){
return;
}

submitted = true;

clearInterval(timerInterval);

calculateResult();

}
   /* =====================================================
   CALCULATE RESULT
===================================================== */

function calculateResult(){

let correct = 0;
let wrong = 0;
let skipped = 0;

const mistakes = [];


questions.forEach(function(q,index){

const selected =
answers[index];


/* SKIPPED */

if(
selected === null ||
selected === undefined
){

skipped++;

return;

}


/* CORRECT */

if(
selected === q.answer
){

correct++;

return;

}


/* WRONG */

wrong++;


mistakes.push({

id:q.id,

question:q.question,

subject:q.subject || "Unknown",

topic:q.topic || "Unknown",

mistakeType:"Concept Gap",

selectedAnswer:
q.options[selected] ?? "",

correctAnswer:
q.options[q.answer] ?? "",

mistakeReason:
"Incorrect answer selected.",

solution:
q.solution ||
q.explanation ||
"Review this question and its concept.",

timestamp:
Date.now()

});

});


/* =====================================================
   SCORE
   +4 CORRECT
   -1 WRONG
===================================================== */

const total =
questions.length;

const score =
(correct * 4) -
wrong;

const maxScore =
total * 4;


/* =====================================================
   SHOW RESULT
===================================================== */

showResult(
correct,
wrong,
skipped,
score,
maxScore,
mistakes
);


/* =====================================================
   SAVE HISTORY
===================================================== */

saveHistory(
correct,
wrong,
skipped,
score,
maxScore
);


/* =====================================================
   SAVE MISTAKES
===================================================== */

saveMistakes(
mistakes
);

}

/* =====================================================

===================================================== */

function saveMistakes(mistakes){

if(
!Array.isArray(mistakes) ||
mistakes.length === 0
){

return;

}


try{

let existing =
readJSON(
"cbtMistakes",
[]
);


if(!Array.isArray(existing)){

existing = [];

}


/*
Compatibility with existing
Mistake Bank data
*/

const prepared =
mistakes.map(function(mistake){

return{

...mistake,

createdAt:
mistake.timestamp ||
Date.now(),

mastered:false,

retryCount:0

};

});


const combined =
prepared.concat(existing);


/* Remove duplicate IDs */

const unique = [];

const seen = new Set();


combined.forEach(function(item){

const key =
item.id ||
(
item.question +
"|" +
item.timestamp
);


if(!seen.has(key)){

seen.add(key);

unique.push(item);

}

});


localStorage.setItem(
"cbtMistakes",
JSON.stringify(unique)
);


/*
Also save retry queue
*/

localStorage.setItem(
STORAGE.RETRY_QUEUE,
JSON.stringify(prepared)
);


}catch(error){

console.error(
"Mistake save error:",
error
);

}

}

/* =========================================================
   PHASE 1 — RANK BOOSTER MISTAKE INTELLIGENCE
   ========================================================= */

const RB_DIAGNOSIS_KEY = "rankBoosterDiagnosisV1";

/*
  Root-cause categories used by the personal mentor.
*/
const RB_MISTAKE_TYPES = {
  CONCEPT: "Concept Gap",
  NCERT: "NCERT / Recall Gap",
  APPROACH: "Wrong Approach",
  CALCULATION: "Calculation Error",
  MISREAD: "Question Misread",
  GUESS: "Guessing",
  TIME: "Time Pressure",
  CLICK: "Wrong Click",
  APPLICATION: "Application Gap",
  PERSISTENT: "Persistent Weakness"
};


/* ---------------------------------------------------------
   SAFE JSON HELPERS
--------------------------------------------------------- */

function rbRead(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;

    const value = JSON.parse(raw);

    return value ?? fallback;
  }catch(error){
    console.error("Rank Booster storage error:", error);
    return fallback;
  }
}


function rbWrite(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(error){
    console.error("Rank Booster write error:", error);
    return false;
  }
}


/* ---------------------------------------------------------
   NORMALIZE QUESTION RECORD
--------------------------------------------------------- */

function rbNormalizeQuestion(q){

  if(!q || !q.question){
    return null;
  }

  return {
    id:
      q.id ||
      q.questionId ||
      null,

    question:
      String(q.question),

    subject:
      q.subject ||
      q.subjectName ||
      q.section ||
      "Unknown",

    topic:
      q.topic ||
      q.chapter ||
      q.unit ||
      "Unknown",

    selectedAnswer:
      q.selectedAnswer ??
      "",

    correctAnswer:
      getCorrectAnswer(q),

    selectedIndex:
      q.selectedIndex ??
      null,

    correctIndex:
      q.correctIndex ??
      q.answerIndex ??
      null,

    timeSpent:
      Number(q.timeSpent ?? q.time ?? 0),

    confidence:
      q.confidence ??
      null,

    mistakeType:
      q.mistakeType ??
      "",

    mistakeReason:
      q.mistakeReason ??
      "",

    solution:
      q.solution ||
      q.explanation ||
      "",

    timestamp:
      q.timestamp ||
      Date.now()
  };
}


/* ---------------------------------------------------------
   CONFIDENCE NORMALIZATION
--------------------------------------------------------- */

function rbConfidenceValue(value){

  if(value === null || value === undefined){
    return null;
  }

  if(typeof value === "number"){
    return Math.max(0, Math.min(100, value));
  }

  const text =
    String(value)
      .trim()
      .toLowerCase();

  if(
    text.includes("very high") ||
    text.includes("certain")
  ){
    return 95;
  }

  if(
    text.includes("high") ||
    text.includes("confident")
  ){
    return 80;
  }

  if(
    text.includes("medium") ||
    text.includes("moderate")
  ){
    return 60;
  }

  if(
    text.includes("low") ||
    text.includes("unsure")
  ){
    return 35;
  }

  if(text.includes("guess")){
    return 20;
  }

  return null;
}


/* ---------------------------------------------------------
   CORRECT / WRONG CLICK DETECTION
--------------------------------------------------------- */

function rbIsCorrect(q){

  const selected =
    normalize(q.selectedAnswer);

  const correct =
    normalize(q.correctAnswer);

  if(
    selected &&
    correct &&
    selected === correct
  ){
    return true;
  }

  if(
    Number.isInteger(Number(q.selectedIndex)) &&
    Number.isInteger(Number(q.correctIndex))
  ){

    return Number(q.selectedIndex) ===
           Number(q.correctIndex);
  }

  return false;
}


function rbLooksLikeWrongClick(q){

  const selected =
    String(q.selectedAnswer || "").trim();

  const correct =
    String(q.correctAnswer || "").trim();

  if(!selected){
    return false;
  }

  /*
    If the system has explicit interaction metadata,
    trust it first.
  */

  if(q.wrongClick === true){
    return true;
  }

  if(q.answerChangedImmediately === true){
    return true;
  }

  /*
    Very short time + otherwise normal performance
    is a signal, not proof.
  */

  const time =
    Number(q.timeSpent || 0);

  if(
    time > 0 &&
    time < 3 &&
    selected !== correct &&
    q.confidence !== null
  ){
    const confidence =
      rbConfidenceValue(q.confidence);

    if(
      confidence !== null &&
      confidence >= 70
    ){
      return true;
    }
  }

  return false;
}


/* ---------------------------------------------------------
   ROOT CAUSE DIAGNOSIS
--------------------------------------------------------- */

function rbDiagnose(q){

  const item =
    rbNormalizeQuestion(q);

  if(!item){
    return {
      type: RB_MISTAKE_TYPES.CONCEPT,
      confidence: 0,
      reason: "Insufficient question data.",
      action: "Review the concept and retry."
    };
  }

  const explicit =
    String(item.mistakeType || "")
      .trim();

  /*
    Existing explicit diagnosis gets priority.
  */

  if(explicit){

    return {
      type: explicit,
      confidence: 95,
      reason:
        item.mistakeReason ||
        "Previously classified mistake.",
      action:
        rbActionForType(explicit)
    };
  }

  /*
    1. Empty answer
  */

  if(!item.selectedAnswer){

    return {
      type: RB_MISTAKE_TYPES.TIME,
      confidence: 75,
      reason:
        "The question was not answered.",
      action:
        "Practice faster question selection and time allocation."
    };
  }


  /*
    2. Wrong click
  */

  if(rbLooksLikeWrongClick(item)){

    return {
      type: RB_MISTAKE_TYPES.CLICK,
      confidence: 70,
      reason:
        "The answer pattern suggests an accidental or rushed selection.",
      action:
        "Slow down for the final answer selection and verify the chosen option."
    };
  }


  /*
    3. Guessing / low confidence
  */

  const confidence =
    rbConfidenceValue(item.confidence);

  if(
    confidence !== null &&
    confidence <= 30 &&
    !rbIsCorrect(item)
  ){

    return {
      type: RB_MISTAKE_TYPES.GUESS,
      confidence: 88,
      reason:
        "The answer was selected with low confidence.",
      action:
        "Strengthen concept recognition before attempting similar questions."
    };
  }


  /*
    4. Calculation clues
  */

  const text =
    normalize(
      item.question +
      " " +
      item.solution
    );

  const calculationWords = [
    "calculate",
    "find the value",
    "numerical",
    "velocity",
    "acceleration",
    "force",
    "energy",
    "power",
    "current",
    "resistance",
    "molarity",
    "percentage",
    "ratio"
  ];

  if(
    calculationWords.some(function(word){
      return text.includes(word);
    })
  ){

    return {
      type: RB_MISTAKE_TYPES.CALCULATION,
      confidence: 68,
      reason:
        "The question appears calculation-heavy and the selected answer was incorrect.",
      action:
        "Recheck formula selection, substitution, units and arithmetic."
    };
  }


  /*
    5. Misread clues
  */

  const misreadWords = [
    "incorrect",
    "not true",
    "except",
    "least",
    "most appropriate",
    "false",
    "wrong statement"
  ];

  if(
    misreadWords.some(function(word){
      return normalize(item.question).includes(word);
    })
  ){

    return {
      type: RB_MISTAKE_TYPES.MISREAD,
      confidence: 62,
      reason:
        "The wording contains a reversal or exception condition that can cause an avoidable error.",
      action:
        "Underline the command word mentally before checking the options."
    };
  }


  /*
    6. Default conceptual diagnosis
  */

  return {
    type: RB_MISTAKE_TYPES.CONCEPT,
    confidence: 55,
    reason:
      "The answer was incorrect without enough evidence for a more specific diagnosis.",
    action:
      "Review the underlying concept and retry the question without looking at the answer."
  };
}


/* ---------------------------------------------------------
   ACTION LIBRARY
--------------------------------------------------------- */

function rbActionForType(type){

  const actions = {

    "Concept Gap":
      "Review the core concept, explain it in your own words, then solve 3 fresh questions.",

    "NCERT / Recall Gap":
      "Revise the relevant NCERT line/table/diagram and immediately test recall.",

    "Wrong Approach":
      "Learn the shortest reliable approach and compare it with your original method.",

    "Calculation Error":
      "Repeat the calculation slowly, identify the first incorrect step, then solve two similar questions.",

    "Question Misread":
      "Read the command words first: NOT, EXCEPT, incorrect, least, most appropriate, etc.",

    "Guessing":
      "Stop option-first guessing. Identify the governing concept before eliminating options.",

    "Time Pressure":
      "Train question selection and set a strict time target for this question type.",

    "Wrong Click":
      "Verify the selected option before submitting and avoid rushed final clicks.",

    "Application Gap":
      "Review the concept-to-question connection and practise unfamiliar applications.",

    "Persistent Weakness":
      "Move this topic into focused practice until repeated retests show stable mastery."
  };

  return actions[type] ||
    "Review the concept and retry the question.";
}


/* ---------------------------------------------------------
   PERSISTENT WEAKNESS DETECTION
--------------------------------------------------------- */

function rbFindPersistentWeaknesses(records){

  const groups = {};

  records.forEach(function(q){

    const item =
      rbNormalizeQuestion(q);

    if(!item){
      return;
    }

    const topic =
      item.subject +
      "::" +
      item.topic;

    if(!groups[topic]){
      groups[topic] = {
        subject: item.subject,
        topic: item.topic,
        attempts: 0,
        wrong: 0,
        times: [],
        types: {}
      };
    }

    groups[topic].attempts++;

    if(!rbIsCorrect(item)){
      groups[topic].wrong++;
    }

    if(item.timeSpent > 0){
      groups[topic].times.push(item.timeSpent);
    }

    const diagnosis =
      rbDiagnose(item);

    groups[topic].types[diagnosis.type] =
      (groups[topic].types[diagnosis.type] || 0) + 1;
  });


  return Object.values(groups)
    .filter(function(group){

      /*
        Persistent = repeated errors OR
        high error rate across several attempts.
      */

      return (
        group.attempts >= 3 &&
        group.wrong >= 2
      );
    })
    .map(function(group){

      let dominantType =
        RB_MISTAKE_TYPES.CONCEPT;

      let highest = 0;

      Object.keys(group.types)
        .forEach(function(type){

          if(group.types[type] > highest){

            highest =
              group.types[type];

            dominantType = type;
          }
        });


      const avgTime =
        group.times.length
        ? group.times.reduce(
            function(a,b){ return a+b; },
            0
          ) / group.times.length
        : 0;


      return {
        subject: group.subject,
        topic: group.topic,
        attempts: group.attempts,
        wrong: group.wrong,
        errorRate:
          Math.round(
            group.wrong /
            group.attempts *
            100
          ),
        dominantType: dominantType,
        averageTime:
          Math.round(avgTime),
        priority:
          group.wrong >= 4
          ? "HIGH"
          : "MEDIUM"
      };
    })
    .sort(function(a,b){

      return (
        b.wrong - a.wrong ||
        b.errorRate - a.errorRate
      );
    });
}


/* ---------------------------------------------------------
   BUILD PERSONAL MENTOR SNAPSHOT
--------------------------------------------------------- */

function buildRankBoosterSnapshot(){

  const history =
    rbRead(HISTORY_KEY, []);

  const mistakes =
    rbRead("cbtMistakes", []);

  const diagnosisRecords =
    [];

  mistakes.forEach(function(q){

    const item =
      rbNormalizeQuestion(q);

    if(!item){
      return;
    }

    const diagnosis =
      rbDiagnose(item);

    diagnosisRecords.push({

      question: item.question,

      subject: item.subject,

      topic: item.topic,

      correct:
        rbIsCorrect(item),

      timeSpent:
        item.timeSpent,

      confidence:
        rbConfidenceValue(item.confidence),

      diagnosis:
        diagnosis.type,

      diagnosisConfidence:
        diagnosis.confidence,

      reason:
        diagnosis.reason,

      action:
        diagnosis.action,

      timestamp:
        item.timestamp
    });
  });


  const weaknesses =
    rbFindPersistentWeaknesses(
      mistakes
    );


  const correct =
    diagnosisRecords.filter(
      function(x){ return x.correct; }
    ).length;


  const total =
    diagnosisRecords.length;


  const accuracy =
    total
    ? Math.round(correct / total * 100)
    : 0;


  const snapshot = {

    version: 1,

    updatedAt:
      Date.now(),

    totalQuestions:
      total,

    correct:
      correct,

    accuracy:
      accuracy,

    activeMistakes:
      getActive().length,

    mastered:
      getMastered().length,

    diagnosis:
      diagnosisRecords,

    persistentWeaknesses:
      weaknesses,

    nextPriority:
      weaknesses.length
      ? weaknesses[0]
      : null
  };


  rbWrite(
    RB_DIAGNOSIS_KEY,
    snapshot
  );

  return snapshot;
}


/* ---------------------------------------------------------
   MENTOR NEXT ACTION
--------------------------------------------------------- */

function getRankBoosterNextAction(){

  const snapshot =
    rbRead(
      RB_DIAGNOSIS_KEY,
      null
    );

  if(
    !snapshot ||
    !snapshot.nextPriority
  ){

    return {
      title:
        "Build your baseline",

      message:
        "Complete a full test first. The mentor needs enough performance data to identify your highest-impact weakness.",

      priority:
        "BASELINE"
    };
  }


  const weakness =
    snapshot.nextPriority;


  return {

    title:
      "Fix " +
      weakness.topic,

    message:
      weakness.subject +
      " → " +
      weakness.topic +
      " has " +
      weakness.wrong +
      " mistakes across " +
      weakness.attempts +
      " attempts. Dominant issue: " +
      weakness.dominantType +
      ".",

    priority:
      weakness.priority,

    action:
      rbActionForType(
        weakness.dominantType
      )
  };
}

function runRankBoosterAnalysis(){

  try{

    );

  }catch(error){

    );

    return null;
  }
  }
