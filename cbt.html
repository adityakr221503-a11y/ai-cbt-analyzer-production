<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Analyzer Pro — Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .question {
      font-size: 20px;
      font-weight: 600;
      margin: 20px 0;
    }

    .option {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
    }

    .option.selected {
      font-weight: 700;
      border: 2px solid #4f46e5;
    }

    #nextButton {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f5f9;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>CBT Analyzer Pro</h1>

  <div id="questionArea"></div>

  <button id="nextButton">Next Question</button>

  <div id="result"></div>

</div>

<script>
  const questions = [
    {
      id: "q1",
      text: "Which planet is known as the Red Planet?",
      options: [
        "Earth",
        "Mars",
        "Jupiter",
        "Venus"
      ],
      answer: "Mars"
    },

    {
      id: "q2",
      text: "What is 2 + 2?",
      options: [
        "3",
        "4",
        "5",
        "6"
      ],
      answer: "4"
    },

    {
      id: "q3",
      text: "Which gas is most abundant in Earth's atmosphere?",
      options: [
        "Oxygen",
        "Carbon dioxide",
        "Nitrogen",
        "Hydrogen"
      ],
      answer: "Nitrogen"
    }
  ];

  let currentIndex = 0;
  let selectedAnswer = null;
  let score = 0;
  let correct = 0;
  let incorrect = 0;
  let skipped = 0;

  const questionArea =
    document.getElementById("questionArea");

  const nextButton =
    document.getElementById("nextButton");

  const result =
    document.getElementById("result");

  function renderQuestion() {

    const question = questions[currentIndex];

    selectedAnswer = null;

    questionArea.innerHTML = `
      <div>
        Question ${currentIndex + 1} of ${questions.length}
      </div>

      <div class="question">
        ${question.text}
      </div>
    `;

    question.options.forEach(option => {

      const button =
        document.createElement("button");

      button.className = "option";
      button.textContent = option;

      button.onclick = () => {

        selectedAnswer = option;

        document
          .querySelectorAll(".option")
          .forEach(btn => {
            btn.classList.remove("selected");
          });

        button.classList.add("selected");
      };

      questionArea.appendChild(button);
    });

    nextButton.textContent =
      currentIndex === questions.length - 1
        ? "Submit Test"
        : "Next Question";
  }

  nextButton.onclick = () => {

    const question = questions[currentIndex];

    if (selectedAnswer === null) {
      skipped++;
    }
    else if (selectedAnswer === question.answer) {
      correct++;
      score += 4;
    }
    else {
      incorrect++;
      score -= 1;
    }

    if (currentIndex < questions.length - 1) {

      currentIndex++;

      renderQuestion();

      return;
    }

    questionArea.innerHTML = `
      <h2>Test Completed</h2>
      <p>Your CBT test has been submitted.</p>
    `;

    result.textContent =
      `Score: ${score}\n` +
      `Correct: ${correct}\n` +
      `Incorrect: ${incorrect}\n` +
      `Skipped: ${skipped}`;

    nextButton.disabled = true;
  };

  renderQuestion();
</script>

</body>
</html>
