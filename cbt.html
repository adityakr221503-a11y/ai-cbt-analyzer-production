.secondary{

.palette button{

.palette .answered{
background:#bbf7d0;

.palette .review{

}

.palette .current{

}

#result{

padding:14px;

margin-top:15px;

background:#f8fafc;
border-radius:10px;
}

.review-item.incorrect{

}

.review-item.correct{

}

.review-item.skipped{

}

margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.analysis-type{
font-weight:800;
color:#3730a3;
}

.info{

background:#f8fafc;
border-radius:10px;
margin-top:10px;
line-height:1.5;
font-size:13px;
color:#475569;

@media(max-width:800px){

}

}

}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

30:00
</div>

</div>

<div class="container">

<main class="card">

</section>

</main>

<aside class="card">

<h3>Question Palette</h3>

<div id="palette" class="palette"></div>

<button
class="danger"
type="button"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>

<script>

"use strict";

/* =====================================================
DEFAULT QUESTIONS
===================================================== */

let questions=[

{
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:[
"Earth",
"Mars",

],
answer:1,

},

{

],

solution:"The SI unit of force is the newton (N)."
},

{
subject:"Biology",

question:"Which organelle is known as the powerhouse of the cell?",
options:[

],
answer:2,
solution:"Mitochondria are major sites of ATP production during cellular respiration."
},

{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol of sodium?",
options:[
"So",

"Sd"
],
answer:1,
solution:"The symbol Na comes from the Latin name natrium."
},

{

options:[

],
answer:2,

},

{

],

},

{

question:"Which molecule carries genetic information?",
options:[

],
answer:2,
solution:"DNA stores hereditary genetic information in most organisms."
},

{
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:[
"Proton",
"Neutron",
"Electron",
"Photon"
],
answer:2,
solution:"An electron carries a negative elementary charge."
},

{
subject:"Chemistry",
topic:"Atomic Structure",
question:"Which particle has no electric charge?",
options:[
"Proton",
"Electron",
"Neutron",
"Positron"
],
answer:2,
solution:"A neutron is electrically neutral."
},

{
subject:"Biology",
topic:"Human Physiology",
question:"Which organ pumps blood throughout the human body?",
options:[
"Liver",
"Kidney",
"Heart",
"Lung"
],
answer:2,
solution:"The heart contracts rhythmically to pump blood through the circulatory system."
}

];


/* =====================================================
PDF CBT IMPORT
===================================================== */

function loadPDFQuestions(){

try{

const saved=localStorage.getItem("pdfCbtQuestions");

if(!saved){
return false;
}

const imported=JSON.parse(saved);

if(!Array.isArray(imported) || imported.length===0){
return false;
}

const valid=imported.filter(function(q){

return q &&
typeof q.question==="string" &&
q.question.trim()!=="" &&
Array.isArray(q.options) &&
q.options.length>=2 &&
Number.isInteger(Number(q.answer)) &&
Number(q.answer)>=0 &&
Number(q.answer)<q.options.length;

});

if(!valid.length){
return false;
}

questions=valid.map(function(q){

return{

id:q.id || ("pdf-"+Date.now()),

subject:q.subject || "Imported",

topic:q.topic || q.section || "PDF Import",

question:q.question,

options:q.options.map(String),

answer:Number(q.answer),

solution:q.solution ||
q.explanation ||
"Review the original PDF solution.",

explanation:q.explanation || "",

pdfPage:q.pdfPage || "",

pdfPageEnd:q.pdfPageEnd ||
q.pdfPage || "",

chapter:q.chapter || "",

section:q.section || "",

answerSource:q.answerSource ||
"Verified",

source:q.source ||
"PDF Import",

sourceType:q.sourceType ||
"PDF",

bookmarked:Boolean(q.bookmarked)

};

});

return true;

}catch(error){

console.error(
"PDF question loading failed:",
error
);

return false;

}

}


/* =====================================================
VALIDATE QUESTIONS
===================================================== */

function validateQuestions(){

questions=questions.filter(function(q){

return q &&
typeof q.question==="string" &&
q.question.trim()!=="" &&
Array.isArray(q.options) &&
q.options.length>=2 &&
Number.isInteger(Number(q.answer)) &&
Number(q.answer)>=0 &&
Number(q.answer)<q.options.length;

});

questions=questions.map(function(q){

q.answer=Number(q.answer);

q.options=q.options.map(String);

return q;

});

}


/* =====================================================
STATE
===================================================== */

let current=0;

let answers=[];

let marked=[];

let submitted=false;

let timeLeft=1800;


/* =====================================================
INITIALIZE
===================================================== */

function initializeState(){

answers=new Array(questions.length).fill(null);

marked=new Array(questions.length).fill(false);

current=0;

submitted=false;

}


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

const minutes=Math.floor(timeLeft/60);

const seconds=timeLeft%60;

document.getElementById("timer").textContent=
String(minutes).padStart(2,"0")+
":"+
String(seconds).padStart(2,"0");

}

updateTimer();

const timerInterval=setInterval(function(){

if(submitted)return;

timeLeft--;

if(timeLeft<=0){

timeLeft=0;

updateTimer();

clearInterval(timerInterval);

submitTest();

return;

}

updateTimer();

},1000);


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

const q=questions[current];

if(!q){

document.getElementById("questionNumber")
.textContent="No question available";

document.getElementById("question")
.textContent=
"Could not load questions.";

document.getElementById("options")
.innerHTML="";

return;

}

document.getElementById("questionNumber")
.textContent=
"Question "+
(current+1)+
" of "+
questions.length+
" • "+
(q.subject || "Imported");

document.getElementById("question")
.textContent=q.question;

const box=document.getElementById("options");

box.innerHTML="";

q.options.forEach(function(option,index){

const button=document.createElement("button");

button.type="button";

button.className="option";

if(answers[current]===index){

button.classList.add("selected");

}

button.textContent=
String.fromCharCode(65+index)+
". "+
option;

button.addEventListener("click",function(){

if(submitted)return;

answers[current]=index;

renderQuestion();

});

box.appendChild(button);

});

document.getElementById("nextButton")
.textContent=
current===questions.length-1
?"Finish"
:"Next";

renderPalette();

}


/* =====================================================
PALETTE
===================================================== */

function renderPalette(){

const palette=document.getElementById("palette");

palette.innerHTML="";

questions.forEach(function(q,index){

const button=document.createElement("button");

button.type="button";

button.textContent=index+1;

if(answers[index]!==null){

button.classList.add("answered");

}

if(marked[index]){

button.classList.add("review");

}

if(index===current){

button.classList.add("current");

}

button.addEventListener("click",function(){

if(submitted)return;

current=index;

renderQuestion();

});

palette.appendChild(button);

});

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

if(submitted)return;

if(current<questions.length-1){

current++;

renderQuestion();

}else{

submitTest();

}

}

function previousQuestion(){

if(submitted)return;

if(current>0){

current--;

renderQuestion();

}

}

function clearAnswer(){

if(submitted)return;

answers[current]=null;

renderQuestion();

}

function markReview(){

if(submitted)return;

marked[current]=!marked[current];

renderPalette();

}


/* =====================================================
MISTAKE INTELLIGENCE
===================================================== */

function classifyMistake(q,selectedIndex){

const question=
String(q.question||"").toLowerCase();

const topic=
String(q.topic||"").toLowerCase();

const selected=
selectedIndex===null ||
selectedIndex===undefined
?""
:String(q.options[selectedIndex]||"")
.toLowerCase();

const correct=
String(q.options[q.answer]||"")
.toLowerCase();

const calculationWords=[
"calculate",
"calculation",
"numerical",
"value of",
"find the",
"velocity",
"acceleration",
"force",
"work",
"energy",
"power",
"current",
"voltage",
"resistance",
"mass",
"momentum"
];

if(calculationWords.some(function(word){

return question.includes(word);

})){

return{
type:"🔢 Calculation Error",
reason:
"Recheck the formula, units and calculation steps."
};

}

const memoryWords=[
"what is",
"which",
"who",
"symbol",
"unit",
"known as",
"called",
"most abundant",
"organ",
"organelle"
];

if(memoryWords.some(function(word){

return question.includes(word);

})){

return{
type:"📚 Memory / Recall Gap",
reason:
"This is mainly a factual or definition-based question. Revise the key fact and test recall again."
};

}

const conceptWords=[
"why",
"principle",
"mechanism",
"process",
"function",
"relationship",
"reason",
"concept"
];

if(
conceptWords.some(function(word){
return question.includes(word);
}) ||
topic.includes("concept")
){

return{
type:"🧠 Concept Gap",
reason:
"Review the underlying concept instead of memorising only the answer."
};

}

if(selected && correct && selected!==correct){

const selectedWords=selected.split(/\s+/);

const correctWords=correct.split(/\s+/);

const overlap=selectedWords.filter(function(word){

return word.length>3 &&
correctWords.includes(word);

}).length;

if(overlap>0){

return{
type:"🧩 Confused Concepts",
reason:
"Your selected answer is related to the correct answer. Review the distinction between the two concepts."
};

}

}

return{
type:"⚠️ Concept Gap",
reason:
"The answer was incorrect. Review the explanation and retry the question."
};

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
REACTIVATE MISTAKES
===================================================== */

function reactivateMistakes(){

let mastery=[];

try{

mastery=JSON.parse(
localStorage.getItem("cbtMasteryV2")||"[]"
);

if(!Array.isArray(mastery)){
mastery=[];
}

}catch(error){

mastery=[];

}

const wrongQuestions=new Set();

questions.forEach(function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

wrongQuestions.add(
normalize(q.question)
);

}

});

mastery=mastery.filter(function(item){

if(!item || !item.question){
return true;
}

return !wrongQuestions.has(
normalize(item.question)
);

});

localStorage.setItem(
"cbtMasteryV2",
JSON.stringify(mastery)
);

}


/* =====================================================
SAVE HISTORY
===================================================== */

function saveHistory(correct,incorrect,skipped,score){

let history=[];

try{

history=JSON.parse(
localStorage.getItem("cbtHistory")||"[]"
);

if(!Array.isArray(history)){
history=[];
}

}catch(error){

history=[];

}

const record={

date:new Date().toLocaleString(),

timestamp:Date.now(),

score:score,

correct:correct,

incorrect:incorrect,

wrong:incorrect,

skipped:skipped,

questions:questions.map(function(q,index){

let status="skipped";

if(answers[index]!==null){

status=
answers[index]===q.answer
?"correct"
:"wrong";

}

let intelligence=null;

if(status==="wrong"){

intelligence=
classifyMistake(q,answers[index]);

}

return{

question:q.question,

options:q.options,

subject:q.subject,

topic:q.topic,

status:status,

selectedIndex:answers[index],

selectedAnswer:
answers[index]===null
?"Not answered"
:q.options[answers[index]],

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

mistakeType:
intelligence
?intelligence.type
:null,

mistakeReason:
intelligence
?intelligence.reason
:null,

mistakeConfidence:
intelligence
?"Auto Classified"
:null,

solution:q.solution||"",

bookmarked:Boolean(marked[index]),

markedForReview:Boolean(marked[index]),

pdfPage:q.pdfPage||"",

chapter:q.chapter||"",

section:q.section||""

};

})

};

history.push(record);

localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}
/* =====================================================
RETRY QUEUE
===================================================== */

function openRetry(){

const wrong=[];

questions.forEach(function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

const intelligence=
classifyMistake(q,answers[index]);

wrong.push({

id:"retry-"+Date.now()+"-"+index,

question:q.question,

options:q.options,

subject:q.subject||"Imported",

topic:q.topic||"PDF Import",

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

solution:q.solution||"",

selectedIndex:answers[index],

selectedAnswer:q.options[answers[index]],

mistakeType:intelligence.type,

mistakeReason:intelligence.reason,

source:"CBT",

pdfPage:q.pdfPage||"",

chapter:q.chapter||"",

section:q.section||""

});

}

});

if(wrong.length===0){

alert("There are no mistakes to retry.");

return;

}

localStorage.setItem(
"cbtAnalyzer.retryQueue",
JSON.stringify(wrong)
);

localStorage.setItem(
"cbtRetryQuestion",
JSON.stringify(wrong[0])
);

localStorage.setItem(
"cbtRetryStartedAt",
String(Date.now())
);

window.location.href="retry.html";

}


/* =====================================================
RETRY BUTTON
===================================================== */

function updateRetryButton(incorrect){

const button=
document.getElementById("retryButton");

if(incorrect>0){

button.style.display="block";

button.textContent=
"🔄 Retry "+
incorrect+
" Mistake"+
(incorrect===1?"":"s");

}else{

button.style.display="none";

}

}


/* =====================================================
SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted)return;

if(!questions.length){

alert("No questions are available.");

return;

}

let correct=0;
let incorrect=0;
let skipped=0;

questions.forEach(function(q,index){

if(answers[index]===null){

skipped++;

}
else if(answers[index]===q.answer){

correct++;

}
else{

incorrect++;

}

});

/*
NEET-style scoring:
Correct = +4
Wrong = -1
Skipped = 0
*/

const score=(correct*4)-incorrect;

reactivateMistakes();

saveHistory(
correct,
incorrect,
skipped,
score
);

submitted=true;

clearInterval(timerInterval);

document.getElementById("testScreen")
.style.display="none";

document.querySelector("aside")
.style.display="none";

document.getElementById("result")
.style.display="block";

document.getElementById("score")
.textContent=
score+
" / "+
(questions.length*4);

document.getElementById("summary")
.textContent=
"Correct: "+
correct+
" | Incorrect: "+
incorrect+
" | Skipped: "+
skipped;

updateRetryButton(incorrect);

generateReview();

}


/* =====================================================
GENERATE REVIEW
===================================================== */

function generateReview(){

const box=
document.getElementById("review");

box.innerHTML=
"<h3>🧠 Question Analysis</h3>";

questions.forEach(function(q,index){

const item=
document.createElement("div");

let status;

if(answers[index]===null){

status="skipped";

}
else if(answers[index]===q.answer){

status="correct";

}
else{

status="incorrect";

}

item.className=
"review-item "+
status;

const yourAnswer=
answers[index]===null
?"Not answered"
:q.options[answers[index]];

let html="";

html+=
"<strong>Question "+
(index+1)+
"</strong>";

html+=
"<p>"+
escapeHTML(q.question)+
"</p>";

html+=
"<p><strong>Your answer:</strong> "+
escapeHTML(yourAnswer)+
"</p>";

html+=
"<p><strong>Correct answer:</strong> "+
escapeHTML(q.options[q.answer])+
"</p>";

if(status==="correct"){

html+=
"<div class='analysis'>"+
"✅ <strong>Correct</strong><br>"+
"Good work. You selected the correct answer.";

if(q.solution){

html+=
"<br><br><strong>💡 Solution:</strong><br>"+
escapeHTML(q.solution);

}

html+="</div>";

}

if(status==="skipped"){

html+=
"<div class='analysis'>"+
"🟡 <strong>Skipped</strong><br>"+
"This question was not answered.";

if(q.solution){

html+=
"<br><br><strong>💡 Solution:</strong><br>"+
escapeHTML(q.solution);

}

html+="</div>";

}

if(status==="incorrect"){

const intelligence=
classifyMistake(
q,
answers[index]
);

html+=
"<div class='analysis'>"+

"<strong>🧠 Mistake Intelligence</strong>"+

"<br><br>"+

"<strong>Mistake Type:</strong>"+

"<div class='analysis-type'>"+
escapeHTML(intelligence.type)+
"</div>"+

"<br>"+

"<strong>Why:</strong><br>"+
escapeHTML(intelligence.reason)+

"<br><br>"+

"<strong>💡 Solution:</strong><br>"+
escapeHTML(
q.solution||
"Review the underlying concept and retry the question."
)+

"</div>";

}

if(
q.pdfPage||
q.chapter||
q.section
){

html+=
"<div class='info'>";

if(q.pdfPage){

html+=
"📄 PDF Page: "+
escapeHTML(q.pdfPage);

}

if(q.chapter){

html+=
"<br>📚 Chapter: "+
escapeHTML(q.chapter);

}

if(q.section){

html+=
"<br>📌 Section: "+
escapeHTML(q.section);

}

html+="</div>";

}

item.innerHTML=html;

box.appendChild(item);

});

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
FINAL INITIALIZATION
===================================================== */

loadPDFQuestions();

validateQuestions();

initializeState();

renderQuestion();

renderPalette();


/* =====================================================
PDF DATA CLEANUP
===================================================== */

/*
Remove temporary PDF questions only AFTER
they have successfully loaded.
*/

if(questions.length>0){

localStorage.removeItem("pdfCbtQuestions");

}


/* =====================================================
EMPTY TEST PROTECTION
===================================================== */

if(!questions.length){

document.getElementById("questionNumber")
.textContent="No questions loaded";

document.getElementById("question")
.textContent=
"Please import a PDF or load a valid question set.";

document.getElementById("options")
.innerHTML="";

}


/* =====================================================
START MESSAGE
===================================================== */

console.log(
"CBT Analyzer Pro ready:",
questions.length,
"questions"
);

</script>
