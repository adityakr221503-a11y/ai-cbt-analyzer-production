/* =====================================================
LOAD PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

    try{

        const saved =
            localStorage.getItem("pdfCbtQuestions");

        if(!saved){
            return false;
        }

        const imported =
            JSON.parse(saved);

        if(
            !Array.isArray(imported) ||
            imported.length === 0
        ){
            return false;
        }

        const valid =
            imported.filter(function(q){

                return q &&
                    typeof q.question === "string" &&
                    q.question.trim() !== "" &&
                    Array.isArray(q.options) &&
                    q.options.length >= 2 &&
                    Number.isInteger(q.answer) &&
                    q.answer >= 0 &&
                    q.answer < q.options.length;

            });


        if(valid.length === 0){
            return false;
        }


        questions =
            valid.map(function(q){

                return {

                    id:
                        q.id ||
                        ("pdf-" + Date.now()),

                    subject:
                        q.subject ||
                        "Imported",

                    topic:
                        q.topic ||
                        q.section ||
                        "PDF Import",

                    question:
                        q.question,

                    options:
                        q.options,

                    answer:
                        Number(q.answer),

                    solution:
                        q.solution ||
                        q.explanation ||
                        "Review the original PDF solution.",

                    explanation:
                        q.explanation || "",

                    pdfPage:
                        q.pdfPage || "",

                    pdfPageEnd:
                        q.pdfPageEnd ||
                        q.pdfPage ||
                        "",

                    chapter:
                        q.chapter || "",

                    section:
                        q.section || "",

                    answerSource:
                        q.answerSource ||
                        "Verified",

                    source:
                        q.source ||
                        "PDF Import",

                    sourceType:
                        q.sourceType ||
                        "PDF",

                    bookmarked:
                        Boolean(q.bookmarked)

                };

            });


        return true;

    }

    catch(error){

        console.error(
            "PDF question loading failed:",
            error
        );

        return false;

    }

}


/* =====================================================
VALIDATE QUESTIONS
===================================================== */

function validateQuestions(){

    questions =
        questions.filter(function(q){

            return q &&
                typeof q.question === "string" &&
                q.question.trim() !== "" &&
                Array.isArray(q.options) &&
                q.options.length >= 2 &&
                Number.isInteger(q.answer) &&
                q.answer >= 0 &&
                q.answer < q.options.length;

        });

                      }
    /* =====================================================
STATE
===================================================== */

let current = 0;
let answers = [];
let marked = [];
let submitted = false;
let timeLeft = 1800;
let timerInterval = null;


/* =====================================================
INITIALIZE STATE
===================================================== */

function initializeState(){

    answers = new Array(questions.length).fill(null);

    marked = new Array(questions.length).fill(false);

    current = 0;

    submitted = false;

    timeLeft = 1800;
}


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");
}


function startTimer(){

    clearInterval(timerInterval);

    updateTimer();

    timerInterval = setInterval(function(){

        if(submitted){
            clearInterval(timerInterval);
            return;
        }

        timeLeft--;

        if(timeLeft <= 0){

            timeLeft = 0;

            updateTimer();

            clearInterval(timerInterval);

            submitTest();

            return;
        }

        updateTimer();

    },1000);
}


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

    const q = questions[current];

    if(!q){

        document.getElementById("questionNumber").textContent =
            "No question available";

        document.getElementById("question").textContent =
            "Could not load questions.";

        document.getElementById("options").innerHTML = "";

        return;
    }


    document.getElementById("questionNumber").textContent =
        "Question " +
        (current + 1) +
        " of " +
        questions.length +
        " • " +
        (q.subject || "Imported");


    document.getElementById("question").textContent =
        q.question;


    const box =
        document.getElementById("options");

    box.innerHTML = "";


    q.options.forEach(function(option,index){

        const button =
            document.createElement("button");

        button.type = "button";

        button.className = "option";


        if(answers[current] === index){

            button.classList.add("selected");

        }


        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;


        button.onclick = function(){

            if(submitted) return;

            answers[current] = index;

            renderQuestion();

        };


        box.appendChild(button);

    });


    const nextButton =
        document.getElementById("nextButton");


    nextButton.textContent =
        current === questions.length - 1
        ? "Finish"
        : "Next";


    renderPalette();

}


/* =====================================================
QUESTION PALETTE
===================================================== */

function renderPalette(){

    const palette =
        document.getElementById("palette");

    palette.innerHTML = "";


    questions.forEach(function(q,index){

        const button =
            document.createElement("button");

        button.type = "button";

        button.textContent = index + 1;


        if(answers[index] !== null){

            button.classList.add("answered");

        }


        if(marked[index]){

            button.classList.add("review");

        }


        if(index === current){

            button.classList.add("current");

        }


        button.onclick = function(){

            if(submitted) return;

            current = index;

            renderQuestion();

        };


        palette.appendChild(button);

    });

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

    if(submitted) return;


    if(current < questions.length - 1){

        current++;

        renderQuestion();

    }else{

        submitTest();

    }

}


function previousQuestion(){

    if(submitted) return;


    if(current > 0){

        current--;

        renderQuestion();

    }

}


function clearAnswer(){

    if(submitted) return;

    answers[current] = null;

    renderQuestion();

}


function markReview(){

    if(submitted) return;

    marked[current] = !marked[current];

    renderPalette();

}
    /* =====================================================
MISTAKE INTELLIGENCE
===================================================== */

function classifyMistake(q, selectedIndex){

    const question =
        String(q.question || "").toLowerCase();

    const topic =
        String(q.topic || "").toLowerCase();

    const selected =
        selectedIndex === null ||
        selectedIndex === undefined
        ? ""
        : String(
            q.options[selectedIndex] || ""
          ).toLowerCase();

    const correct =
        String(
            q.options[q.answer] || ""
        ).toLowerCase();


    /* =========================
       CALCULATION ERROR
    ========================= */

    const calculationWords = [

        "calculate",
        "calculation",
        "numerical",
        "value of",
        "find the",
        "velocity",
        "acceleration",
        "force",
        "work",
        "energy",
        "power",
        "current",
        "voltage",
        "resistance",
        "mass",
        "momentum"

    ];


    if(
        calculationWords.some(function(word){

            return question.includes(word);

        })
    ){

        return {

            type: "🔢 Calculation Error",

            reason:
                "Recheck the formula, units and calculation steps."

        };

    }


    /* =========================
       MEMORY / RECALL
    ========================= */

    const memoryWords = [

        "what is",
        "which is",
        "who",
        "symbol",
        "unit",
        "known as",
        "called",
        "most abundant",
        "organ",
        "organelle"

    ];


    if(
        memoryWords.some(function(word){

            return question.includes(word);

        })
    ){

        return {

            type: "📚 Memory / Recall Gap",

            reason:
                "This is mainly a factual or definition-based question. Revise the key fact and test recall again."

        };

    }


    /* =========================
       CONCEPT GAP
    ========================= */

    const conceptWords = [

        "why",
        "principle",
        "mechanism",
        "process",
        "function",
        "relationship",
        "reason",
        "concept"

    ];


    if(
        conceptWords.some(function(word){

            return question.includes(word);

        }) ||
        topic.includes("concept")
    ){

        return {

            type: "🧠 Concept Gap",

            reason:
                "Review the underlying concept instead of memorising only the answer."

        };

    }


    /* =========================
       CONFUSED CONCEPTS
    ========================= */

    if(
        selected &&
        correct &&
        selected !== correct
    ){

        const selectedWords =
            selected.split(/\s+/);

        const correctWords =
            correct.split(/\s+/);


        const overlap =
            selectedWords.filter(function(word){

                return (
                    word.length > 3 &&
                    correctWords.includes(word)
                );

            }).length;


        if(overlap > 0){

            return {

                type: "🧩 Confused Concepts",

                reason:
                    "Your selected answer is related to the correct answer. Review the distinction between the two concepts."

            };

        }

    }


    /* =========================
       DEFAULT
    ========================= */

    return {

        type: "⚠️ Concept Gap",

        reason:
            "The answer was incorrect. Review the explanation and retry the question."

    };

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =====================================================
REACTIVATE MISTAKES
===================================================== */

function reactivateMistakes(){

    let mastery = [];


    try{

        mastery =
            JSON.parse(
                localStorage.getItem(
                    "cbtMasteryV2"
                ) || "[]"
            );


        if(!Array.isArray(mastery)){

            mastery = [];

        }

    }catch(error){

        mastery = [];

    }


    const wrongQuestions =
        new Set();


    questions.forEach(function(q,index){

        if(
            answers[index] !== null &&
            answers[index] !== q.answer
        ){

            wrongQuestions.add(
                normalize(q.question)
            );

        }

    });


    mastery =
        mastery.filter(function(item){

            if(
                !item ||
                !item.question
            ){

                return true;

            }


            return !wrongQuestions.has(
                normalize(item.question)
            );

        });


    localStorage.setItem(
        "cbtMasteryV2",
        JSON.stringify(mastery)
    );

}
    /* =====================================================
SAVE TEST HISTORY
===================================================== */

function saveHistory(
    correct,
    incorrect,
    skipped,
    score
){

    let history = [];


    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "cbtHistory"
                ) || "[]"
            );


        if(!Array.isArray(history)){

            history = [];

        }

    }catch(error){

        history = [];

    }


    const record = {

        date:
            new Date().toLocaleString(),

        timestamp:
            Date.now(),

        score:
            score,

        correct:
            correct,

        incorrect:
            incorrect,

        wrong:
            incorrect,

        skipped:
            skipped,

        total:
            questions.length,

        questions:
            questions.map(function(q,index){

                let status;


                if(
                    answers[index] === null
                ){

                    status = "skipped";

                }
                else if(
                    answers[index] === q.answer
                ){

                    status = "correct";

                }
                else{

                    status = "incorrect";

                }


                let intelligence = null;


                if(status === "incorrect"){

                    intelligence =
                        classifyMistake(
                            q,
                            answers[index]
                        );

                }


                return {

                    id:
                        q.id ||
                        (
                            "history-" +
                            Date.now() +
                            "-" +
                            index
                        ),

                    question:
                        q.question,

                    options:
                        q.options,

                    subject:
                        q.subject || "Imported",

                    topic:
                        q.topic || "PDF Import",

                    status:
                        status,

                    selectedIndex:
                        answers[index],

                    selectedAnswer:
                        answers[index] === null
                        ? "Not answered"
                        : q.options[
                            answers[index]
                          ],

                    correctIndex:
                        q.answer,

                    correctAnswer:
                        q.options[q.answer],

                    mistakeType:
                        intelligence
                        ? intelligence.type
                        : null,

                    mistakeReason:
                        intelligence
                        ? intelligence.reason
                        : null,

                    mistakeConfidence:
                        intelligence
                        ? "Auto Classified"
                        : null,

                    solution:
                        q.solution || "",

                    explanation:
                        q.explanation || "",

                    bookmarked:
                        Boolean(
                            marked[index]
                        ),

                    markedForReview:
                        Boolean(
                            marked[index]
                        ),

                    pdfPage:
                        q.pdfPage || "",

                    chapter:
                        q.chapter || "",

                    section:
                        q.section || "",

                    source:
                        q.source || "CBT"

                };

            })

    };


    history.push(record);


    /* Keep history available to Dashboard */

    localStorage.setItem(
        "cbtHistory",
        JSON.stringify(history)
    );


    /* Also save latest test separately */

    localStorage.setItem(
        "cbtLastTest",
        JSON.stringify(record)
    );

}

/* =====================================================
CREATE RETRY QUEUE
===================================================== */

function openRetry(){

    const wrong = [];

    questions.forEach(function(q,index){

        if(
            answers[index] !== null &&
            answers[index] !== q.answer
        ){

            const intelligence =
                classifyMistake(
                    q,
                    answers[index]
                );

            wrong.push({

                id:
                    "retry-" +
                    Date.now() +
                    "-" +
                    index,

                question:
                    q.question,

                options:
                    q.options,

                subject:
                    q.subject || "Imported",

                topic:
                    q.topic || "PDF Import",

                correctIndex:
                    q.answer,

                correctAnswer:
                    q.options[q.answer],

                selectedIndex:
                    answers[index],

                selectedAnswer:
                    q.options[answers[index]],

                solution:
                    q.solution || "",

                explanation:
                    q.explanation || "",

                mistakeType:
                    intelligence.type,

                mistakeReason:
                    intelligence.reason,

                mistakeConfidence:
                    "Auto Classified",

                source:
                    q.source || "PDF Import",

                sourceType:
                    q.sourceType || "PDF",

                pdfPage:
                    q.pdfPage || "",

                chapter:
                    q.chapter || "",

                section:
                    q.section || "",

                bookmarked:
                    Boolean(marked[index]),

                markedForReview:
                    Boolean(marked[index])

            });

        }

    });


    if(wrong.length === 0){

        alert(
            "There are no mistakes to retry."
        );

        return;

    }


    /* ==========================================
       SAVE COMPLETE RETRY QUEUE
    ========================================== */

    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(wrong)
    );


    /* ==========================================
       SAVE FIRST RETRY QUESTION
    ========================================== */

    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(wrong[0])
    );


    /* ==========================================
       SAVE COMPATIBILITY DATA
    ========================================== */

    localStorage.setItem(
        "retryQuestions",
        JSON.stringify(wrong)
    );

    localStorage.setItem(
        "mistakeQuestions",
        JSON.stringify(wrong)
    );


    localStorage.setItem(
        "cbtRetryStartedAt",
        String(Date.now())
    );


    /* ==========================================
       OPEN RETRY PAGE
    ========================================== */

    window.location.href =
        "retry.html";

}


/* =====================================================
RETRY BUTTON
===================================================== */

function updateRetryButton(incorrect){

    const button =
        document.getElementById(
            "retryButton"
        );


    if(!button){
        return;
    }


    if(incorrect > 0){

        button.style.display =
            "block";

        button.textContent =
            "🔄 Retry " +
            incorrect +
            " Mistake" +
            (
                incorrect === 1
                ? ""
                : "s"
            );

    }
    else{

        button.style.display =
            "none";

    }

}


/* =====================================================
GENERATE REVIEW
===================================================== */

function generateReview(){

    const review =
        document.getElementById(
            "review"
        );

    if(!review){
        return;
    }


    review.innerHTML = "";


    questions.forEach(function(q,index){

        const selected =
            answers[index];


        const item =
            document.createElement(
                "div"
            );


        let statusHTML = "";


        if(selected === null){

            item.className =
                "review-item skipped";

            statusHTML =
                '<span class="status-skipped">' +
                "⚠️ Skipped" +
                "</span>";

        }
        else if(selected === q.answer){

            item.className =
                "review-item correct";

            statusHTML =
                '<span class="status-correct">' +
                "✅ Correct" +
                "</span>";

        }
        else{

            item.className =
                "review-item incorrect";

            statusHTML =
                '<span class="status-incorrect">' +
                "❌ Incorrect" +
                "</span>";

        }


        let html = "";


        html +=
            "<div>" +
            "<b>Q" +
            (index + 1) +
            ".</b> " +
            escapeHTML(q.question) +
            "</div>";


        html +=
            "<div style='margin-top:8px'>" +
            statusHTML +
            "</div>";


        if(selected === null){

            html +=
                "<div style='margin-top:8px'>" +
                "<b>Your answer:</b> Not answered" +
                "</div>";

        }
        else{

            html +=
                "<div style='margin-top:8px'>" +
                "<b>Your answer:</b> " +
                escapeHTML(
                    q.options[selected]
                ) +
                "</div>";

        }


        html +=
            "<div style='margin-top:8px'>" +
            "<b>Correct answer:</b> " +
            escapeHTML(
                q.options[q.answer]
            ) +
            "</div>";


        /* ======================================
           INCORRECT ANALYSIS
        ====================================== */

        if(
            selected !== null &&
            selected !== q.answer
        ){

            const intelligence =
                classifyMistake(
                    q,
                    selected
                );


            html +=
                "<div class='analysis'>" +

                "<div class='analysis-type'>" +
                intelligence.type +
                "</div>" +

                "<div style='margin-top:6px'>" +
                "<b>Why:</b> " +
                escapeHTML(
                    intelligence.reason
                ) +
                "</div>" +

                "</div>";

        }


        /* ======================================
           SOLUTION
        ====================================== */

        if(q.solution){

            html +=
                "<div class='info'>" +

                "<b>💡 Solution:</b>" +

                "<br>" +

                escapeHTML(
                    q.solution
                ) +

                "</div>";

        }


        /* ======================================
           RETRY THIS QUESTION
        ====================================== */

        if(
            selected !== null &&
            selected !== q.answer
        ){

            html +=
                "<button " +
                "type='button' " +
                "class='primary' " +
                "style='margin-top:8px;width:100%' " +
                "onclick='retrySingleQuestion(" +
                index +
                ")'>" +
                "🔄 Retry This Question" +
                "</button>";

        }


        item.innerHTML =
            html;


        review.appendChild(
            item
        );

    });

}


/* =====================================================
RETRY SINGLE QUESTION
===================================================== */

function retrySingleQuestion(index){

    const q =
        questions[index];

    if(!q){
        return;
    }


    const intelligence =
        classifyMistake(
            q,
            answers[index]
        );


    const retryQuestion = {

        id:
            "retry-single-" +
            Date.now(),

        question:
            q.question,

        options:
            q.options,

        subject:
            q.subject || "Imported",

        topic:
            q.topic || "PDF Import",

        correctIndex:
            q.answer,

        correctAnswer:
            q.options[q.answer],

        selectedIndex:
            answers[index],

        selectedAnswer:
            answers[index] === null
            ? "Not answered"
            : q.options[
                answers[index]
              ],

        solution:
            q.solution || "",

        explanation:
            q.explanation || "",

        mistakeType:
            intelligence.type,

        mistakeReason:
            intelligence.reason,

        source:
            q.source || "PDF Import",

        pdfPage:
            q.pdfPage || "",

        chapter:
            q.chapter || "",

        section:
            q.section || ""

    };


    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(
            retryQuestion
        )
    );


    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(
            [retryQuestion]
        )
    );


    localStorage.setItem(
        "retryQuestions",
        JSON.stringify(
            [retryQuestion]
        )
    );


    window.location.href =
        "retry.html";

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value == null
        ? ""
        : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
