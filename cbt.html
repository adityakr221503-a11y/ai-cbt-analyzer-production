<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CBT Analyzer Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a
}

header{
  background:#fff;
  padding:16px 20px;
  border-bottom:1px solid #e2e8f0;
  position:sticky;
  top:0;
  z-index:10
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

.logo{
  font-size:20px;
  font-weight:700
}

.timer{
  padding:9px 14px;
  border-radius:9px;
  background:#eef2ff;
  font-weight:700
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:20px
}

.card{
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}

.question-number{
  color:#64748b;
  font-weight:600;
  margin-bottom:12px
}

.question{
  font-size:20px;
  line-height:1.5;
  font-weight:700;
  margin-bottom:22px
}

.option{
  width:100%;
  padding:15px;
  margin:9px 0;
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:11px;
  text-align:left;
  font-size:16px;
  cursor:pointer
}

.option:hover{
  background:#f8fafc
}

.option.selected{
  border-color:#4f46e5;
  background:#eef2ff;
  font-weight:700
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:#4f46e5;
  color:#fff
}

.secondary{
  background:#e2e8f0;
  color:#0f172a
}

.warning{
  background:#f59e0b;
  color:#fff
}

.danger{
  background:#dc2626;
  color:#fff
}

.palette{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:15px
}

.palette button{
  padding:10px 5px;
  background:#e2e8f0
}

.palette button.answered{
  background:#bbf7d0
}

.palette button.review{
  background:#fde68a
}

.palette button.current{
  outline:3px solid #4f46e5
}

.legend{
  margin-top:15px;
  font-size:13px;
  color:#64748b;
  line-height:1.8
}

#result{
  display:none;
  text-align:center
}

.score{
  font-size:38px;
  font-weight:800;
  margin:20px 0
}

.review-item{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:#f8fafc;
  text-align:left
}

.correct{
  border-left:5px solid #16a34a
}

.incorrect{
  border-left:5px solid #dc2626
}

.skipped{
  border-left:5px solid #f59e0b
}

@media(max-width:800px){
  .container{
    grid-template-columns:1fr
  }

  .header{
    align-items:flex-start
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">CBT Analyzer Pro</div>
    <div class="timer" id="timer">30:00</div>
  </div>
</header>

<div class="container">

  <main class="card">

    <section id="testScreen">

      <div class="question-number" id="questionNumber">
        Question 1 of 10
      </div>

      <div class="question" id="question">
        Loading question...
      </div>

      <div id="options"></div>

      <div class="buttons">
        <button class="secondary" onclick="previousQuestion()">
          Previous
        </button>

        <button class="warning" onclick="markReview()">
          Mark for Review
        </button>

        <button class="secondary" onclick="clearAnswer()">
          Clear Answer
        </button>

        <button class="primary" id="nextButton" onclick="nextQuestion()">
          Next
        </button>
      </div>

    </section>

    <section id="result">

      <h2>Test Completed</h2>

      <div class="score" id="score"></div>

      <p id="summary"></p>

      <div id="review"></div>

      <button
        class="primary"
        onclick="location.reload()">
        Restart Test
      </button>

    </section>

  </main>


  <aside class="card">

    <h3>Question Palette</h3>

    <div class="palette" id="palette"></div>

    <div class="legend">
      🟩 Answered<br>
      🟨 Marked for review<br>
      ⬜ Not answered<br>
      🟦 Current question
    </div>

    <button
      class="danger"
      style="width:100%;margin-top:20px"
      onclick="submitTest()">
      Submit Test
    </button>

  </aside>

</div>


<script>

/* =========================================
   CBT QUESTIONS
   ========================================= */

const questions = [

  {
    id:"q1",
    question:"Which planet is known as the Red Planet?",
    options:[
      "Earth",
      "Mars",
      "Jupiter",
      "Venus"
    ],
    answer:1
  },

  {
    id:"q2",
    question:"What is 2 + 2?",
    options:[
      "3",
      "4",
      "5",
      "6"
    ],
    answer:1
  },

  {
    id:"q3",
    question:"Which gas is most abundant in Earth's atmosphere?",
    options:[
      "Oxygen",
      "Carbon dioxide",
      "Nitrogen",
      "Hydrogen"
    ],
    answer:2
  },

  {
    id:"q4",
    question:"What is the SI unit of force?",
    options:[
      "Joule",
      "Newton",
      "Watt",
      "Pascal"
    ],
    answer:1
  },

  {
    id:"q5",
    question:"Which organelle is known as the powerhouse of the cell?",
    options:[
      "Nucleus",
      "Ribosome",
      "Mitochondria",
      "Golgi apparatus"
    ],
    answer:2
  },

  {
    id:"q6",
    question:"What is the chemical symbol for sodium?",
    options:[
      "So",
      "Na",
      "S",
      "Sd"
    ],
    answer:1
  },

  {
    id:"q7",
    question:"Which process is responsible for formation of ATP in mitochondria?",
    options:[
      "Photosynthesis",
      "Cellular respiration",
      "Transcription",
      "Translation"
    ],
    answer:1
  },

  {
    id:"q8",
    question:"What is the acceleration due to gravity near Earth's surface approximately?",
    options:[
      "4.9 m/s²",
      "9.8 m/s²",
      "19.6 m/s²",
      "98 m/s²"
    ],
    answer:1
  },

  {
    id:"q9",
    question:"Which molecule carries genetic information?",
    options:[
      "Protein",
      "Lipid",
      "DNA",
      "Glucose"
    ],
    answer:2
  },

  {
    id:"q10",
    question:"Which particle has a negative electric charge?",
    options:[
      "Proton",
      "Neutron",
      "Electron",
      "Photon"
    ],
    answer:2
  }

];


/* =========================================
   STATE
   ========================================= */

let current = 0;

let answers =
  new Array(questions.length).fill(null);

let review =
  new Array(questions.length).fill(false);

let submitted = false;


/* =========================================
   TIMER
   ========================================= */

let timeLeft = 30 * 60;

const timerElement =
  document.getElementById("timer");

const timerInterval =
  setInterval(() => {

    if(submitted) return;

    timeLeft--;

    if(timeLeft <= 0){

      timeLeft = 0;

      updateTimer();

      clearInterval(timerInterval);

      submitTest();

      return;
    }

    updateTimer();

  },1000);


function updateTimer(){

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    timeLeft % 60;

  timerElement.textContent =
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");
}


/* =========================================
   RENDER QUESTION
   ========================================= */

function renderQuestion(){

  const q = questions[current];

  document.getElementById("questionNumber")
    .textContent =
      `Question ${current + 1} of ${questions.length}`;

  document.getElementById("question")
    .textContent = q.question;

  const options =
    document.getElementById("options");

  options.innerHTML = "";

  q.options.forEach((option,index)=>{

    const button =
      document.createElement("button");

    button.className = "option";

    if(answers[current] === index){
      button.classList.add("selected");
    }

    button.textContent =
      String.fromCharCode(65 + index)
      + ". "
      + option;

    button.onclick = ()=>{

      answers[current] = index;

      renderQuestion();

    };

    options.appendChild(button);

  });


  document.getElementById("nextButton")
    .textContent =
      current === questions.length - 1
      ? "Finish"
      : "Next";


  renderPalette();

}


/* =========================================
   QUESTION PALETTE
   ========================================= */

function renderPalette(){

  const palette =
    document.getElementById("palette");

  palette.innerHTML = "";

  questions.forEach((q,index)=>{

    const button =
      document.createElement("button");

    button.textContent = index + 1;

    if(answers[index] !== null){
      button.classList.add("answered");
    }

    if(review[index]){
      button.classList.add("review");
    }

    if(index === current){
      button.classList.add("current");
    }

    button.onclick = ()=>{

      current = index;

      renderQuestion();

    };

    palette.appendChild(button);

  });

}


/* =========================================
   NAVIGATION
   ========================================= */

function nextQuestion(){

  if(current < questions.length - 1){

    current++;

    renderQuestion();

  }else{

    submitTest();

  }

}


function previousQuestion(){

  if(current > 0){

    current--;

    renderQuestion();

  }

}


function clearAnswer(){

  answers[current] = null;

  renderQuestion();

}


function markReview(){

  review[current] =
    !review[current];

  renderPalette();

}


/* =========================================
   SUBMIT
   ========================================= */

function submitTest(){

  if(submitted) return;

  const unanswered =
    answers.filter(a => a === null).length;

  if(unanswered > 0){

    const confirmSubmit =
      confirm(
        `${unanswered} question(s) are unanswered.\n\nSubmit test anyway?`
      );

    if(!confirmSubmit){
      return;
    }

  }

  submitted = true;

  clearInterval(timerInterval);

  let correct = 0;
  let incorrect = 0;
  let skipped = 0;

  questions.forEach((q,index)=>{

    if(answers[index] === null){

      skipped++;

    }
    else if(answers[index] === q.answer){

      correct++;

    }
    else{

      incorrect++;

    }

  });


  const score =
    correct * 4 -
    incorrect;


  document.getElementById("testScreen")
    .style.display = "none";

  document.querySelector("aside")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "block";


  document.getElementById("score")
    .textContent =
      `${score} / ${questions.length * 4}`;


  document.getElementById("summary")
    .textContent =
      `Correct: ${correct} | ` +
      `Incorrect: ${incorrect} | ` +
      `Skipped: ${skipped}`;


  generateReview();

}


/* =========================================
   REVIEW
   ========================================= */

function generateReview(){

  const reviewBox =
    document.getElementById("review");

  reviewBox.innerHTML =
    "<h3>Question Review</h3>";


  questions.forEach((q,index)=>{

    const item =
      document.createElement("div");

    item.className = "review-item";


    if(answers[index] === null){

      item.classList.add("skipped");

    }
    else if(answers[index] === q.answer){

      item.classList.add("correct");

    }
    else{

      item.classList.add("incorrect");

    }


    const selected =
      answers[index] === null
      ? "Not answered"
      : q.options[answers[index]];


    item.innerHTML = `
      <strong>Question ${index + 1}</strong>

      <p>${q.question}</p>

      <p>
        <strong>Your answer:</strong>
        ${selected}
      </p>

      <p>
        <strong>Correct answer:</strong>
        ${q.options[q.answer]}
      </p>
    `;


    reviewBox.appendChild(item);

  });

}


/* =========================================
   START
   ========================================= */

updateTimer();

renderQuestion();

</script>

</body>
</html>
