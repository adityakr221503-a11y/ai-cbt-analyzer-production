<script>

"use strict";


/* =====================================================
   QUESTIONS FROM PDF → CBT
===================================================== */

let questions = [];


function loadQuestions(){

    const saved =
        localStorage.getItem(
            "pdfCbtQuestions"
        );

    if(!saved){
        return false;
    }

    try{

        const data =
            JSON.parse(saved);

        if(!Array.isArray(data)){
            return false;
        }


        questions =
            data
            .filter(function(q){

                if(!q){
                    return false;
                }

                if(!q.question){
                    return false;
                }

                if(
                    !Array.isArray(q.options) ||
                    q.options.length < 2
                ){
                    return false;
                }

                const answer =
                    Number(q.answer);

                if(
                    !Number.isInteger(answer)
                ){
                    return false;
                }

                if(
                    answer < 0 ||
                    answer >= q.options.length
                ){
                    return false;
                }

                return true;

            })
            .map(function(q,index){

                return {

                    id:
                        q.id ||
                        "pdf-" +
                        Date.now() +
                        "-" +
                        index,

                    subject:
                        q.subject ||
                        "Imported",

                    topic:
                        q.topic ||
                        q.section ||
                        "PDF Import",

                    question:
                        String(q.question),

                    options:
                        q.options.map(
                            String
                        ),

                    answer:
                        Number(q.answer),

                    solution:
                        q.solution ||
                        q.explanation ||
                        "Review this question.",

                    explanation:
                        q.explanation ||
                        "",

                    pdfPage:
                        q.pdfPage ||
                        "",

                    source:
                        q.source ||
                        "PDF Import"

                };

            });


        return questions.length > 0;

    }
    catch(error){

        console.error(
            "Question loading error:",
            error
        );

        return false;
    }
}


/* =====================================================
   TEST STATE
===================================================== */

let current = 0;

let answers = [];

let marked = [];

let submitted = false;

let timeLeft = 1800;

let timerInterval = null;

let testStartedAt = null;


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

    current = 0;

    answers =
        new Array(
            questions.length
        ).fill(null);

    marked =
        new Array(
            questions.length
        ).fill(false);

    submitted = false;

    timeLeft = 1800;

    testStartedAt =
        Date.now();
}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        );

    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        );
}


function startTimer(){

    clearInterval(
        timerInterval
    );

    updateTimer();


    timerInterval =
        setInterval(function(){

            if(submitted){

                clearInterval(
                    timerInterval
                );

                return;
            }


            timeLeft--;


            if(timeLeft <= 0){

                timeLeft = 0;

                updateTimer();

                clearInterval(
                    timerInterval
                );

                submitTest(true);

                return;
            }


            updateTimer();

        },1000);
}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    const q =
        questions[current];


    if(!q){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No question available";

        document.getElementById(
            "question"
        ).textContent =
            "No imported questions found.";

        document.getElementById(
            "options"
        ).innerHTML =
            "<div class='info'>" +
            "No valid PDF CBT question is available." +
            "</div>";

        return;
    }


    document.getElementById(
        "questionNumber"
    ).textContent =
        "Question " +
        (current + 1) +
        " of " +
        questions.length;


    document.getElementById(
        "question"
    ).textContent =
        q.question;


    const box =
        document.getElementById(
            "options"
        );

    box.innerHTML = "";


    q.options.forEach(
        function(option,index){

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            if(
                answers[current] === index
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.textContent =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                option;


            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }

                    answers[current] =
                        index;

                    renderQuestion();

                };


            box.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "nextButton"
    ).textContent =
        current === questions.length - 1
        ? "Finish"
        : "Next";


    renderPalette();
}


/* =====================================================
   QUESTION PALETTE
===================================================== */

function renderPalette(){

    const palette =
        document.getElementById(
            "palette"
        );


    palette.innerHTML = "";


    questions.forEach(
        function(q,index){

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                index + 1;


            if(
                answers[index] !== null
            ){

                button.classList.add(
                    "answered"
                );

            }


            if(marked[index]){

                button.classList.add(
                    "review"
                );

            }


            if(index === current){

                button.classList.add(
                    "current"
                );

            }


            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }

                    current =
                        index;

                    renderQuestion();

                };


            palette.appendChild(
                button
            );

        }
    );
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(submitted){
        return;
    }


    if(
        current <
        questions.length - 1
    ){

        current++;

        renderQuestion();

    }
    else{

        submitTest(false);

    }
}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

    if(submitted){
        return;
    }


    if(current > 0){

        current--;

        renderQuestion();

    }
}


/* =====================================================
   CLEAR ANSWER
===================================================== */

function clearAnswer(){

    if(submitted){
        return;
    }


    answers[current] =
        null;


    renderQuestion();
}


/* =====================================================
   MARK FOR REVIEW
===================================================== */

function markReview(){

    if(submitted){
        return;
    }


    marked[current] =
        !marked[current];


    renderPalette();
}


/* =====================================================
   MISTAKE CLASSIFICATION
===================================================== */

function classifyMistake(q){

    const text =
        String(
            q.question || ""
        ).toLowerCase();


    const topic =
        String(
            q.topic || ""
        ).toLowerCase();


    if(
        text.includes("calculate") ||
        text.includes("calculation") ||
        text.includes("numerical") ||
        text.includes("value of") ||
        text.includes("find the") ||
        text.includes("how much")
    ){

        return {

            type:
                "🔢 Calculation Error",

            reason:
                "Recheck the formula, units and calculation steps."

        };

    }


    if(
        text.includes("what is") ||
        text.includes("which") ||
        text.includes("symbol") ||
        text.includes("unit") ||
        text.includes("known as") ||
        text.includes("define")
    ){

        return {

            type:
                "📚 Memory / Recall Gap",

            reason:
                "Revise the important fact or definition and test recall again."

        };

    }


    if(
        text.includes("why") ||
        text.includes("principle") ||
        text.includes("mechanism") ||
        text.includes("process") ||
        text.includes("function") ||
        topic.includes("concept")
    ){

        return {

            type:
                "🧠 Concept Gap",

            reason:
                "Review the underlying concept rather than memorising only the answer."

        };

    }


    return {

        type:
            "⚠️ Concept Gap",

        reason:
            "Review the explanation and retry this question."

    };
}


/* =====================================================
   BUILD RETRY QUEUE
===================================================== */

function buildRetryQueue(){

    const wrong = [];


    questions.forEach(
        function(q,index){

            const selected =
                answers[index];


            if(
                selected !== null &&
                selected !== q.answer
            ){

                const mistake =
                    classifyMistake(q);


                wrong.push({

                    id:
                        q.id,

                    question:
                        q.question,

                    options:
                        q.options,

                    subject:
                        q.subject,

                    topic:
                        q.topic,

                    correctIndex:
                        q.answer,

                    correctAnswer:
                        q.options[
                            q.answer
                        ],

                    selectedIndex:
                        selected,

                    selectedAnswer:
                        q.options[
                            selected
                        ],

                    solution:
                        q.solution,

                    explanation:
                        q.explanation,

                    mistakeType:
                        mistake.type,

                    mistakeReason:
                        mistake.reason,

                    source:
                        "CBT",

                    createdAt:
                        new Date()
                        .toISOString(),

                    mastered:
                        false,

                    retryCount:
                        0

                });

            }

        }
    );


    return wrong;
}


/* =====================================================
   SAVE MISTAKE BANK
===================================================== */

function saveMistakes(wrongQueue){

    let existing = [];


    try{

        existing =
            JSON.parse(
                localStorage.getItem(
                    "cbtMistakeBank"
                )
            ) || [];


        if(!Array.isArray(existing)){

            existing = [];

        }

    }
    catch(error){

        existing = [];

    }


    wrongQueue.forEach(
        function(mistake){

            const found =
                existing.findIndex(
                    function(old){

                        return (
                            old.id ===
                            mistake.id
                        )
                        ||
                        (
                            old.question ===
                            mistake.question
                            &&
                            old.correctIndex ===
                            mistake.correctIndex
                        );

                    }
                );


            if(found >= 0){

                existing[found] = {

                    ...existing[found],

                    ...mistake,

                    mastered:
                        existing[found]
                        .mastered === true,

                    retryCount:
                        Number(
                            existing[found]
                            .retryCount || 0
                        )

                };

            }
            else{

                existing.push(
                    mistake
                );

            }

        }
    );


    localStorage.setItem(
        "cbtMistakeBank",
        JSON.stringify(existing)
    );
}

/* =====================================================
   SAVE RETRY QUEUE
===================================================== */

function saveRetryQueue(wrongQueue){

    if(
        !Array.isArray(wrongQueue) ||
        wrongQueue.length === 0
    ){

        localStorage.removeItem(
            "cbtAnalyzer.retryQueue"
        );

        localStorage.removeItem(
            "cbtRetryQuestion"
        );

        localStorage.removeItem(
            "cbtRetryStartedAt"
        );

        return;
    }


    /* Save complete retry queue */

    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(wrongQueue)
    );


    /* Save first mistake */

    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(wrongQueue[0])
    );


    /* Save retry start time */

    localStorage.setItem(
        "cbtRetryStartedAt",
        String(Date.now())
    );
}


/* =====================================================
   OPEN RETRY
===================================================== */

function openRetry(){

    const wrongQueue =
        buildRetryQueue();


    if(wrongQueue.length === 0){

        alert(
            "There are no mistakes to retry."
        );

        return;
    }


    saveMistakes(
        wrongQueue
    );


    saveRetryQueue(
        wrongQueue
    );


    window.location.href =
        "retry.html";
}


/* =====================================================
   RETRY BUTTON
===================================================== */

function updateRetryButton(
    incorrect
){

    const button =
        document.getElementById(
            "retryButton"
        );


    if(!button){
        return;
    }


    if(incorrect > 0){

        button.style.display =
            "block";


        button.textContent =
            "🔄 Retry " +
            incorrect +
            " Mistake" +
            (
                incorrect === 1
                ? ""
                : "s"
            );

    }
    else{

        button.style.display =
            "none";

    }
}


/* =====================================================
   SAVE TEST HISTORY
===================================================== */

function saveTestHistory(
    correct,
    incorrect,
    skipped,
    percentage
){

    let history = [];


    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "cbtTestHistory"
                )
            ) || [];


        if(!Array.isArray(history)){

            history = [];

        }

    }
    catch(error){

        history = [];

    }


    const record = {

        id:
            "test-" +
            Date.now(),

        date:
            new Date()
            .toISOString(),

        total:
            questions.length,

        correct:
            correct,

        incorrect:
            incorrect,

        skipped:
            skipped,

        percentage:
            percentage,

        source:
            "PDF CBT",

        subject:
            questions[0]?.subject ||
            "Imported",

        duration:
            testStartedAt
            ? Math.max(
                0,
                Math.round(
                    (
                        Date.now() -
                        testStartedAt
                    ) / 1000
                )
            )
            : 1800 - timeLeft

    };


    history.push(
        record
    );


    localStorage.setItem(
        "cbtTestHistory",
        JSON.stringify(history)
    );


    localStorage.setItem(
        "cbtLastResult",
        JSON.stringify(record)
    );
}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(
    autoSubmit
){

    if(submitted){
        return;
    }


    if(questions.length === 0){

        alert(
            "No questions are available."
        );

        return;
    }


    if(!autoSubmit){

        const unanswered =
            answers.filter(
                function(answer){
                    return answer === null;
                }
            ).length;


        if(unanswered > 0){

            const proceed =
                confirm(
                    "You have " +
                    unanswered +
                    " unanswered question" +
                    (
                        unanswered === 1
                        ? ""
                        : "s"
                    ) +
                    ".\n\nSubmit the test anyway?"
                );


            if(!proceed){
                return;
            }

        }

    }


    submitted = true;


    clearInterval(
        timerInterval
    );


    let correct = 0;

    let incorrect = 0;

    let skipped = 0;


    questions.forEach(
        function(q,index){

            const selected =
                answers[index];


            if(selected === null){

                skipped++;

            }
            else if(
                selected === q.answer
            ){

                correct++;

            }
            else{

                incorrect++;

            }

        }
    );


    const percentage =
        Math.round(
            (
                correct /
                questions.length
            ) *
            100
        );


    const wrongQueue =
        buildRetryQueue();


    saveMistakes(
        wrongQueue
    );


    saveRetryQueue(
        wrongQueue
    );


    saveTestHistory(
        correct,
        incorrect,
        skipped,
        percentage
    );


    showResult(
        correct,
        incorrect,
        skipped,
        percentage,
        wrongQueue
    );
}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(
    correct,
    incorrect,
    skipped,
    percentage,
    wrongQueue
){

    document.getElementById(
        "testScreen"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "score"
    ).textContent =
        percentage +
        "%";


    document.getElementById(
        "summary"
    ).textContent =
        "Correct: " +
        correct +
        " • Incorrect: " +
        incorrect +
        " • Skipped: " +
        skipped +
        " • Total: " +
        questions.length;


    updateRetryButton(
        incorrect
    );


    renderReview();
}


/* =====================================================
   REVIEW ANSWERS
===================================================== */

function renderReview(){

    const box =
        document.getElementById(
            "review"
        );


    box.innerHTML =
        "<h3>Question Review</h3>";


    questions.forEach(
        function(q,index){

            const selected =
                answers[index];


            const item =
                document.createElement(
                    "div"
                );


            let statusClass;

            let statusText;


            if(selected === null){

                statusClass =
                    "skipped";

                statusText =
                    "⏭ Skipped";

            }
            else if(
                selected === q.answer
            ){

                statusClass =
                    "correct";

                statusText =
                    "✓ Correct";

            }
            else{

                statusClass =
                    "incorrect";

                statusText =
                    "✗ Incorrect";

            }


            item.className =
                "review-item " +
                statusClass;


            item.innerHTML = "";


            const title =
                document.createElement(
                    "strong"
                );


            title.textContent =
                "Q" +
                (index + 1) +
                ". " +
                q.question;


            item.appendChild(
                title
            );


            const status =
                document.createElement(
                    "div"
                );


            status.style.marginTop =
                "8px";


            status.textContent =
                statusText;


            if(statusClass === "correct"){

                status.className =
                    "status-correct";

            }
            else if(
                statusClass === "incorrect"
            ){

                status.className =
                    "status-incorrect";

            }
            else{

                status.className =
                    "status-skipped";

            }


            item.appendChild(
                status
            );


            const answerText =
                document.createElement(
                    "div"
                );


            answerText.style.marginTop =
                "8px";


            if(selected === null){

                answerText.textContent =
                    "Your answer: Not answered";

            }
            else{

                answerText.textContent =
                    "Your answer: " +
                    q.options[selected];

            }


            item.appendChild(
                answerText
            );


            const correctText =
                document.createElement(
                    "div"
                );


            correctText.style.marginTop =
                "6px";


            correctText.textContent =
                "Correct answer: " +
                q.options[q.answer];


            item.appendChild(
                correctText
            );


            if(
                selected !== null &&
                selected !== q.answer
            ){

                const mistake =
                    classifyMistake(q);


                const analysis =
                    document.createElement(
                        "div"
                    );


                analysis.className =
                    "analysis";


                analysis.innerHTML =
                    "<div class='analysis-type'>" +
                    mistake.type +
                    "</div>" +
                    "<div>" +
                    mistake.reason +
                    "</div>";


                if(q.solution){

                    const solution =
                        document.createElement(
                            "div"
                        );


                    solution.style.marginTop =
                        "8px";


                    solution.innerHTML =
                        "<strong>Solution:</strong> " +
                        escapeHtml(
                            q.solution
                        );


                    analysis.appendChild(
                        solution
                    );

                }


                item.appendChild(
                    analysis
                );

            }
            else if(
                selected === null &&
                q.solution
            ){

                const solution =
                    document.createElement(
                        "div"
                    );


                solution.className =
                    "analysis";


                solution.innerHTML =
                    "<strong>Solution:</strong> " +
                    escapeHtml(
                        q.solution
                    );


                item.appendChild(
                    solution
                );

            }


            box.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   SAFE TEXT
===================================================== */

function escapeHtml(
    value
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value || "");


    return div.innerHTML;
}


/* =====================================================
   START CBT
===================================================== */

function startCBT(){

    const loaded =
        loadQuestions();


    if(!loaded){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No PDF CBT questions";


        document.getElementById(
            "question"
        ).textContent =
            "Please import a PDF and create the CBT first.";


        document.getElementById(
            "options"
        ).innerHTML =
            "<div class='info'>" +
            "No valid questions were found in " +
            "localStorage key: pdfCbtQuestions" +
            "</div>";


        document.getElementById(
            "palette"
        ).innerHTML =
            "";


        return;
    }


    initialize();

    renderQuestion();

    startTimer();
}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    startCBT
);

</script>
