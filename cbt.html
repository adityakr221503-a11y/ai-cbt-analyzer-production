<style>

*{

}

body{
margin:0;
font-family:Arial,sans-serif;

color:#0f172a;

.warning{

.danger{

.palette{

.palette button{

padding:10px 5px;

}

.palette .current{

#result{

}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:10px 0;
}

.result-actions button{
width:100%;
margin-top:8px;
padding:14px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.skipped{

}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.analysis-type{
font-weight:800;
color:#3730a3;
}

.info{
padding:12px;
background:#f8fafc;
border-radius:10px;
margin-top:8px;
line-height:1.5;
}

.status-correct{
color:#15803d;
font-weight:800;
}

.status-incorrect{
color:#dc2626;
font-weight:800;
}

.status-skipped{
color:#d97706;
font-weight:800;
}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.question{
font-size:19px;
}

}

</style>

</head>
<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<div id="timer"
class="timer">
30:00
</div>

</div>

</header>


<div class="container">

<main class="card">

<section id="testScreen">

<div id="questionNumber"
class="question-number">
Loading PDF questions...
</div>

<div id="question"
class="question">
Loading...
</div>

<div id="options"></div>

<div class="buttons">

<button
class="secondary"
type="button"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
type="button"
onclick="markReview()">
Mark Review
</button>

<button
class="secondary"
type="button"
onclick="clearAnswer()">
Clear
</button>

<button
id="nextButton"
class="primary"
type="button"
onclick="nextQuestion()">
Next
</button>

</div>

</section>


<section id="result">

<h2>🎯 Test Completed</h2>

<div
id="score"
class="score">
</div>

<p id="summary"></p>

<div class="result-actions">

<button
id="retryButton"
class="primary"
type="button"
style="display:none"
onclick="openRetry()">
🔄 Retry Mistakes
</button>

<button
class="secondary"
type="button"
onclick="location.href='mistake.html'">
🧠 Mistake Bank
</button>

<button
class="secondary"
type="button"
onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

<div id="review"></div>

</section>

</main>


<aside class="card">

<h3>Question Palette</h3>

<div
id="palette"
class="palette">
</div>

<button
class="danger"
type="button"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>


<script>

"use strict";
    /* =====================================================
MISTAKE INTELLIGENCE
===================================================== */

function classifyMistake(q, selectedIndex){

    const question =
        String(q.question || "").toLowerCase();

    const topic =
        String(q.topic || "").toLowerCase();

    const selected =
        selectedIndex === null ||
        selectedIndex === undefined
            ? ""
            : String(
                q.options[selectedIndex] || ""
              ).toLowerCase();

    const correct =
        String(
            q.options[q.answer] || ""
        ).toLowerCase();


    /* CALCULATION ERROR */

    const calculationWords = [
        "calculate",
        "calculation",
        "numerical",
        "value of",
        "find the",
        "velocity",
        "acceleration",
        "force",
        "work",
        "energy",
        "power",
        "current",
        "voltage",
        "resistance",
        "mass",
        "momentum"
    ];

    if(
        calculationWords.some(function(word){
            return question.includes(word);
        })
    ){

        return {
            type:"🔢 Calculation Error",
            reason:
                "Recheck the formula, units and calculation steps."
        };

    }


    /* MEMORY / RECALL */

    const memoryWords = [
        "what is",
        "which is",
        "who",
        "symbol",
        "unit",
        "known as",
        "called",
        "most abundant",
        "organ",
        "organelle"
    ];

    if(
        memoryWords.some(function(word){
            return question.includes(word);
        })
    ){

        return {
            type:"📚 Memory / Recall Gap",
            reason:
                "This is mainly a factual question. Revise the key fact and test recall again."
        };

    }


    /* CONCEPT GAP */

    const conceptWords = [
        "why",
        "principle",
        "mechanism",
        "process",
        "function",
        "relationship",
        "reason",
        "concept"
    ];

    if(
        conceptWords.some(function(word){
            return question.includes(word);
        }) ||
        topic.includes("concept")
    ){

        return {
            type:"🧠 Concept Gap",
            reason:
                "Review the underlying concept instead of memorising only the answer."
        };

    }


    /* CONFUSED CONCEPTS */

    if(
        selected &&
        correct &&
        selected !== correct
    ){

        const selectedWords =
            selected.split(/\s+/);

        const correctWords =
            correct.split(/\s+/);

        const overlap =
            selectedWords.filter(function(word){

                return (
                    word.length > 3 &&
                    correctWords.includes(word)
                );

            }).length;

        if(overlap > 0){

            return {
                type:"🧩 Confused Concepts",
                reason:
                    "Your selected answer is related to the correct answer. Review the distinction between the two concepts."
            };

        }

    }


    /* DEFAULT */

    return {
        type:"⚠️ Concept Gap",
        reason:
            "The answer was incorrect. Review the explanation and retry the question."
    };

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =====================================================
REACTIVATE MISTAKES
===================================================== */

function reactivateMistakes(){

    let mastery = [];

    try{

        mastery =
            JSON.parse(
                localStorage.getItem(
                    "cbtMasteryV2"
                ) || "[]"
            );

        if(!Array.isArray(mastery)){
            mastery = [];
        }

    }catch(error){

        mastery = [];

    }


    const wrongQuestions = new Set();


    questions.forEach(function(q,index){

        if(
            answers[index] !== null &&
            answers[index] !== q.answer
        ){

            wrongQuestions.add(
                normalize(q.question)
            );

        }

    });


    mastery =
        mastery.filter(function(item){

            if(
                !item ||
                !item.question
            ){

                return true;

            }

            return !wrongQuestions.has(
                normalize(item.question)
            );

        });


    localStorage.setItem(
        "cbtMasteryV2",
        JSON.stringify(mastery)
    );

}


/* =====================================================
SAVE TEST HISTORY
===================================================== */

function saveHistory(
    correct,
    incorrect,
    skipped,
    score
){

    let history = [];

    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "cbtHistory"
                ) || "[]"
            );

        if(!Array.isArray(history)){
            history = [];
        }

    }catch(error){

        history = [];

    }


    const record = {

        date:
            new Date().toLocaleString(),

        timestamp:
            Date.now(),

        score:
            score,

        correct:
            correct,

        incorrect:
            incorrect,

        wrong:
            incorrect,

        skipped:
            skipped,

        questions:
            questions.map(function(q,index){

                let status;

                if(
                    answers[index] === null
                ){

                    status = "skipped";

                }
                else if(
                    answers[index] === q.answer
                ){

                    status = "correct";

                }
                else{

                    status = "incorrect";

                }


                let intelligence = null;


                if(status === "incorrect"){

                    intelligence =
                        classifyMistake(
                            q,
                            answers[index]
                        );

                }


                return {

                    id:
                        q.id ||
                        (
                            "history-" +
                            Date.now() +
                            "-" +
                            index
                        ),

                    question:
                        q.question,

                    options:
                        q.options,

                    subject:
                        q.subject,

                    topic:
                        q.topic,

                    status:
                        status,

                    selectedIndex:
                        answers[index],

                    selectedAnswer:
                        answers[index] === null
                            ? "Not answered"
                            : q.options[
                                answers[index]
                              ],

                    correctIndex:
                        q.answer,

                    correctAnswer:
                        q.options[q.answer],

                    mistakeType:
                        intelligence
                            ? intelligence.type
                            : null,

                    mistakeReason:
                        intelligence
                            ? intelligence.reason
                            : null,

                    mistakeConfidence:
                        intelligence
                            ? "Auto Classified"
                            : null,

                    solution:
                        q.solution || "",

                    explanation:
                        q.explanation || "",

                    bookmarked:
                        Boolean(
                            marked[index]
                        ),

                    markedForReview:
                        Boolean(
                            marked[index]
                        ),

                    pdfPage:
                        q.pdfPage || "",

                    chapter:
                        q.chapter || "",

                    section:
                        q.section || "",

                    source:
                        q.source || "CBT"

                };

            })

    };


    history.push(record);


    localStorage.setItem(
        "cbtHistory",
        JSON.stringify(history)
    );

}


/* =====================================================
CREATE RETRY QUEUE
===================================================== */

function createRetryQueue(){

    const wrong = [];


    questions.forEach(function(q,index){

        if(
            answers[index] !== null &&
            answers[index] !== q.answer
        ){

            const intelligence =
                classifyMistake(
                    q,
                    answers[index]
                );


            wrong.push({

                id:
                    "retry-" +
                    Date.now() +
                    "-" +
                    index,

                question:
                    q.question,

                options:
                    q.options,

                subject:
                    q.subject || "Imported",

                topic:
                    q.topic || "PDF Import",

                correctIndex:
                    q.answer,

                correctAnswer:
                    q.options[q.answer],

                solution:
                    q.solution || "",

                explanation:
                    q.explanation || "",

                selectedIndex:
                    answers[index],

                selectedAnswer:
                    q.options[answers[index]],

                mistakeType:
                    intelligence.type,

                mistakeReason:
                    intelligence.reason,

                source:
                    q.source || "CBT",

                sourceType:
                    q.sourceType || "CBT",

                pdfPage:
                    q.pdfPage || "",

                chapter:
                    q.chapter || "",

                section:
                    q.section || ""

            });

        }

    });


    return wrong;

}
    /* =====================================================
RETRY BUTTON
===================================================== */

function updateRetryButton(incorrect){

    const button =
        document.getElementById("retryButton");

    if(!button){
        return;
    }

    if(incorrect > 0){

        button.style.display = "block";

        button.textContent =
            "🔄 Retry " +
            incorrect +
            " Mistake" +
            (incorrect === 1 ? "" : "s");

    }else{

        button.style.display = "none";

    }

}


/* =====================================================
OPEN RETRY
===================================================== */

function openRetry(){

    const wrong =
        createRetryQueue();


    if(wrong.length === 0){

        alert(
            "There are no mistakes to retry."
        );

        return;

    }


    /*
     IMPORTANT:
     Save the COMPLETE retry queue.
     This prevents the old question from
     replacing the newly generated retry.
    */

    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(wrong)
    );


    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(wrong[0])
    );


    localStorage.setItem(
        "cbtRetryStartedAt",
        String(Date.now())
    );


    /*
     Tell retry.html that this is a
     fresh retry session.
    */

    localStorage.setItem(
        "cbtRetryMode",
        "fresh"
    );


    /*
     Open retry page.
    */

    window.location.href =
        "retry.html";

}


/* =====================================================
SUBMIT TEST
===================================================== */

function submitTest(){

    if(submitted){
        return;
    }


    if(!questions.length){

        alert(
            "No questions are available."
        );

        return;

    }


    let correct = 0;
    let incorrect = 0;
    let skipped = 0;


    questions.forEach(function(q,index){

        if(
            answers[index] === null
        ){

            skipped++;

        }
        else if(
            answers[index] === q.answer
        ){

            correct++;

        }
        else{

            incorrect++;

        }

    });


    /*
     NEET-style scoring:
     +4 correct
     -1 incorrect
     */

    const score =
        (correct * 4) -
        incorrect;


    /*
     Remove old mastery entries for
     questions answered incorrectly.
     */

    reactivateMistakes();


    /*
     Save complete test history.
     */

    saveHistory(
        correct,
        incorrect,
        skipped,
        score
    );


    /*
     Create retry queue NOW.
     This is important because after
     submit the test state is preserved.
     */

    const retryQueue =
        createRetryQueue();


    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(retryQueue)
    );


    if(retryQueue.length > 0){

        localStorage.setItem(
            "cbtRetryQuestion",
            JSON.stringify(
                retryQueue[0]
            )
        );

    }else{

        localStorage.removeItem(
            "cbtRetryQuestion"
        );

    }


    localStorage.setItem(
        "cbtRetryMode",
        "fresh"
    );


    submitted = true;


    clearInterval(
        timerInterval
    );


    /*
     Hide test screen.
     */

    document.getElementById(
        "testScreen"
    ).style.display = "none";


    const aside =
        document.querySelector("aside");

    if(aside){
        aside.style.display = "none";
    }


    /*
     Show result.
     */

    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "score"
    ).textContent =
        score +
        " / " +
        (questions.length * 4);


    document.getElementById(
        "summary"
    ).textContent =
        "Correct: " +
        correct +
        " | Incorrect: " +
        incorrect +
        " | Skipped: " +
        skipped;


    updateRetryButton(
        incorrect
    );


    /*
     Generate detailed review.
     */

    generateReview();

}


/* =====================================================
GENERATE REVIEW
===================================================== */

function generateReview(){

    const review =
        document.getElementById(
            "review"
        );


    if(!review){
        return;
    }


    review.innerHTML = "";


    const heading =
        document.createElement("h3");

    heading.textContent =
        "📋 Question Review";

    review.appendChild(
        heading
    );


    questions.forEach(function(q,index){

        const selected =
            answers[index];


        const item =
            document.createElement("div");

        item.className =
            "review-item";


        /*
         CORRECT
         */

        if(
            selected !== null &&
            selected === q.answer
        ){

            item.classList.add(
                "correct"
            );


            item.innerHTML =

                "<div class='status-correct'>" +
                "✅ Correct" +
                "</div>" +

                "<b>Q" +
                (index + 1) +
                ".</b> " +
                escapeHTML(
                    q.question
                ) +

                "<div class='info'>" +

                "<b>Your Answer:</b> " +
                escapeHTML(
                    q.options[selected]
                ) +

                "<br><br>" +

                "<b>Correct Answer:</b> " +
                escapeHTML(
                    q.options[q.answer]
                ) +

                "</div>" +

                "<div class='analysis'>" +

                "<b>Solution:</b><br>" +

                escapeHTML(
                    q.solution ||
                    q.explanation ||
                    "No solution available."
                ) +

                "</div>";

        }


        /*
         INCORRECT
         */

        else if(
            selected !== null &&
            selected !== q.answer
        ){

            item.classList.add(
                "incorrect"
            );


            const intelligence =
                classifyMistake(
                    q,
                    selected
                );


            item.innerHTML =

                "<div class='status-incorrect'>" +
                "❌ Incorrect" +
                "</div>" +

                "<b>Q" +
                (index + 1) +
                ".</b> " +
                escapeHTML(
                    q.question
                ) +

                "<div class='info'>" +

                "<b>Your Answer:</b> " +
                escapeHTML(
                    q.options[selected]
                ) +

                "<br><br>" +

                "<b>Correct Answer:</b> " +
                escapeHTML(
                    q.options[q.answer]
                ) +

                "</div>" +

                "<div class='analysis'>" +

                "<div class='analysis-type'>" +
                escapeHTML(
                    intelligence.type
                ) +
                "</div>" +

                "<b>Why this may have happened:</b><br>" +

                escapeHTML(
                    intelligence.reason
                ) +

                "<br><br>" +

                "<b>Solution:</b><br>" +

                escapeHTML(
                    q.solution ||
                    q.explanation ||
                    "Review this question carefully."
                ) +

                "</div>";

        }


        /*
         SKIPPED
         */

        else{

            item.classList.add(
                "skipped"
            );


            item.innerHTML =

                "<div class='status-skipped'>" +
                "⏭️ Skipped" +
                "</div>" +

                "<b>Q" +
                (index + 1) +
                ".</b> " +
                escapeHTML(
                    q.question
                ) +

                "<div class='info'>" +

                "<b>Correct Answer:</b> " +

                escapeHTML(
                    q.options[q.answer]
                ) +

                "</div>" +

                "<div class='analysis'>" +

                "<b>Solution:</b><br>" +

                escapeHTML(
                    q.solution ||
                    q.explanation ||
                    "Review this question."
                ) +

                "</div>";

        }


        review.appendChild(
            item
        );

    });

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
STARTUP
===================================================== */

function startCBT(){

    /*
     FIRST priority:
     Load the newly imported PDF questions.
     */

    const loaded =
        loadPDFQuestions();


    /*
     If no PDF questions exist,
     keep the built-in questions.
     */

    if(!loaded){

        console.log(
            "No imported PDF questions found. Using default questions."
        );

    }


    /*
     Make sure questions are valid.
     */

    questions =
        questions.filter(function(q){

            return q &&
                typeof q.question === "string" &&
                q.question.trim() !== "" &&
                Array.isArray(q.options) &&
                q.options.length >= 2 &&
                Number.isInteger(q.answer) &&
                q.answer >= 0 &&
                q.answer < q.options.length;

        });


    if(!questions.length){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No questions available";

        document.getElementById(
            "question"
        ).textContent =
            "Please import a valid PDF question paper.";

        return;

    }


    initializeState();

    renderQuestion();

    startTimer();

}


/* =====================================================
AUTO START
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        startCBT();

    }
);

</script>
