<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.timer{
background:#eef2ff;
color:#3730a3;
padding:9px 14px;
border-radius:9px;
font-weight:800;
min-width:78px;
text-align:center;
}

.timer.warning{
background:#fef3c7;
color:#92400e;
}

.timer.danger{
background:#fee2e2;
color:#991b1b;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
color:#64748b;
font-weight:700;
margin-bottom:12px;
}

.question{
font-size:21px;
font-weight:800;
line-height:1.55;
margin-bottom:20px;
white-space:pre-wrap;
}

.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:11px;
text-align:left;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.15s;
}

.option:hover{
border-color:#818cf8;
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
font-family:inherit;
border:0;
border-radius:10px;
padding:13px;
font-weight:700;
cursor:pointer;
}

button:disabled{
opacity:.55;
cursor:not-allowed;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.palette button{
background:#e2e8f0;
padding:10px 5px;
}

.palette button.answered{
background:#bbf7d0;
}

.palette button.review{
background:#fde68a;
}

.palette button.answered.review{
background:#86efac;
}

.palette button.current{
outline:3px solid #4f46e5;
}

.palette button.skipped{
background:#e2e8f0;
}

#result{
display:none;
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:15px 0;
}

.summary-box{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:20px 0;
}

.stat{
padding:15px;
background:#f8fafc;
border-radius:10px;
text-align:center;
}

.stat strong{
display:block;
font-size:22px;
}

.stat small{
color:#64748b;
}

.result-actions button{
width:100%;
margin-top:8px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.skipped{
border-left:5px solid #f59e0b;
}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.meta{
margin-top:8px;
color:#64748b;
font-size:13px;
}

.source-badge{
display:inline-block;
margin-bottom:15px;
padding:6px 10px;
border-radius:999px;
background:#dcfce7;
color:#166534;
font-size:12px;
font-weight:800;
}

.loading{
text-align:center;
padding:30px 10px;
color:#64748b;
}

.error-box{
background:#fee2e2;
color:#991b1b;
padding:15px;
border-radius:10px;
line-height:1.5;
}

.empty-box{
background:#f8fafc;
padding:20px;
border-radius:12px;
text-align:center;
color:#64748b;
}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.question{
font-size:19px;
}

.summary-box{
grid-template-columns:1fr;
}

aside.card{
order:2;
}

}

@media(max-width:500px){

header{
padding:13px 15px;
}

.logo{
font-size:17px;
}

.card{
padding:17px;
}

.buttons{
grid-template-columns:1fr 1fr;
}

.palette{
grid-template-columns:repeat(5,1fr);
}

}

</style>
</head>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>

30:00

<div class="container">

Submit Test
</button>

</div>

<script>
 "use strict";

/* =====================================================
   CBT ANALYZER PRO
   PRODUCTION CBT ENGINE
===================================================== */


/* =====================================================
   STATE
===================================================== */

let questions = [];
let current = 0;

let answers = [];
let marked = [];

let submitted = false;
let initialized = false;

let timeLeft = 1800;
let timerInterval = null;

let testSource = "Fallback";
let testStartedAt = Date.now();


/* =====================================================
   STORAGE KEYS
===================================================== */

const STORAGE = {

  PDF: "pdfCbtQuestions",

  HISTORY: "cbtHistory",

  RETRY_QUEUE: "cbtAnalyzer.retryQueue",

  RETRY_QUESTION: "cbtRetryQuestion",

  RETRY_STARTED: "cbtRetryStartedAt"

};


/* =====================================================
   FALLBACK QUESTIONS
   ONLY USED WHEN NO VALID PDF TEST EXISTS
===================================================== */

const fallbackQuestions = [

{
id:"fallback-1",
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1,
solution:"Mars is called the Red Planet."
},

{
id:"fallback-2",
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is newton."
},

{
id:"fallback-3",
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of ATP production."
},

{
id:"fallback-4",
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol of sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The symbol Na comes from natrium."
},

{
id:"fallback-5",
subject:"Biology",
topic:"Environment",
question:"Which gas is most abundant in Earth's atmosphere?",
options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],
answer:2,
solution:"Nitrogen makes up about 78% of Earth's atmosphere."
},

{
id:"fallback-6",
subject:"Physics",
topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],
answer:1,
solution:"The approximate value is 9.8 m/s²."
},

{
id:"fallback-7",
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:["Protein","Lipid","DNA","Glucose"],
answer:2,
solution:"DNA stores hereditary information."
},

{
id:"fallback-8",
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:["Proton","Neutron","Electron","Photon"],
answer:2,
solution:"The electron has a negative charge."
},

{
id:"fallback-9",
subject:"Chemistry",
topic:"Atomic Structure",
question:"Which particle has no electric charge?",
options:["Proton","Electron","Neutron","Positron"],
answer:2,
solution:"The neutron is electrically neutral."
},

{
id:"fallback-10",
subject:"Biology",
topic:"Human Physiology",
question:"Which organ pumps blood throughout the human body?",
options:["Liver","Kidney","Heart","Lung"],
answer:2,
solution:"The heart pumps blood through the circulatory system."
}

];


/* =====================================================
   SAFE JSON READER
===================================================== */

function readJSON(key,fallback){

try{

const value =
localStorage.getItem(key);

if(!value){
return fallback;
}

return JSON.parse(value);

}catch(error){

console.error(
"Storage read error:",
key,
error
);

return fallback;

}

}


/* =====================================================
   ANSWER NORMALIZER
===================================================== */

function normalizeAnswer(answer,options){

if(
answer === null ||
answer === undefined
){
return null;
}


/* Numeric answer */

if(
typeof answer === "number" &&
Number.isInteger(answer)
){

if(
answer >= 0 &&
answer < options.length
){
return answer;
}

}


/* String answer */

const value =
String(answer).trim();


/* Numeric string */

if(/^\d+$/.test(value)){

const number =
Number(value);


/* Zero-based */

if(
number >= 0 &&
number < options.length
){
return number;
}


/* One-based */

if(
number >= 1 &&
number <= options.length
){
return number-1;
}

}


/* A/B/C/D */

if(
/^[A-Za-z]$/.test(value)
){

const index =
value
.toUpperCase()
.charCodeAt(0)-65;

if(
index >= 0 &&
index < options.length
){
return index;
}

}


/* Exact option text */

const lower =
value.toLowerCase();

const found =
options.findIndex(
function(option){

return String(option)
.trim()
.toLowerCase()
=== lower;

}
);

if(found >= 0){
return found;
}

return null;

}


/* =====================================================
   NORMALIZE PDF QUESTION
===================================================== */

function normalizeQuestion(q,index){

if(
!q ||
typeof q !== "object"
){
return null;
}


/* Question text */

const questionText =
String(
q.question ??
q.questionText ??
q.text ??
""
).trim();

if(!questionText){
return null;
}


/* Options */

let options =
Array.isArray(q.options)
? q.options
: Array.isArray(q.choices)
? q.choices
: [];


options =
options
.map(function(option){

return String(
option ?? ""
).trim();

})
.filter(function(option){

return option !== "";

});


if(options.length < 2){
return null;
}


/* Correct answer */

const answer =
normalizeAnswer(
q.answer ??
q.correctAnswer ??
q.correctIndex ??
q.correct,
options
);


if(answer === null){

console.warn(
"Skipping question without valid answer:",
questionText
);

return null;

}


/* Return normalized object */

return {

id:
q.id ||
"pdf-"+Date.now()+"-"+index,

subject:
q.subject ||
"PDF Import",

topic:
q.topic ||
q.section ||
q.chapter ||
"PDF Import",

question:
questionText,

options:
options,

answer:
answer,

solution:
String(
q.solution ??
q.explanation ??
""
),

explanation:
String(
q.explanation ??
q.solution ??
""
),

pdfPage:
q.pdfPage ??
q.page ??
"",

pdfPageEnd:
q.pdfPageEnd ??
q.pageEnd ??
q.pdfPage ??
q.page ??
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"PDF",

source:
q.source ||
"PDF Import",

sourceType:
"PDF",

bookmarked:
Boolean(q.bookmarked)

};

}


/* =====================================================
   LOAD PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

const saved =
localStorage.getItem(
STORAGE.PDF
);


if(!saved){

console.log(
"No pdfCbtQuestions found."
);

return false;

}


try{

const imported =
JSON.parse(saved);


if(
!Array.isArray(imported) ||
imported.length === 0
){

console.warn(
"pdfCbtQuestions is empty."
);

return false;

}


const normalized =
imported
.map(normalizeQuestion)
.filter(Boolean);


if(normalized.length === 0){

console.warn(
"PDF data exists but contains no valid questions."
);

return false;

}


/* IMPORTANT:
   The CURRENT PDF test becomes
   the active CBT test.
*/

questions =
normalized;

testSource =
"PDF Import";


console.log(
"CURRENT PDF CBT LOADED:",
questions.length,
"questions"
);


return true;


}catch(error){

console.error(
"Could not load PDF CBT:",
error
);

return false;

}


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

if(initialized){
return;
}

initialized = true;

testStartedAt =
Date.now();


const pdfLoaded = loadPDFQuestions();

if(!pdfLoaded){

questions = fallbackQuestions.map(function(q){
return {...q};
});

testSource = "Demo Test";

console.log(
"PDF questions not loaded. Using fallback questions:",
questions.length
);

}else{

console.log(
"PDF questions successfully loaded:",
questions.length
);

}


console.log(
"No valid PDF CBT found. Using demo test."
);

}


if(!questions.length){

showFatalError(
"No questions are available for this test."
);

return;

}


/* Reset only the CURRENT test state.
   Existing history/mistakes remain safe.
*/

answers =
new Array(
questions.length
).fill(null);


marked =
questions.map(
function(q){

return Boolean(
q.bookmarked
);

}
);


current = 0;

submitted = false;


/* Source badge */

const badge =
document.getElementById(
"sourceBadge"
);

if(badge){

badge.textContent =
testSource === "PDF Import"
? "📄 PDF CBT"
: "📝 Demo CBT";

}


/* Render */

renderQuestion();

renderPalette();

startTimer();

}
 /* =====================================================
   TIMER
===================================================== */

function updateTimer(){

const timer =
document.getElementById("timer");

if(!timer){
return;
}

const minutes =
Math.floor(timeLeft / 60);

const seconds =
timeLeft % 60;

timer.textContent =
String(minutes).padStart(2,"0") +
":" +
String(seconds).padStart(2,"0");


/* Timer warning */

timer.classList.remove(
"warning",
"danger"
);

if(timeLeft <= 300){

timer.classList.add("warning");

}

if(timeLeft <= 60){

timer.classList.remove("warning");

timer.classList.add("danger");

}

}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

clearInterval(timerInterval);

timeLeft = 1800;

updateTimer();

timerInterval =
setInterval(function(){

if(submitted){

clearInterval(
timerInterval
);

return;

}

timeLeft--;

updateTimer();


if(timeLeft <= 0){

clearInterval(
timerInterval
);

submitTest();

}

},1000);

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

if(submitted){
return;
}

const q =
questions[current];

if(!q){
return;
}


/* Question number */

document.getElementById(
"questionNumber"
).textContent =
"Question " +
(current + 1) +
" of " +
questions.length +
" • " +
(q.subject || "PDF");


/* Question text */

document.getElementById(
"question"
).textContent =
q.question;


/* Options */

const box =
document.getElementById(
"options"
);

box.innerHTML = "";


q.options.forEach(
function(option,index){

const button =
document.createElement(
"button"
);

button.type =
"button";

button.className =
"option";


if(
answers[current] === index
){

button.classList.add(
"selected"
);

}


button.textContent =
String.fromCharCode(
65 + index
) +
". " +
option;


button.onclick =
function(){

if(submitted){
return;
}

answers[current] =
index;

renderQuestion();

};


box.appendChild(
button
);

});


/* Next / Finish */

const nextButton =
document.getElementById(
"nextButton"
);

if(nextButton){

nextButton.textContent =
current === questions.length - 1
? "Finish"
: "Next";

}


/* Previous button */

const previousButton =
document.getElementById(
"previousButton"
);

if(previousButton){

previousButton.disabled =
current === 0;

}


/* Palette */

renderPalette();

}


/* =====================================================
   QUESTION PALETTE
===================================================== */

function renderPalette(){

const palette =
document.getElementById(
"palette"
);

if(!palette){
return;
}

palette.innerHTML = "";


questions.forEach(
function(q,index){

const button =
document.createElement(
"button"
);

button.type =
"button";

button.textContent =
index + 1;


/* Answered */

if(
answers[index] !== null
){

button.classList.add(
"answered"
);

}


/* Review */

if(
marked[index]
){

button.classList.add(
"review"
);

}


/* Current */

if(
index === current
){

button.classList.add(
"current"
);

}


/* Click */

button.onclick =
function(){

if(submitted){
return;
}

current =
index;

renderQuestion();

};


palette.appendChild(
button
);

});

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

if(submitted){
return;
}


if(
current <
questions.length - 1
){

current++;

renderQuestion();

return;

}


/* Last question */

confirmSubmit();

}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

if(submitted){
return;
}


if(current > 0){

current--;

renderQuestion();

}

}


/* =====================================================
   CLEAR ANSWER
===================================================== */

function clearAnswer(){

if(submitted){
return;
}

answers[current] =
null;

renderQuestion();

}


/* =====================================================
   MARK FOR REVIEW
===================================================== */

function markReview(){

if(submitted){
return;
}

marked[current] =
!marked[current];

renderPalette();

}


/* =====================================================
   CONFIRM SUBMIT
===================================================== */

function confirmSubmit(){

if(submitted){
return;
}


const unanswered =
answers.filter(
function(answer){

return answer === null;

}
).length;


if(unanswered > 0){

const message =
"You have " +
unanswered +
" unanswered question" +
(unanswered === 1 ? "" : "s") +
".\n\n" +
"Do you want to submit the test?";


if(!confirm(message)){
return;
}

}


/* Submit */
 submitTest();

}


/* =====================================================
   FATAL ERROR
===================================================== */

function showFatalError(message){

const testScreen =
document.getElementById(
"testScreen"
);

if(testScreen){

testScreen.innerHTML =
'<div class="error-box">' +
"<strong>Unable to load test</strong><br><br>" +
escapeHTML(message) +
"<br><br>" +
'<button class="secondary" ' +
'onclick="location.href=\'index.html\'">' +
"Return to Dashboard" +
"</button>" +
"</div>";

}

const aside =
document.querySelector(
"aside"
);

if(aside){

aside.style.display =
"none";

}

}
 /* =====================================================
   MISTAKE CLASSIFICATION
===================================================== */

function classifyMistake(q,selectedIndex){

const text =
String(
q.question || ""
).toLowerCase();


/* Calculation */

if(
text.includes("calculate") ||
text.includes("numerical") ||
text.includes("find the") ||
text.includes("value of") ||
text.includes("velocity") ||
text.includes("acceleration") ||
text.includes("force") ||
text.includes("calculate the")
){

return {

type:"🔢 Calculation Error",

reason:
"Recheck the formula, units and calculation steps."

};

}


/* Memory / Recall */

if(
text.includes("which") ||
text.includes("what is") ||
text.includes("symbol") ||
text.includes("unit") ||
text.includes("known as") ||
text.includes("called")
){

return {

type:"📚 Memory / Recall Gap",

reason:
"Revise the relevant factual information and test recall again."

};

}


/* Default */

return {

type:"🧠 Concept Gap",

reason:
"Review the underlying concept and retry the question."

};

}


/* =====================================================
   GET QUESTION STATUS
===================================================== */

function getQuestionStatus(q,index){

if(
answers[index] === null
){

return "skipped";

}

if(
answers[index] === q.answer
){

return "correct";

}

return "wrong";

}


/* =====================================================
   CREATE HISTORY QUESTION
===================================================== */

function createHistoryQuestion(q,index){

const status =
getQuestionStatus(
q,
index
);

let intelligence =
null;


if(status === "wrong"){

intelligence =
classifyMistake(
q,
answers[index]
);

}


return {

id:
q.id ||
("history-"+Date.now()+"-"+index),

question:
q.question,

options:
Array.isArray(q.options)
? q.options
: [],

subject:
q.subject ||
"",

topic:
q.topic ||
"",

status:
status,

selectedIndex:
answers[index],

selectedAnswer:
answers[index] === null
? "Not answered"
: q.options[answers[index]],

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

mistakeType:
intelligence
? intelligence.type
: null,

mistakeReason:
intelligence
? intelligence.reason
: null,

solution:
q.solution ||
q.explanation ||
"",

explanation:
q.explanation ||
q.solution ||
"",

bookmarked:
Boolean(
marked[index]
),

markedForReview:
Boolean(
marked[index]
),

pdfPage:
q.pdfPage ||
"",

pdfPageEnd:
q.pdfPageEnd ||
q.pdfPage ||
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"",

source:
q.source ||
"",

sourceType:
q.sourceType ||
""

};

}


/* =====================================================
   SAVE TEST HISTORY
===================================================== */

function saveHistory(
correct,
incorrect,
skipped,
score
){

let history =
readJSON(
STORAGE.HISTORY,
[]
);


if(!Array.isArray(history)){

history = [];

}


const historyItem = {

id:
"test-"+Date.now(),

date:
new Date().toLocaleString(),

timestamp:
Date.now(),

startedAt:
testStartedAt,

completedAt:
Date.now(),

source:
testSource,

sourceType:
testSource === "PDF Import"
? "PDF"
: "CBT",

totalQuestions:
questions.length,

score:
score,

correct:
correct,

incorrect:
incorrect,

wrong:
incorrect,

skipped:
skipped,

percentage:
questions.length
? Math.round(
(score /
(questions.length * 4))
* 100
)
: 0,

questions:
questions.map(
function(q,index){

return createHistoryQuestion(
q,
index
);

}

};


history.push(
historyItem
);


/* Keep existing history */

try{

localStorage.setItem(
STORAGE.HISTORY,
JSON.stringify(history)
);

}catch(error){

console.error(
"Could not save CBT history:",
error
);

}

}


/* =====================================================
   BUILD RETRY QUESTIONS
===================================================== */

function buildRetryQueue(){

const wrong = [];


questions.forEach(
function(q,index){

if(
answers[index] === null
){
return;
}


if(
answers[index] === q.answer
){
return;
}


const intelligence =
classifyMistake(
q,
answers[index]
);


wrong.push({

id:
"retry-"+Date.now()+"-"+index,

question:
q.question,

options:
Array.isArray(q.options)
? q.options
: [],

subject:
q.subject ||
"",

topic:
q.topic ||
"",

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

solution:
q.solution ||
q.explanation ||
"",

explanation:
q.explanation ||
q.solution ||
"",

selectedIndex:
answers[index],

selectedAnswer:
q.options[answers[index]],

mistakeType:
intelligence.type,

mistakeReason:
intelligence.reason,

source:
"CBT",

sourceType:
"CBT",

pdfPage:
q.pdfPage ||
"",

pdfPageEnd:
q.pdfPageEnd ||
q.pdfPage ||
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"",

bookmarked:
Boolean(
marked[index]
)

});

});


return wrong;

}


/* =====================================================
   SAVE RETRY QUEUE
===================================================== */

function saveRetryQueue(wrong){

try{

localStorage.setItem(
STORAGE.RETRY_QUEUE,
JSON.stringify(wrong)
);


if(wrong.length > 0){

localStorage.setItem(
STORAGE.RETRY_QUESTION,
JSON.stringify(
wrong[0]
)
);

localStorage.setItem(
STORAGE.RETRY_STARTED,
String(Date.now())
);

}

}catch(error){

console.error(
"Could not save retry queue:",
error
);

}

}


/* =====================================================
   OPEN RETRY
===================================================== */

function openRetry(){

if(!submitted){

return;

}


const wrong =
buildRetryQueue();


if(!wrong.length){

alert(
"There are no mistakes to retry."
);

return;

}


/* Save complete queue */

saveRetryQueue(
wrong
);


/* Open existing retry page */

location.href =
"retry.html";

}


/* =====================================================
   CLEAR OLD RETRY QUEUE
   ONLY WHEN NEW RETRY IS CREATED
===================================================== */

function replaceRetryQueue(wrong){

try{

localStorage.setItem(
STORAGE.RETRY_QUEUE,
JSON.stringify(wrong)
);

if(wrong.length){

localStorage.setItem(
STORAGE.RETRY_QUESTION,
JSON.stringify(
wrong[0]
)
);

}

}catch(error){

console.error(error);

}

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted){

return;

}


let correct = 0;
let incorrect = 0;
let skipped = 0;


questions.forEach(
function(q,index){

if(
answers[index] === null
){

skipped++;

}else if(
answers[index] === q.answer
){

correct++;

}else{

incorrect++;

}

});


/* NEET-style marking */

const score =
(correct * 4) -
incorrect;


/* Save history BEFORE showing result */

saveHistory(
correct,
incorrect,
skipped,
score
);


/* Build retry queue */

const wrong =
buildRetryQueue();


if(wrong.length){

saveRetryQueue(
wrong
);

}


submitted = true;


/* Stop timer */

clearInterval(
timerInterval
);


/* Disable submit */

const submitButton =
document.getElementById(
"submitButton"
);

if(submitButton){

submitButton.disabled =
true;

}


/* Hide test */

document.getElementById(
"testScreen"
).style.display =
"none";


/* Hide palette */

const aside =
document.querySelector(
"aside"
);

if(aside){

aside.style.display =
"none";

}


/* Show result */

document.getElementById(
"result"
).style.display =
"block";


/* Score */

document.getElementById(
"score"
).textContent =
score +
" / " +
(questions.length * 4);


/* Summary */

document.getElementById(
"summary"
).textContent =
"Correct: " +
correct +
" | Incorrect: " +
incorrect +
" | Skipped: " +
skipped;


/* Statistics */

const stats =
document.getElementById(
"resultStats"
);

if(stats){

stats.innerHTML =

'<div class="stat">' +
"<strong>" +
correct +
"</strong>" +
"<small>Correct</small>" +
"</div>" +

'<div class="stat">' +
"<strong>" +
incorrect +
"</strong>" +
"<small>Incorrect</small>" +
"</div>" +

'<div class="stat">' +
"<strong>" +
skipped +
"</strong>" +
"<small>Skipped</small>" +
"</div>";

}


/* Retry button */

const retryButton =
document.getElementById(
"retryButton"
);


if(
retryButton &&
incorrect > 0
){

retryButton.style.display =
"block";

retryButton.textContent =
"🔄 Retry " +
incorrect +
" Mistake" +
(
incorrect === 1
? ""
: "s"
);

}


/* Review */

generateReview();

}
 /* =====================================================
   QUESTION REVIEW
===================================================== */

function generateReview(){

const box =
document.getElementById(
"review"
);

if(!box){
return;
}

box.innerHTML =
"<h3>🧠 Question Analysis</h3>";


questions.forEach(
function(q,index){

const status =
getQuestionStatus(
q,
index
);


const item =
document.createElement(
"div"
);

item.className =
"review-item " +
(
status === "correct"
? "correct"
: status === "wrong"
? "incorrect"
: "skipped"
);


/* Question */

item.innerHTML =
"<strong>Q" +
(index + 1) +
". " +
escapeHTML(
q.question
) +
"</strong>";


/* Answers */

const yourAnswer =
answers[index] === null
? "Not answered"
: q.options[
answers[index]
];


const correctAnswer =
q.options[
q.answer
];


item.innerHTML +=

"<p>" +

"<b>Your answer:</b> " +
escapeHTML(
yourAnswer
) +

"<br>" +

"<b>Correct answer:</b> " +
escapeHTML(
correctAnswer
) +

"</p>";


/* Solution */

const solution =
q.solution ||
q.explanation ||
"";


if(solution){

item.innerHTML +=

'<div class="analysis">' +

"<b>💡 Solution</b><br>" +

escapeHTML(
solution
) +

"</div>";

}


/* Mistake intelligence */

if(status === "wrong"){

const intelligence =
classifyMistake(
q,
answers[index]
);


item.innerHTML +=

'<div class="analysis">' +

"<b>" +
escapeHTML(
intelligence.type
) +
"</b><br>" +

escapeHTML(
intelligence.reason
) +

"</div>";

}


/* PDF information */

if(
q.pdfPage ||
q.chapter ||
q.section
){

let meta = "";


if(q.pdfPage){

meta +=
"📄 PDF Page: " +
escapeHTML(
q.pdfPage
);

}


if(q.pdfPageEnd &&
q.pdfPageEnd !== q.pdfPage){

meta +=
" – " +
escapeHTML(
q.pdfPageEnd
);

}


if(q.chapter){

meta +=
" | Chapter: " +
escapeHTML(
q.chapter
);

}


if(q.section){

meta +=
" | Section: " +
escapeHTML(
q.section
);

}


item.innerHTML +=

'<div class="meta">' +
meta +
"</div>";

}


/* Source */

if(q.source){

item.innerHTML +=

'<div class="meta">' +
"Source: " +
escapeHTML(
q.source
) +
"</div>";

}


box.appendChild(
item
);

});

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   PROTECT AGAINST DOUBLE SUBMIT
===================================================== */

window.addEventListener(
"beforeunload",
function(){

if(!submitted){

/*
  We intentionally do not
  delete any saved data here.
*/

}

}
);


/* =====================================================
   START APPLICATION
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

try{

initialize();

}catch(error){

console.error(
"CBT initialization failed:",
error
);

showFatalError(
"The CBT could not be initialized. Please reload the test."
);

}

}
);


/* =====================================================
   END CBT ENGINE
===================================================== */
</script>

</body>
</html>
