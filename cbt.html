<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:700
}

.timer{
background:#eef2ff;
padding:9px 14px;
border-radius:9px;
font-weight:700
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px
}

.card{
background:#fff;
border-radius:15px;
padding:22px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.question-number{
color:#64748b;
font-weight:600;
margin-bottom:12px
}

.question{
font-size:20px;
line-height:1.5;
font-weight:700;
margin-bottom:20px
}

.option{
width:100%;
padding:15px;
margin:8px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:10px;
text-align:left;
font-size:16px;
cursor:pointer
}

.option:hover{
border-color:#818cf8
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
font-weight:700
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px
}

button{
border:0;
border-radius:10px;
padding:13px;
font-size:15px;
font-weight:700;
cursor:pointer
}

.primary{
background:#4f46e5;
color:white
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.warning{
background:#f59e0b;
color:white
}

.danger{
background:#dc2626;
color:white
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px
}

.palette button{
background:#e2e8f0;
padding:10px 5px
}

.palette .answered{
background:#bbf7d0
}

.palette .review{
background:#fde68a
}

.palette .current{
outline:3px solid #4f46e5
}

.legend{
margin-top:15px;
color:#64748b;
font-size:13px;
line-height:1.8
}

#result{
display:none
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:20px
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px
}

.correct{
border-left:5px solid #16a34a
}

.incorrect{
border-left:5px solid #dc2626
}

.skipped{
border-left:5px solid #f59e0b
}

.analysis{
margin-top:10px;
padding:12px;
background:#eef2ff;
border-radius:9px;
line-height:1.5
}

.bookmark{
margin-top:10px;
background:#fef3c7;
padding:10px;
border-radius:8px;
font-weight:700
}

.reason-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px
}

.reason-button{
background:#fff;
border:2px solid #e2e8f0;
color:#0f172a;
text-align:left;
padding:11px;
border-radius:9px;
font-size:14px
}

.reason-button.selected-reason{
border-color:#4f46e5;
background:#eef2ff;
color:#3730a3;
font-weight:800
}

.reason-status{
font-size:13px;
color:#64748b;
margin-top:8px
}

.saved-message{
margin-top:8px;
color:#15803d;
font-weight:700;
font-size:13px
}

.result-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px
}

.result-actions button{
flex:1;
min-width:150px
}

@media(max-width:800px){

.container{
grid-template-columns:1fr
}

.reason-options{
grid-template-columns:1fr
}

}

@media(max-width:500px){

.question{
font-size:18px
}

.buttons{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer Pro
</div>

<div class="timer" id="timer">
30:00
</div>

</div>

</header>


<div class="container">

<main class="card">

<section id="testScreen">

<div
class="question-number"
id="questionNumber">
Loading...
</div>

<div
class="question"
id="question">
</div>

<div id="options"></div>

<div class="buttons">

<button
class="secondary"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
onclick="markReview()">
Mark for Review
</button>

<button
class="secondary"
onclick="clearAnswer()">
Clear Answer
</button>

<button
class="primary"
id="nextButton"
onclick="nextQuestion()">
Next
</button>

</div>

</section>


<section id="result">

<h2>
Test Completed
</h2>

<div
class="score"
id="score">
</div>

<p id="summary"></p>

<div id="review"></div>

<div class="result-actions">

<button
class="primary"
onclick="location.href='mistake.html'">
Open Mistake Bank
</button>

<button
class="primary"
onclick="location.href='retry.html'">
Retry Mistakes
</button>

<button
class="secondary"
onclick="location.href='index.html'">
Dashboard
</button>

</div>

</section>

</main>


<aside class="card">

<h3>
Question Palette
</h3>

<div
class="palette"
id="palette">
</div>

<div class="legend">
🟩 Answered<br>
🟨 Marked for review<br>
⬜ Not answered<br>
🟦 Current question
</div>

<button
class="danger"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>


<script>

/* =========================================================
   CBT ANALYZER PRO
   SHARED STORAGE SYSTEM
========================================================= */

const STORAGE = {

history:
"cbtHistory",

tests:
"cbtAnalyzer.tests",

mistakes:
"cbtAnalyzer.mistakes",

bookmarks:
"cbtAnalyzer.bookmarks",

retryQueue:
"cbtAnalyzer.retryQueue",

retryHistory:
"cbtAnalyzer.retryHistory",

mastery:
"cbtAnalyzer.mastery"

};


/* =========================================================
   QUESTIONS
========================================================= */

const questions=[

{
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1,
solution:"Mars appears reddish because iron minerals in its surface have oxidized.",
mistakeReason:"Review the basic identification and characteristics of planets.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Basic Mathematics",
question:"What is 2 + 2?",
options:["3","4","5","6"],
answer:1,
solution:"Adding 2 and 2 gives 4.",
mistakeReason:"Recheck the basic arithmetic operation.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Environment",
question:"Which gas is most abundant in Earth's atmosphere?",
options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],
answer:2,
solution:"Nitrogen makes up approximately 78% of Earth's atmosphere.",
mistakeReason:"Revise the approximate composition of Earth's atmosphere.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is the newton (N).",
mistakeReason:"Carefully distinguish force from energy, power and pressure units.",
mistakeType:"Misread Question"
},

{
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of aerobic cellular respiration and ATP production.",
mistakeReason:"Revise the functions of major cell organelles.",
mistakeType:"Concept Gap"
},

{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol for sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The chemical symbol of sodium is Na, derived from its Latin name natrium.",
mistakeReason:"Revise symbols of common elements.",
mistakeType:"Concept Gap"
},

{
subject:"Biology",
topic:"Cellular Respiration",
question:"Which process produces ATP in mitochondria?",
options:["Photosynthesis","Cellular respiration","Transcription","Translation"],
answer:1,
solution:"Cellular respiration in mitochondria generates ATP through oxidative phosphorylation and related processes.",
mistakeReason:"Differentiate cellular respiration from other cellular processes.",
mistakeType:"Misread Question"
},

{
subject:"Physics",
topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],
answer:1,
solution:"The standard approximate value of gravitational acceleration near Earth's surface is 9.8 m/s².",
mistakeReason:"Revise standard physical constants and check numerical values carefully.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:["Protein","Lipid","DNA","Glucose"],
answer:2,
solution:"DNA stores and transmits hereditary genetic information in most organisms.",
mistakeReason:"Revise the roles of DNA, RNA, proteins and other biomolecules.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:["Proton","Neutron","Electron","Photon"],
answer:2,
solution:"An electron carries one unit of negative elementary charge.",
mistakeReason:"Revise the basic properties of subatomic particles.",
mistakeType:"Concept Gap"
}

];


/* =========================================================
   STATE
========================================================= */

let current=0;

let answers=
new Array(questions.length).fill(null);

let marked=
new Array(questions.length).fill(false);

let mistakeReasons=
new Array(questions.length).fill(null);

let submitted=false;

let savedHistoryIndex=-1;

let timeLeft=1800;


/* =========================================================
   STORAGE HELPERS
========================================================= */

function readStorage(key,fallback){

try{

const value=
localStorage.getItem(key);

if(!value){

return fallback;
}

return JSON.parse(value);

}catch(error){

console.error(
"Storage read error:",
error
);

return fallback;

}

}


function writeStorage(key,value){

try{

localStorage.setItem(
key,
JSON.stringify(value)
);

}catch(error){

console.error(
"Storage write error:",
error
);

}

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

const m=
Math.floor(timeLeft/60);

const s=
timeLeft%60;

document.getElementById(
"timer"
).textContent=

String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0");

}


const timerInterval=
setInterval(function(){

if(submitted)return;

timeLeft--;

if(timeLeft<=0){

timeLeft=0;

updateTimer();

clearInterval(timerInterval);

submitTest();

return;

}

updateTimer();

},1000);


/* =========================================================
   RENDER QUESTION
========================================================= */

function renderQuestion(){

const q=
questions[current];

document.getElementById(
"questionNumber"
).textContent=

"Question "+
(current+1)+
" of "+
questions.length+
" • "+
q.subject;


document.getElementById(
"question"
).textContent=
q.question;


const box=
document.getElementById(
"options"
);

box.innerHTML="";


q.options.forEach(function(
option,
index
){

const button=
document.createElement(
"button"
);

button.className=
"option";


if(
answers[current]===index
){

button.classList.add(
"selected"
);

}


button.textContent=

String.fromCharCode(
65+index
)+
". "+
option;


button.onclick=function(){

answers[current]=index;

renderQuestion();

};


box.appendChild(button);

});


document.getElementById(
"nextButton"
).textContent=

current===
questions.length-1
?
"Finish"
:
"Next";


renderPalette();

}


/* =========================================================
   PALETTE
========================================================= */

function renderPalette(){

const palette=
document.getElementById(
"palette"
);

palette.innerHTML="";


questions.forEach(
function(q,index){

const button=
document.createElement(
"button"
);

button.textContent=
index+1;


if(
answers[index]!==null
){

button.classList.add(
"answered"
);

}


if(
marked[index]
){

button.classList.add(
"review"
);

}


if(
index===current
){

button.classList.add(
"current"
);

}


button.onclick=function(){

current=index;

renderQuestion();

};


palette.appendChild(button);

});

}


/* =========================================================
   NAVIGATION
========================================================= */

function nextQuestion(){

if(
current<
questions.length-1
){

current++;

renderQuestion();

}else{

submitTest();

}

}


function previousQuestion(){

if(current>0){

current--;

renderQuestion();

}

}


function clearAnswer(){

answers[current]=null;

renderQuestion();

}


function markReview(){

marked[current]=
!marked[current];

renderPalette();

}


/* =========================================================
   MISTAKE REASON
========================================================= */

function getReasonExplanation(
reason
){

const explanations={

"Concept Gap":
"Student identified a gap in understanding the underlying concept.",

"Calculation Error":
"Student identified an error in calculation, arithmetic or numerical processing.",

"Misread Question":
"Student identified that the question or options were misunderstood or read incorrectly.",

"Guessing":
"Student identified that the answer was selected without sufficient confidence or reasoning.",

"Time Pressure":
"Student identified that time pressure affected the answer."

};

return explanations[reason]||
"Student-selected mistake reason.";

}


function selectMistakeReason(
index,
reason
){

mistakeReasons[index]=
reason;

saveReasonToHistory(
index,
reason
);

generateReview();

}


/* =========================================================
   SAVE MISTAKE REASON
========================================================= */

function saveReasonToHistory(
index,
reason
){

const history=
readStorage(
STORAGE.history,
[]
);


if(
!Array.isArray(history)||
savedHistoryIndex<0||
!history[savedHistoryIndex]
){

return;

}


if(
!Array.isArray(
history[savedHistoryIndex]
.questions
)
){

return;

}


const record=
history[savedHistoryIndex]
.questions[index];


if(!record)return;


record.mistakeType=
reason;

record.mistakeReason=
getReasonExplanation(
reason
);


history[savedHistoryIndex]
.questions[index]=
record;


writeStorage(
STORAGE.history,
history
);


/* Update shared mistake */

updateSharedMistake(
record
);

}


/* =========================================================
   UPDATE SHARED MISTAKE
========================================================= */

function updateSharedMistake(
record
){

let mistakes=
readStorage(
STORAGE.mistakes,
[]
);


if(!Array.isArray(mistakes)){

mistakes=[];

}


const existing=
mistakes.findIndex(
item=>item.id===record.id
);


const mistake={

id:record.id,

question:record.question,

options:record.options,

subject:record.subject,

topic:record.topic,

selectedIndex:
record.selectedIndex,

selectedAnswer:
record.selectedAnswer,

correctIndex:
record.correctIndex,

correctAnswer:
record.correctAnswer,

mistakeType:
record.mistakeType,

mistakeReason:
record.mistakeReason,

solution:
record.solution,

source:"CBT Test",

date:new Date().toISOString(),

mastered:false

};


if(existing>=0){

mistakes[existing]={
...mistakes[existing],
...mistake
};

}else{

mistakes.push(mistake);

}


writeStorage(
STORAGE.mistakes,
mistakes
);

}


/* =========================================================
   SAVE TEST
========================================================= */

function saveTest(
correct,
incorrect,
skipped,
score
){

let history=
readStorage(
STORAGE.history,
[]
);


if(!Array.isArray(history)){

history=[];

}


const testId=
"test-"+Date.now();


const questionData=
questions.map(
function(q,index){

let status;


if(
answers[index]===null
){

status="skipped";

}
else if(
answers[index]===q.answer
){

status="correct";

}
else{

status="wrong";

}


const selectedAnswer=
answers[index]===null
?
null
:
q.options[
answers[index]
];


return{

id:
testId+
"-q-"+
index,

question:
q.question,

options:
q.options,

subject:
q.subject,

topic:
q.topic,

status:
status,

selectedIndex:
answers[index],

selectedAnswer:
selectedAnswer,

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

bookmarked:
marked[index],

mistakeType:
status==="wrong"
?
(
mistakeReasons[index]||
"Not Classified"
)
:
null,

mistakeReason:
status==="wrong"
?
(
mistakeReasons[index]||
"Student has not selected a mistake reason yet."
)
:
"Correct answer.",

solution:
q.solution,

markedForReview:
marked[index],

mastered:false

};

});


const testRecord={

id:
testId,

date:
new Date().toISOString(),

displayDate:
new Date().toLocaleString(),

score:
score,

correct:
correct,

incorrect:
incorrect,

wrong:
incorrect,

skipped:
skipped,

total:
questions.length,

accuracy:
questions.length
?
Math.round(
correct/
questions.length*
100
)
:
0,

questions:
questionData

};


/* Existing history */

history.push(
testRecord
);

savedHistoryIndex=
history.length-1;

writeStorage(
STORAGE.history,
history
);


/* Shared tests */

const tests=
readStorage(
STORAGE.tests,
[]
);

tests.push(
testRecord
);

writeStorage(
STORAGE.tests,
tests
);


/* Shared mistakes */

let mistakes=
readStorage(
STORAGE.mistakes,
[]
);

if(!Array.isArray(mistakes)){

mistakes=[];

}


/* Shared bookmarks */

let bookmarks=
readStorage(
STORAGE.bookmarks,
[]
);

if(!Array.isArray(bookmarks)){

bookmarks=[];

}


questionData.forEach(
function(record){

/* WRONG */

if(
record.status==="wrong"
){

const mistake={

id:record.id,

question:record.question,

options:record.options,

subject:record.subject,

topic:record.topic,

selectedIndex:
record.selectedIndex,

selectedAnswer:
record.selectedAnswer,

correctIndex:
record.correctIndex,

correctAnswer:
record.correctAnswer,

mistakeType:
record.mistakeType,

mistakeReason:
record.mistakeReason,

solution:
record.solution,

source:"CBT Test",

date:
new Date().toISOString(),

mastered:false

};


const exists=
mistakes.some(
item=>
item.id===mistake.id
);


if(!exists){

mistakes.push(
mistake
);

}

}


/* BOOKMARK */

if(
record.bookmarked
){

const bookmark={

id:record.id,

question:
record.question,

options:
record.options,

subject:
record.subject,

topic:
record.topic,

correctIndex:
record.correctIndex,

correctAnswer:
record.correctAnswer,

solution:
record.solution,

source:"CBT Test",

date:
new Date().toISOString()

};


const exists=
bookmarks.some(
item=>
item.id===bookmark.id
);


if(!exists){

bookmarks.push(
bookmark
);

}

}

});


writeStorage(
STORAGE.mistakes,
mistakes
);

writeStorage(
STORAGE.bookmarks,
bookmarks
);


/* Retry Queue */

createRetryQueue();

}


/* =========================================================
   RETRY QUEUE
========================================================= */

function createRetryQueue(){

const mistakes=
readStorage(
STORAGE.mistakes,
[]
);

const bookmarks=
readStorage(
STORAGE.bookmarks,
[]
);


const combined=[
...mistakes,
...bookmarks
];


const unique=[];

const seen=
new Set();


combined.forEach(
function(item){

const id=
item.id||
item.question;


if(!seen.has(id)){

seen.add(id);

unique.push(item);

}

});


writeStorage(
STORAGE.retryQueue,
unique
);

}


/* =========================================================
   REASON BUTTON
========================================================= */

function reasonButton(
index,
reason,
icon
){

const selected=
mistakeReasons[index]===
reason
?
" selected-reason"
:
"";


return `

<button
type="button"
class="reason-button${selected}"
onclick="selectMistakeReason(${index},'${reason}')">

${icon} ${reason}

</button>

`;

}


/* =========================================================
   REVIEW
========================================================= */

function generateReview(){

const box=
document.getElementById(
"review"
);

box.innerHTML=
"<h3>Question Analysis</h3>";


questions.forEach(
function(q,index){

const item=
document.createElement(
"div"
);


let status;


if(
answers[index]===null
){

status="skipped";

}
else if(
answers[index]===q.answer
){

status="correct";

}
else{

status="incorrect";

}


item.className=
"review-item "+
status;


const selected=
ans
