"use strict";


/* =====================================================
GLOBAL STATE
===================================================== */

let questions=[];

let current=0;

let answers=[];

let marked=[];

let submitted=false;

let timeLeft=1800;

let timerInterval=null;


/* =====================================================
LOAD ONLY PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

const saved=
localStorage.getItem(
"pdfCbtQuestions"
);


console.log(
"PDF CBT STORAGE:",
saved
);


if(!saved){

return false;

}


try{

const imported=
JSON.parse(saved);


if(
!Array.isArray(imported) ||
imported.length===0
){

return false;

}


/*
IMPORTANT:
No hard-coded questions are used.
*/

const valid=
imported.filter(function(q){

if(!q){
return false;
}

if(
typeof q.question!=="string" ||
q.question.trim()===""
){

return false;

}

if(
!Array.isArray(q.options) ||
q.options.length<2
){

return false;

}

const answer=
Number(q.answer);


if(
!Number.isInteger(answer)
){

return false;

}

if(
answer<0 ||
answer>=q.options.length
){

return false;

}

return true;

});


if(valid.length===0){

return false;

}


questions=
valid.map(function(q,index){

return{

id:
q.id ||
"pdf-"+Date.now()+"-"+index,

subject:
q.subject ||
"Imported",

topic:
q.topic ||
q.section ||
"PDF Import",

question:
q.question,

options:
q.options,

answer:
Number(q.answer),

solution:
q.solution ||
q.explanation ||
"Review the solution from the original PDF.",

explanation:
q.explanation ||
"",

pdfPage:
q.pdfPage ||
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"PDF",

source:
q.source ||
"PDF Import",

sourceType:
q.sourceType ||
"PDF"

};

});


console.log(
"VALID PDF QUESTIONS:",
questions.length
);


return questions.length>0;

}
catch(error){

console.error(
"PDF QUESTION ERROR:",
error
);

return false;

}

}


/* =====================================================
INITIALIZE
===================================================== */

function initialize(){

const loaded=
loadPDFQuestions();


if(!loaded){

document.getElementById(
"questionNumber"
).textContent=
"No PDF CBT loaded";


document.getElementById(
"question"
).innerHTML=
'<div class="empty">'+

'No valid PDF questions were found.<br><br>'+

'Please return to <b>PDF → CBT</b>, read your PDF, and tap <b>Start CBT</b> again.'+

'</div>';


document.getElementById(
"options"
).innerHTML="";


document.getElementById(
"nextButton"
).disabled=true;


return;

}


answers=
new Array(
questions.length
).fill(null);


marked=
new Array(
questions.length
).fill(false);


current=0;

submitted=false;

timeLeft=1800;


renderQuestion();

startTimer();

}


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

const minutes=
Math.floor(timeLeft/60);

const seconds=
timeLeft%60;


document.getElementById(
"timer"
).textContent=

String(minutes)
.padStart(2,"0")+
":"+
String(seconds)
.padStart(2,"0");

}


function startTimer(){

clearInterval(
timerInterval
);

updateTimer();


timerInterval=
setInterval(function(){

if(submitted){

clearInterval(
timerInterval
);

return;

}


timeLeft--;


if(timeLeft<=0){

timeLeft=0;

updateTimer();

clearInterval(
timerInterval
);

submitTest();

return;

}


updateTimer();

},1000);

}


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

if(!questions.length){

return;

}


const q=
questions[current];


document.getElementById(
"questionNumber"
).textContent=

"Question "+
(current+1)+
" of "+
questions.length+
" • "+
(q.subject||"Imported");


document.getElementById(
"question"
).textContent=
q.question;


const optionsBox=
document.getElementById(
"options"
);


optionsBox.innerHTML="";


q.options.forEach(
function(option,index){

const button=
document.createElement(
"button"
);

button.type="button";

button.className=
"option";


if(
answers[current]===index
){

button.classList.add(
"selected"
);

}


button.textContent=
String.fromCharCode(
65+index
)+
". "+
option;


button.onclick=
function(){

if(submitted){

return;

}


answers[current]=index;

renderQuestion();

};


optionsBox.appendChild(
button
);

});


document.getElementById(
"nextButton"
).textContent=

current===
questions.length-1
?"Finish"
:"Next";


renderPalette();

}


/* =====================================================
PALETTE
===================================================== */

function renderPalette(){

const palette=
document.getElementById(
"palette"
);

palette.innerHTML="";


questions.forEach(
function(q,index){

const button=
document.createElement(
"button"
);

button.type="button";

button.textContent=
index+1;


if(
answers[index]!==null
){

button.classList.add(
"answered"
);

}


if(marked[index]){

button.classList.add(
"review"
);

}


if(index===current){

button.classList.add(
"current"
);

}


button.onclick=
function(){

if(submitted){

return;

}


current=index;

renderQuestion();

};


palette.appendChild(
button
);

});

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

if(submitted){

return;

}


if(
current<
questions.length-1
){

current++;

renderQuestion();

}
else{

submitTest();

}

}


function previousQuestion(){

if(submitted){

return;

}


if(current>0){

current--;

renderQuestion();

}

}


function clearAnswer(){

if(submitted){

return;

}


answers[current]=null;

renderQuestion();

}


function markReview(){

if(submitted){

return;

}


marked[current]=
!marked[current];

renderPalette();

}
    /* =====================================================
LOAD LATEST PDF QUESTIONS
===================================================== */

function loadQuestions(){

let saved=null;

try{

saved=
localStorage.getItem(
"pdfCbtQuestions"
);

}catch(error){

console.error(
"Storage read error:",
error
);

}


if(!saved){

showNoQuestions();

return false;

}


let imported=[];


try{

imported=
JSON.parse(saved);

}catch(error){

console.error(
"Invalid saved questions:",
error
);

showNoQuestions();

return false;

}


if(
!Array.isArray(imported) ||
imported.length===0
){

showNoQuestions();

return false;

}


/*
IMPORTANT:

Only questions coming from
pdfCbtQuestions are used.

The old hard-coded questions
are NOT used.
*/

const valid=
imported.filter(function(q){

return q &&
typeof q.question==="string" &&
q.question.trim()!=="" &&
Array.isArray(q.options) &&
q.options.length>=2 &&
Number.isInteger(
Number(q.answer)

Number(q.answer)>=0 &&

if(valid.length===0){

return false;

}


questions=
valid.map(function(q,index){

return{

id:
q.id ||
"pdf-question-"+
Date.now()+
"-"+
index,

subject:
q.subject ||
"Imported",

topic:
q.topic ||
q.section ||
"PDF Import",

question:
q.question,

options:
q.options,

answer:
Number(q.answer),

solution:
q.solution ||
q.explanation ||
"Review the solution from the source PDF.",

explanation:
q.explanation ||
"",

pdfPage:
q.pdfPage ||
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

source:
q.source ||
"PDF Import",

answerSource:
q.answerSource ||
"Verified"

};

});


console.log(
"Imported questions loaded:",
questions.length
);

return true;

}

/* =====================================================
MISTAKE INTELLIGENCE
===================================================== */

function classifyMistake(
q,
selectedIndex
){

const text=
String(
q.question||""
).toLowerCase();


const topic=
String(
q.topic||""
).toLowerCase();


const selected=
selectedIndex===null ||
selectedIndex===undefined
?""
:String(
q.options[selectedIndex]||""
).toLowerCase();


const correct=
String(
q.options[q.answer]||""
).toLowerCase();


/* CALCULATION */

if(
/calculate|calculation|numerical|velocity|acceleration|force|work|energy|power|current|voltage|resistance|mass|momentum/
.test(text)
){

return{

type:
"🔢 Calculation Error",

reason:
"Recheck the formula, units and calculation steps."

};

}


/* MEMORY */

if(
/what is|which is|symbol|unit|known as|called|most abundant|organ|organelle/
.test(text)
){

return{

type:
"📚 Memory / Recall Gap",

reason:
"Revise this factual information and practise active recall."

};

}


/* CONCEPT */

if(
/why|principle|mechanism|process|function|relationship|reason|concept/
.test(text)
){

return{

type:
"🧠 Concept Gap",

reason:
"Review the underlying concept and understand why the correct answer is correct."

};

}


/* CONFUSION */

if(
selected &&
correct &&
selected!==correct
){

return{

type:
"🧩 Confused Concepts",

reason:
"Your selected answer differs from the correct answer. Review the distinction between these concepts."

};

}


/* DEFAULT */

return{

type:
"⚠️ Concept Gap",

reason:
"Review the explanation and retry this question."

};

}


/* =====================================================
SAVE TEST HISTORY
===================================================== */

function saveHistory(
correct,
incorrect,
skipped,
score
){

let history=[];


try{

history=
JSON.parse(
localStorage.getItem(
"cbtHistory"
)||"[]"
);


if(
!Array.isArray(history)
){

history=[];

}

}catch(error){

history=[];

}


const record={

date:
new Date().toLocaleString(),

timestamp:
Date.now(),

score:
score,

correct:
correct,

incorrect:
incorrect,

wrong:
incorrect,

skipped:
skipped,

questions:
questions.map(
function(q,index){

let status;


if(
answers[index]===null
){

status=
"skipped";

}
else if(
answers[index]===q.answer
){

status=
"correct";

}
else{

status=
"incorrect";

}


let intelligence=null;


if(
status==="incorrect"
){

intelligence=
classifyMistake(
q,
answers[index]
);

}


return{

id:
q.id,

question:
q.question,

options:
q.options,

subject:
q.subject,

topic:
q.topic,

status:
status,

selectedIndex:
answers[index],

selectedAnswer:
answers[index]===null
?"Not answered"
:q.options[
answers[index]
],

correctIndex:
q.answer,

correctAnswer:
q.options[
q.answer
],

mistakeType:
intelligence
?intelligence.type
:null,

mistakeReason:
intelligence
?intelligence.reason
:null,

solution:
q.solution||"",

explanation:
q.explanation||"",

markedForReview:
Boolean(
marked[index]
),

pdfPage:
q.pdfPage||"",

chapter:
q.chapter||"",

section:
q.section||"",

source:
q.source||"PDF Import"

};

})

};


history.push(record);


localStorage.setItem(
"cbtHistory",
JSON.stringify(
history
)
);

    }
    /* =====================================================
CREATE RETRY QUEUE
===================================================== */

function createRetryQueue(){

const wrong=[];


questions.forEach(
function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

const intelligence=
classifyMistake(
q,
answers[index]
);


wrong.push({

id:
"retry-"+
Date.now()+
"-"+
index,

question:
q.question,

options:
q.options,

subject:
q.subject ||
"Imported",

topic:
q.topic ||
"PDF Import",

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

selectedIndex:
answers[index],

selectedAnswer:
q.options[
answers[index]
],

mistakeType:
intelligence.type,

mistakeReason:
intelligence.reason,

solution:
q.solution ||
"Review the source solution.",

explanation:
q.explanation ||
"",

pdfPage:
q.pdfPage ||
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

source:
"CBT Retry"

});

}

});


/*
Save the complete retry queue.
*/

localStorage.setItem(
"cbtAnalyzer.retryQueue",
JSON.stringify(wrong)
);


/*
Save first retry question.
*/

if(wrong.length>0){

localStorage.setItem(
"cbtRetryQuestion",
JSON.stringify(
wrong[0]
)
);

}else{

localStorage.removeItem(
"cbtRetryQuestion"
);

}


return wrong;

}


/* =====================================================
SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted){

return;

}


if(!questions.length){

alert(
"No questions are available."
);

return;

}


let correct=0;

let incorrect=0;

let skipped=0;


questions.forEach(
function(q,index){

if(
answers[index]===null
){

skipped++;

}
else if(
answers[index]===q.answer
){

correct++;

}
else{

incorrect++;

}

});


/*
NEET-style scoring:
+4 correct
-1 incorrect
*/

const score=
(correct*4)-incorrect;


/*
Save history BEFORE showing result.
*/

saveHistory(
correct,
incorrect,
skipped,
score
);


/*
Create retry questions
for every incorrect answer.
*/

const retryQueue=
createRetryQueue();


submitted=true;


clearInterval(
timerInterval
);


/*
Hide CBT screen.
*/

document.getElementById(
"testScreen"
).style.display=
"none";


document.querySelector(
"aside"
).style.display=
"none";


/*
Show result.
*/

document.getElementById(
"result"
).style.display=
"block";


document.getElementById(
"score"
).textContent=

score+
" / "+
(
questions.length*4
);


document.getElementById(
"summary"
).textContent=

"Correct: "+
correct+
" | Incorrect: "+
incorrect+
" | Skipped: "+
skipped;


/*
Show Retry button only
when mistakes exist.
*/

const retryButton=
document.getElementById(
"retryButton"
);


if(
retryQueue.length>0
){

retryButton.style.display=
"block";


retryButton.textContent=

"🔄 Retry "+
retryQueue.length+
" Mistake"+
(
retryQueue.length===1
?""
:"s"
);

}else{

retryButton.style.display=
"none";

}


/*
Generate complete review.
*/

generateReview();

}

    /* =====================================================

===================================================== */

function generateReview(){

    const review =
        document.getElementById("review");

    if(!review){
        return;
    }

    review.innerHTML = "";

    questions.forEach(function(q,index){

        const selected =
            answers[index];

        const item =
            document.createElement("div");

        let status = "";
        let statusClass = "";

        if(selected === null){

            status = "⏭ Skipped";
            statusClass = "skipped";

        }
        else if(selected === q.answer){

            status = "✅ Correct";
            statusClass = "correct";

        }
        else{

            status = "❌ Incorrect";
            statusClass = "incorrect";

        }

        item.className =
            "review-item " +
            statusClass;

        let html = "";

        html +=
            "<div><b>Q" +
            (index + 1) +
            ".</b> " +
            escapeHTML(q.question) +
            "</div>";

        html +=
            "<p class='status-" +
            statusClass +
            "'>" +
            status +
            "</p>";

        /* =========================
        SELECTED ANSWER
        ========================= */

        if(selected !== null){

            html +=
                "<div class='info'>" +
                "<b>Your Answer:</b> " +
                escapeHTML(
                    String.fromCharCode(65 + selected) +
                    ". " +
                    q.options[selected]
                ) +
                "</div>";

        }
        else{

            html +=
                "<div class='info'>" +
                "<b>Your Answer:</b> Not answered" +
                "</div>";

        }


        /* =========================
        CORRECT ANSWER
        ========================= */

        html +=
            "<div class='info'>" +
            "<b>Correct Answer:</b> " +
            escapeHTML(
                String.fromCharCode(65 + q.answer) +
                ". " +
                q.options[q.answer]
            ) +
            "</div>";


        /* =========================
        SOLUTION
        ========================= */

        if(q.solution){

            html +=
                "<div class='info'>" +
                "<b>💡 Solution:</b><br>" +
                escapeHTML(q.solution) +
                "</div>";

        }


        /* =========================
        MISTAKE ANALYSIS
        ========================= */

        if(
            selected !== null &&
            selected !== q.answer
        ){

            const intelligence =
                classifyMistake(
                    q,
                    selected
                );

            html +=
                "<div class='analysis'>" +

                "<div class='analysis-type'>" +
                intelligence.type +
                "</div>" +

                "<div>" +
                "<b>Why:</b> " +
                escapeHTML(
                    intelligence.reason
                ) +
                "</div>" +

                "</div>";

        }


        /* =========================
        RETRY BUTTON
        ========================= */

        if(
            selected !== null &&
            selected !== q.answer
        ){

            html +=
                "<button " +
                "type='button' " +
                "class='primary' " +
                "style='margin-top:10px;width:100%' " +
                "onclick='retrySingleQuestion(" +
                index +
                ")'>" +

                "🔄 Retry This Question" +

                "</button>";

        }


        item.innerHTML = html;

        review.appendChild(item);

    });

}


/* =====================================================
RETRY SINGLE QUESTION
===================================================== */

function retrySingleQuestion(index){

    const q =
        questions[index];

    if(!q){
        return;
    }


    const intelligence =
        classifyMistake(
            q,
            answers[index]
        );


    const retryQuestion = {

        id:
            "retry-" +
            Date.now() +
            "-" +
            index,

        question:
            q.question,

        options:
            q.options,

        subject:
            q.subject ||
            "Imported",

        topic:
            q.topic ||
            "PDF Import",

        correctIndex:
            q.answer,

        correctAnswer:
            q.options[q.answer],

        solution:
            q.solution || "",

        explanation:
            q.explanation || "",

        selectedIndex:
            answers[index],

        selectedAnswer:
            answers[index] === null
            ? "Not answered"
            : q.options[answers[index]],

        mistakeType:
            intelligence.type,

        mistakeReason:
            intelligence.reason,

        source:
            q.source ||
            "CBT",

        pdfPage:
            q.pdfPage || "",

        chapter:
            q.chapter || "",

        section:
            q.section || ""

    };


    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify([
            retryQuestion
        ])
    );


    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(
            retryQuestion
        )
    );


    localStorage.setItem(
        "cbtRetryStartedAt",
        String(Date.now())
    );


    window.location.href =
        "retry.html";

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
LOAD QUESTIONS ON START
===================================================== */

function startCBTApp(){

    /*
    IMPORTANT:
    PDF questions are loaded FIRST.
    Therefore the old built-in questions
    will NOT replace imported PDF questions.
    */

    const loaded =
        loadPDFQuestions();


    if(!loaded){

        /*
        Only use built-in questions
        when there is no imported PDF.
        */

        console.log(
            "No valid PDF questions found. Using default questions."
        );

    }
    else{

        console.log(
            "Imported PDF questions loaded:",
            questions.length
        );

    }


    if(!questions.length){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No questions available";

        document.getElementById(
            "question"
        ).textContent =
            "Please import a PDF first.";

        return;

    }


    initializeState();

    renderQuestion();

    startTimer();

}


/* =====================================================
START APP
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        startCBTApp();

    }
);
