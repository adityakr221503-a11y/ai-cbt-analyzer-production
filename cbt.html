<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Analyzer Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .container {
      max-width: 750px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .progress {
      margin-top: 10px;
      color: #64748b;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .option {
      width: 100%;
      display: block;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      color: #0f172a;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      background: #f8fafc;
    }

    .option.selected {
      border-color: #4f46e5;
      background: #eef2ff;
      font-weight: bold;
    }

    #nextButton {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #nextButton:disabled {
      opacity: 0.5;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
    }

    .score {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>CBT Analyzer Pro</h1>
    <div class="progress" id="progress">
      Loading test...
    </div>
  </div>

  <div class="card">

    <div id="questionArea">
      Loading question...
    </div>

    <button id="nextButton">
      Next Question
    </button>

    <div id="result"></div>

  </div>

</div>
