<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.timer{
background:#eef2ff;
color:#3730a3;
padding:9px 14px;
border-radius:9px;
font-weight:800;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
color:#64748b;
font-weight:700;
margin-bottom:12px;
}

.question{
font-size:21px;
font-weight:800;
line-height:1.55;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:11px;
text-align:left;
font-size:16px;
font-weight:600;
cursor:pointer;
touch-action:manipulation;
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
font-family:inherit;
border:0;
border-radius:10px;
padding:13px;
font-weight:700;
cursor:pointer;
touch-action:manipulation;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.palette button{
background:#e2e8f0;
padding:10px 5px;
}

.palette .answered{
background:#bbf7d0;
}

.palette .review{
background:#fde68a;
}

.palette .current{
outline:3px solid #4f46e5;
}

#result{
display:none;
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:10px 0;
}

.result-actions{
margin-top:10px;
}

.result-actions button{
width:100%;
margin-top:8px;
padding:14px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.skipped{
border-left:5px solid #f59e0b;
}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.analysis-type{
font-weight:800;
color:#3730a3;
}

.info{
padding:12px;
background:#f8fafc;
border-radius:10px;
margin-bottom:12px;
line-height:1.5;
}

.status-correct{
color:#15803d;
font-weight:800;
}

.status-incorrect{
color:#dc2626;
font-weight:800;
}

.status-skipped{
color:#d97706;
font-weight:800;
}

.small{
font-size:14px;
color:#64748b;
}

.empty{
padding:20px;
background:#fef2f2;
border-radius:12px;
color:#991b1b;
font-weight:700;
}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.question{
font-size:19px;
}

}
</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<div id="timer" class="timer">
30:00
</div>

</div>

</header>

<div class="container">

<main class="card">

<section id="testScreen">

<div id="questionNumber"
class="question-number">
Loading imported questions...
</div>

<div id="question"
class="question">
Loading...
</div>

<div id="options"></div>

<div class="buttons">

<button
class="secondary"
type="button"
onclick="previousQuestion()">
Previous
</button>

<button
class="warning"
type="button"
onclick="markReview()">
Mark Review
</button>

<button
class="secondary"
type="button"
onclick="clearAnswer()">
Clear
</button>

<button
id="nextButton"
class="primary"
type="button"
onclick="nextQuestion()">
Next
</button>

</div>

</section>

<section id="result">

<h2>🎯 Test Completed</h2>

<div id="score" class="score"></div>

<p id="summary"></p>

<div class="result-actions">

<button
id="retryButton"
class="primary"
type="button"
style="display:none"
onclick="openRetry()">
🔄 Retry Mistakes
</button>

<button
class="secondary"
type="button"
onclick="location.href='mistake.html'">
🧠 Mistake Bank
</button>

<button
class="secondary"
type="button"
onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

<div id="review"></div>

</section>

</main>

<aside class="card">

<h3>Question Palette</h3>

<div id="palette" class="palette"></div>

<button
class="danger"
type="button"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>

<script>

"use strict";

/* =====================================================
IMPORTANT:
THIS CBT USES PDF QUESTIONS ONLY.
NO OLD HARD-CODED QUESTIONS.
===================================================== */

let questions=[];

let current=0;
let answers=[];
let marked=[];
let submitted=false;

let timeLeft=1800;
let timerInterval=null;


/* =====================================================
LOAD PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

const saved=
localStorage.getItem("pdfCbtQuestions");

console.log(
"pdfCbtQuestions:",
saved
);

if(!saved){

return false;

}

try{

const imported=
JSON.parse(saved);

if(
!Array.isArray(imported) ||
imported.length===0
){

return false;

}


/*
Only accept properly scored questions.
*/

const valid=
imported.filter(function(q){

return q &&
typeof q.question==="string" &&
q.question.trim()!=="" &&
Array.isArray(q.options) &&
q.options.length>=2 &&
Number.isInteger(Number(q.answer)) &&
Number(q.answer)>=0 &&
Number(q.answer)<q.options.length;

});


if(valid.length===0){

return false;

}


/*
Replace questions completely.
*/

questions=
valid.map(function(q,index){

return {

id:
q.id ||
("pdf-"+Date.now()+"-"+index),

subject:
q.subject ||
"Imported",

topic:
q.topic ||
"PDF Import",

question:
q.question,

options:
q.options,

answer:
Number(q.answer),

solution:
q.solution ||
q.explanation ||
"Review the solution from the source PDF.",

explanation:
q.explanation || "",

pdfPage:
q.pdfPage || "",

chapter:
q.chapter || "",

section:
q.section || "",

answerSource:
q.answerSource ||
"PDF",

source:
q.source ||
"PDF Import",

sourceType:
q.sourceType ||
"PDF"

};

});


return true;

}
catch(error){

console.error(
"PDF loading error:",
error
);

return false;

}

}


/* =====================================================
INITIALIZE
===================================================== */

function initialize(){

/*
CRITICAL:
Try PDF data first.
*/

const loaded=
loadPDFQuestions();


if(!loaded){

document.getElementById(
"questionNumber"
).textContent=
"No imported CBT available";


document.getElementById(
"question"
).innerHTML=
'<div class="empty">'+
'No valid PDF questions were found.<br><br>'+
'Go back to <b>PDF → CBT</b>, read the PDF, and then tap Start CBT.'+
'</div>';


document.getElementById(
"options"
).innerHTML="";


return;

}


answers=
new Array(
questions.length
).fill(null);


marked=
new Array(
questions.length
).fill(false);


current=0;

submitted=false;

timeLeft=1800;


renderQuestion();

startTimer();

}


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

const minutes=
Math.floor(timeLeft/60);

const seconds=
timeLeft%60;


document.getElementById(
"timer"
).textContent=
String(minutes).padStart(2,"0")+
":"+
String(seconds).padStart(2,"0");

}


function startTimer(){

clearInterval(timerInterval);

updateTimer();


timerInterval=
setInterval(function(){

if(submitted){

clearInterval(timerInterval);
return;

}


timeLeft--;


if(timeLeft<=0){

timeLeft=0;

updateTimer();

clearInterval(timerInterval);

submitTest();

return;

}


updateTimer();

},1000);

}


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

if(!questions.length){

return;

}


const q=
questions[current];


document.getElementById(
"questionNumber"
).textContent=
"Question "+
(current+1)+
" of "+
questions.length+
" • "+
(q.subject||"Imported");


document.getElementById(
"question"
).textContent=
q.question;


const box=
document.getElementById(
"options"
);

box.innerHTML="";


q.options.forEach(
function(option,index){

const button=
document.createElement(
"button"
);

button.type="button";

button.className=
"option";


if(
answers[current]===index
){

button.classList.add(
"selected"
);

}


button.textContent=
String.fromCharCode(65+index)+
". "+
option;


button.onclick=
function(){

if(submitted){
return;
}

answers[current]=index;

renderQuestion();

};


box.appendChild(button);

});


document.getElementById(
"nextButton"
).textContent=
current===questions.length-1
?"Finish"
:"Next";


renderPalette();

}


/* =====================================================
PALETTE
===================================================== */

function renderPalette(){

const palette=
document.getElementById(
"palette"
);

palette.innerHTML="";


questions.forEach(
function(q,index){

const button=
document.createElement(
"button"
);

button.type="button";

button.textContent=
index+1;


if(
answers[index]!==null
){

button.classList.add(
"answered"
);

}


if(marked[index]){

button.classList.add(
"review"
);

}


if(index===current){

button.classList.add(
"current"
);

}


button.onclick=
function(){

if(submitted){
return;
}

current=index;

renderQuestion();

};


palette.appendChild(
button
);

});

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

if(submitted){
return;
}


if(
current<
questions.length-1
){

current++;

renderQuestion();

}
else{

submitTest();

}

}


function previousQuestion(){

if(submitted){
return;
}


if(current>0){

current--;

renderQuestion();

}

}


function clearAnswer(){

if(submitted){
return;
}


answers[current]=null;

renderQuestion();

}


function markReview(){

if(submitted){
return;
}


marked[current]=
!marked[current];

renderPalette();

}
    /* =====================================================
MISTAKE INTELLIGENCE
===================================================== */

function classifyMistake(q,selectedIndex){

const question=
String(q.question||"")
.toLowerCase();

const topic=
String(q.topic||"")
.toLowerCase();

const selected=
selectedIndex===null ||
selectedIndex===undefined
?""
:String(
q.options[selectedIndex]||""
).toLowerCase();

const correct=
String(
q.options[q.answer]||""
).toLowerCase();


/* CALCULATION */

const calculationWords=[

"calculate",
"calculation",
"numerical",
"value of",
"find the",
"velocity",
"acceleration",
"force",
"work",
"energy",
"power",
"current",
"voltage",
"resistance",
"mass",
"momentum"

];


if(
calculationWords.some(
function(word){

return question.includes(word);

})
){

return{

type:"🔢 Calculation Error",

reason:
"Recheck the formula, units and calculation steps."

};

}


/* MEMORY */

const memoryWords=[

"what is",
"which is",
"who",
"symbol",
"unit",
"known as",
"called",
"most abundant",
"organ",
"organelle"

];


if(
memoryWords.some(
function(word){

return question.includes(word);

})
){

return{

type:"📚 Memory / Recall Gap",

reason:
"This is mainly a factual or definition-based question. Revise the key fact and test recall again."

};

}


/* CONCEPT */

const conceptWords=[

"why",
"principle",
"mechanism",
"process",
"function",
"relationship",
"reason",
"concept"

];


if(
conceptWords.some(
function(word){

return question.includes(word);

}) ||
topic.includes("concept")
){

return{

type:"🧠 Concept Gap",

reason:
"Review the underlying concept instead of memorising only the answer."

};

}


/* CONFUSION */

if(
selected &&
correct &&
selected!==correct
){

const selectedWords=
selected.split(/\s+/);

const correctWords=
correct.split(/\s+/);


const overlap=
selectedWords.filter(
function(word){

return(
word.length>3 &&
correctWords.includes(word)
);

}).length;


if(overlap>0){

return{

type:"🧩 Confused Concepts",

reason:
"Your selected answer is related to the correct answer. Review the distinction between the two concepts."

};

}

}


/* DEFAULT */

return{

type:"⚠️ Concept Gap",

reason:
"The answer was incorrect. Review the explanation and retry the question."

};

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
REACTIVATE MISTAKES
===================================================== */

function reactivateMistakes(){

let mastery=[];


try{

mastery=
JSON.parse(
localStorage.getItem(
"cbtMasteryV2"
)||"[]"
);


if(!Array.isArray(mastery)){

mastery=[];

}

}
catch(error){

mastery=[];

}


const wrongQuestions=
new Set();


questions.forEach(
function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

wrongQuestions.add(
normalize(q.question)
);

}

});


mastery=
mastery.filter(
function(item){

if(
!item ||
!item.question
){

return true;

}


return !wrongQuestions.has(
normalize(item.question)
);

});


localStorage.setItem(
"cbtMasteryV2",
JSON.stringify(mastery)
);

}


/* =====================================================
SAVE TEST HISTORY
===================================================== */

function saveHistory(
correct,
incorrect,
skipped,
score
){

let history=[];


try{

history=
JSON.parse(
localStorage.getItem(
"cbtHistory"
)||"[]"
);


if(!Array.isArray(history)){

history=[];

}

}
catch(error){

history=[];

}


const record={

date:
new Date().toLocaleString(),

timestamp:
Date.now(),

score:score,

correct:correct,

incorrect:incorrect,

wrong:incorrect,

skipped:skipped,

total:questions.length,

source:
"PDF / CBT",


questions:
questions.map(
function(q,index){

let status;

if(
answers[index]===null
){

status="skipped";

}
else if(
answers[index]===q.answer
){

status="correct";

}
else{

status="incorrect";

}


let intelligence=null;


if(status==="incorrect"){

intelligence=
classifyMistake(
q,
answers[index]
);

}


return{

id:
q.id ||
(
"history-"+
Date.now()+
"-"+
index
),

question:
q.question,

options:
q.options,

subject:
q.subject||"Imported",

topic:
q.topic||"PDF Import",

status:status,

selectedIndex:
answers[index],

selectedAnswer:
answers[index]===null
?"Not answered"
:q.options[answers[index]],

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

mistakeType:
intelligence
?intelligence.type
:null,

mistakeReason:
intelligence
?intelligence.reason
:null,

mistakeConfidence:
intelligence
?"Auto Classified"
:null,

solution:
q.solution||"",

explanation:
q.explanation||"",

bookmarked:
Boolean(
marked[index]
),

markedForReview:
Boolean(
marked[index]
),

pdfPage:
q.pdfPage||"",

chapter:
q.chapter||"",

section:
q.section||"",

source:
q.source||"PDF Import"

};

})

};


history.push(record);


localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}


/* =====================================================
CREATE RETRY QUEUE
===================================================== */

function createRetryQueue(){

const wrong=[];


questions.forEach(
function(q,index){

if(
answers[index]!==null &&
answers[index]!==q.answer
){

const intelligence=
classifyMistake(
q,
answers[index]
);


wrong.push({

id:
"retry-"+
Date.now()+
"-"+
index,

question:
q.question,

options:
q.options,

subject:
q.subject||"Imported",

topic:
q.topic||"PDF Import",

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

solution:
q.solution||"",

explanation:
q.explanation||"",

selectedIndex:
answers[index],

selectedAnswer:
q.options[answers[index]],

mistakeType:
intelligence.type,

mistakeReason:
intelligence.reason,

mistakeConfidence:
"Auto Classified",

source:
"PDF / CBT",

pdfPage:
q.pdfPage||"",

chapter:
q.chapter||"",

section:
q.section||""

});

}

});


return wrong;

}


/* =====================================================
OPEN RETRY
===================================================== */

function openRetry(){

const wrong=
createRetryQueue();


if(!wrong.length){

alert(
"There are no mistakes to retry."
);

return;

}


/*
Save complete retry queue.
*/

localStorage.setItem(
"cbtAnalyzer.retryQueue",
JSON.stringify(wrong)
);


/*
Save first retry question.
*/

localStorage.setItem(
"cbtRetryQuestion",
JSON.stringify(wrong[0])
);


/*
Save retry timestamp.
*/

localStorage.setItem(
"cbtRetryStartedAt",
String(Date.now())
);


/*
Important:
Tell retry.html exactly where
its questions are coming from.
*/

localStorage.setItem(
"retrySource",
"cbtAnalyzer.retryQueue"
);


window.location.href=
"retry.html";

}


/* =====================================================
RETRY BUTTON
===================================================== */

function updateRetryButton(
incorrect
){

const button=
document.getElementById(
"retryButton"
);


if(incorrect>0){

button.style.display=
"block";


button.textContent=
"🔄 Retry "+
incorrect+
" Mistake"+
(
incorrect===1
?""
:"s"
);

}
else{

button.style.display=
"none";

}

}


/* =====================================================
GENERATE REVIEW
===================================================== */

function generateReview(){

const review=
document.getElementById(
"review"
);


review.innerHTML="";


if(!questions.length){

review.innerHTML=
'<div class="empty">'+
"No questions available for review."+
"</div>";

return;

}


/*
Heading
*/

const heading=
document.createElement("h3");

heading.textContent=
"📝 Detailed Test Review";

review.appendChild(
heading
);


/*
Create one review item
for every question.
*/

questions.forEach(
function(q,index){

const selected=
answers[index];

const item=
document.createElement("div");


let status="skipped";


if(selected!==null){

if(selected===q.answer){

status="correct";

}
else{

status="incorrect";

}

}


item.className=
"review-item "+
status;


const title=
document.createElement("div");


title.innerHTML=
"<b>Q"+
(index+1)+
". "+
escapeHTML(
q.question
)+
"</b>";


item.appendChild(
title
);


/*
STATUS
*/

const statusDiv=
document.createElement("div");

statusDiv.style.marginTop=
"8px";


if(status==="correct"){

statusDiv.className=
"status-correct";

statusDiv.textContent=
"✅ Correct";

}
else if(status==="incorrect"){

statusDiv.className=
"status-incorrect";

statusDiv.textContent=
"❌ Incorrect";

}
else{

statusDiv.className=
"status-skipped";

statusDiv.textContent=
"⏭️ Skipped";

}


item.appendChild(
statusDiv
);


/*
Selected answer
*/

if(selected!==null){

const selectedDiv=
document.createElement("div");

selectedDiv.style.marginTop=
"8px";

selectedDiv.innerHTML=
"<b>Your answer:</b> "+
escapeHTML(
q.options[selected]
);

item.appendChild(
selectedDiv
);

}


/*
Correct answer
*/

const correctDiv=
document.createElement("div");

correctDiv.style.marginTop=
"6px";

correctDiv.innerHTML=
"<b>Correct answer:</b> "+
escapeHTML(
q.options[q.answer]
);

item.appendChild(
correctDiv
);


/*
Solution
*/

if(q.solution){

const solutionDiv=
document.createElement("div");

solutionDiv.className=
"analysis";

solutionDiv.innerHTML=
"<b>💡 Solution</b><br>"+
escapeHTML(
q.solution
);

item.appendChild(
solutionDiv
);

}


/*
Mistake intelligence
*/

if(status==="incorrect"){

const intelligence=
classifyMistake(
q,
selected
);


const analysis=
document.createElement("div");

analysis.className=
"analysis";

analysis.innerHTML=
'<div class="analysis-type">'+
escapeHTML(
intelligence.type
)+
"</div>"+
"<div>"+
escapeHTML(
intelligence.reason
)+
"</div>";

item.appendChild(
analysis
);

}


/*
Retry question button
*/

if(status==="incorrect"){

const retryBtn=
document.createElement("button");

retryBtn.type="button";

retryBtn.className=
"primary";

retryBtn.style.marginTop=
"10px";

retryBtn.textContent=
"🔄 Retry This Question";


retryBtn.onclick=
function(){

const retryQuestion={

id:
"single-retry-"+
Date.now(),

question:
q.question,

options:
q.options,

subject:
q.subject||"Imported",

topic:
q.topic||"PDF Import",

correctIndex:
q.answer,

correctAnswer:
q.options[q.answer],

solution:
q.solution||"",

explanation:
q.explanation||"",

selectedIndex:
selected,

selectedAnswer:
q.options[selected],

mistakeType:
classifyMistake(
q,
selected
).type,

mistakeReason:
classifyMistake(
q,
selected
).reason,

source:
"PDF / CBT"

};


localStorage.setItem(
"cbtAnalyzer.retryQueue",
JSON.stringify(
[retryQuestion]
)
);


localStorage.setItem(
"cbtRetryQuestion",
JSON.stringify(
retryQuestion
)
);


localStorage.setItem(
"retrySource",
"cbtAnalyzer.retryQueue"
);


window.location.href=

};


item.appendChild(

);

}


review.appendChild(

);

});

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value==null
?""
:value
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

    }
    /* =====================================================
SUBMIT TEST
===================================================== */

function submitTest(){

if(submitted){
return;
}


if(!questions.length){

alert(
"No imported questions are available."
);

return;

}


let correct=0;
let incorrect=0;
let skipped=0;


questions.forEach(
function(q,index){

if(
answers[index]===null
){

skipped++;

}
else if(
answers[index]===q.answer
){

correct++;

}
else{

incorrect++;

}

});


/*
NEET-style scoring:
+4 correct
-1 incorrect
0 skipped
*/

const score=
(correct*4)-incorrect;


/*
Save history BEFORE showing result.
*/

reactivateMistakes();


saveHistory(
correct,
incorrect,
skipped,
score
);


submitted=true;


clearInterval(
timerInterval
);


/*
Hide test interface.
*/

document.getElementById(
"testScreen"
).style.display="none";


document.querySelector(
"aside"
).style.display="none";


/*
Show result.
*/

document.getElementById(
"result"
).style.display="block";


document.getElementById(
"score"
).textContent=
score+
" / "+
(questions.length*4);


document.getElementById(
"summary"
).textContent=
"Correct: "+
correct+
" | Incorrect: "+
incorrect+
" | Skipped: "+
skipped;


/*
Retry button appears
when mistakes exist.
*/

updateRetryButton(
incorrect
);


/*
Generate complete review.
*/

generateReview();

}


/* =====================================================
PAGE SAFETY
===================================================== */

window.addEventListener(
"beforeunload",
function(event){

if(
!submitted &&
questions.length>0
){

/*
Do not block navigation,
but save current progress.
*/

try{

localStorage.setItem(
"cbtCurrentAnswers",
JSON.stringify(
answers
)
);

localStorage.setItem(
"cbtCurrentQuestion",
String(
current
)
);

}catch(error){

console.log(
"Progress save skipped."
);

}

}

});


/* =====================================================
START APPLICATION
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

initialize();

});

</script>
