<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .option {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
    }

    .option.selected {
      border: 2px solid #4f46e5;
      font-weight: 700;
    }

    #nextButton {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #nextButton:disabled {
      opacity: .5;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f1f5f9;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>CBT Test</h1>

    <div id="questionArea"></div>

    <button id="nextButton">Next Question</button>

    <div id="result"></div>
  </main>

  <script type="module">
    import {
      createQuestion,
      createTest,
      startAttempt,
      saveAnswer,
      submitAttempt
    } from "./src/core/index.js";

    const questions = [
      createQuestion({
        id: "demo-q1",
        text: "Which planet is known as the Red Planet?",
        options: ["Earth", "Mars", "Jupiter", "Venus"],
        correctAnswer: "Mars",
        subject: "General Science",
        topic: "Solar System"
      }),

      createQuestion({
        id: "demo-q2",
        text: "What is 2 + 2?",
        options: ["3", "4", "5", "6"],
        correctAnswer: "4",
        subject: "Mathematics",
        topic: "Arithmetic"
      })
    ];

    const test = createTest({
      id: "demo-test-1",
      title: "Demo CBT Test",
      subject: "General",
      questions: questions.map(q => q.id)
    });

    let attempt = startAttempt({
      id: "attempt-" + Date.now(),
      testId: test.id
    });

    let currentIndex = 0;
    let selectedAnswer = null;

    const questionArea = document.getElementById("questionArea");
    const nextButton = document.getElementById("nextButton");
    const result = document.getElementById("result");

    function renderQuestion() {
      const question = questions[currentIndex];
      selectedAnswer = null;

      questionArea.innerHTML = `
        <h2>Question ${currentIndex + 1} of ${questions.length}</h2>
        <p>${question.text}</p>
      `;

      question.options.forEach(option => {
        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;

        button.addEventListener("click", () => {
          selectedAnswer = option;

          document.querySelectorAll(".option").forEach(btn => {
            btn.classList.remove("selected");
          });

          button.classList.add("selected");
        });

        questionArea.appendChild(button);
      });

      nextButton.textContent =
        currentIndex === questions.length - 1
          ? "Submit Test"
          : "Next Question";
    }

    nextButton.addEventListener("click", () => {
      if (selectedAnswer === null) {
        alert("Please select an answer.");
        return;
      }

      const question = questions[currentIndex];

      attempt = saveAnswer(
        attempt,
        question.id,
        selectedAnswer
      );

      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
        return;
      }

      const submission = submitAttempt({
        attempt,
        questions
      });

      result.textContent =
        "Test completed!\n\n" +
        "Score: " + submission.score.score + "\n" +
        "Correct: " + submission.score.correct + "\n" +
        "Incorrect: " + submission.score.incorrect + "\n" +
        "Skipped: " + submission.score.skipped + "\n" +
        "Mistakes created: " + submission.mistakes.length;

      nextButton.disabled = true;
    });

    renderQuestion();
  </script>
</body>
</html>
