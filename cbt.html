<script>
    "use strict";

/* ==============================
QUESTIONS FROM PDF
============================== */

let questions = [];

function loadQuestions(){

    const saved =
        localStorage.getItem("pdfCbtQuestions");

    if(!saved){

        return false;

    }

    try{

        const data =
            JSON.parse(saved);

        if(!Array.isArray(data)){
            return false;
        }

        questions =
            data.filter(function(q){

                return q &&
                    q.question &&
                    Array.isArray(q.options) &&
                    q.options.length >= 2 &&
                    Number.isInteger(
                        Number(q.answer)
                    );

            }).map(function(q){

                return {

                    id:
                        q.id ||
                        "pdf-" +
                        Date.now(),

                    subject:
                        q.subject ||
                        "Imported",

                    topic:
                        q.topic ||
                        q.section ||
                        "PDF Import",

                    question:
                        String(q.question),

                    options:
                        q.options.map(
                            String
                        ),

                    answer:
                        Number(q.answer),

                    solution:
                        q.solution ||
                        q.explanation ||
                        "Review this question.",

                    explanation:
                        q.explanation ||
                        "",

                    pdfPage:
                        q.pdfPage ||
                        "",

                    source:
                        q.source ||
                        "PDF Import"

                };

            });

        return questions.length > 0;

    }
    catch(error){

        console.error(error);

        return false;

    }

}


/* ==============================
TEST STATE
============================== */

let current = 0;

let answers = [];

let marked = [];

let submitted = false;

let timeLeft = 1800;

let timerInterval = null;


/* ==============================
INITIALIZE
============================== */

function initialize(){

    answers =
        new Array(
            questions.length
        ).fill(null);

    marked =
        new Array(
            questions.length
        ).fill(false);

    current = 0;

    submitted = false;

    timeLeft = 1800;

}
    /* ==============================
TIMER
============================== */

function updateTimer(){

    const min =
        Math.floor(timeLeft / 60);

    const sec =
        timeLeft % 60;

    document.getElementById(
        "timer"
    ).textContent =
        String(min).padStart(2,"0") +
        ":" +
        String(sec).padStart(2,"0");

}


function startTimer(){

    clearInterval(timerInterval);

    updateTimer();

    timerInterval =
        setInterval(function(){

            if(submitted){

                clearInterval(
                    timerInterval
                );

                return;

            }

            timeLeft--;

            if(timeLeft <= 0){

                timeLeft = 0;

                updateTimer();

                clearInterval(
                    timerInterval
                );

                submitTest();

                return;

            }

            updateTimer();

        },1000);

}


/* ==============================
RENDER QUESTION
============================== */

function renderQuestion(){

    const q =
        questions[current];

    if(!q){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No question available";

        document.getElementById(
            "question"
        ).textContent =
            "No imported questions found.";

        return;

    }

    document.getElementById(
        "questionNumber"
    ).textContent =
        "Question " +
        (current + 1) +
        " of " +
        questions.length;

    document.getElementById(
        "question"
    ).textContent =
        q.question;

    const box =
        document.getElementById(
            "options"
        );

    box.innerHTML = "";

    q.options.forEach(
        function(option,index){

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "option";

            if(
                answers[current] === index
            ){

                button.classList.add(
                    "selected"
                );

            }

            button.textContent =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                option;

            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }

                    answers[current] =
                        index;

                    renderQuestion();

                };

            box.appendChild(button);

        }
    );


    document.getElementById(
        "nextButton"
    ).textContent =
        current === questions.length - 1
        ? "Finish"
        : "Next";

    renderPalette();

}


/* ==============================
PALETTE
============================== */

function renderPalette(){

    const palette =
        document.getElementById(
            "palette"
        );

    palette.innerHTML = "";

    questions.forEach(
        function(q,index){

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                index + 1;

            if(
                answers[index] !== null
            ){

                button.classList.add(
                    "answered"
                );

            }

            if(marked[index]){

                button.classList.add(
                    "review"
                );

            }

            if(index === current){

                button.classList.add(
                    "current"
                );

            }

            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }

                    current = index;

                    renderQuestion();

                };

            palette.appendChild(button);

        }
    );

}


/* ==============================
NEXT
============================== */

function nextQuestion(){

    if(submitted){
        return;
    }

    if(
        current <
        questions.length - 1
    ){

        current++;

        renderQuestion();

    }
    else{

        submitTest();

    }

}


/* ==============================
PREVIOUS
============================== */

function previousQuestion(){

    if(submitted){
        return;
    }

    if(current > 0){

        current--;

        renderQuestion();

    }

}


/* ==============================
CLEAR
============================== */

function clearAnswer(){

    if(submitted){
        return;
    }

    answers[current] = null;

    renderQuestion();

}


/* ==============================
MARK REVIEW
============================== */

function markReview(){

    if(submitted){
        return;
    }

    marked[current] =
        !marked[current];

    renderPalette();

}
    /* ==============================
MISTAKE CLASSIFICATION
============================== */

function classifyMistake(q,selected){

    const text =
        String(q.question || "")
        .toLowerCase();

    const topic =
        String(q.topic || "")
        .toLowerCase();


    if(
        text.includes("calculate") ||
        text.includes("numerical") ||
        text.includes("value of") ||
        text.includes("find the")
    ){

        return {
            type:"🔢 Calculation Error",
            reason:
            "Recheck the formula, units and calculation steps."
        };

    }


    if(
        text.includes("what is") ||
        text.includes("which") ||
        text.includes("symbol") ||
        text.includes("unit") ||
        text.includes("known as")
    ){

        return {
            type:"📚 Memory / Recall Gap",
            reason:
            "Revise the important fact or definition and test recall again."
        };

    }


    if(
        text.includes("why") ||
        text.includes("principle") ||
        text.includes("mechanism") ||
        text.includes("process") ||
        text.includes("function") ||
        topic.includes("concept")
    ){

        return {
            type:"🧠 Concept Gap",
            reason:
            "Review the underlying concept rather than memorising only the answer."
        };

    }


    return {
        type:"⚠️ Concept Gap",
        reason:
        "Review the explanation and retry this question."
    };

}


/* ==============================
CREATE RETRY QUEUE
============================== */

function createRetryQueue(){

    const wrong = [];

    questions.forEach(
        function(q,index){

            const selected =
                answers[index];

            if(
                selected !== null &&
                selected !== q.answer
            ){

                const mistake =
                    classifyMistake(
                        q,
                        selected
                    );

                wrong.push({

                    id:
                    q.id ||
                    "retry-" +
                    Date.now() +
                    "-" +
                    index,

                    question:
                    q.question,

                    options:
                    q.options,

                    subject:
                    q.subject,

                    topic:
                    q.topic,

                    correctIndex:
                    q.answer,

                    correctAnswer:
                    q.options[q.answer],

                    selectedIndex:
                    selected,

                    selectedAnswer:
                    q.options[selected],

                    solution:
                    q.solution || "",

                    mistakeType:
                    mistake.type,

                    mistakeReason:
                    mistake.reason,

                    source:
                    "CBT"

                });

            }

        }
    );

    return wrong;

}


/* ==============================
OPEN RETRY
============================== */

function openRetry(){

    const wrong =
        createRetryQueue();

    if(wrong.length === 0){

        alert(
            "There are no mistakes to retry."
        );

        return;

    }

    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(wrong)
    );

    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(wrong[0])
    );

    window.location.href =
        "retry.html";

}


/* ==============================
RETRY BUTTON
============================== */

function updateRetryButton(incorrect){

    const button =
        document.getElementById("retryButton");

    if(incorrect > 0){

        button.style.display = "block";

        button.textContent =
            "🔄 Retry " +
            incorrect +
            " Mistake" +
            (incorrect === 1 ? "" : "s");

    }else{

        button.style.display = "none";

    }

}

    }

}

/* ==============================
RETRY BUTTON
============================== */

function updateRetryButton(
    incorrect
){

    const button =
        document.getElementById(
            "retryButton"
        );


    if(incorrect > 0){

        button.style.display =

        button.textContent =
            "🔄 Retry " +
            incorrect +
            " Mistake" +

                ? ""

    /* ==============================
SUBMIT TEST
============================== */

function submitTest(){

    if(submitted){
        return;
    }

    if(questions.length === 0){

        alert("No questions available.");
        return;

    }

    let correct = 0;
    let incorrect = 0;
    let skipped = 0;


    questions.forEach(function(q,index){

        if(answers[index] === null){

            skipped++;

        }
        else if(
            answers[index] === q.answer
        ){

            correct++;

        }
        else{

            incorrect++;

        }

    });


    const score =
        (correct * 4) - incorrect;


    submitted = true;

    clearInterval(timerInterval);


    document.getElementById(
        "testScreen"
    ).style.display = "none";


    document.querySelector(
        "aside"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "score"
    ).textContent =
        score +
        " / " +
        (questions.length * 4);


    document.getElementById(
        "summary"
    ).textContent =
        "Correct: " +
        correct +
        " | Incorrect: " +
        incorrect +
        " | Skipped: " +
        skipped;


    updateRetryButton(
        incorrect
    );


    saveTestHistory(
        correct,
        incorrect,
        skipped,
        score
    );


    generateReview();

}

     /* ==============================
GENERATE REVIEW
============================== */

        document.getElementById("review");

    review.innerHTML =

    questions.forEach(function(q,index){

        const selected =
            answers[index];

        const item =
            document.createElement("div");

        item.className =
            "review-item";


        /* CORRECT */

        if(
            selected !== null &&
            selected === q.answer
        ){

            item.classList.add("correct");

            item.innerHTML =
                "<div class='status-correct'>" +
                "✅ Correct" +
                "</div>" +

                (index + 1) +
                ".</b> " +
                escapeHTML(q.question) +
                "</p>" +

                "<p><b>Your answer:</b> " +
                escapeHTML(
                    q.options[selected]
                ) +
                "</p>" +

                "<p><b>Correct answer:</b> " +
                escapeHTML(
                    q.options[q.answer]
                ) +
                "</p>" +

                "<div class='analysis'>" +
                "<b>Solution:</b><br>" +
                escapeHTML(
                    q.solution ||
                    "Correct answer."
                ) +
                "</div>";

        }


        /* INCORRECT */

        else if(selected !== null){

            item.classList.add(
                "incorrect"
            );

            const mistake =
                classifyMistake(
                    q,
                    selected
                );

            item.innerHTML =
                "<div class='status-incorrect'>" +

                "<p><b>Q" +
                (index + 1) +
                ".</b> " +
                escapeHTML(q.question) +
                "</p>" +

                "<p><b>Your answer:</b> " +

                ) +

                "<p><b>Correct answer:</b> " +

                "<p>" +

                    mistake.reason
                ) +

                "<b>Solution:</b><br>" +
                escapeHTML(
                    q.solution ||

                    "Review this question."
                ) +

        }


        /* SKIPPED */

        else{

            item.classList.add(

                ) +

        review.appendChild(item);

}


/* ==============================
ESCAPE HTML
============================== */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
START CBT
============================== */

 function startCBT(){

    if(!detectedQuestions.length){

        try{

            const saved =
                localStorage.getItem(
                    "pdfCbtQuestions"
                );

            if(saved){

                const parsed =
                    JSON.parse(saved);

                if(Array.isArray(parsed)){

                    detectedQuestions =
                        parsed;

                }

            }

        }catch(error){

            console.error(error);

        }

    }


    if(!detectedQuestions.length){

        alert(
            "Please choose and read a PDF first."
        );

        return;

    }


    const usable =
        detectedQuestions.filter(
            function(q){

                return q &&
                    typeof q.question === "string" &&
                    q.question.trim() !== "" &&
                    Array.isArray(q.options) &&
                    q.options.length >= 2 &&
                    Number.isInteger(
                        Number(q.answer)
                    ) &&
                    Number(q.answer) >= 0 &&
                    Number(q.answer) < q.options.length;

            }
        );


    if(!usable.length){

        alert(
            "No verified questions were found."
        );

        return;

    }


    /* IMPORTANT:
       Replace old CBT data with
       the questions just generated.
    */

    localStorage.removeItem(
        "pdfCbtQuestions"
    );


    localStorage.setItem(
        "pdfCbtQuestions",
        JSON.stringify(usable)
    );


    /* Verification */

    console.log(
        "PDF CBT QUESTIONS:",
        usable.length,
        usable[0]
    );


    window.location.href =
        "cbt.html";

 }

    const loaded =
        loadQuestions();


    if(!loaded){

        document.getElementById(
            "questionNumber"
        ).textContent =
            "No PDF questions found";

        document.getElementById(
            "question"
        ).textContent =
            "Please read a PDF first.";

        document.getElementById(
            "options"
        ).innerHTML = "";

        return;

    }


    initialize();

    renderQuestion();

    startTimer();

}


/* ==============================
PAGE LOAD
============================== */

window.addEventListener(
    "load",
    function(){  
        startCBT();

    }
);

</script>
