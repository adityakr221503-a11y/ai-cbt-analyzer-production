<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — CBT Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  padding:16px 20px;
  border-bottom:1px solid #e2e8f0;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{color:#4f46e5}

.timer{
  background:#eef2ff;
  color:#3730a3;
  padding:10px 15px;
  border-radius:10px;
  font-weight:800;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
  color:#64748b;
  font-weight:700;
  margin-bottom:12px;
}

.question{
  font-size:21px;
  line-height:1.5;
  font-weight:800;
  margin-bottom:20px;
}

.option{
  width:100%;
  padding:15px;
  margin:8px 0;
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:11px;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.option.selected{
  border-color:#4f46e5;
  background:#eef2ff;
  font-weight:800;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{background:#4f46e5;color:#fff}
.secondary{background:#e2e8f0;color:#0f172a}
.warning{background:#f59e0b;color:#fff}
.danger{background:#dc2626;color:#fff}

.palette{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:15px;
}

.palette button{
  background:#e2e8f0;
  padding:10px 5px;
}

.palette .answered{background:#bbf7d0}
.palette .review{background:#fde68a}
.palette .current{
  outline:3px solid #4f46e5;
}

.legend{
  margin-top:15px;
  color:#64748b;
  font-size:13px;
  line-height:1.8;
}

#result{display:none}

.score{
  font-size:40px;
  font-weight:800;
  text-align:center;
  margin:20px;
}

.review-item{
  margin-top:15px;
  padding:16px;
  background:#f8fafc;
  border-radius:10px;
}

.correct{border-left:5px solid #16a34a}
.incorrect{border-left:5px solid #dc2626}
.skipped{border-left:5px solid #f59e0b}

.analysis{
  margin-top:10px;
  padding:13px;
  background:#eef2ff;
  border-radius:9px;
  line-height:1.5;
}

.bookmark{
  margin-top:10px;
  background:#fef3c7;
  padding:10px;
  border-radius:8px;
  font-weight:700;
}

.reason-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.reason-button{
  background:#fff;
  border:2px solid #e2e8f0;
  color:#0f172a;
  text-align:left;
  padding:11px;
  border-radius:9px;
}

.reason-button.selected-reason{
  border-color:#4f46e5;
  background:#eef2ff;
  color:#3730a3;
  font-weight:800;
}

.saved-message{
  margin-top:8px;
  color:#15803d;
  font-weight:700;
  font-size:13px;
}

@media(max-width:800px){
  .container{grid-template-columns:1fr}
  .reason-options{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="header">
  <div class="logo">
    CBT Analyzer <span>Pro</span>
  </div>

  <div class="timer" id="timer">30:00</div>
</div>
</header>

<div class="container">

<main class="card">

<section id="testScreen">

<div class="question-number" id="questionNumber">
Question 1 of 10
</div>

<div class="question" id="question">
Loading question...
</div>

<div id="options"></div>

<div class="buttons">

<button class="secondary" onclick="previousQuestion()">
Previous
</button>

<button class="warning" onclick="markReview()">
Mark for Review
</button>

<button class="secondary" onclick="clearAnswer()">
Clear Answer
</button>

<button class="primary" id="nextButton" onclick="nextQuestion()">
Next
</button>

</div>

</section>

<section id="result">

<h2>🎯 Test Completed</h2>

<div class="score" id="score"></div>

<p id="summary"></p>

<div id="review"></div>

<br>

<button class="primary"
onclick="location.href='mistake.html'">
🧠 Open Mistake Bank
</button>

<br><br>

<button class="secondary"
onclick="location.href='index.html'">
🏠 Dashboard
</button>

</section>

</main>

<aside class="card">

<h3>Question Palette</h3>

<div class="palette" id="palette"></div>

<div class="legend">
🟩 Answered<br>
🟨 Marked for review<br>
⬜ Not answered<br>
🟦 Current question
</div>

<button class="danger"
style="width:100%;margin-top:20px"
onclick="submitTest()">
Submit Test
</button>

</aside>

</div>

<script>

/* =====================================================
QUESTIONS
===================================================== */

const questions = [

{
subject:"Physics",
topic:"Basic Physics",
question:"Which planet is known as the Red Planet?",
options:["Earth","Mars","Jupiter","Venus"],
answer:1,
solution:"Mars is known as the Red Planet because iron-bearing minerals on its surface have undergone oxidation, giving the surface a reddish appearance.",
mistakeReason:"Revise basic planetary characteristics.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Basic Mathematics",
question:"What is 2 + 2?",
options:["3","4","5","6"],
answer:1,
solution:"2 + 2 = 4.",
mistakeReason:"Recheck the arithmetic operation.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Environment",
question:"Which gas is most abundant in Earth's atmosphere?",
options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],
answer:2,
solution:"Nitrogen is the most abundant gas in Earth's atmosphere, making up approximately 78% by volume.",
mistakeReason:"Revise atmospheric composition.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is the newton (N).",
mistakeReason:"Differentiate units of force, energy, power and pressure.",
mistakeType:"Misread Question"
},

{
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of aerobic respiration and ATP production.",
mistakeReason:"Revise functions of major cell organelles.",
mistakeType:"Concept Gap"
},

{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol for sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The symbol of sodium is Na, derived from the Latin name natrium.",
mistakeReason:"Revise common element symbols.",
mistakeType:"Concept Gap"
},

{
subject:"Biology",
topic:"Cellular Respiration",
question:"Which process produces ATP in mitochondria?",
options:["Photosynthesis","Cellular respiration","Transcription","Translation"],
answer:1,
solution:"Cellular respiration in mitochondria produces ATP, particularly through oxidative phosphorylation.",
mistakeReason:"Differentiate cellular respiration from transcription and translation.",
mistakeType:"Misread Question"
},

{
subject:"Physics",
topic:"Gravitation",
question:"What is the approximate acceleration due to gravity near Earth's surface?",
options:["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],
answer:1,
solution:"The approximate acceleration due to gravity near Earth's surface is 9.8 m/s².",
mistakeReason:"Revise standard physical constants.",
mistakeType:"Calculation Error"
},

{
subject:"Biology",
topic:"Genetics",
question:"Which molecule carries genetic information?",
options:["Protein","Lipid","DNA","Glucose"],
answer:2,
solution:"DNA stores and transmits hereditary genetic information in most organisms.",
mistakeReason:"Revise the functions of DNA, RNA and proteins.",
mistakeType:"Concept Gap"
},

{
subject:"Physics",
topic:"Electricity",
question:"Which particle has a negative electric charge?",
options:["Proton","Neutron","Electron","Photon"],
answer:2,
solution:"An electron carries a negative elementary electric charge.",
mistakeReason:"Revise the properties of fundamental subatomic particles.",
mistakeType:"Concept Gap"
}

];


/* =====================================================
STATE
===================================================== */

let current = 0;

let answers = new Array(questions.length).fill(null);

let marked = new Array(questions.length).fill(false);

let mistakeReasons = new Array(questions.length).fill(null);

let submitted = false;

let savedHistoryIndex = -1;

let timeLeft = 1800;


/* =====================================================
TIMER
===================================================== */

function updateTimer(){

const minutes = Math.floor(timeLeft / 60);

const seconds = timeLeft % 60;

document.getElementById("timer").textContent =
String(minutes).padStart(2,"0") +
":" +
String(seconds).padStart(2,"0");

}


const timerInterval = setInterval(function(){

if(submitted) return;

timeLeft--;

if(timeLeft <= 0){

timeLeft = 0;

updateTimer();

clearInterval(timerInterval);

submitTest();

return;

}

updateTimer();

},1000);


/* =====================================================
RENDER QUESTION
===================================================== */

function renderQuestion(){

const q = questions[current];

if(!q){

document.getElementById("question").textContent =
"Question unavailable.";

return;

}

document.getElementById("questionNumber").textContent =
"Question " +
(current + 1) +
" of " +
questions.length +
" • " +
q.subject;

document.getElementById("question").textContent =
q.question;


const optionsBox =
document.getElementById("options");

optionsBox.innerHTML = "";


q.options.forEach(function(option,index){

const button =
document.createElement("button");

button.type = "button";

button.className = "option";

button.textContent =
String.fromCharCode(65 + index) +
". " +
option;

if(answers[current] === index){

button.classList.add("selected");

}

button.onclick = function(){

if(submitted) return;

answers[current] = index;

renderQuestion();

};

optionsBox.appendChild(button);

});


document.getElementById("nextButton").textContent =
current === questions.length - 1
? "Finish"
: "Next";

renderPalette();

}


/* =====================================================
PALETTE
===================================================== */

function renderPalette(){

const palette =
document.getElementById("palette");

palette.innerHTML = "";


questions.forEach(function(q,index){

const button =
document.createElement("button");

button.type = "button";

button.textContent = index + 1;


if(answers[index] !== null){

button.classList.add("answered");

}

if(marked[index]){

button.classList.add("review");

}

if(index === current){

button.classList.add("current");

}

button.onclick = function(){

if(submitted) return;

current = index;

renderQuestion();

};

palette.appendChild(button);

});

}


/* =====================================================
NAVIGATION
===================================================== */

function nextQuestion(){

if(current < questions.length - 1){

current++;

renderQuestion();

}else{

submitTest();

}

}


function previousQuestion(){

if(current > 0){

current--;

renderQuestion();

}

}


function clearAnswer(){

answers[current] = null;

renderQuestion();

}


function markReview(){

marked[current] = !marked[current];

renderPalette();

}


/* =====================================================
MISTAKE REASON
===================================================== */

function getReasonExplanation(reason){

const explanations = {

"Concept Gap":
"Student identified a gap in understanding the underlying concept.",

"Calculation Error":
"Student identified an error in calculation or numerical processing.",

"Misread Question":
"Student identified that the question or options were misunderstood.",

"Guessing":
"Student identified that the answer was selected without sufficient reasoning.",

"Time Pressure":
"Student identified that time pressure affected the answer."

};

return explanations[reason] ||
"Student-selected mistake reason.";

}


function selectMistakeReason(index,reason){

mistakeReasons[index] = reason;

updateSavedHistoryReason(index,reason);

generateReview();

}


/* =====================================================
SAVE REASON AFTER TEST
===================================================== */

function updateSavedHistoryReason(index,reason){

if(savedHistoryIndex < 0) return;

try{

let history =
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)) return;

if(
!history[savedHistoryIndex] ||
!Array.isArray(
history[savedHistoryIndex].questions
)
){

return;

}

const record =
history[savedHistoryIndex].questions[index];

if(!record) return;

record.mistakeType = reason;

record.mistakeReason =
getReasonExplanation(reason);

history[savedHistoryIndex].questions[index] =
record;

localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}catch(error){

console.error(error);

}

}


/* =====================================================
SAVE TEST HISTORY
===================================================== */

function saveTest(
correct,
incorrect,
skipped,
score
){

let history = [];

try{

history =
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)){

history = [];

}

}catch(error){

history = [];

}


const questionData =
questions.map(function(q,index){

let status;

if(answers[index] === null){

status = "skipped";

}
else if(answers[index] === q.answer){

status = "correct";

}
else{

status = "wrong";

}


const selectedAnswer =
answers[index] === null
? null
: q.options[answers[index]];


return {

question:q.question,

options:q.options,

subject:q.subject,

topic:q.topic,

status:status,

selectedIndex:answers[index],

selectedAnswer:selectedAnswer,

correctIndex:q.answer,

correctAnswer:q.options[q.answer],

bookmarked:marked[index],

markedForReview:marked[index],

mistakeType:
status === "wrong"
? (
mistakeReasons[index] ||
q.mistakeType ||
"Not Classified"
)
: null,

mistakeReason:
status === "wrong"
? (
mistakeReasons[index]
? getReasonExplanation(mistakeReasons[index])
: q.mistakeReason
)
: "Correct answer.",

solution:q.solution,

mastered:false

};

});


const testRecord = {

id:"test-" + Date.now(),

date:new Date().toLocaleString(),

timestamp:new Date().toISOString(),

score:score,

correct:correct,

incorrect:incorrect,

wrong:incorrect,

skipped:skipped,

total:questions.length,

questions:questionData

};


history.push(testRecord);

savedHistoryIndex = history.length - 1;


localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}


/* =====================================================
SUBMIT
===================================================== */

function submitTest(){

if(submitted) return;


let correct = 0;

let incorrect = 0;

let skipped = 0;


questions.forEach(function(q,index){

if(answers[index] === null){

skipped++;

}
else if(answers[index] === q.answer){

correct++;

}
else{

incorrect++;

}

});


const score =
(correct * 4) - incorrect;


saveTest(
correct,
incorrect,
skipped,
score
);


submitted = true;

clearInterval(timerInterval);


document.getElementById("testScreen").style.display =
"none";

document.querySelector("aside").style.display =
"none";

document.getElementById("result").style.display =
"block";


document.getElementById("score").textContent =
score +
" / " +
(questions.length * 4);


document.getElementById("summary").textContent =
"Correct: " +
correct +
" | Incorrect: " +
incorrect +
" | Skipped: " +
skipped;


generateReview();

}


/* =====================================================
REASON BUTTON
===================================================== */

function reasonButton(
index,
reason,
icon
){

const selected =
mistakeReasons[index] === reason
? " selected-reason"
: "";


return `
<button
type="button"
class="reason-button${selected}"
onclick="selectMistakeReason(${index},'${reason}')">
${icon} ${reason}
</button>
`;

}


/* =====================================================
REVIEW
===================================================== */

function generateReview(){

const box =
document.getElementById("review");

box.innerHTML =
"<h3>📊 Question Analysis</h3>";


questions.forEach(function(q,index){

const item =
document.createElement("div");


let status;

if(answers[index] === null){

status = "skipped";

}
else if(answers[index] === q.answer){

status = "correct";

}
else{

status = "incorrect";

}


item.className =
"review-item " +
status;


const selected =
answers[index] === null
? "Not answered"
: q.options[answers[index]];


item.innerHTML =

"<strong>Question " +
(index + 1) +
" • " +
escapeHTML(q.subject) +
"</strong>" +

"<p>" +
escapeHTML(q.question) +
"</p>" +

"<p><strong>Your answer:</strong> " +
escapeHTML(selected) +
"</p>" +

"<p><strong>Correct answer:</strong> " +
escapeHTML(q.options[q.answer]) +
"</p>";


if(marked[index]){

item.innerHTML +=
'<div class="bookmark">🔖 Bookmarked for review</div>';

}


if(status === "incorrect"){

const selectedReason =
mistakeReasons[index];


item.innerHTML += `

<div class="analysis">

<strong>
❌ Why did you get this wrong?
</strong>

<div class="reason-options">

${reasonButton(index,"Concept Gap","🧠")}

${reasonButton(index,"Calculation Error","🧮")}

${reasonButton(index,"Misread Question","👀")}

${reasonButton(index,"Guessing","🎲")}

${reasonButton(index,"Time Pressure","⏱️")}

</div>

<div style="margin-top:8px;color:#64748b;font-size:13px">

${
selectedReason
? "Selected: " + escapeHTML(selectedReason)
: "Select the reason that best describes your mistake."
}

</div>

${
selectedReason
?
'<div class="saved-message">✓ Saved to your performance history</div>'
:
''
}

<br>

<strong>💡 Solution</strong>

<br><br>

${escapeHTML(q.solution)}

</div>

`;

}


if(status === "skipped"){

item.innerHTML += `

<div class="analysis">

<strong>⏭️ Skipped Question</strong>

<br><br>

<strong>💡 Solution</strong>

<br><br>

${escapeHTML(q.solution)}

</div>

`;

}


if(status === "correct"){

item.innerHTML += `

<div class="analysis">

<strong>✅ Correct</strong>

<br><br>

${escapeHTML(q.solution)}

</div>

`;

}


box.appendChild(item);

});

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

return String(
value === undefined || value === null
? ""
: value
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
START
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

updateTimer();

renderQuestion();

}
);

</script>

</body>
</html>
