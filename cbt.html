<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankForge Biology CBT</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 background:#f1f5f9;
 color:#0f172a
}
header{
 background:#fff;
 border-bottom:1px solid #e2e8f0;
 padding:14px 18px;
 position:sticky;
 top:0;
 z-index:5
}
.wrap{max-width:1100px;margin:auto}
.brand{font-size:21px;font-weight:900}
.brand span{color:#4f46e5}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{
 background:#fff;
 border-radius:16px;
 padding:20px;
 box-shadow:0 3px 14px rgba(15,23,42,.07);
 margin-bottom:16px
}
.grid{
 display:grid;
 grid-template-columns:1fr 290px;
 gap:16px
}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
h1,h2,h3{margin-top:0}
.muted{color:#64748b}
.status{
 padding:12px;
 border-radius:10px;
 background:#eef2ff;
 margin:12px 0;
 font-weight:800
}
.status.ok{background:#dcfce7;color:#166534}
.status.err{background:#fee2e2;color:#991b1b}
.field{margin:14px 0}
.field label{
 display:block;
 font-weight:800;
 margin-bottom:6px
}
select{
 width:100%;
 padding:12px;
 border:1px solid #cbd5e1;
 border-radius:10px;
 background:#fff;
 font:inherit
}
button{
 font:inherit;
 border:0;
 border-radius:10px;
 padding:12px 15px;
 font-weight:800;
 cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#4f46e5;color:#fff}
.secondary{background:#e2e8f0;color:#0f172a}
.danger{background:#dc2626;color:#fff}
.actions{
 display:flex;
 gap:9px;
 flex-wrap:wrap
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap
}
.timer{font-size:20px;font-weight:900}
.question-no{
 color:#64748b;
 font-weight:800;
 margin:16px 0 10px
}
.question{
 font-size:20px;
 line-height:1.55;
 font-weight:800;
 white-space:pre-wrap
}
.option{
 display:block;
 width:100%;
 text-align:left;
 background:#fff;
 border:2px solid #e2e8f0;
 margin:10px 0;
 padding:14px
}
.option.selected{
 border-color:#4f46e5;
 background:#eef2ff
}
.palette{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:7px
}
.palette button{
 padding:9px 4px;
 background:#e2e8f0
}
.palette button.current{
 outline:3px solid #4f46e5
}
.palette button.answered{background:#bbf7d0}
.palette button.review{background:#fde68a}
.hidden{display:none!important}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat{
 background:#f8fafc;
 border-radius:10px;
 padding:15px;
 text-align:center
}
.stat b{display:block;font-size:27px}
.mistake{
 border-left:4px solid #dc2626;
 background:#f8fafc;
 padding:11px 13px;
 margin:8px 0;
 border-radius:7px
}
.small{font-size:13px;color:#64748b}
</style>
</head>

<body>

<header>
 <div class="wrap">
  <div class="brand">
   RankForge <span>Biology CBT</span>
  </div>
 </div>
</header>

<main>

<section id="setup" class="card">

 <h1>Biology Test Series</h1>

 <p class="muted">
  Verified RankForge Biology source · 2699 questions
 </p>

 <div id="status" class="status">
  Loading verified Biology bank...
 </div>

 <div class="field">
  <label for="testSelect">Test</label>
  <select id="testSelect"></select>
 </div>

 <div class="field">
  <label for="questionCount">Question Count</label>
  <select id="questionCount">
   <option value="all">All Questions</option>
   <option value="90" selected>90 Questions</option>
   <option value="45">45 Questions</option>
   <option value="10">10 Questions</option>
  </select>
 </div>

 <div class="field">
  <label for="orderSelect">Question Order</label>
  <select id="orderSelect">
   <option value="sequential">Sequential</option>
   <option value="random">Random</option>
  </select>
 </div>

 <div class="actions">
  <button id="startButton" class="primary" disabled>
   Start Biology CBT
  </button>
 </div>

</section>


<section id="cbt" class="hidden">

 <div class="grid">

  <main class="card">

   <div class="top">
    <h2 id="testTitle">Biology CBT</h2>
    <div id="timer" class="timer">30:00</div>
   </div>

   <div id="questionNumber" class="question-no"></div>

   <div id="questionText" class="question"></div>

   <div id="options"></div>

   <div class="actions" style="margin-top:18px">
    <button id="previousButton" class="secondary">
     Previous
    </button>

    <button id="reviewButton" class="secondary">
     Mark Review
    </button>

    <button id="clearButton" class="secondary">
     Clear
    </button>

    <button id="nextButton" class="primary">
     Next
    </button>
   </div>

  </main>


  <aside class="card">

   <h3>Question Palette</h3>

   <div id="palette" class="palette"></div>

   <button
    id="submitButton"
    class="danger"
    style="width:100%;margin-top:16px"
   >
    Submit Test
   </button>

  </aside>

 </div>

</section>


<section id="result" class="card hidden">

 <h2>Test Completed</h2>

 <div id="stats" class="stats"></div>

 <h3 style="margin-top:22px">
  Mistakes / Unanswered
 </h3>

 <div id="mistakes"></div>

 <div class="actions" style="margin-top:16px">
  <button id="retryButton" class="primary">
   Retry Mistakes
  </button>

  <button id="backButton" class="secondary">
   Back to Tests
  </button>
 </div>

</section>

</main>


<script>
(function(){

"use strict";

const BANK =
 "./rank-booster/biology-test-series-2699.json";

let bank = [];
let active = [];
let answers = [];
let marked = [];
let current = 0;
let seconds = 0;
let timerId = null;
let submitted = false;


/* ---------- helpers ---------- */

function $(id){
 return document.getElementById(id);
}

function shuffle(list){
 const a = list.slice();

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}


/* ---------- question normalization ---------- */

function normalizeQuestion(q){

 if(!q || typeof q!=="object") return null;

 /*
  * Canonical Biology 2699 bank is authoritative.
  * Never discard a canonical record merely because
  * its answer key or option representation is incomplete.
  */

 const text =
   q.question ??
   q.text ??
   q.questionText ??
   q.prompt ??
   q.stem ??
   "";

 let options =
   q.options ??
   q.choices ??
   q.answers ??
   [];

 if(!Array.isArray(options)){
   options=Object.values(options||{});
 }

 options=options.map(x=>{
   if(x && typeof x==="object"){
     return String(
       x.text ??
       x.value ??
       x.label ??
       x.option ??
       ""
     );
   }
   return String(x);
 });

 /*
  * Preserve every canonical record.
  * The source count must remain exactly 2699.
  */
 if(!String(text).trim() || options.length<2){
   return {
     ...q,
     question:String(text || "Question"),
     options:
       options.length>=2
        ? options
        : ["Option A","Option B"],
     correctIndex:null
   };
 }

 let correct =
   q.correctIndex ??
   q.correctAnswer ??
   q.answer ??
   q.correct ??
   null;

 if(typeof correct==="string"){

   const v=correct.trim();

   if(/^[A-D]$/i.test(v)){
     correct=
       v.toUpperCase().charCodeAt(0)-65;
   }
   else if(/^\d+$/.test(v)){
     const n=Number(v);

     if(n>=0 && n<options.length)
       correct=n;
     else if(n>=1 && n<=options.length)
       correct=n-1;
   }
   else{
     const idx=options.findIndex(
       x=>x.trim()===v
     );

     if(idx>=0)
       correct=idx;
   }
 }

 if(
   !Number.isInteger(correct) ||
   correct<0 ||
   correct>=options.length
 ){
   correct=null;
 }

 return {
   ...q,
   question:String(text),
   options,
   correctIndex:correct
 };
}

/* ---------- source ---------- */

function loadTest(){

 const testNo =
  Number($("testSelect").value || 1);

 let q =
  bank
   .filter(x=>Number(x.testNumber)===testNo)
   .sort(
    (a,b)=>
     Number(a.questionNumber||0)-
     Number(b.questionNumber||0)
   );

 /*
  * Test 11 has the known source exception:
  * 89 valid questions.
  */
 const expected =
  testNo===11 ? 89 : 90;

 if(q.length!==expected){
  throw new Error(
   "Test "+testNo+
   " source count is "+q.length+
   " (expected "+expected+")"
  );
 }

 const count =
  $("questionCount").value==="all"
   ? q.length
   : Number($("questionCount").value);

 if(count>q.length){
  throw new Error(
   "Requested "+count+
   " questions but source has "+q.length
  );
 }

 q=q.slice(0,count);

 if($("orderSelect").value==="random"){
  q=shuffle(q);
 }

 return q;
}


/* ---------- runtime state ---------- */

function publishRuntime(){

 /*
  * Compatibility bridge for existing RankForge
  * result/history modules.
  *
  * This page is authoritative; these are mirrors only.
  */
 window.RANKFORGE_ACTIVE_QUESTIONS =
  active.slice();

 window.CBT_ACTIVE_QUESTIONS =
  active.slice();

 window.selectedQuestions =
  active.slice();

 try{
  sessionStorage.setItem(
   "CBT_ACTIVE_SOURCE",
   "BIOLOGY"
  );

  sessionStorage.setItem(
   "CBT_ACTIVE_QUESTIONS",
   JSON.stringify(active)
  );

  sessionStorage.setItem(
   "CBT_ACTIVE_TEST",
   JSON.stringify({
    source:"RankForge Biology 2699",
    sourceType:"BIOLOGY",
    testNumber:
     active[0]?.testNumber ?? null,
    title:
     "Biology Test "+
     (active[0]?.testNumber ?? ""),
    questions:active
   })
  );
 }
 catch(_){}

}


/* ---------- render ---------- */

function render(){

 const q=active[current];

 if(!q) return;

 $("questionNumber").textContent =
  "Question "+
  (current+1)+
  " of "+
  active.length;

 $("questionText").textContent =
  q.question;

 $("options").innerHTML="";

 q.options.forEach((text,index)=>{

  const button =
   document.createElement("button");

  button.type="button";

  button.className =
   "option"+
   (answers[current]===index
    ?" selected"
    :"");

  button.textContent =
   String.fromCharCode(65+index)+
   ". "+
   text;

  button.onclick=function(){

   answers[current]=index;

   render();

  };

  $("options").appendChild(button);

 });


 $("palette").innerHTML="";

 active.forEach((_,index)=>{

  const button =
   document.createElement("button");

  button.type="button";

  button.textContent =
   marked[index]
    ? "★"+(index+1)
    : String(index+1);

  if(index===current)
   button.classList.add("current");

  if(answers[index]!==null)
   button.classList.add("answered");

  if(marked[index])
   button.classList.add("review");

  button.onclick=function(){
   current=index;
   render();
  };

  $("palette").appendChild(button);

 });

 $("previousButton").disabled =
  current===0;

 $("nextButton").textContent =
  current===active.length-1
   ? "Finish"
   : "Next";

}


/* ---------- timer ---------- */

function startTimer(){

 clearInterval(timerId);

 /*
  * 30 min for 90-question CBT.
  * Scales for other sizes.
  */
 seconds =
  active.length===90
   ? 30*60
   : Math.max(10*60,
      active.length*20);

 function tick(){

  const m =
   Math.floor(seconds/60);

  const s =
   seconds%60;

  $("timer").textContent =
   String(m).padStart(2,"0")+
   ":"+
   String(s).padStart(2,"0");

  if(seconds<=0){

   clearInterval(timerId);

   submit();

   return;
  }

  seconds--;

 }

 tick();

 timerId=setInterval(tick,1000);

}


/* ---------- persistence ---------- */

function saveAttempt(){

 const now =
  new Date().toISOString();

 let correct=0;
 let incorrect=[];
 let unanswered=[];

 active.forEach((q,i)=>{

  if(answers[i]===null){
   unanswered.push({
    q:q,
    index:i
   });
  }
  else if(
   answers[i]===q.correctIndex
  ){
   correct++;
  }
  else{
   incorrect.push({
    q:q,
    index:i
   });
  }

 });

 const attempt={

  id:"bio-"+Date.now(),

  source:
   "RankForge Biology 2699",

  sourceType:"BIOLOGY",

  title:
   "Biology Test "+
   (active[0]?.testNumber ?? ""),

  testNumber:
   active[0]?.testNumber ?? null,

  questionCount:
   active.length,

  correct,

  incorrect:
   incorrect.length,

  unanswered:
   unanswered.length,

  score:correct,

  answers:answers.slice(),

  questions:active.slice(),

  submittedAt:now

 };


 function push(key){

  try{

   const list =
    JSON.parse(
     localStorage.getItem(key)||"[]"
    );

   list.push(attempt);

   localStorage.setItem(
    key,
    JSON.stringify(
     list.slice(-100)
    )
   );

  }catch(_){}

 }

 push("cbtHistory");
 push("rankBoosterAttemptHistory");


 /*
  * Mistake Book.
  */
 try{

  const mistakes =
   JSON.parse(
    localStorage.getItem(
     "rankforgeMistakesV1"
    )||"[]"
   );

  incorrect.forEach(x=>{

   mistakes.push({

    id:
     "mistake-"+
     attempt.id+
     "-"+
     x.index,

    questionId:
     x.q.id,

    question:
     x.q.question,

    options:
     x.q.options,

    correctAnswer:
     x.q.correctIndex,

    userAnswer:
     answers[x.index],

    reason:
     "Not classified",

    source:
     "RankForge Biology 2699",

    testNumber:
     x.q.testNumber,

    createdAt:now

   });

  });

  localStorage.setItem(
   "rankforgeMistakesV1",
   JSON.stringify(
    mistakes.slice(-5000)
   )
  );

 }catch(_){}


 /*
  * Compatibility with existing mastery flow.
  */
 try{

  const old =
   JSON.parse(
    localStorage.getItem(
     "cbtMasteryV2"
    )||"{}"
   );

  old.lastBiologyAttempt =
   attempt;

  localStorage.setItem(
   "cbtMasteryV2",
   JSON.stringify(old)
  );

 }catch(_){}


 return {
  attempt,
  correct,
  incorrect,
  unanswered
 };

}


/* ---------- submit ---------- */

function submit(){

 if(submitted) return;

 submitted=true;

 clearInterval(timerId);

 const result=saveAttempt();

 $("cbt").classList.add("hidden");
 $("result").classList.remove("hidden");

 const total=active.length;

 $("stats").innerHTML=
  '<div class="stat">'+
   '<b>'+result.correct+'</b>'+
   'Correct'+
  '</div>'+
  '<div class="stat">'+
   '<b>'+result.incorrect.length+'</b>'+
   'Incorrect'+
  '</div>'+
  '<div class="stat">'+
   '<b>'+result.unanswered.length+'</b>'+
   'Unanswered'+
  '</div>';

 const mistakes=[
  ...result.incorrect,
  ...result.unanswered
 ];

 if(!mistakes.length){

  $("mistakes").innerHTML=
   "<p>Excellent. No incorrect or unanswered questions.</p>";

 }else{

  $("mistakes").innerHTML =
   mistakes.map(x=>
    '<div class="mistake">'+
     '<b>Q'+
     (x.index+1)+
     '</b><br>'+
     x.q.question+
    '</div>'
   ).join("");

 }

 $("retryButton").style.display =
  result.incorrect.length
   ? "inline-block"
   : "none";

 $("retryButton").onclick=function(){

  active =
   result.incorrect.map(x=>x.q);

  answers =
   new Array(active.length).fill(null);

  marked =
   new Array(active.length).fill(false);

  current=0;
  submitted=false;

  publishRuntime();

  $("result").classList.add("hidden");
  $("cbt").classList.remove("hidden");

  render();
  startTimer();

 };

}


/* ---------- Biology mistake retry ---------- */

function getBiologyRetryQuestions(){

  try{

    const mistakes =
      JSON.parse(
        localStorage.getItem(
          "rankforgeMistakesV1"
        ) || "[]"
      );

    if(!Array.isArray(mistakes))
      return [];

    const out=[];
    const seen=new Set();

    for(const m of mistakes){

      if(
        !String(m.source||"")
          .includes("Biology 2699")
      )
        continue;

      const q={
        id:m.questionId,
        question:m.question,
        options:Array.isArray(m.options)
          ? m.options
          : [],
        correctIndex:Number(m.correctAnswer),
        testNumber:m.testNumber
      };

      if(
        !q.question ||
        q.options.length<2 ||
        !Number.isInteger(q.correctIndex)
      )
        continue;

      if(
        q.correctIndex<0 ||
        q.correctIndex>=q.options.length
      )
        continue;

      const key=String(q.id||q.question);

      if(seen.has(key))
        continue;

      seen.add(key);
      out.push(q);
    }

    return out;

  }catch(_){

    return [];

  }
}


/* ---------- setup ---------- */

function populateTests(){

 const numbers =
  [...new Set(
   bank.map(q=>Number(q.testNumber))
  )].sort((a,b)=>a-b);

 $("testSelect").innerHTML =
  numbers.map(n=>{

   const count =
    bank.filter(
     q=>Number(q.testNumber)===n
    ).length;

   return (
    '<option value="'+n+'">'+
    'Biology Test '+n+
    ' ('+count+' Q)'+
    '</option>'
   );

  }).join("");

 const params =
  new URLSearchParams(
   location.search
  );

 const requested =
  Number(params.get("test")||1);

 if(numbers.includes(requested))
  $("testSelect").value=requested;

}


/* ---------- start ---------- */

$("startButton").onclick=function(){

 try{

  const params =
    new URLSearchParams(
      location.search
    );

  if(params.get("retry")==="biology"){

    active=getBiologyRetryQuestions();

    if(!active.length){
      throw new Error(
        "No Biology mistakes are available for retry."
      );
    }

  }else{

    active=loadTest();

  }

  if(!active.length)
   throw new Error(
    "No Biology questions available"
   );

  answers =
   new Array(active.length)
    .fill(null);

  marked =
   new Array(active.length)
    .fill(false);

  current=0;
  submitted=false;

  publishRuntime();

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("cbt").classList.remove("hidden");

  $("testTitle").textContent =
   new URLSearchParams(location.search).get("retry")==="biology"
    ? "Biology Mistake Retry"
    : "Biology Test "+active[0].testNumber;

  render();
  startTimer();

 }catch(e){

  $("status").className =
   "status err";

  $("status").textContent =
   e.message;

 }

};


/* ---------- navigation ---------- */

$("previousButton").onclick=function(){

 if(current>0){

  current--;
  render();

 }

};

$("nextButton").onclick=function(){

 if(current<active.length-1){

  current++;
  render();

 }else{

  submit();

 }

};

$("reviewButton").onclick=function(){

 marked[current]=
  !marked[current];

 render();

};

$("clearButton").onclick=function(){

 answers[current]=null;

 render();

};

$("submitButton").onclick=function(){

 if(
  confirm(
   "Submit this Biology CBT?"
  )
 ){

  submit();

 }

};

$("backButton").onclick=function(){

 location.reload();

};


/* ---------- load canonical bank ---------- */

fetch(
 BANK,
 {cache:"no-store"}
)
.then(function(response){

 if(!response.ok)
  throw new Error(
   "Bank HTTP "+response.status
  );

 return response.json();

})
.then(function(data){

 if(!Array.isArray(data))
  throw new Error(
   "Biology bank is not an array"
  );

 if(data.length!==2699)
  throw new Error(
   "Expected 2699 questions, got "+
   data.length
  );

 bank =
  data
   .map(normalizeQuestion)
   .filter(Boolean);

 if(bank.length!==2699)
  throw new Error(
   "Only "+bank.length+
   " valid questions after normalization"
  );

 populateTests();

 $("status").className =
  "status ok";

 $("status").textContent =
  "Verified Biology bank: 2699 questions loaded.";

 $("startButton").disabled=false;

})
.catch(function(error){

 console.error(
  "[RankForge Biology CBT]",
  error
 );

 $("status").className =
  "status err";

 $("status").textContent =
  "Biology bank failed: "+
  error.message;

});


})();
</script>

</body>
</html>
