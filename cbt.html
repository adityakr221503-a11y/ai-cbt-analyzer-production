<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.timer{
  padding:9px 13px;
  border-radius:10px;
  background:#eef2ff;
  color:#4338ca;
  font-weight:800;
}

.timer.warning{
  background:#fef3c7;
  color:#92400e;
}

.timer.danger{
  background:#fee2e2;
  color:#991b1b;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:16px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.test-title{
  margin:0 0 5px;
}

.question-number{
  color:#64748b;
  font-size:14px;
}

.question{
  font-size:20px;
  font-weight:700;
  line-height:1.6;
  margin:20px 0;
}

.option{
  width:100%;
  display:block;
  padding:14px;
  margin:10px 0;
  border:2px solid #e2e8f0;
  border-radius:12px;
  background:#fff;
  color:#0f172a;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.option:hover{
  border-color:#818cf8;
}

.option.selected{
  border-color:#4f46e5;
  background:#eef2ff;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.action{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#4f46e5;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.action.secondary{
  background:#64748b;
}

.action.submit{
  background:#15803d;
  margin-top:10px;
}

.action:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.palette-title{
  margin-top:0;
}

.palette{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.palette button{
  min-height:42px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#e2e8f0;
  color:#0f172a;
  font-weight:700;
}

.palette button.current{
  outline:3px solid #4f46e5;
}

.palette button.answered{
  background:#c7d2fe;
}

.legend{
  margin-top:15px;
  font-size:12px;
  color:#64748b;
  line-height:1.8;
}

.result{
  margin-top:20px;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.result-box{
  padding:16px;
  border-radius:12px;
  background:#f8fafc;
  text-align:center;
}

.result-value{
  font-size:25px;
  font-weight:800;
}

.result-label{
  color:#64748b;
  font-size:13px;
}

.hidden{
  display:none!important;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .palette-card{
    order:-1;
  }
}

@media(max-width:500px){
  .actions{
    grid-template-columns:1fr;
  }

  .question{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      CBT Analyzer <span>Pro</span>
    </div>

    <div id="timer" class="timer">
      180:00
    </div>

  </div>
</header>

<div class="container">

  <div id="errorBox" class="error hidden"></div>

  <div id="testScreen">

    <div class="layout">

      <main class="card">

        <h1 id="testTitle" class="test-title">
          CBT Test
        </h1>

        <div
          id="questionNumber"
          class="question-number">
        </div>

        <div
          id="question"
          class="question">
        </div>

        <div id="options"></div>

        <div class="actions">

          <button
            id="previousButton"
            class="action secondary">
            Previous
          </button>

          <button
            id="nextButton"
            class="action">
            Next
          </button>

        </div>

        <button
          id="submitButton"
          class="action submit">
          Submit Test
        </button>

      </main>

      <aside class="card palette-card">

        <h3 class="palette-title">
          Question Palette
        </h3>

        <div
          id="palette"
          class="palette">
        </div>

        <div class="legend">
          <div>⬜ Not answered</div>
          <div>🟦 Answered</div>
          <div>🔵 Current</div>
        </div>

      </aside>

    </div>

  </div>

  <section
    id="resultScreen"
    class="card result hidden">

    <h2>🎯 Test Completed</h2>

    <div id="resultSummary"></div>

    <div class="actions">

      <button
        id="historyButton"
        class="action secondary">
        Test History
      </button>

      <button
        id="mistakeButton"
        class="action">
        Mistake Bank
      </button>

    </div>

    <button
      id="retryButton"
      class="action submit">
      Retry Mistakes
    </button>

  </section>

</div>
<script type="module">

"use strict";

import {
  createQuestion,
  createTest,
  startAttempt,
  saveAnswer,
  submitAttempt
} from "./core/index.js";


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

  createQuestion({
    id: "demo-q1",
    text: "Which planet is known as the Red Planet?",
    options: [
      "Earth",
      "Mars",
      "Jupiter",
      "Venus"
    ],
    correctAnswer: "Mars",
    subject: "General Science",
    chapter: "Astronomy",
    topic: "Solar System",
    difficulty: "easy",
    marks: 4,
    negativeMarks: 1,
    explanation:
      "Mars is called the Red Planet because of iron oxide on its surface."
  }),

  createQuestion({
    id: "demo-q2",
    text: "What is 2 + 2?",
    options: [
      "3",
      "4",
      "5",
      "6"
    ],
    correctAnswer: "4",
    subject: "Mathematics",
    chapter: "Arithmetic",
    topic: "Basic Operations",
    difficulty: "easy",
    marks: 4,
    negativeMarks: 1,
    explanation:
      "2 + 2 = 4."
  })

];


/* =====================================================
   TEST
===================================================== */

const test = createTest({

  id: "demo-test-1",

  title: "Demo CBT Test",

  subject: "General",

  exam: "NEET",

  durationMinutes: 180,

  questions:
    questions.map(
      question => question.id
    ),

  totalMarks:
    questions.length * 4,

  negativeMarking: true

});


/* =====================================================
   ATTEMPT
===================================================== */

let attempt = startAttempt({

  id: `attempt-${Date.now()}`,

  testId: test.id

});


/* =====================================================
   STATE
===================================================== */

let currentIndex = 0;

let selectedAnswer = null;

let submitted = false;


/*
  Local answer cache.
  This keeps answers while moving between questions.
*/

const answers = {};


/* =====================================================
   ELEMENTS
===================================================== */

const testTitle =
  document.getElementById("testTitle");

const questionNumber =
  document.getElementById("questionNumber");

const questionElement =
  document.getElementById("question");

const optionsElement =
  document.getElementById("options");

const paletteElement =
  document.getElementById("palette");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const submitButton =
  document.getElementById("submitButton");

const timerElement =
  document.getElementById("timer");

const testScreen =
  document.getElementById("testScreen");

const resultScreen =
  document.getElementById("resultScreen");

const resultSummary =
  document.getElementById("resultSummary");

const errorBox =
  document.getElementById("errorBox");

const historyButton =
  document.getElementById("historyButton");

const mistakeButton =
  document.getElementById("mistakeButton");

const retryButton =
  document.getElementById("retryButton");


/* =====================================================
   TITLE
===================================================== */

testTitle.textContent =
  test.title;


/* =====================================================
   TIMER
===================================================== */

let remainingSeconds =
  Number(test.durationMinutes) * 60;


function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );

  const seconds =
    remainingSeconds % 60;


  timerElement.textContent =
    `${String(minutes).padStart(2, "0")}:` +
    `${String(seconds).padStart(2, "0")}`;


  timerElement.classList.remove(
    "warning",
    "danger"
  );


  if (
    remainingSeconds <= 300
  ) {

    timerElement.classList.add(
      "danger"
    );

  } else if (
    remainingSeconds <= 900
  ) {

    timerElement.classList.add(
      "warning"
    );

  }

}


const timer =
  setInterval(
    function () {

      if (submitted) {

        clearInterval(timer);

        return;

      }


      remainingSeconds--;

      updateTimer();


      if (
        remainingSeconds <= 0
      ) {

        clearInterval(timer);

        finishTest(true);

      }

    },
    1000
  );


updateTimer();


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  errorBox.textContent =
    String(message);

  errorBox.classList.remove(
    "hidden"
  );

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion() {

  const question =
    questions[currentIndex];


  selectedAnswer =
    answers[question.id] ?? null;


  questionNumber.textContent =
    `Question ${currentIndex + 1} of ${questions.length}`;


  questionElement.textContent =
    question.text;


  optionsElement.innerHTML =
    "";


  question.options.forEach(
    function (option) {

      const button =
        document.createElement("button");


      button.type =
        "button";


      button.className =
        "option";


      button.textContent =
        option;


      if (
        selectedAnswer !== null &&
        String(selectedAnswer) ===
        String(option)
      ) {

        button.classList.add(
          "selected"
        );

      }


      button.addEventListener(
        "click",
        function () {

          if (submitted) {

            return;

          }


          selectedAnswer =
            option;


          answers[question.id] =
            option;


          attempt =
            saveAnswer(
              attempt,
              question.id,
              option
            );


          renderQuestion();

        }
      );


      optionsElement.appendChild(
        button
      );

    }
  );


  previousButton.disabled =
    currentIndex === 0;


  nextButton.textContent =
    currentIndex === questions.length - 1
      ? "Finish"
      : "Next";


  renderPalette();

}


/* =====================================================
   QUESTION PALETTE
===================================================== */

function renderPalette() {

  paletteElement.innerHTML =
    "";


  questions.forEach(
    function (question, index) {

      const button =
        document.createElement("button");


      button.type =
        "button";


      button.textContent =
        index + 1;


      if (
        index === currentIndex
      ) {

        button.classList.add(
          "current"
        );

      }


      if (
        answers[question.id] !== undefined
      ) {

        button.classList.add(
          "answered"
        );

      }


      button.addEventListener(
        "click",
        function () {

          if (submitted) {

            return;

          }


          currentIndex =
            index;


          renderQuestion();

        }
      );


      paletteElement.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   PREVIOUS
===================================================== */

previousButton.addEventListener(
  "click",
  function () {

    if (
      currentIndex > 0
    ) {

      currentIndex--;

      renderQuestion();

    }

  }
);


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener(
  "click",
  function () {

    if (
      currentIndex <
      questions.length - 1
    ) {

      currentIndex++;

      renderQuestion();

      return;

    }


    finishTest(false);

  }
);


/* =====================================================
   SUBMIT BUTTON
===================================================== */

submitButton.addEventListener(
  "click",
  function () {

    const unanswered =
      questions.filter(
        question =>
          answers[question.id] === undefined
      ).length;


    let message =
      "Submit test?";


    if (
      unanswered > 0
    ) {

      message +=
        `\n\n${unanswered} question(s) unanswered.`;

    }


    if (
      window.confirm(message)
    ) {

      finishTest(false);

    }

  }
);


/* =====================================================
   FINISH TEST
===================================================== */

function finishTest(
  autoSubmitted = false
) {

  if (submitted) {

    return;

  }


  submitted = true;


  clearInterval(timer);


  let submission;


  try {

    submission =
      submitAttempt({

        attempt,

        questions,

        correctMarks: 4,

        negativeMarks: 1

      });

  } catch (error) {

    submitted = false;

    showError(
      error.message ||
      "Unable to submit test."
    );

    return;

  }


  showResult(
    submission,
    autoSubmitted
  );

}


/* =====================================================
   RESULT
===================================================== */

function showResult(
  submission,
  autoSubmitted
) {

  testScreen.classList.add(
    "hidden"
  );


  resultScreen.classList.remove(
    "hidden"
  );


  const score =
    submission.score;


  resultSummary.innerHTML = `

    ${
      autoSubmitted
        ? `
          <div class="error">
            ⏰ Time limit reached.
            The test was submitted automatically.
          </div>
        `
        : ""
    }

    <div class="result-grid">

      <div class="result-box">
        <div class="result-value">
          ${score.score}
        </div>
        <div class="result-label">
          Score
        </div>
      </div>

      <div class="result-box">
        <div class="result-value">
          ${score.correct}
        </div>
        <div class="result-label">
          Correct
        </div>
      </div>

      <div class="result-box">
        <div class="result-value">
          ${score.incorrect}
        </div>
        <div class="result-label">
          Incorrect
        </div>
      </div>

      <div class="result-box">
        <div class="result-value">
          ${score.skipped}
        </div>
        <div class="result-label">
          Skipped
        </div>
      </div>

      <div class="result-box">
        <div class="result-value">
          ${score.accuracy}%
        </div>
        <div class="result-label">
          Accuracy
        </div>
      </div>

      <div class="result-box">
        <div class="result-value">
          ${submission.mistakes.length}
        </div>
        <div class="result-label">
          New Mistakes
        </div>
      </div>

    </div>

  `;

}
  /* =====================================================
   RESULT NAVIGATION
===================================================== */

historyButton.addEventListener(
  "click",
  function () {
    window.location.href = "history.html";
  }
);


mistakeButton.addEventListener(
  "click",
  function () {
    window.location.href = "mistake.html";
  }
);


retryButton.addEventListener(
  "click",
  function () {
    window.location.href = "retry.html";
  }
);


/* =====================================================
   INITIALIZE CBT
===================================================== */

try {

  if (!Array.isArray(questions) || questions.length === 0) {

    throw new Error(
      "No questions are available for this test."
    );

  }

  renderQuestion();

} catch (error) {

  showError(
    error.message ||
    "Unable to load CBT test."
  );

}


/* =====================================================
   END SCRIPT
===================================================== */

</script>

</body>
</html>
