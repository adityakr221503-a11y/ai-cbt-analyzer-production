<!doctype html>
<html lang="en">
<head>
<script src="./rankforge-core-v1.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankForge Owner AI</title>
<style>
body{margin:0;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:20px}
.card{background:#111a30;border:1px solid #263454;border-radius:18px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:#17223b;border-radius:14px;padding:15px}
.n{font-size:26px;font-weight:900}
.muted{color:#9eabc5}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#4f7cff;color:white;font-weight:800;margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;background:#080d19;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">

<section class="card">
<h1>RankForge Owner AI</h1>
<div class="muted">
Evidence-first Guardian • No fake blame • No unverified fixes
</div>
</section>

<section class="grid">

<div class="stat">
<div class="n" id="state">NOT VERIFIED</div>
<div class="muted">Guardian state</div>
</div>

<div class="stat">
<div class="n" id="t180">—</div>
<div class="muted">Test 180</div>
</div>

<div class="stat">
<div class="n" id="bio">—</div>
<div class="muted">Biology</div>
</div>

<div class="stat">
<div class="n" id="errors">0</div>
<div class="muted">Runtime errors</div>
</div>

</section>

<section class="card">
<h2>Verification</h2>
<button id="scan">VERIFY EVERYTHING</button>
<button id="continuous">CONTINUOUS FULL SCAN</button>
<button id="deep">DEEP DATA-FLOW SCAN</button>
<button id="e2e">E2E CBT FLOW SCAN</button>
<button id="release">RELEASE / DEPLOYMENT SCAN</button>
<button id="investigate">ROOT-CAUSE INVESTIGATION</button>
<button id="mega">MEGA GUARDIAN SCAN</button>
<button id="ultimate">ULTIMATE QUALITY SCAN</button>
<button id="repair">SAFE REPAIR CYCLE</button>
<button id="command">INCIDENT COMMAND CENTER</button>
<button id="bundle">EXPORT INCIDENT BUNDLE</button>
<button id="flow">REAL USER-FLOW SCAN</button>
<button id="oracle">INDEPENDENT ORACLE</button>
<button id="diff">DIFFERENTIAL VERIFICATION</button>
<button id="replay">REPRODUCE FAILURE</button>
<button id="compare">COMPARE REPLAY</button>
<button id="root">ROOT-CAUSE ENGINE</button>
<button id="fix">VERIFIED FIX ENGINE</button>
<button id="localRepair">SAFE LOCAL REPAIR</button>
<button id="export">EXPORT EVIDENCE</button>
</section>

<section class="card">
<h2>Evidence</h2>
<pre id="log">Guardian starting...</pre>
</section>

</div>

<script src="./rankforge-owner-ai.js"></script>

<script>
(async function(){

const g=window.RankForgeOwnerAI;
const $=id=>document.getElementById(id);

function render(r){
  $("state").textContent=r.status||"NOT VERIFIED";

  $("t180").textContent=
    (r.banks?.test180?.actual??"—")+"/180";

  $("bio").textContent=
    (r.banks?.biology?.actual??"—")+"/2700";

  $("errors").textContent=
    g.consoleErrors.length;

  $("log").textContent=
    JSON.stringify(r,null,2);
}

$("scan").onclick=async function(){
  render(await g.continuousScan());
};

$("continuous").onclick=async function(){
  $("log").textContent="Running full evidence scan...";
  render(await g.continuousScan());
};

$("deep").onclick=async function(){
  $("log").textContent="Running deep data-flow verification...";
  render(await g.deepScan());
};

$("e2e").onclick=async function(){
  $("log").textContent="Running E2E CBT contract verification...";
  render(await g.e2eScan());
};

$("release").onclick=async function(){
  $("log").textContent="Running deployment and dependency verification...";
  render(await g.releaseScan());
};

$("investigate").onclick=async function(){
  $("log").textContent="Correlating failures and investigating root causes...";
  render(await g.investigationScan());
};

$("mega").onclick=async function(){
  $("log").textContent="Running complete multi-layer Guardian scan...";
  render(await g.megaScan());
};

$("ultimate").onclick=async function(){
  $("log").textContent="Running ultimate quality/security/mobile scan...";
  render(await g.ultimateScan());
};

$("repair").onclick=async function(){
  $("log").textContent="Building evidence-backed safe repair plan...";
  render(await g.repairCycle());
};

$("command").onclick=async function(){
  $("log").textContent="Running incident command and health-state analysis...";
  render(await g.commandCenterScan());
};

$("bundle").onclick=async function(){
  $("log").textContent="Building immutable-style evidence bundle...";
  render(await g.exportIncidentBundle());
};

$("flow").onclick=async function(){
  $("log").textContent="Running real RankForge CBT user-flow verification...";
  render(await g.realFlowScan());
};

$("oracle").onclick=async function(){
  $("log").textContent="Running independent question-bank oracle...";
  render(await g.independentOracle());
};

$("diff").onclick=async function(){
  $("log").textContent="Running Guardian vs independent differential verification...";
  render(await g.differentialScan());
};

$("replay").onclick=async function(){
  $("log").textContent="Re-running the independent oracle to reproduce failures...";
  render(await g.reproduceFailure());
};

$("compare").onclick=async function(){
  $("log").textContent="Comparing replay snapshots...";
  render(await g.compareReplay());
};

$("root").onclick=async function(){
  $("log").textContent="Correlating evidence and testing root-cause hypotheses...";
  render(await g.rootCauseEngine());
};

$("fix").onclick=async function(){
  $("log").textContent="Running evidence-gated deterministic repair and independent verification...";
  render(await g.verifiedFixEngine());
};

$("localRepair").onclick=function(){
  const r=g.safeRepairLocalRegistration();
  $("log").textContent=
    JSON.stringify(r,null,2);
};

$("export").onclick=function(){
  g.exportEvidence();
};

render(await g.checkPage());

})();
</script>

</body>
</html>
