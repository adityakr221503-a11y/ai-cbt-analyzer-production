<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:inherit;
cursor:pointer;
}

.dashboard{
border:0;
background:#4f46e5;
color:white;
padding:12px 18px;
border-radius:10px;
font-weight:800;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:white;
padding:28px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 10px;
font-size:32px;
}

.hero p{
margin:0;
line-height:1.5;
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.title{
font-size:24px;
font-weight:800;
margin-bottom:18px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.stat{
border:0;
background:#f8fafc;
border-radius:16px;
padding:20px;
text-align:left;
width:100%;
}

.icon{
font-size:30px;
}

.number{
font-size:38px;
font-weight:800;
margin:5px 0;
}

.label{
font-size:17px;
font-weight:600;
color:#64748b;
}

.hint{
color:#4f46e5;
font-size:13px;
font-weight:800;
margin-top:7px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
border:0;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:white;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.item{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.mastered-item{
background:#f0fdf4;
border-color:#bbf7d0;
}

.badge{
display:inline-block;
background:#eef2ff;
color:#3730a3;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin:0 5px 5px 0;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:#fff;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.retry{
width:100%;
border:0;
background:#4f46e5;
color:white;
padding:13px;
border-radius:10px;
font-size:16px;
font-weight:800;
margin-top:13px;
}

.back{
border:0;
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

@media(max-width:600px){
.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.actions{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

.number{
font-size:32px;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
onclick="location.href='index.html'">
Dashboard
</button>

</div>
</header>

<div class="container">

<div class="hero">
<h1>🧠 Mistake Bank</h1>

<p>
Turn mistakes into mastery. Retry difficult questions
and review your mastered questions.
</p>
</div>

<div class="card">

<div class="title">
📊 Performance
</div>

<div class="stats">

<button
class="stat"
onclick="showActive()">

<div class="icon">❌</div>

<div
class="number"
id="activeCount">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
View Active →
</div>

</button>

<button
class="stat"
onclick="showMastered()">

<div class="icon">🏆</div>

<div
class="number"
id="masteredCount">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
View Mastered →
</div>

</button>

</div>
</div>

<div class="card">

<div class="actions">

<button
class="action primary"
onclick="openRetry()">

🔄 Retry Active Mistakes

</button>

<button
class="action secondary"
onclick="location.href='cbt.html'">

📝 Start CBT

</button>

</div>

</div>

<div class="card">

<div id="controls"></div>

<h2 id="sectionTitle">
❌ Active Mistakes
</h2>

<div id="list"></div>

</div>

</div>

<script>

/* =====================================================
EXACT STORAGE FROM retry.html
===================================================== */

const HISTORY_KEY="cbtHistory";
const MASTERY_KEY="cbtMasteryV2";
const RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";
const RETRY_QUESTION_KEY="cbtRetryQuestion";


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
READ HISTORY
===================================================== */

function getHistory(){

try{

const data=JSON.parse(
localStorage.getItem(HISTORY_KEY)||"[]"
);

return Array.isArray(data)?data:[];

}catch(e){

return[];

}

}


/* =====================================================
READ MASTERY
===================================================== */

function getMastery(){

try{

const data=JSON.parse(
localStorage.getItem(MASTERY_KEY)||"[]"
);

return Array.isArray(data)?data:[];

}catch(e){

return[];

}

}


/* =====================================================
ACTIVE MISTAKES
===================================================== */

function getActive(){

const history=getHistory();

const mastered=new Set(
getMastery().map(function(q){
return normalize(q.question);
})
);

const map=new Map();

history.forEach(function(test){

if(!test||!Array.isArray(test.questions))
return;

test.questions.forEach(function(q){

if(
!q||
!q.question||
q.status!=="wrong"
)
return;

const key=normalize(q.question);

if(mastered.has(key))
return;

map.set(key,q);

});

});

return Array.from(map.values());

}


/* =====================================================
ESCAPE
===================================================== */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
COUNTS
===================================================== */

function updateCounts(){

document.getElementById("activeCount").textContent=
getActive().length;

document.getElementById("masteredCount").textContent=
getMastery().length;

}


/* =====================================================
SHOW ACTIVE
===================================================== */

function showActive(){

document.getElementById("sectionTitle").textContent=
"❌ Active Mistakes";

document.getElementById("controls").innerHTML="";

const list=document.getElementById("list");

list.innerHTML="";

const mistakes=getActive();

if(!mistakes.length){

list.innerHTML=`
<div class="empty">
<div style="font-size:55px">🎉</div>
<h2>No Active Mistakes</h2>
<p>You have no unresolved mistakes.</p>
</div>
`;

return;

}

mistakes.forEach(function(q,index){

const answer=
q.correctAnswer||
(
Array.isArray(q.options)
?q.options[Number(q.correctIndex)]
:""
);

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${esc(q.subject||"Unknown")}
</span>

<span class="badge">
${esc(q.topic||"Unknown")}
</span>

<div class="question">
${esc(q.question)}
</div>

<div class="info">

<strong>Your answer:</strong>
<br>
${esc(q.selectedAnswer||"Not answered")}

<br><br>

<strong>Correct answer:</strong>
<br>

<span class="correct">
${esc(answer)}
</span>

</div>

<button
class="retry"
onclick="retryOne(${index})">

🔄 Retry This Question

</button>

`;

list.appendChild(div);

});

}


/* =====================================================
SHOW MASTERED
===================================================== */

function showMastered(){

document.getElementById("sectionTitle").textContent=
"🏆 Mastered Questions";

document.getElementById("controls").innerHTML=`

<button
class="back"
onclick="showActive()">

← Active Mistakes

</button>

`;

const list=document.getElementById("list");

list.innerHTML="";

/*
READ DIRECTLY FROM cbtMasteryV2
*/

const mastered=getMastery();

document.getElementById("masteredCount").textContent=
mastered.length;

if(!mastered.length){

list.innerHTML=`
<div class="empty">

<div style="font-size:55px">
🔎
</div>

<h2>No Mastered Questions Found</h2>

<p>
The storage key <strong>cbtMasteryV2</strong>
currently contains no readable questions.
</p>

</div>
`;

return;

}


/*
DISPLAY EVERY MASTERED QUESTION
*/

mastered.forEach(function(q,index){

const answer=
q.correctAnswer||
(
Array.isArray(q.options)
?q.options[Number(q.correctIndex)]
:""
);

const div=document.createElement("div");

div.className="item mastered-item";

div.innerHTML=`

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${esc(q.subject||"Unknown")}
</span>

<span class="badge">
${esc(q.topic||"Unknown")}
</span>

<div class="question">
${esc(q.question)}
</div>

<div class="info">

<strong class="correct">
✅ Correct Answer
</strong>

<br><br>

${esc(answer)}

${
q.solution
?
`
<br><br>

<strong>💡 Solution</strong>

<br><br>

${esc(q.solution)}
`
:""
}

</div>

`;

list.appendChild(div);

});

}


/* =====================================================
RETRY ALL
===================================================== */

function openRetry(){

const mistakes=getActive();

if(!mistakes.length){

alert("No active mistakes available.");

return;

}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(mistakes)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(mistakes[0])
);

location.href="retry.html";

}


/* =====================================================
RETRY ONE
===================================================== */

function retryOne(index){

const mistakes=getActive();

if(!mistakes[index])
return;

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(mistakes)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(mistakes[index])
);

location.href="retry.html";

}


/* =====================================================
START
===================================================== */

updateCounts();

showActive();

</script>

</body>
</html>
