<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.header{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{color:#4f46e5}

.dashboard{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:12px 18px;
  border-radius:11px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.hero{
  background:#4f46e5;
  color:#fff;
  padding:28px;
  border-radius:20px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 10px;
  font-size:34px;
}

.hero p{
  margin:0;
  font-size:17px;
  line-height:1.5;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.title{
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.stat{
  display:block;
  width:100%;
  border:0;
  background:#f8fafc;
  border-radius:16px;
  padding:22px;
  text-align:left;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.stat:active{
  transform:scale(.98);
}

.icon{
  font-size:30px;
}

.number{
  font-size:38px;
  font-weight:800;
  margin:5px 0;
}

.label{
  font-size:17px;
  color:#64748b;
  font-weight:600;
}

.hint{
  margin-top:7px;
  color:#4f46e5;
  font-size:13px;
  font-weight:800;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action{
  border:0;
  padding:14px;
  border-radius:11px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#4f46e5;
  color:#fff;
}

.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

.mistake{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:17px;
  margin-top:14px;
}

.badge{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
  margin-right:5px;
}

.question{
  font-size:18px;
  font-weight:800;
  line-height:1.5;
  margin-top:12px;
}

.answer{
  background:#f8fafc;
  padding:13px;
  border-radius:10px;
  margin-top:12px;
  line-height:1.6;
}

.wrong{
  color:#dc2626;
  font-weight:800;
}

.correct{
  color:#16a34a;
  font-weight:800;
}

.retry{
  width:100%;
  margin-top:13px;
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:13px;
  border-radius:10px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#64748b;
}

.empty-icon{
  font-size:55px;
}

.mastered-box{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:14px;
  padding:15px;
  margin-top:14px;
}

.mastered-box .question{
  margin-top:10px;
}

.solution{
  margin-top:12px;
  padding:12px;
  background:#fff;
  border-radius:10px;
  line-height:1.6;
}

@media(max-width:600px){

  .container{margin:15px auto}

  .hero{padding:22px}

  .hero h1{font-size:30px}

  .card{padding:17px}

  .stats{gap:10px}

  .stat{padding:16px}

  .number{font-size:32px}

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
type="button"
onclick="location.href='index.html'">
Dashboard
</button>

</div>
</header>


<div class="container">

<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Every wrong CBT answer becomes a learning opportunity.
Review it, retry it, and convert it into mastery.
</p>

</div>


<div class="card">

<div class="title">
📊 Mistake Overview
</div>

<div class="stats">

<!-- ACTIVE MISTAKES -->

<button
type="button"
class="stat"
onclick="openRetry()">

<div class="icon">❌</div>

<div
id="activeCount"
class="number">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to Retry →
</div>

</button>


<!-- MASTERED -->

<button
type="button"
class="stat"
onclick="showMastered()">

<div class="icon">🏆</div>

<div
id="masteredCount"
class="number">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
View Mastered →
</div>

</button>

</div>
</div>


<div class="card">

<div class="actions">

<button
type="button"
class="action primary"
onclick="openRetry()">

🔄 Retry Active Mistakes

</button>

<button
type="button"
class="action secondary"
onclick="location.href='cbt.html'">

📝 Start CBT

</button>

</div>
</div>


<div class="card">

<h2 id="listTitle">
❌ Active Mistakes
</h2>

<div id="mistakeList"></div>

<div
id="empty"
class="empty"
style="display:none">

<div class="empty-icon">🏆</div>

<h2>No Active Mistakes</h2>

<p>
Complete a CBT test and answer at least one
question incorrectly.
</p>

</div>

</div>

</div>


<script>

const HISTORY_KEY="cbtHistory";
const MISTAKES_KEY="cbtAnalyzer.mistakes";
const MASTERY_KEY="cbtAnalyzer.mastery";
const LEGACY_MASTERY_KEY="cbtMasteryV2";
const RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";
const RETRY_QUESTION_KEY="cbtRetryQuestion";


function read(key,fallback){

try{
const raw=localStorage.getItem(key);

if(!raw)return fallback;

return JSON.parse(raw);

}catch(e){
return fallback;
}

}


function write(key,value){
localStorage.setItem(key,JSON.stringify(value));
}


function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =========================
MASTERED QUESTIONS
========================= */

function getMasteredQuestions(){

const map=new Map();

[
MASTERY_KEY,
LEGACY_MASTERY_KEY
].forEach(function(key){

const data=read(key,[]);

if(!Array.isArray(data))return;

data.forEach(function(item){

if(!item || !item.question)return;

const keyQuestion=normalize(item.question);

if(!map.has(keyQuestion)){
map.set(keyQuestion,item);
}

});

});

return Array.from(map.values());

}


function masteredSet(){

return new Set(
getMasteredQuestions().map(function(item){
return normalize(item.question);
})
);

}


/* =========================
ACTIVE MISTAKES
========================= */

function getMistakes(){

const mastered=masteredSet();

const map=new Map();


const mistakes=read(MISTAKES_KEY,[]);

if(Array.isArray(mistakes)){

mistakes.forEach(function(q){

if(!q || !q.question)return;

const key=normalize(q.question);

if(!mastered.has(key)){
map.set(key,q);
}

});

}


const history=read(HISTORY_KEY,[]);

if(Array.isArray(history)){

history.forEach(function(test){

if(!test || !Array.isArray(test.questions))return;

test.questions.forEach(function(q){

if(
!q ||
!q.question ||
q.status!=="wrong"
)return;

const key=normalize(q.question);

if(mastered.has(key))return;

map.set(key,{
id:q.id||"mistake-"+Date.now(),
question:q.question,
options:Array.isArray(q.options)?q.options:[],
subject:q.subject||"Unknown",
topic:q.topic||"Unknown",
selectedIndex:q.selectedIndex,
selectedAnswer:q.selectedAnswer||"Not answered",
correctIndex:Number(q.correctIndex),
correctAnswer:q.correctAnswer||
(
Array.isArray(q.options)
?q.options[Number(q.correctIndex)]
:""
),
solution:q.solution||"Solution not available."
});

});

});

}

return Array.from(map.values());

}


/* =========================
COUNTS
========================= */

function updateCount(){

document.getElementById("activeCount").textContent=
getMistakes().length;

document.getElementById("masteredCount").textContent=
getMasteredQuestions().length;

}


/* =========================
OPEN RETRY
========================= */

function openRetry(){

const mistakes=getMistakes();

if(mistakes.length===0){

alert(
"No active mistakes found. Complete a CBT test and answer at least one question incorrectly."
);

return;

}

write(RETRY_QUEUE_KEY,mistakes);

write(RETRY_QUESTION_KEY,mistakes[0]);

window.location.assign("retry.html");

}


/* =========================
RETRY ONE
========================= */

function retryOne(index){

const mistakes=getMistakes();

const q=mistakes[index];

if(!q)return;

write(RETRY_QUEUE_KEY,mistakes);

write(RETRY_QUESTION_KEY,q);

window.location.assign("retry.html");

}


/* =========================
ACTIVE LIST
========================= */

function renderActive(){

const mistakes=getMistakes();

const list=document.getElementById("mistakeList");

const empty=document.getElementById("empty");

document.getElementById("listTitle").textContent=
"❌ Active Mistakes";

list.innerHTML="";

if(mistakes.length===0){

empty.style.display="block";
return;

}

empty.style.display="none";


mistakes.forEach(function(q,index){

const div=document.createElement("div");

div.className="mistake";

const answer=
q.correctAnswer||
(
Array.isArray(q.options)
?q.options[q.correctIndex]
:""
);

div.innerHTML=`

<div>

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject)}
</span>

<span class="badge">
${escapeHTML(q.topic)}
</span>

</div>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="answer">

<strong>Your answer:</strong>

<span class="wrong">
${escapeHTML(q.selectedAnswer)}
</span>

<br><br>

<strong>Correct answer:</strong>

<span class="correct">
${escapeHTML(answer)}
</span>

</div>

<button
type="button"
class="retry"
onclick="retryOne(${index})">

🔄 Retry This Question

</button>

`;

list.appendChild(div);

});

}


/* =========================
MASTERED VIEW
========================= */

function showMastered(){

const mastered=getMasteredQuestions();

const list=document.getElementById("mistakeList");

const empty=document.getElementById("empty");

document.getElementById("listTitle").textContent=
"🏆 Mastered Questions";

list.innerHTML="";

empty.style.display="none";


if(mastered.length===0){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
📚
</div>

<h2>No Mastered Questions Yet</h2>

<p>
Answer retry questions correctly to move them here.
</p>

</div>

`;

return;

}


mastered.forEach(function(q,index){

const div=document.createElement("div");

div.className="mastered-box";

const answer=
q.correctAnswer||
(
Array.isArray(q.options)
?q.options[q.correctIndex]
:""
);

div.innerHTML=`

<div>

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

</div>

<div class="question">

${escapeHTML(q.question)}

</div>

<div class="solution">

<strong>✅ Correct Answer:</strong>

<br>

${escapeHTML(answer)}

${
q.solution
?
`
<br><br>
<strong>💡 Solution:</strong>
<br>
${escapeHTML(q.solution)}
`
:""
}

</div>

`;

list.appendChild(div);

});

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
START
========================= */

updateCount();

renderActive();

</script>

</body>
</html>
