<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
padding:25px;
border-radius:18px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
opacity:.9;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:27px;
margin-bottom:5px;
}

.stat small{
color:#64748b;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-top:14px;
}

.question-number{
font-weight:800;
color:#4f46e5;
margin-bottom:10px;
}

.question-text{
font-size:16px;
font-weight:700;
line-height:1.5;
}

.answer{
margin-top:10px;
padding:11px;
border-radius:8px;
background:#f8fafc;
line-height:1.5;
}

.correct{
border-left:4px solid #16a34a;
}

.wrong{
border-left:4px solid #dc2626;
}

.retry{
width:100%;
background:#16a34a;
color:#fff;
font-size:16px;
padding:15px;
border:0;
border-radius:10px;
font-weight:800;
cursor:pointer;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:700;
cursor:pointer;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

.mastered-card{
border:1px solid #bbf7d0;
background:#f0fdf4;
border-radius:14px;
padding:18px;
margin-top:14px;
}

.mastered-title{
font-weight:800;
color:#15803d;
margin-bottom:10px;
}

.mastered-question{
font-weight:700;
line-height:1.5;
}

.mastered-info{
margin-top:10px;
font-size:14px;
color:#475569;
}

@media(max-width:700px){
.stats{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="secondary"
onclick="location.href='analysis.html'">

📊 Dashboard

</button>

</div>
</header>


<div class="container">

<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Turn every mistake into mastery.
</p>

</div>


<!-- SUMMARY -->

<div class="card">

<h2>📊 Mistake Summary</h2>

<div class="stats">

<div class="stat">
<strong id="totalMistakes">0</strong>
<small>Active Mistakes</small>
</div>

<div class="stat">
<strong id="retryCount">0</strong>
<small>Ready to Retry</small>
</div>

<div class="stat">
<strong id="mastered">0</strong>
<small>Mastered</small>
</div>

</div>

<br>

<button
class="retry"
onclick="startRetry()">

🔄 Retry Mistakes

</button>

</div>


<!-- ACTIVE MISTAKES -->

<div class="card">

<h2>❌ Active Mistakes</h2>

<div id="mistakes"></div>

</div>


<!-- MASTERED QUESTIONS -->

<div class="card">

<h2>🏆 Mastered Questions</h2>

<p style="color:#64748b;">
Questions you answered correctly during retry.
</p>

<div id="masteredQuestions"></div>

</div>


</div>


<script>

/* =================================
LOAD DATA
================================= */

let history=[];
let masteredIds=[];


try{

history=
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)){
history=[];
}

}catch(e){

history=[];

}


try{

masteredIds=
JSON.parse(
localStorage.getItem(
"cbtMasteredQuestions"
) || "[]"
);

if(!Array.isArray(masteredIds)){
masteredIds=[];
}

}catch(e){

masteredIds=[];

}


/* =================================
QUESTION ID
================================= */

function getQuestionId(q){

return String(
q.question ||
q.text ||
q.questionText ||
""
)
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =================================
ALL WRONG QUESTIONS
================================= */

function getAllMistakes(){

const result=[];

history.forEach(function(test){

if(!Array.isArray(test.questions)){
return;
}

test.questions.forEach(function(q){

if(q.status==="wrong"){

result.push(q);

}

});

});

return result;

}


/* =================================
ACTIVE MISTAKES
================================= */

function getActiveMistakes(){

return getAllMistakes().filter(
function(q){

const id=
getQuestionId(q);

return !masteredIds.includes(id);

});

}


/* =================================
MASTERED QUESTIONS
================================= */

function getMasteredQuestions(){

const result=[];
const seen=new Set();

getAllMistakes().forEach(function(q){

const id=
getQuestionId(q);

if(
masteredIds.includes(id) &&
!seen.has(id)
){

seen.add(id);
result.push(q);

}

});

return result;

}


/* =================================
ESCAPE
================================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =================================
RENDER ACTIVE
================================= */

function renderActive(){

const active=
getActiveMistakes();

const box=
document.getElementById("mistakes");

box.innerHTML="";

document.getElementById(
"totalMistakes"
).textContent=
active.length;

document.getElementById(
"retryCount"
).textContent=
active.length;


if(active.length===0){

box.innerHTML=
`
<div class="empty">

🎉 <strong>No active mistakes!</strong>

<br><br>

All currently tracked mistakes have been mastered.

</div>
`;

return;

}


active.forEach(function(q,index){

const question=
q.question ||
q.text ||
q.questionText ||
"Question unavailable";

const yourAnswer=
q.selectedAnswer ??
q.userAnswer ??
"Not recorded";

const correctAnswer=
q.correctAnswer ??
q.correctOption ??
q.correct ??
"Not recorded";

const reason=
q.mistakeReason ||
q.reason ||
"Review why the original answer was incorrect.";

const solution=
q.solution ||
q.explanation ||
"No solution recorded.";

const div=
document.createElement("div");

div.className="question";

div.innerHTML=
`
<div class="question-number">
Mistake #${index+1}
</div>

<div class="question-text">
${escapeHTML(question)}
</div>

<div class="answer wrong">
<strong>❌ Your Answer</strong><br>
${escapeHTML(yourAnswer)}
</div>

<div class="answer correct">
<strong>✅ Correct Answer</strong><br>
${escapeHTML(correctAnswer)}
</div>

<div class="answer">
<strong>🧠 Mistake Reason</strong><br>
${escapeHTML(reason)}
</div>

<div class="answer">
<strong>💡 Solution</strong><br>
${escapeHTML(solution)}
</div>
`;

box.appendChild(div);

});

}


/* =================================
RENDER MASTERED
================================= */

function renderMastered(){

const mastered=
getMasteredQuestions();

const box=
document.getElementById(
"masteredQuestions"
);

box.innerHTML="";

document.getElementById(
"mastered"
).textContent=
mastered.length;


if(mastered.length===0){

box.innerHTML=
`
<div class="empty">

🏆 No mastered questions yet.

<br><br>

Retry your active mistakes and answer them correctly.

</div>
`;

return;

}


mastered.forEach(function(q,index){

const question=
q.question ||
q.text ||
q.questionText ||
"Question unavailable";

const correctAnswer=
q.correctAnswer ??
q.correctOption ??
q.correct ??
"Not recorded";

const div=
document.createElement("div");

div.className="mastered-card";

div.innerHTML=
`
<div class="mastered-title">
🏆 Mastered Question #${index+1}
</div>

<div class="mastered-question">
${escapeHTML(question)}
</div>

<div class="answer correct">

<strong>✅ Correct Answer</strong><br>

${escapeHTML(correctAnswer)}

</div>

<div class="mastered-info">

🎯 Status: <strong>Mastered</strong><br>

This question was answered correctly during retry
and has been removed from the active mistake queue.

</div>
`;

box.appendChild(div);

});

}


/* =================================
START RETRY
================================= */

function startRetry(){

const active=
getActiveMistakes();

if(active.length===0){

alert(
"No active mistakes are available for retry."
);

return;

}


const retryQuestions=
active.map(function(q){

return{

...q,

retryQuestionId:
getQuestionId(q)

};

});


localStorage.setItem(
"cbtRetryQuestions",
JSON.stringify(
retryQuestions
)
);

localStorage.setItem(
"cbtRetryMode",
"true"
);

window.location.href=
"retry.html";

}


/* =================================
START
================================= */

renderActive();

renderMastered();

</script>

</body>
</html>
