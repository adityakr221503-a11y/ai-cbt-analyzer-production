<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.logo{
font-size:20px;
font-weight:800
}

.logo span{
color:#4f46e5
}

button{
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:700;
cursor:pointer
}

.primary{
background:#4f46e5;
color:white
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px
}

.hero{
background:#4f46e5;
color:white;
padding:25px;
border-radius:18px;
margin-bottom:20px
}

.hero h1{
margin:0 0 8px
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07)
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.stat{
background:#f8fafc;
padding:17px;
border-radius:12px;
text-align:center
}

.stat strong{
display:block;
font-size:27px;
margin-bottom:5px
}

.stat small{
color:#64748b
}

.filters{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px
}

.filter{
background:#e2e8f0
}

.filter.active{
background:#4f46e5;
color:white
}

.mistake{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-top:14px
}

.mistake h3{
margin:0 0 10px
}

.question{
font-weight:700;
font-size:17px;
line-height:1.5
}

.meta{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:12px 0
}

.badge{
display:inline-block;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
background:#eef2ff;
color:#3730a3
}

.reason{
background:#fff7ed;
border:1px solid #fed7aa;
padding:12px;
border-radius:10px;
margin-top:12px
}

.reason strong{
color:#c2410c
}

.solution{
background:#f0fdf4;
border:1px solid #bbf7d0;
padding:12px;
border-radius:10px;
margin-top:10px;
line-height:1.5
}

.answer{
background:#f8fafc;
padding:10px;
border-radius:9px;
margin-top:10px
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b
}

.retry{
margin-top:14px;
width:100%
}

.mastered{
opacity:.7;
border-left:5px solid #16a34a
}

.active{
border-left:5px solid #dc2626
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
onclick="location.href='index.html'">
Dashboard
</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Review mistakes, understand the reason, and convert mistakes into mastery.
</p>

</div>


<div class="card">

<h2>📊 Mistake Overview</h2>

<div class="stats">

<div class="stat">
<strong id="activeCount">0</strong>
<small>Active Mistakes</small>
</div>

<div class="stat">
<strong id="masteredCount">0</strong>
<small>Mastered</small>
</div>

<div class="stat">
<strong id="conceptCount">0</strong>
<small>Concept Gaps</small>
</div>

<div class="stat">
<strong id="retryCount">0</strong>
<small>Retries</small>
</div>

</div>


<div class="filters">

<button
class="filter active"
id="allFilter"
onclick="setFilter('all')">
All
</button>

<button
class="filter"
id="conceptFilter"
onclick="setFilter('Concept Gap')">
🧠 Concept Gap
</button>

<button
class="filter"
id="calcFilter"
onclick="setFilter('Calculation Error')">
🧮 Calculation Error
</button>

<button
class="filter"
id="misreadFilter"
onclick="setFilter('Misread Question')">
👀 Misread
</button>

<button
class="filter"
id="guessFilter"
onclick="setFilter('Guessing')">
🎲 Guessing
</button>

<button
class="filter"
id="timeFilter"
onclick="setFilter('Time Pressure')">
⏱️ Time Pressure
</button>

</div>

</div>


<div class="card">

<h2>❌ Active Mistakes</h2>

<div id="mistakeList"></div>

</div>


<div class="card">

<h2>🏆 Mastered Questions</h2>

<div id="masteredList"></div>

</div>

</div>


<script>

/* =========================
DATA
========================= */

let history=[];

let retryHistory=[];

let mastered=[];

let activeMistakes=[];

let currentFilter="all";


/* =========================
LOAD
========================= */

function loadData(){

try{

history=
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)){
history=[];
}

}catch(e){

history=[];

}


try{

retryHistory=
JSON.parse(
localStorage.getItem("retryHistory") || "[]"
);

if(!Array.isArray(retryHistory)){
retryHistory=[];
}

}catch(e){

retryHistory=[];

}


try{

mastered=
JSON.parse(
localStorage.getItem("cbtMasteredQuestions") || "[]"
);

if(!Array.isArray(mastered)){
mastered=[];
}

}catch(e){

mastered=[];

}

buildMistakes();

}


/* =========================
NORMALIZE
========================= */

function normalize(text){

return String(text||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =========================
MASTERED TEXTS
========================= */

function getMasteredTexts(){

const result=[];

mastered.forEach(function(item){

if(typeof item==="string"){

result.push(
normalize(item)
);

}
else if(item && typeof item==="object"){

const text=
item.question ||
item.text ||
item.questionText;

if(text){

result.push(
normalize(text)
);

}

}

});

return [
...new Set(
result.filter(Boolean)
)
];

}


/* =========================
BUILD MISTAKES
========================= */

function buildMistakes(){

const masteredTexts=
getMasteredTexts();

const map=
new Map();


history.forEach(function(test){

if(!Array.isArray(test.questions)){
return;
}

test.questions.forEach(function(q){

if(q.status!=="wrong"){
return;
}

const text=
q.question ||
q.text ||
q.questionText;

if(!text){
return;
}

const key=normalize(text);

if(masteredTexts.includes(key)){
return;
}


/*
Keep the newest record of the
same question so the latest
mistake reason is displayed.
*/

map.set(key,{

...q,

question:text,

mistakeType:
q.mistakeType ||
"Not Classified",

mistakeReason:
q.mistakeReason ||
"Student has not selected a mistake reason yet."

});

});

});


activeMistakes=
Array.from(map.values());

render();

}


/* =========================
FILTER
========================= */

function setFilter(filter){

currentFilter=filter;

document.querySelectorAll(
".filter"
).forEach(function(button){

button.classList.remove("active");

});


const ids={
"all":"allFilter",
"Concept Gap":"conceptFilter",
"Calculation Error":"calcFilter",
"Misread Question":"misreadFilter",
"Guessing":"guessFilter",
"Time Pressure":"timeFilter"
};


if(ids[filter]){

document.getElementById(
ids[filter]
).classList.add("active");

}

render();

}


/* =========================
FILTERED
========================= */

function getFilteredMistakes(){

if(currentFilter==="all"){

return activeMistakes;

}

return activeMistakes.filter(
function(item){

return item.mistakeType===currentFilter;

});

}


/* =========================
RENDER
========================= */

function render(){

const filtered=
getFilteredMistakes();

const list=
document.getElementById(
"mistakeList"
);

list.innerHTML="";


const conceptCount=
activeMistakes.filter(
q=>q.mistakeType==="Concept Gap"
).length;

document.getElementById(
"activeCount"
).textContent=
activeMistakes.length;

document.getElementById(
"masteredCount"
).textContent=
getMasteredTexts().length;

document.getElementById(
"conceptCount"
).textContent=
conceptCount;

document.getElementById(
"retryCount"
).textContent=
retryHistory.length;


if(filtered.length===0){

list.innerHTML=`

<div class="empty">

${
currentFilter==="all"
?
"No active mistakes. Complete a CBT to build your Mistake Bank."
:
"No active mistakes in the “"+currentFilter+"” category."
}

</div>

`;

}
else{

filtered.forEach(function(q,index){

const div=
document.createElement("div");

div.className="mistake active";

div.innerHTML=`

<h3>
❌ Question ${index+1}
</h3>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="meta">

<span class="badge">
${escapeHTML(q.subject||"")}
</span>

<span class="badge">
${escapeHTML(q.topic||"")}
</span>

<span class="badge">
${escapeHTML(q.mistakeType||"Not Classified")}
</span>

</div>


<div class="answer">

<strong>
Your answer:
</strong>

${escapeHTML(
q.selectedAnswer || "Not answered"
)}

<br><br>

<strong>
Correct answer:
</strong>

${escapeHTML(
q.correctAnswer || ""
)}

</div>


<div class="reason">

<strong>
🧠 Mistake Reason
</strong>

<br><br>

${escapeHTML(
q.mistakeReason ||
"Student has not selected a mistake reason yet."
)}

</div>


<div class="solution">

<strong>
💡 Solution
</strong>

<br><br>

${escapeHTML(
q.solution || "Solution unavailable."
)}

</div>


<button
class="primary retry"
onclick="alert('Retry system will be connected next.')">

🔄 Retry This Mistake

</button>

`;

list.appendChild(div);

});

}


renderMastered();

}


/* =========================
MASTERED
========================= */

function renderMastered(){

const box=
document.getElementById(
"masteredList"
);

box.innerHTML="";


if(mastered.length===0){

box.innerHTML=`

<div class="empty">
No mastered questions yet.
<br>
Retry your active mistakes to build mastery.
</div>

`;

return;

}


mastered.forEach(function(item,index){

const question=
typeof item==="string"
?
item
:
(
item.question ||
item.text ||
item.questionText ||
""
);


const div=
document.createElement("div");

div.className=
"mistake mastered";


div.innerHTML=`

<h3>
🏆 Mastered #${index+1}
</h3>

<div class="question">
${escapeHTML(question)}
</div>

<div class="meta">

<span class="badge">
Mastered
</span>

</div>

`;

box.appendChild(div);

});

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
START
========================= */

loadData();

</script>

</body>
</html>
