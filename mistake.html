<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Mistake Bank</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:Arial,sans-serif;
cursor:pointer;
touch-action:manipulation;
}

.dashboard{
border:0;
background:#4f46e5;
color:#fff;
padding:12px 18px;
border-radius:11px;
font-weight:800;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
padding:28px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 10px;
font-size:32px;
}

.hero p{
margin:0;
line-height:1.5;
}

.card{
background:#fff;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.title{
font-size:24px;
font-weight:800;
margin-bottom:18px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.stat{
width:100%;
border:0;
background:#f8fafc;
border-radius:16px;
padding:22px;
text-align:left;
}

.stat:active{
transform:scale(.98);
}

.icon{
font-size:30px;
}

.number{
font-size:38px;
font-weight:800;
margin:5px 0;
}

.label{
font-size:17px;
color:#64748b;
font-weight:600;
}

.hint{
margin-top:7px;
color:#4f46e5;
font-size:13px;
font-weight:800;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
border:0;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.back{
border:0;
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
cursor:pointer;
margin-bottom:15px;
}

.item{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.mastered-item{
background:#f0fdf4;
border:1px solid #bbf7d0;
}

.badge{
display:inline-block;
background:#eef2ff;
color:#3730a3;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin:0 5px 5px 0;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:#fff;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.retry{
width:100%;
border:0;
background:#4f46e5;
color:#fff;
padding:13px;
border-radius:10px;
font-size:16px;
font-weight:800;
margin-top:13px;
cursor:pointer;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

.empty-icon{
font-size:55px;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:16px;
}

.number{
font-size:32px;
}

.actions{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
type="button"
onclick="goDashboard()">

Dashboard

</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Turn mistakes into mastery. Retry difficult questions
and review everything you have already mastered.
</p>

</div>


<div class="card">

<div class="title">
📊 Performance
</div>

<div class="stats">

<button
type="button"
class="stat"
onclick="showActive()">

<div class="icon">
❌
</div>

<div
class="number"
id="activeCount">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to View →
</div>

</button>


<button
type="button"
class="stat"
onclick="showMastered()">

<div class="icon">
🏆
</div>

<div
class="number"
id="masteredCount">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
Tap to View →
</div>

</button>

</div>

</div>


<div class="card">

<div class="actions">

<button
class="action primary"
type="button"
onclick="openRetry()">

🔄 Retry Active Mistakes

</button>

<button
class="action secondary"
type="button"
onclick="goCBT()">

📝 Start CBT

</button>

</div>

</div>


<div class="card">

<div id="controls"></div>

<h2 id="sectionTitle">
❌ Active Mistakes
</h2>

<div id="list"></div>

</div>

</div>


<script>

/* =====================================================
STORAGE
===================================================== */

const HISTORY_KEY="cbtHistory";

const MASTERY_KEY="cbtMasteryV2";

const RETRY_QUEUE_KEY=
"cbtAnalyzer.retryQueue";

const RETRY_QUESTION_KEY=
"cbtRetryQuestion";


/* =====================================================
READ STORAGE
===================================================== */

function readJSON(key){

try{

const raw=
localStorage.getItem(key);

if(!raw){
return [];
}

const data=
JSON.parse(raw);

return data;

}catch(error){

console.error(
"Storage error:",
error
);

return [];

}

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value===undefined ||
value===null
?
""
:
value
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
GET MASTERY
===================================================== */

function getMastered(){

const data=
readJSON(
MASTERY_KEY
);

if(
!Array.isArray(data)
){

return [];

}

const map=
new Map();


data.forEach(
function(q){

if(
!q ||
!q.question
){

return;

}

const key=
normalize(q.question);

if(key){

map.set(
key,
q
);

}

});


return Array.from(
map.values()
);

}


/* =====================================================
GET MASTERED SET
===================================================== */

function getMasteredSet(){

return new Set(
getMastered().map(
function(q){

return normalize(
q.question
);

})
);

}


/* =====================================================
GET HISTORY
===================================================== */

function getHistory(){

const data=
readJSON(
HISTORY_KEY
);

return Array.isArray(data)
?
data
:
[];

}


/* =====================================================
GET ACTIVE MISTAKES
===================================================== */

function getActiveMistakes(){

const history=
getHistory();

const mastered=
getMasteredSet();

const map=
new Map();


history.forEach(
function(test){

if(
!test ||
!Array.isArray(
test.questions
)
){

return;

}


test.questions.forEach(
function(q){

if(
!q ||
!q.question
){

return;

}


if(
q.status!=="wrong"
){

return;

}


const key=
normalize(q.question);


if(
mastered.has(key)
){

return;

}


map.set(
key,
q
);

});

});


return Array.from(
map.values()
);

}


/* =====================================================
COUNTS
===================================================== */

function updateCounts(){

document.getElementById(
"activeCount"
).textContent=
getActiveMistakes().length;


document.getElementById(
"masteredCount"
).textContent=
getMastered().length;

}


/* =====================================================
ACTIVE
===================================================== */

function showActive(){

document.getElementById(
"sectionTitle"
).textContent=
"❌ Active Mistakes";


document.getElementById(
"controls"
).innerHTML="";


const list=
document.getElementById(
"list"
);

list.innerHTML="";


const mistakes=
getActiveMistakes();


if(
mistakes.length===0
){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
🎉
</div>

<h2>
No Active Mistakes
</h2>

<p>
You have no unresolved mistakes.
</p>

</div>

`;

return;

}


mistakes.forEach(
function(q,index){

const div=
document.createElement(
"div"
);

div.className="item";


let answer=
q.correctAnswer||"";


if(
!answer &&
Array.isArray(q.options)
){

answer=
q.options[
Number(q.correctIndex)
]||"";

}


div.innerHTML=`

<div>

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${escapeHTML(
q.subject||"Unknown"
)}
</span>

<span class="badge">
${escapeHTML(
q.topic||"Unknown"
)}
</span>

</div>


<div class="question">

${escapeHTML(
q.question
)}

</div>


<div class="info">

<strong>
Your answer:
</strong>

<br>

${escapeHTML(
q.selectedAnswer||
"Not answered"
)}

<br><br>

<strong>
Correct answer:
</strong>

<br>

<span class="correct">

${escapeHTML(answer)}

</span>

</div>


<button
class="retry"
type="button">

🔄 Retry This Question

</button>

`;


div.querySelector(
".retry"
).onclick=
function(){

retryOne(index);

};


list.appendChild(
div
);

});

}


/* =====================================================
MASTERED
===================================================== */

function showMastered(){

document.getElementById(
"sectionTitle"
).textContent=
"🏆 Mastered Questions";


document.getElementById(
"controls"
).innerHTML=`

<button
class="back"
type="button"
onclick="showActive()">

← Active Mistakes

</button>

`;


const list=
document.getElementById(
"list"
);

list.innerHTML="";


/*
READ STORAGE AGAIN.
This is important because
the retry page may have just
created a new mastery record.
*/

const mastered=
getMastered();


document.getElementById(
"masteredCount"
).textContent=
mastered.length;


if(
mastered.length===0
){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
🔎
</div>

<h2>
No Mastered Questions Found
</h2>

<p>
No mastered questions are currently
stored in cbtMasteryV2.
</p>

</div>

`;

return;

}


mastered.forEach(
function(q,index){

const div=
document.createElement(
"div"
);

div.className=
"item mastered-item";


let answer=
q.correctAnswer||"";


if(
!answer &&
Array.isArray(q.options)
){

answer=
q.options[
Number(q.correctIndex)
]||"";

}


if(
!answer &&
q.selectedAnswer
){

answer=
q.selectedAnswer;

}


let solutionHTML="";


if(q.solution){

solutionHTML=`

<br><br>

<strong>
💡 Solution
</strong>

<br><br>

${escapeHTML(
q.solution
)}

`;

}


div.innerHTML=`

<div>

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(
q.subject||"Unknown"
)}
</span>

<span class="badge">
${escapeHTML(
q.topic||"Unknown"
)}
</span>

</div>


<div class="question">

${escapeHTML(
q.question
)}

</div>


<div class="info">

<strong>

<span class="correct">
✅ Correct Answer
</span>

</strong>

<br><br>

${escapeHTML(answer)}

${solutionHTML}

</div>

`;


list.appendChild(
div
);

});

}


/* =====================================================
OPEN RETRY
===================================================== */

function openRetry(){

const mistakes=
getActiveMistakes();


if(
mistakes.length===0
){

alert(
"No active mistakes available."
);

return;

}


localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(
mistakes
)
);


localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(
mistakes[0]
)
);


location.href=
"retry.html";

}


/* =====================================================
RETRY ONE
===================================================== */

function retryOne(index){

const mistakes=
getActiveMistakes();


if(
!mistakes[index]
){

return;

}


localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(
mistakes
)
);


localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(
mistakes[index]
)
);


location.href=
"retry.html";

}


/* =====================================================
NAVIGATION
===================================================== */

function goDashboard(){

location.href=
"index.html";

}


function goCBT(){

location.href=
"cbt.html";

}


/* =====================================================
START
===================================================== */

updateCounts();


/*
If URL contains #mastered,
open Mastered automatically.
Otherwise open Active Mistakes.
*/

if(
location.hash.toLowerCase()==="#mastered"
){

showMastered();

}else{

showActive();

}


/* =====================================================
REFRESH WHEN PAGE RETURNS
===================================================== */

document.addEventListener(
"visibilitychange",
function(){

if(
!document.hidden
){

updateCounts();

if(
location.hash.toLowerCase()==="#mastered"
){

showMastered();

}

}

});


/* =====================================================
BACK/FORWARD HASH
===================================================== */

window.addEventListener(
"hashchange",
function(){

if(
location.hash.toLowerCase()==="#mastered"
){

showMastered();

}else{

showActive();

}

});

</script>

</body>
</html>
