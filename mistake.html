<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{color:#4f46e5}

button{
font-family:Arial,sans-serif;
touch-action:manipulation;
}

.dashboard{
border:0;
background:#4f46e5;
color:white;
padding:12px 18px;
border-radius:11px;
font-weight:800;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:white;
padding:28px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 10px;
font-size:32px;
}

.hero p{
margin:0;
line-height:1.5;
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.title{
font-size:24px;
font-weight:800;
margin-bottom:18px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.stat{
width:100%;
border:0;
background:#f8fafc;
border-radius:16px;
padding:22px;
text-align:left;
cursor:pointer;
}

.stat:active{
transform:scale(.98);
}

.icon{
font-size:30px;
}

.number{
font-size:38px;
font-weight:800;
margin:5px 0;
}

.label{
font-size:17px;
color:#64748b;
font-weight:600;
}

.hint{
margin-top:7px;
color:#4f46e5;
font-size:13px;
font-weight:800;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
border:0;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:white;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.back{
border:0;
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
cursor:pointer;
margin-bottom:15px;
}

.item{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.mastered-item{
background:#f0fdf4;
border:1px solid #bbf7d0;
}

.badge{
display:inline-block;
background:#eef2ff;
color:#3730a3;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin:0 5px 5px 0;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:#fff;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.retry{
width:100%;
border:0;
background:#4f46e5;
color:white;
padding:13px;
border-radius:10px;
font-size:16px;
font-weight:800;
margin-top:13px;
cursor:pointer;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

.empty-icon{
font-size:55px;
}

@media(max-width:600px){

.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:16px;
}

.number{
font-size:32px;
}

.actions{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
id="dashboardBtn">
Dashboard
</button>

</div>
</header>


<div class="container">

<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Turn mistakes into mastery. Retry difficult questions
and review everything you have already mastered.
</p>

</div>


<div class="card">

<div class="title">
📊 Performance
</div>

<div class="stats">

<button
type="button"
class="stat"
id="activeBtn">

<div class="icon">❌</div>

<div
class="number"
id="activeCount">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to Retry →
</div>

</button>


<button
type="button"
class="stat"
id="masteredBtn">

<div class="icon">🏆</div>

<div
class="number"
id="masteredCount">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
View Mastered →
</div>

</button>

</div>

</div>


<div class="card">

<div class="actions">

<button
class="action primary"
id="retryBtn">

🔄 Retry Active Mistakes

</button>

<button
class="action secondary"
id="cbtBtn">

📝 Start CBT

</button>

</div>

</div>


<div class="card">

<div id="controls"></div>

<h2 id="sectionTitle">
❌ Active Mistakes
</h2>

<div id="list"></div>

</div>


</div>


<script>

/* =====================================================
STORAGE KEYS
===================================================== */

const HISTORY_KEY="cbtHistory";

const MISTAKES_KEY="cbtAnalyzer.mistakes";

const MASTERY_KEY="cbtAnalyzer.mastery";

const LEGACY_KEY="cbtMasteryV2";

const RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";

const RETRY_QUESTION_KEY="cbtRetryQuestion";

const RETRY_HISTORY_KEY="cbtAnalyzer.retryHistory";


/* =====================================================
READ STORAGE SAFELY
===================================================== */

function read(key){

try{

const value=
localStorage.getItem(key);

if(!value){
return null;
}

return JSON.parse(value);

}catch(error){

return null;

}

}


/* =====================================================
NORMALIZE
===================================================== */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =====================================================
CONVERT ANY DATA INTO QUESTIONS
===================================================== */

function extractQuestions(data){

const result=[];

if(!data){
return result;
}


/* Array */

if(Array.isArray(data)){

data.forEach(function(item){

if(
item &&
typeof item==="object"
){

if(item.question){

result.push(item);

}

/*
Some storage may contain nested questions.
*/

if(Array.isArray(item.questions)){

item.questions.forEach(function(q){

if(q && q.question){
result.push(q);
}

});

}

}

});

return result;

}


/* Object containing questions */

if(
typeof data==="object"
){

if(data.question){

result.push(data);

}

if(Array.isArray(data.questions)){

data.questions.forEach(function(q){

if(q && q.question){
result.push(q);
}

});

}

}

return result;

}


/* =====================================================
GET ALL MASTERED QUESTIONS
===================================================== */

function getAllMastered(){

const map=new Map();


/*
1. Main mastery storage
*/

[
MASTERY_KEY,
LEGACY_KEY
].forEach(function(storageKey){

const data=
read(storageKey);

const questions=
extractQuestions(data);

questions.forEach(function(q){

const key=
normalize(q.question);

if(key){

map.set(key,q);

}

});

});


/*
2. Retry history
*/

const retryHistory=
read(RETRY_HISTORY_KEY);

const retryQuestions=
extractQuestions(retryHistory);


retryQuestions.forEach(function(q){

/*
Only successful retry attempts become mastery.
*/

if(q.correct===true){

const key=
normalize(q.question);

if(key){

map.set(key,q);

}

}

});


/*
3. CBT history

Some versions store mastery flags
inside the original test history.
*/

const history=
read(HISTORY_KEY);

if(Array.isArray(history)){

history.forEach(function(test){

if(
!test ||
!Array.isArray(test.questions)
){
return;
}

test.questions.forEach(function(q){

if(
q &&
q.question &&
(
q.mastered===true ||
q.masteryStatus==="Mastered"
)
){

const key=
normalize(q.question);

if(key){

map.set(key,q);

}

}

});

});

}


return Array.from(map.values());

}


/* =====================================================
MASTERED SET
===================================================== */

function masteredSet(){

return new Set(

getAllMastered()
.map(function(q){

return normalize(q.question);

})

);

}


/* =====================================================
GET ACTIVE MISTAKES
===================================================== */

function getActiveMistakes(){

const mastered=
masteredSet();

const map=new Map();


/*
Mistake storage
*/

const stored=
read(MISTAKES_KEY);

extractQuestions(stored)
.forEach(function(q){

const key=
normalize(q.question);

if(
key &&
!mastered.has(key)
){

map.set(key,q);

}

});


/*
CBT history
*/

const history=
read(HISTORY_KEY);

if(Array.isArray(history)){

history.forEach(function(test){

if(
!test ||
!Array.isArray(test.questions)
){
return;
}

test.questions.forEach(function(q){

if(
!q ||
!q.question ||
q.status!=="wrong"
){
return;
}

const key=
normalize(q.question);

if(mastered.has(key)){
return;
}

map.set(key,q);

});

});

}


return Array.from(map.values());

}


/* =====================================================
UPDATE COUNTS
===================================================== */

function updateCounts(){

document.getElementById(
"activeCount"
).textContent=
getActiveMistakes().length;


document.getElementById(
"masteredCount"
).textContent=
getAllMastered().length;

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
OPEN RETRY
===================================================== */

function openRetry(){

const mistakes=
getActiveMistakes();

if(mistakes.length===0){

alert(
"No active mistakes available."
);

return;

}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(mistakes)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(mistakes[0])
);

window.location.href=
"retry.html";

}


/* =====================================================
RETRY ONE
===================================================== */

function retryOne(index){

const mistakes=
getActiveMistakes();

if(!mistakes[index]){
return;
}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(mistakes)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(mistakes[index])
);

window.location.href=
"retry.html";

}


/* =====================================================
SHOW ACTIVE
===================================================== */

function showActive(){

document.getElementById(
"sectionTitle"
).textContent=
"❌ Active Mistakes";


document.getElementById(
"controls"
).innerHTML="";


const list=
document.getElementById("list");

list.innerHTML="";


const mistakes=
getActiveMistakes();


if(mistakes.length===0){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">🎉</div>

<h2>No Active Mistakes</h2>

<p>
You have no unresolved mistakes.
</p>

</div>

`;

return;

}


mistakes.forEach(function(q,index){

const div=
document.createElement("div");

div.className="item";


const answer=
q.correctAnswer ||
(
Array.isArray(q.options)
?
q.options[q.correctIndex]
:
""
);


div.innerHTML=`

<div>

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

</div>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="info">

<strong>Your answer:</strong>

<br>

${escapeHTML(q.selectedAnswer||"Not answered")}

<br><br>

<strong>Correct answer:</strong>

<br>

<span class="correct">
${escapeHTML(answer)}
</span>

</div>

<button
class="retry"
data-index="${index}">

🔄 Retry This Question

</button>

`;

div.querySelector(".retry")
.addEventListener(
"click",
function(){

retryOne(index);

}
);

list.appendChild(div);

});

}


/* =====================================================
SHOW MASTERED
===================================================== */

function showMastered(){

document.getElementById(
"sectionTitle"
).textContent=
"🏆 Mastered Questions";


const controls=
document.getElementById(
"controls"
);

controls.innerHTML=`

<button
class="back"
id="backActive">

← Active Mistakes

</button>

`;


document.getElementById(
"backActive"
).addEventListener(
"click",
showActive
);


const list=
document.getElementById("list");

list.innerHTML="";


/*
IMPORTANT:
Read mastery AFTER the click.
This ensures the newest retry
is included.
*/

const mastered=
getAllMastered();


/*
Show the actual number we found.
*/

document.getElementById(
"masteredCount"
).textContent=
mastered.length;


if(mastered.length===0){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
🔎
</div>

<h2>
No Mastered Questions Found
</h2>

<p>
The Mastered card is working, but no mastery
record is currently readable by this page.
</p>

</div>

`;

return;

}


mastered.forEach(function(q,index){

const div=
document.createElement("div");

div.className=
"item mastered-item";


const answer=
q.correctAnswer ||
(
Array.isArray(q.options)
?
q.options[q.correctIndex]
:
q.selectedAnswer ||
""
);


div.innerHTML=`

<div>

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

</div>

<div class="question">

${escapeHTML(q.question)}

</div>

<div class="info">

<strong>
<span class="correct">
✅ Correct Answer
</span>
</strong>

<br><br>

${escapeHTML(answer)}

${
q.solution
?
`

<br><br>

<strong>💡 Solution</strong>

<br><br>

${escapeHTML(q.solution)}

`
:
""
}

</div>

`;


list.appendChild(div);

});

}


/* =====================================================
BUTTONS
===================================================== */

document.getElementById(
"activeBtn"
).addEventListener(
"click",
showActive
);


document.getElementById(
"masteredBtn"
).addEventListener(
"click",
showMastered
);


document.getElementById(
"retryBtn"
).addEventListener(
"click",
openRetry
);


document.getElementById(
"dashboardBtn"
).addEventListener(
"click",
function(){

window.location.href=
"index.html";

}
);


document.getElementById(
"cbtBtn"
).addEventListener(
"click",
function(){

window.location.href=
"cbt.html";

}
);


/* =====================================================
START
===================================================== */

updateCounts();

showActive();

</script>

</body>
</html>
