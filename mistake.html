<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro - Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:white;
padding:16px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
border:0;
cursor:pointer;
font-family:inherit;
}

.dashboard{
background:#4f46e5;
color:white;
padding:12px 17px;
border-radius:10px;
font-weight:800;
}

.container{
max-width:1000px;
margin:20px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:white;
padding:25px;
border-radius:18px;
margin-bottom:18px;
}

.hero h1{
margin:0 0 8px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat{
background:#f8fafc;
padding:20px;
border-radius:14px;
text-align:left;
}

.number{
font-size:35px;
font-weight:800;
margin:5px 0;
}

.label{
color:#64748b;
font-weight:700;
}

.hint{
color:#4f46e5;
font-size:13px;
font-weight:800;
margin-top:8px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
padding:14px;
border-radius:10px;
font-size:15px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:white;
}

.secondary{
background:#e2e8f0;
}

.back{
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
}

.item{
border:1px solid #e2e8f0;
padding:16px;
border-radius:13px;
margin-top:12px;
}

.mastered{
background:#f0fdf4;
border-color:#bbf7d0;
}

.badge{
display:inline-block;
padding:6px 8px;
background:#eef2ff;
color:#3730a3;
border-radius:7px;
font-size:12px;
font-weight:800;
margin:2px;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:#f8fafc;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.retry{
width:100%;
background:#4f46e5;
color:white;
padding:13px;
border-radius:10px;
font-weight:800;
font-size:15px;
margin-top:12px;
}

.empty{
text-align:center;
padding:35px 10px;
color:#64748b;
}

@media(max-width:600px){
.actions{
grid-template-columns:1fr;
}

.card{
padding:16px;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
onclick="goDashboard()">
Dashboard
</button>

</div>
</header>

<div class="container">

<div class="hero">
<h1>🧠 Mistake Bank</h1>
<p>
Turn mistakes into mastery. Retry difficult questions
and review mastered questions.
</p>
</div>

<div class="card">

<h2>📊 Performance</h2>

<div class="stats">

<button
class="stat"
onclick="showActive()">

<div>❌</div>

<div
class="number"
id="activeCount">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to View →
</div>

</button>

<button
class="stat"
onclick="showMastered()">

<div>🏆</div>

<div
class="number"
id="masteredCount">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
Tap to View →
</div>

</button>

</div>
</div>

<div class="card">

<div class="actions">

<button
class="action primary"
onclick="retryAll()">

🔄 Retry Active Mistakes

</button>

<button
class="action secondary"
onclick="goCBT()">

📝 Start CBT

</button>

</div>

</div>

<div class="card">

<div id="controls"></div>

<h2 id="title">
❌ Active Mistakes
</h2>

<div id="list"></div>

</div>

</div>

<script>

var HISTORY_KEY="cbtHistory";
var MASTERY_KEY="cbtMasteryV2";
var RETRY_QUEUE="cbtAnalyzer.retryQueue";
var RETRY_QUESTION="cbtRetryQuestion";


function read(key){

try{
return JSON.parse(
localStorage.getItem(key)||"[]"
);
}catch(e){
return [];
}

}


function norm(x){

return String(x||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


function esc(x){

return String(x==null?"":x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* MASTERED */

function mastered(){

var data=read(MASTERY_KEY);

if(!Array.isArray(data))
return [];

var map={};

data.forEach(function(q){

if(q && q.question){

map[norm(q.question)]=q;

}

});

return Object.keys(map).map(function(k){
return map[k];
});

}


/* ACTIVE */

function active(){

var history=read(HISTORY_KEY);

if(!Array.isArray(history))
return [];

var masteredMap={};

mastered().forEach(function(q){

masteredMap[norm(q.question)]=true;

});

var map={};

history.forEach(function(test){

if(!test ||
!Array.isArray(test.questions))
return;

test.questions.forEach(function(q){

if(!q ||
!q.question ||
q.status!=="wrong")
return;

var key=norm(q.question);

if(masteredMap[key])
return;

map[key]=q;

});

});

return Object.keys(map).map(function(k){
return map[k];
});

}


/* COUNTS */

function counts(){

document.getElementById("activeCount")
.textContent=active().length;

document.getElementById("masteredCount")
.textContent=mastered().length;

}


/* ACTIVE VIEW */

function showActive(){

document.getElementById("title")
.textContent="❌ Active Mistakes";

document.getElementById("controls")
.innerHTML="";

var list=document.getElementById("list");

list.innerHTML="";

var data=active();

if(data.length===0){

list.innerHTML=
'<div class="empty">'+
'<div style="font-size:50px">🎉</div>'+
'<h2>No Active Mistakes</h2>'+
'<p>You have no unresolved mistakes.</p>'+
'</div>';

return;

}

data.forEach(function(q,i){

var answer=q.correctAnswer||"";

if(!answer &&
Array.isArray(q.options)){

answer=
q.options[Number(q.correctIndex)]||"";

}

var div=document.createElement("div");

div.className="item";

div.innerHTML=
'<span class="badge">❌ Mistake '+(i+1)+'</span>'+
'<span class="badge">'+esc(q.subject||"Unknown")+'</span>'+
'<span class="badge">'+esc(q.topic||"Unknown")+'</span>'+

'<div class="question">'+
esc(q.question)+
'</div>'+

'<div class="info">'+
'<b>Your answer:</b><br>'+
esc(q.selectedAnswer||"Not answered")+
'<br><br>'+
'<b>Correct answer:</b><br>'+
'<span class="correct">'+
esc(answer)+
'</span>'+
'</div>'+

'<button class="retry" onclick="retryOne('+i+')">'+
'🔄 Retry This Question'+
'</button>';

list.appendChild(div);

});

}


/* MASTERED VIEW */

function showMastered(){

document.getElementById("title")
.textContent="🏆 Mastered Questions";

document.getElementById("controls")
.innerHTML=
'<button class="back" onclick="showActive()">← Active Mistakes</button>';

var list=document.getElementById("list");

list.innerHTML="";

var data=mastered();

document.getElementById("masteredCount")
.textContent=data.length;

if(data.length===0){

list.innerHTML=
'<div class="empty">'+
'<div style="font-size:50px">🔎</div>'+
'<h2>No Mastered Questions</h2>'+
'<p>No questions are stored in cbtMasteryV2.</p>'+
'</div>';

return;

}

data.forEach(function(q,i){

var answer=q.correctAnswer||"";

if(!answer &&
Array.isArray(q.options)){

answer=
q.options[Number(q.correctIndex)]||"";

}

var solution="";

if(q.solution){

solution=
'<br><br><b>💡 Solution</b><br><br>'+
esc(q.solution);

}

var div=document.createElement("div");

div.className="item mastered";

div.innerHTML=
'<span class="badge">🏆 Mastered '+(i+1)+'</span>'+
'<span class="badge">'+esc(q.subject||"Unknown")+'</span>'+
'<span class="badge">'+esc(q.topic||"Unknown")+'</span>'+

'<div class="question">'+
esc(q.question)+
'</div>'+

'<div class="info">'+
'<span class="correct">✅ Correct Answer</span>'+
'<br><br>'+
esc(answer)+
solution+
'</div>';

list.appendChild(div);

});

}


/* RETRY ALL */

function retryAll(){

var data=active();

if(!data.length){

alert("No active mistakes available.");

return;

}

localStorage.setItem(
RETRY_QUEUE,
JSON.stringify(data)
);

localStorage.setItem(
RETRY_QUESTION,
JSON.stringify(data[0])
);

location.href="retry.html";

}


/* RETRY ONE */

function retryOne(i){

var data=active();

if(!data[i])
return;

localStorage.setItem(
RETRY_QUEUE,
JSON.stringify(data)
);

localStorage.setItem(
RETRY_QUESTION,
JSON.stringify(data[i])
);

location.href="retry.html";

}


/* NAVIGATION */

function goDashboard(){

location.href="index.html";

}


function goCBT(){

location.href="cbt.html";

}


/* START */

counts();

if(
location.hash.toLowerCase()==="#mastered"
){

showMastered();

}else{

showActive();

}

</script>

</body>
</html>
