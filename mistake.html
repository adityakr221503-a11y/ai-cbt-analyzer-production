<script>

"use strict";

/* ================================
STORAGE
================================ */

const HISTORY_KEY="cbtHistory";
const MASTERY_KEY="cbtMasteryV2";
const RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";
const RETRY_QUESTION_KEY="cbtRetryQuestion";


/* ================================
READ JSON
================================ */

function readJSON(key){

try{

const raw=localStorage.getItem(key);

if(!raw)return [];

const data=JSON.parse(raw);

return Array.isArray(data)?data:[];

}catch(error){

console.error("Storage error:",error);

return [];

}

}


/* ================================
ESCAPE
================================ */

function escapeHTML(value){

return String(
value===undefined||value===null
?""
:value
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
NORMALIZE
================================ */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* ================================
MASTERED
================================ */

function getMastered(){

const data=readJSON(MASTERY_KEY);

const map={};

data.forEach(function(item){

if(item&&item.question){

map[normalize(item.question)]=item;

}

});

return Object.values(map);

}


/* ================================
ACTIVE
================================ */
function getActive(){

const mistakes =
readJSON("cbtMistakes");

const mastered =
getMastered();

const masteredSet =
new Set(
mastered.map(function(item){
return normalize(item.question);
})
);

const map = {};

mistakes.forEach(function(q){

if(!q || !q.question){
return;
}

const key =
normalize(q.question);

if(masteredSet.has(key)){
return;
}

map[key] = q;

});

return Object.values(map);

}


/* ================================
CORRECT ANSWER
================================ */

function getCorrectAnswer(q){

if(
q.correctAnswer!==undefined&&
q.correctAnswer!==null&&
String(q.correctAnswer).trim()!==""
){

return q.correctAnswer;

}

if(
Array.isArray(q.options)&&
q.correctIndex!==undefined
){

const i=Number(q.correctIndex);

if(i>=0&&i<q.options.length){
return q.options[i];
}

}

if(
Array.isArray(q.options)&&
q.answerIndex!==undefined
){

const i=Number(q.answerIndex);

if(i>=0&&i<q.options.length){
return q.options[i];
}

}

return "";

}


/* ================================
MISTAKE TYPE
================================ */

function getMistakeType(q){

if(
q.mistakeType &&
String(q.mistakeType).trim() &&
q.mistakeType!=="Not Classified"
){

return q.mistakeType;

}

const question=
normalize(q.question);

const solution=
normalize(q.solution);

if(
question.includes("calculate")||
question.includes("find")||
question.includes("value")||
question.includes("velocity")||
question.includes("force")||
question.includes("energy")
){

return "🧮 Calculation";

}

if(
solution.includes("called")||
solution.includes("known as")||
solution.includes("symbol")||
solution.includes("definition")
){

return "📚 Factual";

}

return "🧠 Conceptual";

}


/* ================================
MISTAKE REASON
================================ */

function getMistakeReason(q){

if(
q.mistakeReason &&
String(q.mistakeReason).trim() &&
q.mistakeReason!=="Review the concept and identify why the answer was incorrect."
){

return q.mistakeReason;

}

const type=getMistakeType(q);

if(type.includes("Calculation")){

return "The selected answer was incorrect. Recheck the formula, values, units and calculation steps.";

}

if(type.includes("Factual")){

return "The required fact or NCERT detail was not recalled correctly. Revise the key fact and test it again.";

}

return "The selected answer indicates a concept gap. Review the underlying concept and compare it with the correct explanation.";

}


/* ================================
PREPARE RETRY
================================ */

function prepareRetryQuestion(q){

if(!q||!q.question){
return null;
}

let options=
Array.isArray(q.options)
?q.options.slice()
:[];

if(
options.length<2&&
Array.isArray(q.choices)
){

options=q.choices.slice();

}

options=options.map(function(option){

if(option&&typeof option==="object"){

return String(
option.text??
option.label??
option.value??
""
);

}

return String(option);

});

let correctIndex=-1;

if(q.correctIndex!==undefined){

const i=Number(q.correctIndex);

if(
Number.isInteger(i)&&
i>=0&&
i<options.length
){

correctIndex=i;

}

}

if(
correctIndex===-1&&
q.answerIndex!==undefined
){

const i=Number(q.answerIndex);

if(
Number.isInteger(i)&&
i>=0&&
i<options.length
){

correctIndex=i;

}

}

if(
correctIndex===-1&&
q.correctAnswer!==undefined
){

const target=normalize(q.correctAnswer);

correctIndex=options.findIndex(function(option){

return normalize(option)===target;

});

}

let correctAnswer=
q.correctAnswer||
"";

if(
!correctAnswer&&
correctIndex>=0
){

correctAnswer=options[correctIndex];

}

return{

id:
q.id||
q.questionId||
("retry-"+Date.now()),

question:String(q.question),

options:options,

subject:
q.subject||
q.subjectName||
q.section||
"Unknown",

topic:
q.topic||
q.chapter||
q.unit||
"Unknown",

correctIndex:correctIndex,

correctAnswer:String(correctAnswer||""),

solution:
q.solution||
q.explanation||
q.reason||
"Solution not available.",

selectedIndex:
q.selectedIndex??
null,

selectedAnswer:
q.selectedAnswer||
"",

mistakeType:getMistakeType(q),

mistakeReason:getMistakeReason(q),

source:"Mistake Bank",

retryStartedAt:Date.now()

};

}


/* ================================
START RETRY
================================ */

function practiceQuestion(q){

try{

const retryQuestion=
prepareRetryQuestion(q);

if(!retryQuestion){

alert("Unable to prepare this question.");

return;

}

if(
!Array.isArray(retryQuestion.options)||
retryQuestion.options.length<2
){

alert(
"This question does not contain valid options."
);

return;

}

if(
retryQuestion.correctIndex<0||
retryQuestion.correctIndex>=
retryQuestion.options.length
){

alert(
"Correct answer could not be identified for this question."
);

return;

}

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(retryQuestion)
);

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify([retryQuestion])
);

localStorage.setItem(
"cbtRetryStartedAt",
String(Date.now())
);

const saved=
localStorage.getItem(RETRY_QUESTION_KEY);

if(!saved){

alert("Retry question could not be saved.");

return;

}

const status=
document.getElementById("retryStatus");

if(status){

status.style.display="block";

status.textContent=
"✅ Retry question loaded. Opening Retry Engine...";

}

setTimeout(function(){

window.location.href="retry.html";

},250);

}catch(error){

console.error("Retry error:",error);

alert(
"Unable to start Retry: "+
error.message
);

}

}


/* ================================
ACTIVE VIEW
================================ */

function showActive(){

document.getElementById(
"sectionTitle"
).textContent=
"❌ Active Mistakes";

document.getElementById(
"controls"
).innerHTML="";

const list=
document.getElementById("list");

list.innerHTML="";

const data=getActive();

if(data.length===0){

list.innerHTML=`

<div class="empty">

<div style="font-size:55px">
🎉
</div>

<h2>
No Active Mistakes
</h2>

<p>
Excellent! You have no unresolved mistakes.
</p>

<button
class="practice"
type="button"
onclick="showMastered()">

🏆 View Mastered Questions

</button>

</div>

`;

return;

}

data.forEach(function(q,index){

const answer=getCorrectAnswer(q);

const type=getMistakeType(q);

const reason=getMistakeReason(q);

const solution=
q.solution||
q.explanation||
"Solution not available.";

const div=
document.createElement("div");

div.className="item";

div.innerHTML=`

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="info">

<strong>📝 Your Answer</strong>

<br>

${escapeHTML(
q.selectedAnswer||
"Not answered"
)}

<br><br>

<strong>✅ Correct Answer</strong>

<br>

<span class="correct">
${escapeHTML(
answer||
"Not available"
)}
</span>

</div>

<div class="intelligence">

<div class="intelligence-box type-box">

<div class="intelligence-title">
🧠 Mistake Type
</div>

${escapeHTML(type)}

</div>

<div class="intelligence-box reason-box">

<div class="intelligence-title">
💡 Why This Happened
</div>

${escapeHTML(reason)}

</div>

<div class="intelligence-box solution-box">

<div class="intelligence-title">
📖 Solution
</div>

${escapeHTML(solution)}

</div>

</div>

<button
class="practice"
type="button">

🔄 Retry This Question

</button>

`;

const button=
div.querySelector(".practice");

button.addEventListener(
"click",
function(event){

event.preventDefault();

event.stopPropagation();

practiceQuestion(q);

});

list.appendChild(div);

});

}


/* ================================
MASTERED VIEW
================================ */

function showMastered(){

document.getElementById(
"sectionTitle"
).textContent=
"🏆 Mastered Questions";

document.getElementById(
"controls"
).innerHTML=`

<button
class="back"
type="button"
onclick="showActive()">

❌ View Active Mistakes

</button>

`;

const list=
document.getElementById("list");

list.innerHTML="";

const data=getMastered();

if(data.length===0){

list.innerHTML=`

<div class="empty">

<div style="font-size:55px">
🔎
</div>

<h2>
No Mastered Questions
</h2>

<p>
Retry your mistakes to build mastery.
</p>

<button
class="practice"
type="button"
onclick="showActive()">

❌ View Active Mistakes

</button>

</div>

`;

return;

}

data.forEach(function(q,index){

const answer=getCorrectAnswer(q);

const type=getMistakeType(q);

const reason=getMistakeReason(q);

const solution=
q.solution||
q.explanation||
"Solution not available.";

const div=
document.createElement("div");

div.className=
"item mastered-item";

div.innerHTML=`

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="info">

<strong>
✅ Correct Answer
</strong>

<br><br>

<span class="correct">
${escapeHTML(
answer||
"Not available"
)}
</span>

</div>

<div class="intelligence">

<div class="intelligence-box type-box">

<div class="intelligence-title">
🧠 Original Mistake Type
</div>

${escapeHTML(type)}

</div>

<div class="intelligence-box reason-box">

<div class="intelligence-title">
💡 Original Mistake Reason
</div>

${escapeHTML(reason)}

</div>

<div class="intelligence-box solution-box">

<div class="intelligence-title">
📖 Solution
</div>

${escapeHTML(solution)}

</div>

</div>

<button
class="practice"
type="button">

🔄 Practice This Question Again

</button>

`;

const button=
div.querySelector(".practice");

button.addEventListener(
"click",
function(event){

event.preventDefault();

event.stopPropagation();

practiceQuestion(q);

});

list.appendChild(div);

});

}

DASHBOARD

updateCounts();

</script>

<script>
(function(){
"use strict";

function renderLearningBridge(){
  if(document.querySelector("[data-rf-learning-bridge]"))return;

  const L=window.RankForgeLearningLoop;
  if(!L)return;

  L.syncHistory();

  const mistakes=L.read(L.keys.mistakes,[]);
  const active=mistakes.filter(x=>x.status!=="mastered");
  const mastered=mistakes.filter(x=>x.status==="mastered");

  const box=document.createElement("section");
  box.dataset.rfLearningBridge="true";
  box.style.cssText=
    "margin:16px 0;padding:16px;border:1px solid rgba(127,127,127,.22);border-radius:16px";

  box.innerHTML=`
    <b>RankForge Learning Loop</b>
    <div style="margin-top:8px">
      Active: <b>${active.length}</b>
      &nbsp;•&nbsp;
      Mastered: <b>${mastered.length}</b>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" data-rf-retry>Retry Mistakes</button>
      <button type="button" data-rf-review>Review Mastered</button>
    </div>
  `;

  box.querySelector("[data-rf-retry]").onclick=function(){
    if(active.length){
      const first=active[0];
      L.write(L.keys.retry,active);
      L.write(L.keys.queue,active);
      location.href="./retry.html";
    }else{
      alert("No active mistakes to retry.");
    }
  };

  box.querySelector("[data-rf-review]").onclick=function(){
    if(mastered.length){
      alert("Mastered questions: "+mastered.length);
    }else{
      alert("No mastered questions yet.");
    }
  };

  const target=
    document.querySelector("main")||
    document.querySelector(".container")||
    document.body;

  target.prepend(box);
}

if(document.readyState==="loading")
  document.addEventListener("DOMContentLoaded",renderLearningBridge,{once:true});
else
  renderLearningBridge();

})();
</script>

<script>
(function(){
  "use strict";

  const KEY="cbtMasteryV2";

  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||"null");
      return x && typeof x==="object"
        ? x
        : {mistakes:[],mastered:[],retries:[],improvement:[]};
    }catch(e){
      return {mistakes:[],mastered:[],retries:[],improvement:[]};
    }
  }

  function save(x){
    localStorage.setItem(KEY,JSON.stringify(x));
    window.dispatchEvent(new Event("rankforge-mastery-updated"));
  }

  function idOf(q){
    return String(q && (q.id||q.questionId||q._id)||"");
  }

  window.RankForgeMastery={
    version:"RANKFORGE_MASTERY_FLOW_V1",

    retry:function(questionId){
      const state=load();
      const id=String(questionId||"");
      const item=(state.mistakes||[]).find(x=>
        String(x.id||x.questionId||"")===id
      );

      if(!item) return null;

      item.status="retry";
      item.retryCount=Number(item.retryCount||0)+1;
      item.lastRetryAt=new Date().toISOString();

      state.retries=Array.isArray(state.retries)?state.retries:[];
      const old=state.retries.find(x=>
        String(x.id||x.questionId||"")===id
      );

      if(old){
        old.retryCount=item.retryCount;
        old.lastRetryAt=item.lastRetryAt;
      }else{
        state.retries.push({
          id:id,
          questionId:id,
          retryCount:item.retryCount,
          lastRetryAt:item.lastRetryAt,
          source:item.source||"RankForge AI",
          topic:item.topic||"",
          concept:item.concept||""
        });
      }

      save(state);
      return item;
    },

    completeRetry:function(questionId,correct,userAnswer){
      const state=load();
      const id=String(questionId||"");
      const index=(state.mistakes||[]).findIndex(x=>
        String(x.id||x.questionId||"")===id
      );

      if(index<0) return null;

      const item=state.mistakes[index];
      item.lastRetryAnswer=userAnswer??"";
      item.lastRetryCorrect=!!correct;
      item.lastRetryAt=new Date().toISOString();

      state.improvement=Array.isArray(state.improvement)
        ? state.improvement
        : [];

      state.improvement.push({
        id:id,
        questionId:id,
        correct:!!correct,
        at:item.lastRetryAt,
        topic:item.topic||"",
        concept:item.concept||"",
        source:item.source||"RankForge AI"
      });

      if(correct){
        item.status="mastered";
        item.masteredAt=item.lastRetryAt;
        item.improvementStatus="improved";

        state.mastered=Array.isArray(state.mastered)
          ? state.mastered
          : [];

        const already=state.mastered.some(x=>
          String(x.id||x.questionId||"")===id
        );

        if(!already){
          state.mastered.push({
            ...item,
            status:"mastered",
            masteredAt:item.masteredAt
          });
        }

        state.mistakes.splice(index,1);

        state.retries=(state.retries||[]).filter(x=>
          String(x.id||x.questionId||"")!==id
        );
      }else{
        item.status="active";
        item.retryFailedCount=
          Number(item.retryFailedCount||0)+1;
      }

      save(state);
      return item;
    },

    stats:function(){
      const state=load();
      const improvement=state.improvement||[];
      const correct=improvement.filter(x=>x.correct).length;
      const attempted=improvement.length;

      return {
        activeMistakes:(state.mistakes||[]).length,
        mastered:(state.mastered||[]).length,
        retries:(state.retries||[]).length,
        retryAttempts:attempted,
        retryCorrect:correct,
        improvementRate:attempted
          ? Math.round(correct/attempted*100)
          : 0
      };
    },

    get:function(questionId){
      const state=load();
      const id=String(questionId||"");

      return (state.mistakes||[]).find(x=>
        String(x.id||x.questionId||"")===id
      ) ||
      (state.mastered||[]).find(x=>
        String(x.id||x.questionId||"")===id
      ) ||
      null;
    }
  };

  window.RANKFORGE_MASTERY_FLOW_READY=true;

  window.addEventListener("rankforge-mastery-updated",function(){
    try{
      if(typeof window.renderMistakes==="function")
        window.renderMistakes();
      if(typeof window.renderMistakeBook==="function")
        window.renderMistakeBook();
      if(typeof window.refreshMistakes==="function")
        window.refreshMistakes();
    }catch(e){}
  });
})();
</script>
