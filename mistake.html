<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.dashboard{
border:0;
background:#4f46e5;
color:#fff;
padding:12px 18px;
border-radius:11px;
font-weight:800;
cursor:pointer;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
padding:28px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 10px;
font-size:34px;
}

.hero p{
margin:0;
font-size:17px;
line-height:1.5;
}

.card{
background:#fff;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.title{
font-size:25px;
font-weight:800;
margin-bottom:18px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.stat{
display:block;
width:100%;
border:0;
background:#f8fafc;
border-radius:16px;
padding:22px;
text-align:left;
cursor:pointer;
touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
font-family:Arial,sans-serif;
color:#0f172a;
}

.stat:active{
transform:scale(.98);
}

.icon{
font-size:30px;
}

.number{
font-size:38px;
font-weight:800;
margin:5px 0;
}

.label{
font-size:17px;
color:#64748b;
font-weight:600;
}

.hint{
margin-top:7px;
color:#4f46e5;
font-size:13px;
font-weight:800;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
border:0;
padding:14px;
border-radius:11px;
font-size:16px;
font-weight:800;
cursor:pointer;
touch-action:manipulation;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.mistake{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.mastered-box{
background:#f0fdf4;
border:1px solid #bbf7d0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.badge{
display:inline-block;
background:#eef2ff;
color:#3730a3;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin-right:5px;
margin-bottom:5px;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.answer{
background:#f8fafc;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.wrong{
color:#dc2626;
font-weight:800;
}

.correct{
color:#16a34a;
font-weight:800;
}

.retry{
width:100%;
margin-top:13px;
border:0;
background:#4f46e5;
color:#fff;
padding:13px;
border-radius:10px;
font-size:16px;
font-weight:800;
cursor:pointer;
touch-action:manipulation;
}

.solution{
margin-top:12px;
padding:13px;
background:#fff;
border-radius:10px;
line-height:1.6;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

.empty-icon{
font-size:55px;
}

.view-active{
border:0;
background:#e2e8f0;
color:#0f172a;
padding:12px 16px;
border-radius:10px;
font-weight:800;
cursor:pointer;
margin-bottom:10px;
}

@media(max-width:600px){

.container{
margin:15px auto;
}

.hero{
padding:22px;
}

.hero h1{
font-size:30px;
}

.card{
padding:17px;
}

.stats{
gap:10px;
}

.stat{
padding:16px;
}

.number{
font-size:32px;
}

.actions{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
type="button"
class="dashboard"
onclick="location.href='index.html'">

Dashboard

</button>

</div>

</header>


<div class="container">


<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Every wrong CBT answer becomes a learning opportunity.
Review it, retry it, and convert it into mastery.
</p>

</div>


<div class="card">

<div class="title">
📊 Mistake Overview
</div>

<div class="stats">


<!-- ACTIVE MISTAKES -->

<button
type="button"
class="stat"
id="activeButton">

<div class="icon">
❌
</div>

<div
id="activeCount"
class="number">
0
</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to Retry →
</div>

</button>


<!-- MASTERED -->

<button
type="button"
class="stat"
id="masteredButton">

<div class="icon">
🏆
</div>

<div
id="masteredCount"
class="number">
0
</div>

<div class="label">
Mastered
</div>

<div class="hint">
View Mastered →
</div>

</button>


</div>

</div>


<div class="card">

<div class="actions">

<button
type="button"
class="action primary"
id="retryAllButton">

🔄 Retry Active Mistakes

</button>

<button
type="button"
class="action secondary"
onclick="location.href='cbt.html'">

📝 Start CBT

</button>

</div>

</div>


<div class="card">

<div
id="viewControls"
style="display:none;margin-bottom:15px">

<button
type="button"
class="view-active"
id="activeViewButton">

← Active Mistakes

</button>

</div>


<h2 id="listTitle">
❌ Active Mistakes
</h2>

<div id="mistakeList"></div>

<div
id="empty"
class="empty"
style="display:none">

<div class="empty-icon">
🏆
</div>

<h2>
No Active Mistakes
</h2>

<p>
Complete a CBT test and answer at least one question incorrectly.
</p>

</div>

</div>


</div>


<script>

const HISTORY_KEY="cbtHistory";
const MISTAKES_KEY="cbtAnalyzer.mistakes";
const MASTERY_KEY="cbtAnalyzer.mastery";
const LEGACY_MASTERY_KEY="cbtMasteryV2";
const RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";
const RETRY_QUESTION_KEY="cbtRetryQuestion";


/* =========================
STORAGE
========================= */

function read(key,fallback){

try{

const raw=localStorage.getItem(key);

if(!raw){
return fallback;
}

return JSON.parse(raw);

}catch(error){

return fallback;

}

}


function write(key,value){

localStorage.setItem(
key,
JSON.stringify(value)
);

}


/* =========================
NORMALIZE
========================= */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =========================
MASTERED QUESTIONS
========================= */

function getMasteredQuestions(){

const map=new Map();

[
MASTERY_KEY,
LEGACY_MASTERY_KEY
].forEach(function(storageKey){

const data=read(storageKey,[]);

if(!Array.isArray(data)){
return;
}

data.forEach(function(item){

if(
!item ||
!item.question
){
return;
}

const key=
normalize(item.question);

if(!map.has(key)){

map.set(key,item);

}

});

});

return Array.from(map.values());

}


/* =========================
MASTERED SET
========================= */

function getMasteredSet(){

return new Set(
getMasteredQuestions().map(function(item){

return normalize(item.question);

})
);

}


/* =========================
ACTIVE MISTAKES
========================= */

function getMistakes(){

const mastered=
getMasteredSet();

const map=new Map();


/*
Existing mistake storage
*/

const mistakes=
read(MISTAKES_KEY,[]);

if(Array.isArray(mistakes)){

mistakes.forEach(function(q){

if(
!q ||
!q.question
){
return;
}

const key=
normalize(q.question);

if(!mastered.has(key)){

map.set(key,q);

}

});

}


/*
CBT history
*/

const history=
read(HISTORY_KEY,[]);

if(Array.isArray(history)){

history.forEach(function(test){

if(
!test ||
!Array.isArray(test.questions)
){
return;
}

test.questions.forEach(function(q){

if(
!q ||
!q.question ||
q.status!=="wrong"
){
return;
}

const key=
normalize(q.question);

if(mastered.has(key)){
return;
}

map.set(
key,
{
id:
q.id ||
"mistake-"+Date.now(),

question:
q.question,

options:
Array.isArray(q.options)
?q.options
:[],

subject:
q.subject ||
"Unknown",

topic:
q.topic ||
"Unknown",

selectedIndex:
q.selectedIndex,

selectedAnswer:
q.selectedAnswer ||
"Not answered",

correctIndex:
Number(q.correctIndex),

correctAnswer:
q.correctAnswer ||
(
Array.isArray(q.options)
?
q.options[Number(q.correctIndex)]
:
""
),

solution:
q.solution ||
"Solution not available."

}
);

});

});

}


return Array.from(map.values());

}


/* =========================
UPDATE COUNTS
========================= */

function updateCounts(){

document.getElementById(
"activeCount"
).textContent=
getMistakes().length;


document.getElementById(
"masteredCount"
).textContent=
getMasteredQuestions().length;

}


/* =========================
OPEN RETRY
========================= */

function openRetry(){

const mistakes=
getMistakes();

if(mistakes.length===0){

alert(
"No active mistakes found. Complete a CBT test and answer at least one question incorrectly."
);

return;

}

write(
RETRY_QUEUE_KEY,
mistakes
);

write(
RETRY_QUESTION_KEY,
mistakes[0]
);

window.location.href=
"retry.html";

}


/* =========================
RETRY ONE
========================= */

function retryOne(index){

const mistakes=
getMistakes();

const question=
mistakes[index];

if(!question){
return;
}

write(
RETRY_QUEUE_KEY,
mistakes
);

write(
RETRY_QUESTION_KEY,
question
);

window.location.href=
"retry.html";

}


/* =========================
SHOW ACTIVE
========================= */

function showActive(){

document.getElementById(
"listTitle"
).textContent=
"❌ Active Mistakes";


document.getElementById(
"viewControls"
).style.display=
"none";


renderActive();

}


/* =========================
SHOW MASTERED
========================= */

function showMastered(){

const mastered=
getMasteredQuestions();

const list=
document.getElementById(
"mistakeList"
);

const empty=
document.getElementById(
"empty"
);


document.getElementById(
"listTitle"
).textContent=
"🏆 Mastered Questions";


document.getElementById(
"viewControls"
).style.display=
"block";


list.innerHTML="";

empty.style.display="none";


if(mastered.length===0){

list.innerHTML=`

<div class="empty">

<div class="empty-icon">
📚
</div>

<h2>
No Mastered Questions Yet
</h2>

<p>
Answer retry questions correctly to move them here.
</p>

</div>

`;

return;

}


mastered.forEach(function(q,index){

const div=
document.createElement("div");

div.className=
"mastered-box";


const answer=
q.correctAnswer ||
(
Array.isArray(q.options)
?
q.options[q.correctIndex]
:
""
);


div.innerHTML=`

<div>

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

</div>

<div class="question">

${escapeHTML(q.question)}

</div>

<div class="solution">

<strong>
✅ Correct Answer
</strong>

<br><br>

${escapeHTML(answer)}

${
q.solution
?
`

<br><br>

<strong>
💡 Solution
</strong>

<br><br>

${escapeHTML(q.solution)}

`
:
""
}

</div>

`;

list.appendChild(div);

});

}


/* =========================
RENDER ACTIVE
========================= */

function renderActive(){

const mistakes=
getMistakes();

const list=
document.getElementById(
"mistakeList"
);

const empty=
document.getElementById(
"empty"
);


list.innerHTML="";


if(mistakes.length===0){

empty.style.display="block";

return;

}


empty.style.display="none";


mistakes.forEach(function(q,index){

const div=
document.createElement("div");

div.className=
"mistake";


const answer=
q.correctAnswer ||
(
Array.isArray(q.options)
?
q.options[q.correctIndex]
:
""
);


div.innerHTML=`

<div>

<span class="badge">
❌ Mistake ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject)}
</span>

<span class="badge">
${escapeHTML(q.topic)}
</span>

</div>

<div class="question">

${escapeHTML(q.question)}

</div>

<div class="answer">

<strong>
Your answer:
</strong>

<span class="wrong">

${escapeHTML(q.selectedAnswer)}

</span>

<br><br>

<strong>
Correct answer:
</strong>

<span class="correct">

${escapeHTML(answer)}

</span>

</div>

<button
type="button"
class="retry"
data-index="${index}">

🔄 Retry This Question

</button>

`;


const retryButton=
div.querySelector(".retry");


retryButton.addEventListener(
"click",
function(){

retryOne(index);

}
);


list.appendChild(div);

});

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(
value===undefined ||
value===null
?
""
:
value
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
BUTTON EVENTS
========================= */

/*
Using addEventListener instead of inline
onclick makes the Mastered button reliable
on mobile browsers.
*/

document
.getElementById("activeButton")
.addEventListener(
"click",
function(){

showActive();

}
);


document
.getElementById("masteredButton")
.addEventListener(
"click",
function(){

showMastered();

}
);


document
.getElementById("retryAllButton")
.addEventListener(
"click",
function(){

openRetry();

}
);


document
.getElementById("activeViewButton")
.addEventListener(
"click",
function(){

showActive();

}
);


/* =========================
START
========================= */

updateCounts();

renderActive();

</script>

</body>
</html>
