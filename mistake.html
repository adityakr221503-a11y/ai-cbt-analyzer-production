<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:21px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:Arial,sans-serif;
cursor:pointer;
touch-action:manipulation;
}

.dashboard{
border:0;
background:#4f46e5;
color:#fff;
padding:12px 18px;
border-radius:10px;
font-weight:800;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
padding:27px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
font-size:29px;
}

.hero p{
margin:0;
line-height:1.5;
}

.card{
background:#fff;
border-radius:17px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat{
border:0;
background:#f8fafc;
border-radius:15px;
padding:20px;
text-align:left;
color:#0f172a;
width:100%;
}

.number{
font-size:36px;
font-weight:800;
margin:5px 0;
}

.label{
font-size:16px;
color:#64748b;
font-weight:700;
}

.hint{
font-size:13px;
font-weight:800;
color:#4f46e5;
margin-top:7px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.action{
border:0;
padding:14px;
border-radius:10px;
font-size:15px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.back{
border:0;
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
}

.item{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:13px;
}

.mastered-item{
background:#f0fdf4;
border-color:#bbf7d0;
cursor:pointer;
}

.mastered-item:active{
transform:scale(.99);
}

.badge{
display:inline-block;
background:#eef2ff;
color:#3730a3;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin:2px 4px 2px 0;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:#f8fafc;
padding:14px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.retry{
width:100%;
border:0;
background:#4f46e5;
color:#fff;
padding:13px;
border-radius:10px;
font-size:15px;
font-weight:800;
margin-top:13px;
}

.detail-question{
font-size:22px;
font-weight:800;
line-height:1.6;
margin:20px 0;
}

.option{
padding:13px;
border:1px solid #e2e8f0;
border-radius:10px;
margin-top:8px;
background:#fff;
}

.option.correct-option{
background:#f0fdf4;
border-color:#86efac;
font-weight:800;
}

.solution{
background:#eff6ff;
border-left:4px solid #4f46e5;
padding:16px;
border-radius:10px;
margin-top:18px;
line-height:1.7;
}

.empty{
text-align:center;
padding:35px 15px;
color:#64748b;
}

@media(max-width:600px){
.actions{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

.number{
font-size:31px;
}

.detail-question{
font-size:19px;
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="dashboard"
type="button"
onclick="goDashboard()">
Dashboard
</button>

</div>
</header>

<div class="container">

<div class="hero">
<h1>🧠 Mistake Bank</h1>
<p>
Review mistakes, retry questions and build mastery.
</p>
</div>

<div class="card">

<h2>📊 Performance</h2>

<div class="stats">

<button
class="stat"
type="button"
onclick="showActive()">

<div>❌</div>

<div class="number" id="activeCount">0</div>

<div class="label">
Active Mistakes
</div>

<div class="hint">
Tap to View →
</div>

</button>

<button
class="stat"
type="button"
onclick="showMastered()">

<div>🏆</div>

<div class="number" id="masteredCount">0</div>

<div class="label">
Mastered
</div>

<div class="hint">
Tap to View →
</div>

</button>

</div>
</div>

<div class="card">

<div class="actions">

<button
class="action primary"
type="button"
onclick="openRetry()">

🔄 Retry Active Mistakes

</button>

<button
class="action secondary"
type="button"
onclick="goCBT()">

📝 Start CBT

</button>

</div>

</div>

<div class="card">

<div id="controls"></div>

<h2 id="sectionTitle">
❌ Active Mistakes
</h2>

<div id="list"></div>

</div>

</div>

<script>

var HISTORY_KEY="cbtHistory";
var MASTERY_KEY="cbtMasteryV2";
var RETRY_QUEUE_KEY="cbtAnalyzer.retryQueue";
var RETRY_QUESTION_KEY="cbtRetryQuestion";


function readJSON(key){

try{

var value=localStorage.getItem(key);

if(!value){
return [];
}

return JSON.parse(value);

}catch(e){

return [];

}

}


function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


function escapeHTML(value){

return String(
value===undefined||value===null?"":value
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* MASTERED */

function getMastered(){

var data=readJSON(MASTERY_KEY);

if(!Array.isArray(data)){
return [];
}

var map={};

data.forEach(function(q){

if(q && q.question){

map[normalize(q.question)]=q;

}

});

return Object.keys(map).map(function(k){
return map[k];
});

}


/* ACTIVE */

function getActive(){

var history=readJSON(HISTORY_KEY);

if(!Array.isArray(history)){
return [];
}

var masteredSet=new Set(
getMastered().map(function(q){
return normalize(q.question);
})
);

var map={};

history.forEach(function(test){

if(!test||!Array.isArray(test.questions)){
return;
}

test.questions.forEach(function(q){

if(
!q||
!q.question||
q.status!=="wrong"
){
return;
}

var key=normalize(q.question);

if(masteredSet.has(key)){
return;
}

map[key]=q;

});

});

return Object.keys(map).map(function(k){
return map[k];
});

}


/* COUNTS */

function updateCounts(){

document.getElementById("activeCount")
.textContent=getActive().length;

document.getElementById("masteredCount")
.textContent=getMastered().length;

}


/* ACTIVE */

function showActive(){

document.getElementById("sectionTitle")
.textContent="❌ Active Mistakes";

document.getElementById("controls")
.innerHTML="";

var list=document.getElementById("list");

list.innerHTML="";

var data=getActive();

if(data.length===0){

list.innerHTML=`
<div class="empty">
<div style="font-size:55px">🎉</div>
<h2>No Active Mistakes</h2>
<p>You have no unresolved mistakes.</p>
</div>
`;

return;

}

data.forEach(function(q,index){

var answer=q.correctAnswer||"";

if(!answer&&Array.isArray(q.options)){

answer=q.options[Number(q.correctIndex)]||"";

}

var div=document.createElement("div");

div.className="item";

div.innerHTML=`

<span class="badge">❌ Mistake ${index+1}</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="info">

<strong>Your answer:</strong>
<br>
${escapeHTML(q.selectedAnswer||"Not answered")}

<br><br>

<strong>Correct answer:</strong>
<br>

<span class="correct">
${escapeHTML(answer)}
</span>

</div>

<button
class="retry"
type="button"
onclick="retryOne(${index})">

🔄 Retry This Question

</button>
`;

list.appendChild(div);

});

}


/* MASTERED LIST */

function showMastered(){

document.getElementById("sectionTitle")
.textContent="🏆 Mastered Questions";

document.getElementById("controls")
.innerHTML=`

<button
class="back"
type="button"
onclick="showActive()">

← Active Mistakes

</button>
`;

var list=document.getElementById("list");

list.innerHTML="";

var data=getMastered();

document.getElementById("masteredCount")
.textContent=data.length;

if(data.length===0){

list.innerHTML=`
<div class="empty">

<div style="font-size:55px">🔎</div>

<h2>No Mastered Questions Found</h2>

<p>
No questions are currently stored in cbtMasteryV2.
</p>

</div>
`;

return;

}

data.forEach(function(q,index){

var div=document.createElement("div");

div.className="item mastered-item";

div.setAttribute(
"role",
"button"
);

div.setAttribute(
"tabindex",
"0"
);

div.innerHTML=`

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="hint">
Tap to open full question →
</div>
`;

div.onclick=function(){

openMasteredQuestion(index);

};

div.onkeydown=function(e){

if(e.key==="Enter"||e.key===" "){

e.preventDefault();

openMasteredQuestion(index);

}

};

list.appendChild(div);

});

}


/* MASTERED DETAIL */

function openMasteredQuestion(index){

var data=getMastered();

var q=data[index];

if(!q){
return;
}

document.getElementById("sectionTitle")
.textContent="🏆 Mastered Question";

document.getElementById("controls")
.innerHTML=`

<button
class="back"
type="button"
onclick="showMastered()">

← Back to Mastered

</button>
`;

var list=document.getElementById("list");

var answer=q.correctAnswer||"";

if(
!answer&&
Array.isArray(q.options)
){

answer=q.options[
Number(q.correctIndex)
]||"";

}

var options="";

if(Array.isArray(q.options)){

options=`
<h3>📝 Options</h3>
`;

q.options.forEach(function(option,i){

var isCorrect=
Number(q.correctIndex)===i;

options+=`

<div class="option ${
isCorrect?"correct-option":""
}">

${isCorrect?"✅ ":""}

${escapeHTML(option)}

</div>
`;

});

}

var solution="";

if(q.solution){

solution=`

<div class="solution">

<strong>💡 Solution</strong>

<br><br>

${escapeHTML(q.solution)}

</div>
`;

}

list.innerHTML=`

<div class="item">

<span class="badge">
🏆 MASTERED
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="detail-question">

${escapeHTML(q.question)}

</div>

${options}

<div class="info">

<strong>
✅ Correct Answer
</strong>

<br><br>

<span class="correct">
${escapeHTML(answer)}
</span>

</div>

${solution}

<button
class="retry"
type="button"
onclick="retryMastered()">

🔄 Practice This Question Again

</button>

</div>
`;

window.currentMasteredQuestion=q;

}


/* RETRY MASTERED */

function retryMastered(){

var q=window.currentMasteredQuestion;

if(!q){
return;
}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify([q])
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(q)
);

location.href="retry.html";

}


/* RETRY ACTIVE */

function openRetry(){

var data=getActive();

if(data.length===0){

alert("No active mistakes available.");

return;

}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(data)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(data[0])
);

location.href="retry.html";

}


function retryOne(index){

var data=getActive();

if(!data[index]){
return;
}

localStorage.setItem(
RETRY_QUEUE_KEY,
JSON.stringify(data)
);

localStorage.setItem(
RETRY_QUESTION_KEY,
JSON.stringify(data[index])
);

location.href="retry.html";

}


/* NAVIGATION */

function goDashboard(){

location.href="index.html";

}

function goCBT(){

location.href="cbt.html";

}


/* START */

updateCounts();

if(location.hash.toLowerCase()==="#mastered"){

showMastered();

}else{

showActive();

}

</script>

</body>
</html>
