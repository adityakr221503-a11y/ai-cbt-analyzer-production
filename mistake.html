<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Mistake Bank</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
padding:25px;
border-radius:18px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:27px;
margin-bottom:5px;
}

.stat small{
color:#64748b;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-top:14px;
}

.question-number{
font-weight:800;
color:#4f46e5;
margin-bottom:10px;
}

.question-text{
font-size:16px;
font-weight:700;
line-height:1.5;
}

.answer{
margin-top:10px;
padding:10px;
border-radius:8px;
background:#f8fafc;
}

.correct{
border-left:4px solid #16a34a;
}

.wrong{
border-left:4px solid #dc2626;
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b;
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:700;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:#fff;
}

.retry{
background:#16a34a;
color:#fff;
font-size:16px;
padding:14px 20px;
width:100%;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
onclick="location.href='analysis.html'">

Dashboard

</button>

</div>

</header>


<div class="container">


<div class="hero">

<h1>🧠 Mistake Bank</h1>

<p>
Review your incorrect questions and turn mistakes into mastery.
</p>

</div>


<!-- SUMMARY -->

<div class="card">

<h2>Mistake Summary</h2>

<div class="stats">

<div class="stat">

<strong id="totalMistakes">
0
</strong>

<small>Total Mistakes</small>

</div>


<div class="stat">

<strong id="retryCount">
0
</strong>

<small>Retry Questions</small>

</div>


<div class="stat">

<strong id="mastered">
0
</strong>

<small>Mastered</small>

</div>

</div>


<div class="actions">

<button
class="retry"
onclick="startRetry()">

🔄 Retry Mistakes

</button>

</div>

</div>


<!-- MISTAKES -->

<div class="card">

<h2>❌ Your Mistakes</h2>

<div id="mistakes">

<div class="empty">
Loading mistakes...
</div>

</div>

</div>


</div>


<script>


/* =========================
LOAD DATA
========================= */

let history=[];

try{

history=
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);

if(!Array.isArray(history)){
history=[];
}

}catch(e){

history=[];

}


/* =========================
COLLECT MISTAKES
========================= */

function getMistakes(){

const mistakes=[];


history.forEach(function(test,testIndex){

if(!Array.isArray(test.questions)){
return;
}


test.questions.forEach(function(q,questionIndex){

if(q.status==="wrong"){

mistakes.push({

...q,

originalTest:
testIndex+1,

originalQuestion:
questionIndex+1

});

}

});

});


return mistakes;

}


/* =========================
RENDER
========================= */

function render(){

const mistakes=
getMistakes();


document.getElementById(
"totalMistakes"
).textContent=
mistakes.length;


document.getElementById(
"retryCount"
).textContent=
mistakes.length;


document.getElementById(
"mastered"
).textContent=
"0";


const box=
document.getElementById("mistakes");

box.innerHTML="";


if(mistakes.length===0){

box.innerHTML=
`
<div class="empty">

🎉 No wrong questions found yet.

<br><br>

Complete a CBT and your mistakes will appear here.

</div>
`;

return;

}


mistakes.forEach(function(q,index){

const div=
document.createElement("div");

div.className="question";


const questionText=
q.question ||
q.text ||
"Question text unavailable";


const yourAnswer=
q.selectedAnswer ??
q.userAnswer ??
q.answer ??
"Not recorded";


const correctAnswer=
q.correctAnswer ??
q.correct ??
"Not recorded";


const reason=
q.mistakeReason ||
q.reason ||
"Review the concept and solution carefully.";


const solution=
q.solution ||
q.explanation ||
"No solution recorded.";


div.innerHTML=

`
<div class="question-number">

Mistake #${index+1}

</div>

<div class="question-text">

${escapeHTML(questionText)}

</div>

<div class="answer wrong">

<strong>Your Answer:</strong><br>

${escapeHTML(yourAnswer)}

</div>

<div class="answer correct">

<strong>Correct Answer:</strong><br>

${escapeHTML(correctAnswer)}

</div>

<div class="answer">

<strong>🧠 Mistake Reason:</strong><br>

${escapeHTML(reason)}

</div>

<div class="answer">

<strong>💡 Solution:</strong><br>

${escapeHTML(solution)}

</div>

`;


box.appendChild(div);

});

}


/* =========================
RETRY
========================= */

function startRetry(){

const mistakes=
getMistakes();


if(mistakes.length===0){

alert(
"No mistakes are available for retry yet."
);

return;

}


/*
Create a dedicated retry set.

The existing CBT can read this
when retry mode is implemented.
*/

const retryQuestions=
mistakes.map(function(q,index){

return {

...q,

retryQuestionId:
"retry_"+Date.now()+"_"+index

};

});


localStorage.setItem(
"cbtRetryQuestions",
JSON.stringify(retryQuestions)
);


localStorage.setItem(
"cbtRetryMode",
"true"
);


/*
Open CBT.
*/

window.location.href=
"cbt.html?mode=retry";

}


/* =========================
ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
START
========================= */

render();

</script>

</body>
</html>
