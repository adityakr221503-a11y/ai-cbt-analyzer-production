<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.timer{
  background:#eef2ff;
  color:#3730a3;
  padding:9px 14px;
  border-radius:9px;
  font-weight:800;
  min-width:78px;
  text-align:center;
}

.timer.warning{
  background:#fef3c7;
  color:#92400e;
}

.timer.danger{
  background:#fee2e2;
  color:#991b1b;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:1fr 280px;
  gap:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
  color:#64748b;
  font-weight:700;
  margin-bottom:12px;
}

.question{
  font-size:21px;
  font-weight:800;
  line-height:1.55;
  margin-bottom:20px;
  white-space:pre-wrap;
}

.option{
  display:block;
  width:100%;
  padding:15px;
  margin:10px 0;
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:11px;
  text-align:left;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.option:hover{
  border-color:#818cf8;
}

.option.selected{
  border-color:#4f46e5;
  background:#eef2ff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

button{
  font-family:inherit;
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:#4f46e5;
  color:#fff;
}

.secondary{
  background:#e2e8f0;
  color:#0f172a;
}

.warning{
  background:#f59e0b;
  color:#fff;
}

.danger{
  background:#dc2626;
  color:#fff;
}

.palette{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:15px;
}

.palette button{
  background:#e2e8f0;
  padding:10px 5px;
}

.palette button.answered{
  background:#bbf7d0;
}

.palette button.review{
  background:#fde68a;
}

.palette button.answered.review{
  background:#86efac;
}

.palette button.current{
  outline:3px solid #4f46e5;
}

#result{
  display:none;
}

.score{
  font-size:38px;
  font-weight:800;
  text-align:center;
  margin:15px 0;
}

.summary-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:20px 0;
}

.stat{
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:22px;
}

.stat small{
  color:#64748b;
}

.result-actions button{
  width:100%;
  margin-top:8px;
}

.review-item{
  margin-top:15px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
}

.review-item.correct{
  border-left:5px solid #16a34a;
}

.review-item.incorrect{
  border-left:5px solid #dc2626;
}

.review-item.skipped{
  border-left:5px solid #f59e0b;
}

.analysis{
  margin-top:10px;
  padding:14px;
  background:#eef2ff;
  border-radius:10px;
  line-height:1.6;
}

.error-box{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:10px;
  line-height:1.5;
}

.success-box{
  background:#dcfce7;
  color:#166534;
  padding:14px;
  border-radius:10px;
  line-height:1.5;
  margin-bottom:15px;
}

.info-box{
  background:#eef2ff;
  color:#3730a3;
  padding:14px;
  border-radius:10px;
  line-height:1.5;
  margin-bottom:15px;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#64748b;
}

.small{
  font-size:13px;
  color:#64748b;
}

@media(max-width:800px){

  .container{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

  .summary-box{
    grid-template-columns:1fr 1fr;
  }

  aside.card{
    order:2;
  }

}

@media(max-width:500px){

  header{
    padding:13px 15px;
  }

  .logo{
    font-size:17px;
  }

  .card{
    padding:17px;
  }

  .buttons{
    grid-template-columns:1fr 1fr;
  }

  .summary-box{
    grid-template-columns:1fr 1fr;
  }

}

</style>

</head>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

30:00
</div>

</div>

</header>


<div class="container">

<button

Previous

🔄 Retry Mistakes

🧠 Mistake Bank

</main>

style="width:100%;margin-top:20px"
onclick="confirmSubmit()">
Submit Test
</button>

</aside>

</div>


<script>

"use strict";


/* =====================================================
   CBT ANALYZER PRO
   PDF → CBT ENGINE
===================================================== */


/* =====================================================
   GLOBAL STATE
===================================================== */

let questions = [];

let current = 0;

let answers = [];

let marked = [];

let submitted = false;

let timeLeft = 1800;

let timerInterval = null;

let initialized = false;


/* =====================================================
   STORAGE KEYS
===================================================== */

const PDF_KEYS = [

  "pdfCbtQuestions",

  "pdfQuestions",

  "cbtQuestions",

  "importedQuestions",

  "pdfQuestionBank",

  "questionBank"

];


const HISTORY_KEY = "cbtHistory";

const RETRY_QUEUE_KEY =
  "cbtAnalyzer.retryQueue";

const RETRY_QUESTION_KEY =
  "cbtRetryQuestion";

const RETRY_STARTED_KEY =
  "cbtRetryStartedAt";


/* =====================================================
   LOGGING
===================================================== */

function log(){

  console.log(
    "[CBT Analyzer]",
    ...arguments
  );

}


/* =====================================================
   SAFE LOCAL STORAGE
===================================================== */

function getStorage(key){

  try{

    return localStorage.getItem(key);

  }catch(error){

    console.error(
      "Cannot read localStorage:",
      error
    );

    return null;

  }

}


function setStorage(key,value){

  try{

    localStorage.setItem(
      key,
      value
    );

    return true;

  }catch(error){

    console.error(
      "Cannot write localStorage:",
      error
    );

    return false;

  }

}


/* =====================================================
   JSON PARSER
===================================================== */

function parseJSON(value){

  try{

    return JSON.parse(value);

  }catch(error){

    console.error(
      "JSON parse error:",
      error
    );

    return null;

  }

}


/* =====================================================
   NEXT PART
===================================================== */
   /* =====================================================
   EXTRACT QUESTION ARRAY
===================================================== */

function extractQuestionArray(data){

  if(Array.isArray(data)){
    return data;
  }

  if(
    data &&
    Array.isArray(data.questions)
  ){
    return data.questions;
  }

  if(
    data &&
    Array.isArray(data.data)
  ){
    return data.data;
  }

  if(
    data &&
    Array.isArray(data.items)
  ){
    return data.items;
  }

  if(
    data &&
    Array.isArray(data.questionBank)
  ){
    return data.questionBank;
  }

  return [];
}


/* =====================================================
   CONVERT ANSWER
===================================================== */

function normalizeAnswer(answer,options){

  if(
    answer === null ||
    answer === undefined ||
    answer === ""
  ){
    return null;
  }


  /* Number */

  if(typeof answer === "number"){

    if(
      Number.isInteger(answer) &&
      answer >= 0 &&
      answer < options.length
    ){

      return answer;

    }

    /*
      Some PDF importers store:
      1 = A
      2 = B
      3 = C
      4 = D
    */

    if(
      Number.isInteger(answer) &&
      answer >= 1 &&
      answer <= options.length
    ){

      return answer - 1;

    }

  }


  const value =
    String(answer).trim();


  /* A / B / C / D */

  if(
    /^[A-Da-d]$/.test(value)
  ){

    const index =
      value
      .toUpperCase()
      .charCodeAt(0) - 65;

    if(
      index >= 0 &&
      index < options.length
    ){

      return index;

    }

  }


  /* Numeric string */

  if(
    /^\d+$/.test(value)
  ){

    const number =
      Number(value);


    if(
      number >= 1 &&
      number <= options.length
    ){

      return number - 1;

    }


    if(
      number >= 0 &&
      number < options.length
    ){

      return number;

    }

  }


  /* Exact option text */

  const lower =
    value.toLowerCase();


  const found =
    options.findIndex(
      function(option){

        return String(option)
          .trim()
          .toLowerCase()
          === lower;

      }
    );


  if(found >= 0){
    return found;
  }


  return null;

}


/* =====================================================
   NORMALIZE OPTIONS
===================================================== */

function normalizeOptions(q){

  let options = [];


  if(
    Array.isArray(q.options)
  ){

    options = q.options;

  }
  else if(
    Array.isArray(q.choices)
  ){

    options = q.choices;

  }
  else if(
    Array.isArray(q.answers)
  ){

    options = q.answers;

  }
  else{

    options = [

      q.optionA,

      q.optionB,

      q.optionC,

      q.optionD

    ];

  }


  return options

    .filter(function(option){

      return (
        option !== undefined &&
        option !== null &&
        String(option).trim() !== ""
      );

    })

    .map(function(option){

      if(
        typeof option === "object" &&
        option.text !== undefined
      ){

        return String(
          option.text
        ).trim();

      }

      return String(
        option
      ).trim();

    });

}


/* =====================================================
   NORMALIZE QUESTION
===================================================== */

function normalizeQuestion(q,index){

  if(
    !q ||
    typeof q !== "object"
  ){

    return null;

  }


  /* Question text */

  const questionText =
    String(

      q.question ??
      q.questionText ??
      q.text ??
      q.question_text ??
      ""

    ).trim();


  if(!questionText){

    console.warn(
      "Question has no text:",
      index
    );

    return null;

  }


  /* Options */

  const options =
    normalizeOptions(q);


  if(options.length < 2){

    console.warn(
      "Question has fewer than 2 options:",
      index
    );

    return null;

  }


  /* Answer */

  let rawAnswer =
    q.answer;


  if(
    rawAnswer === undefined ||
    rawAnswer === null ||
    rawAnswer === ""
  ){

    rawAnswer =
      q.correctAnswer;

  }


  if(
    rawAnswer === undefined ||
    rawAnswer === null ||
    rawAnswer === ""
  ){

    rawAnswer =
      q.correctIndex;

  }


  if(
    rawAnswer === undefined ||
    rawAnswer === null ||
    rawAnswer === ""
  ){

    rawAnswer =
      q.answerIndex;

  }


  if(
    rawAnswer === undefined ||
    rawAnswer === null ||
    rawAnswer === ""
  ){

    rawAnswer =
      q.correct;

  }


  const answer =
    normalizeAnswer(
      rawAnswer,
      options
    );


  if(answer === null){

    console.warn(
      "Question has invalid answer:",
      index,
      questionText
    );

    return null;

  }


  return {

    id:
      q.id ||
      "pdf-" +
      Date.now() +
      "-" +
      index,

    subject:
      q.subject ||
      q.subjectName ||
      "PDF",

    topic:
      q.topic ||
      q.chapter ||
      q.section ||
      "PDF Import",

    question:
      questionText,

    options:
      options,

    answer:
      answer,

    solution:
      String(
        q.solution ??
        q.explanation ??
        q.detailedSolution ??
        ""
      ),

    explanation:
      String(
        q.explanation ??
        q.solution ??
        ""
      ),

    pdfPage:
      q.pdfPage ??
      q.page ??
      "",

    pdfPageEnd:
      q.pdfPageEnd ??
      q.pageEnd ??
      q.pdfPage ??
      q.page ??
      "",

    chapter:
      q.chapter ||
      "",

    section:
      q.section ||
      "",

    answerSource:
      q.answerSource ||
      "PDF",

    source:
      q.source ||
      "PDF Import",

    sourceType:
      "PDF",

    bookmarked:
      Boolean(
        q.bookmarked
      )

  };

}


/* =====================================================
   LOAD QUESTIONS
===================================================== */

function loadPDFQuestions(){

  log(
    "Searching for PDF CBT questions..."
  );


  for(
    const key of PDF_KEYS
  ){

    const saved =
      getStorage(key);


    if(!saved){

      continue;

    }


    log(
      "Found storage key:",
      key
    );


    const data =
      parseJSON(saved);


    if(data === null){

      continue;

    }


    const rawQuestions =
      extractQuestionArray(
        data
      );


    if(
      !Array.isArray(rawQuestions) ||
      rawQuestions.length === 0
    ){

      console.warn(
        "Storage key contains no questions:",
        key
      );

      continue;

    }


    log(
      "Raw question count:",
      rawQuestions.length
    );


    const normalized =
      rawQuestions

        .map(
          function(q,index){

            return normalizeQuestion(
              q,
              index
            );

          }
        )

        .filter(Boolean);


    if(normalized.length === 0){

      console.error(
        "Questions were found but none could be normalized."
      );

      continue;

    }


    questions =
      normalized;


    log(
      "PDF CBT LOADED:",
      questions.length,
      "questions"
    );


    log(
      "First question:",
      questions[0].question
    );


    return true;

  }


  console.warn(
    "No PDF questions found in any supported storage key."
  );


  return false;

}


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(){

  const badge =
    document.getElementById(
      "sourceBadge"
    );


  if(badge){

    badge.className =
      "info-box";

    badge.textContent =
      "⏳ Loading PDF-to-CBT questions...";

  }


  const number =
    document.getElementById(
      "questionNumber"
    );


  if(number){

    number.textContent =
      "Please wait...";

  }


  const question =
    document.getElementById(
      "question"
    );


  if(question){

    question.textContent =
      "Reading your imported PDF questions...";

  }

}


/* =====================================================
   SHOW PDF ERROR
===================================================== */

function showPDFError(){

  const badge =
    document.getElementById(
      "sourceBadge"
    );


  if(badge){

    badge.className =
      "error-box";

    badge.innerHTML =
      "<b>⚠️ PDF QUESTIONS NOT FOUND</b><br><br>" +
      "The CBT page cannot find the imported question bank.";


  }


  const number =
    document.getElementById(
      "questionNumber"
    );


  if(number){

    number.textContent =
      "PDF CBT unavailable";

  }


  const question =
    document.getElementById(
      "question"
    );


  if(question){

    question.innerHTML =
      "Your PDF questions are not available in this browser.";

  }


  const options =
    document.getElementById(
      "options"
    );


  if(options){

    options.innerHTML =

      '<div class="error-box">' +

      "<b>Why?</b><br><br>" +

      "The PDF importer and CBT page must use the same browser storage.<br><br>" +

      "Import the PDF again from the PDF → CBT page, then open CBT without clearing browser data." +

      "</div>";

  }


  const palette =
    document.getElementById(
      "palette"
    );


  if(palette){

    palette.innerHTML = "";

  }


  const submit =
    document.getElementById(
      "submitButton"
    );


  if(submit){

    submit.disabled = true;

  }

}


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

  if(initialized){

    return;

  }


  initialized = true;


  showLoading();


  log(
    "CBT initialization started."
  );


  const loaded =
    loadPDFQuestions();


  if(!loaded){

    showPDFError();

    return;

  }


  if(
    !Array.isArray(questions) ||
    questions.length === 0
  ){

    showPDFError();

    return;

  }


  current = 0;

  submitted = false;


  answers =
    new Array(
      questions.length
    ).fill(null);


  marked =
    new Array(
      questions.length
    ).fill(false);


  const badge =
    document.getElementById(
      "sourceBadge"
    );


  if(badge){

    badge.className =
      "success-box";

    badge.textContent =
      "📄 PDF CBT • " +
      questions.length +
      " Questions Loaded";

  }


  renderQuestion();

  renderPalette();

  startTimer();


  log(
    "CBT READY"
  );

}


/* =====================================================
   NEXT PART
===================================================== */
   /* =====================================================
   TIMER
===================================================== */

function updateTimer(){

  const timer =
    document.getElementById(
      "timer"
    );

  if(!timer){
    return;
  }


  const minutes =
    Math.floor(
      timeLeft / 60
    );


  const seconds =
    timeLeft % 60;


  timer.textContent =
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");


  timer.classList.remove(
    "warning",
    "danger"
  );


  if(timeLeft <= 300){

    timer.classList.add(
      "warning"
    );

  }


  if(timeLeft <= 60){

    timer.classList.remove(
      "warning"
    );

    timer.classList.add(
      "danger"
    );

  }

}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

  clearInterval(
    timerInterval
  );


  timeLeft = 1800;


  updateTimer();


  timerInterval =
    setInterval(function(){

      if(submitted){

        clearInterval(
          timerInterval
        );

        return;

      }


      timeLeft--;


      updateTimer();


      if(timeLeft <= 0){

        clearInterval(
          timerInterval
        );

        submitTest();

      }

    },1000);

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

  if(submitted){
    return;
  }


  const q =
    questions[current];


  if(!q){

    console.error(
      "Question not found:",
      current
    );

    return;

  }


  /* Question number */

  const number =
    document.getElementById(
      "questionNumber"
    );


  if(number){

    number.textContent =
      "Question " +
      (current + 1) +
      " of " +
      questions.length +
      " • " +
      (
        q.subject ||
        "PDF"
      );

  }


  /* Question */

  const question =
    document.getElementById(
      "question"
    );


  if(question){

    question.textContent =
      q.question;

  }


  /* Options */

  const box =
    document.getElementById(
      "options"
    );


  if(!box){
    return;
  }


  box.innerHTML = "";


  q.options.forEach(
    function(option,index){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "option";


      if(
        answers[current] === index
      ){

        button.classList.add(
          "selected"
        );

      }


      button.textContent =
        String.fromCharCode(
          65 + index
        ) +
        ". " +
        option;


      button.onclick =
        function(){

          if(submitted){
            return;
          }


          answers[current] =
            index;


          renderQuestion();

        };


      box.appendChild(
        button
      );

    }
  );


  /* Previous */

  const previous =
    document.getElementById(
      "previousButton"
    );


  if(previous){

    previous.disabled =
      current === 0;

  }


  /* Next */

  const next =
    document.getElementById(
      "nextButton"
    );


  if(next){

    next.textContent =
      current ===
      questions.length - 1
      ? "Finish"
      : "Next";

  }


  renderPalette();

}


/* =====================================================
   QUESTION PALETTE
===================================================== */

function renderPalette(){

  const palette =
    document.getElementById(
      "palette"
    );


  if(!palette){
    return;
  }


  palette.innerHTML = "";


  questions.forEach(
    function(q,index){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.textContent =

function classifyMistake(
  q,
  selectedIndex
){

  const text =
    String(
      q.question || ""
    ).toLowerCase();


  /* Calculation */

  if(

    text.includes("calculate") ||
    text.includes("numerical") ||
    text.includes("find the") ||
    text.includes("value of") ||
    text.includes("velocity") ||
    text.includes("acceleration") ||
    text.includes("force") ||
    text.includes("mass") ||
    text.includes("energy") ||
    text.includes("work done")

  ){

    return {

      type:
        "🔢 Calculation Error",

      reason:
        "Recheck the formula, units and calculation steps."

    };

  }


  /* Memory */

  if(

    text.includes("which") ||
    text.includes("what is") ||
    text.includes("symbol") ||
    text.includes("unit") ||
    text.includes("known as") ||
    text.includes("called")

  ){

    return {

      type:
        "📚 Memory / Recall Gap",

      reason:
        "Revise the relevant factual information and test recall again."

    };

  }


  /* Default */

  return {

    type:
      "🧠 Concept Gap",

    reason:
      "Review the underlying concept and retry the question."

  };

}

/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    if(submitted){
        return;
    }


    if(
        !questions.length
    ){

        return;

    }


    let correct = 0;

    let incorrect = 0;

    let skipped = 0;


    questions.forEach(function(q,index){

        if(
            answers[index] === null
        ){

            skipped++;

        }
        else if(
            answers[index] === q.answer
        ){

            correct++;

        }
        else{

            incorrect++;

        }

    });


    const score =
        (correct * 4) -
        incorrect;


    saveHistory(
        correct,
        incorrect,
        skipped,
        score
    );


    submitted = true;


    clearInterval(
        timerInterval
    );


    const testScreen =
        document.getElementById(
            "testScreen"
        );


    const result =
        document.getElementById(
            "result"
        );


    const aside =
        document.querySelector(
            "aside"
        );


    if(testScreen){

        testScreen.style.display =
            "none";

    }


    if(aside){

        aside.style.display =
            "none";

    }


    if(result){

        result.style.display =
            "block";

    }


    const scoreBox =
        document.getElementById(
            "score"
        );


    if(scoreBox){

        scoreBox.textContent =
            score +
            " / " +
            (questions.length * 4);

    }


    const summary =
        document.getElementById(
            "summary"
        );


    if(summary){

        summary.innerHTML =
            "<b>Correct:</b> " +
            correct +
            " &nbsp; | &nbsp; " +

            "<b>Incorrect:</b> " +
            incorrect +
            " &nbsp; | &nbsp; " +

            "<b>Skipped:</b> " +
            skipped;

    }


    /* RESULT STATS */

    const stats =
        document.getElementById(
            "resultStats"
        );


    if(stats){

        stats.innerHTML =

            '<div class="stat">' +
                '<strong>' +
                    correct +
                '</strong>' +
                '<small>Correct</small>' +
            '</div>' +

            '<div class="stat">' +
                '<strong>' +
                    incorrect +
                '</strong>' +
                '<small>Incorrect</small>' +
            '</div>' +

            '<div class="stat">' +
                '<strong>' +
                    skipped +
                '</strong>' +
                '<small>Skipped</small>' +
            '</div>';

    }


    /* RETRY BUTTON */

    const retry =
        document.getElementById(
            "retryButton"
        );


    if(retry){

        if(incorrect > 0){

            retry.style.display =
                "block";

            retry.textContent =
                "🔄 Retry " +
                incorrect +
                " Mistake" +
                (
                    incorrect === 1

                    : "s"
                );

        }

            retry.style.display =

        }

    }


    generateReview();

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
