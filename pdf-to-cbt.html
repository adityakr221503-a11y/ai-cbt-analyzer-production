<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — PDF to CBT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:15px 18px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:inherit;
cursor:pointer;
touch-action:manipulation;
}

.btn{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.container{
max-width:1000px;
margin:22px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
line-height:1.6;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.upload{
border:2px dashed #cbd5e1;
border-radius:14px;
padding:30px 20px;
text-align:center;
}

.upload input{
display:none;
}

.upload label{
display:inline-block;
background:#4f46e5;
color:#fff;
padding:14px 18px;
border-radius:10px;
font-weight:800;
cursor:pointer;
}

.status{
margin-top:15px;
padding:13px;
border-radius:10px;
background:#eef2ff;
color:#3730a3;
font-weight:700;
line-height:1.5;
}

.status.warning{
background:#fff7ed;
color:#9a3412;
}

.status.success{
background:#ecfdf5;
color:#166534;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.question-title{
font-weight:800;
margin-bottom:10px;
}

.option{
margin:7px 0;
padding:10px;
background:#f8fafc;
border-radius:8px;
line-height:1.5;
}

.answer-select{
margin-top:12px;
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
background:#fff;
}

.answer-source{
margin-top:8px;
font-size:13px;
font-weight:700;
color:#64748b;
}

.meta{
margin-top:10px;
padding:10px;
background:#f8fafc;
border-radius:9px;
font-size:13px;
color:#475569;
line-height:1.5;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

.actions button{
flex:1;
min-width:160px;
}

.hidden{
display:none;
}

.info{
background:#f8fafc;
padding:14px;
border-radius:10px;
line-height:1.6;
margin-bottom:12px;
}

.warning-box{
background:#fff7ed;
color:#9a3412;
}

.success-box{
background:#ecfdf5;
color:#166534;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#e0e7ff;
color:#3730a3;
font-size:12px;
font-weight:800;
margin:3px;
}

@media(max-width:600px){

.container{
margin:15px auto;
}

.actions{
display:grid;
grid-template-columns:1fr;
}

.actions button{
width:100%;
}

.header{
align-items:flex-start;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="btn secondary"
type="button"
onclick="location.href='index.html'">

Dashboard

</button>

</div>

</header>


<div class="container">

<section class="hero">

<h1>📄 PDF → CBT</h1>

<p>
Import MCQs, detect answer keys, track PDF pages and chapters,
verify answers, and launch a proper CBT.
</p>

</section>


<section class="card">

<h2>📤 Upload Question PDF</h2>

<div class="upload">

<p>
Works best with text-based PDFs containing numbered MCQs.
</p>

<input
id="pdfFile"
type="file"
accept="application/pdf">

<label for="pdfFile">
Choose PDF
</label>

<div
id="status"
class="status hidden">
</div>

</div>

</section>


<section
id="summaryCard"
class="card hidden">

<h2>📊 Import Summary</h2>

<div id="summary"></div>

</section>


<section
id="previewCard"
class="card hidden">

<h2>📝 Imported Questions</h2>

<div
id="questionCount"
class="info">
</div>

<div id="preview"></div>

<div class="actions">

<button
class="btn primary"
type="button"
onclick="startCBT()">

🚀 Start CBT

</button>

<button
class="btn secondary"
type="button"
onclick="clearImport()">

Clear

</button>

</div>

</section>

</div>


<script>

"use strict";


/* =====================================================
STATE
===================================================== */

let importedQuestions=[];

let detectedAnswerKey={};

let pdfPages=[];


/* =====================================================
ELEMENTS
===================================================== */

const pdfFile=
document.getElementById("pdfFile");

const statusBox=
document.getElementById("status");

const previewCard=
document.getElementById("previewCard");

const preview=
document.getElementById("preview");

const questionCount=
document.getElementById("questionCount");

const summaryCard=
document.getElementById("summaryCard");

const summary=
document.getElementById("summary");


/* =====================================================
PDF UPLOAD
===================================================== */

pdfFile.addEventListener(
"change",
async function(){

const file=
pdfFile.files[0];

if(!file){

return;

}


if(file.type!=="application/pdf"){

showStatus(
"❌ Please select a PDF file.",
"warning"
);

return;

}


showStatus(
"📖 Reading PDF page-by-page...",
""
);


try{

await loadPDFLibrary();


const buffer=
await file.arrayBuffer();


const pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;


pdfPages=[];

let fullText="";


for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page=
await pdf.getPage(pageNumber);


const content=
await page.getTextContent();


const pageText=
content.items
.map(function(item){

return item.str||"";

})
.join(" ");


const cleanPage=
normalizeText(pageText);


pdfPages.push({

page:pageNumber,

text:cleanPage

});


fullText+=
"\n"+cleanPage;

}


if(
fullText.replace(/\s/g,"").length<100
){

showStatus(
"⚠️ This PDF appears to be scanned/image-only. Text extraction found too little text.",
"warning"
);

return;

}


/* Answer-key detection */

detectedAnswerKey=
detectAnswerKeyFromSections(
pdfPages
);


/* Question detection */

importedQuestions=
parseMCQsFromPages(
pdfPages
);


/* Remove duplicates */

importedQuestions=
removeDuplicates(
importedQuestions
);


/* Apply detected answers */

applyAnswerKey();


if(
importedQuestions.length===0
){

showStatus(
"⚠️ PDF loaded, but no clear MCQs were detected. Try a PDF with numbered questions and A/B/C/D options.",
"warning"
);

previewCard.classList.add("hidden");

summaryCard.classList.add("hidden");

return;

}


showStatus(
"✅ "+
importedQuestions.length+
" question(s) detected. Verify every answer before starting the CBT.",
"success"
);


renderSummary();

renderQuestions();


}catch(error){

console.error(error);


showStatus(
"❌ Could not read this PDF. Please try another PDF.",
"warning"
);

}

});


/* =====================================================
STATUS
===================================================== */

function showStatus(
message,
type
){

statusBox.classList.remove(
"hidden",
"warning",
"success"
);

statusBox.textContent=
message;


if(type){

statusBox.classList.add(type);

}

}


/* =====================================================
LOAD PDF.JS
===================================================== */

function loadPDFLibrary(){

if(window.pdfjsLib){

return Promise.resolve();

}


return new Promise(
function(resolve,reject){

const script=
document.createElement("script");


script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";


script.onload=function(){

if(window.pdfjsLib){

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

resolve();

}else{

reject(
new Error(
"PDF library unavailable"
)
);

}

};


script.onerror=function(){

reject(
new Error(
"Could not load PDF library"
)
);

};


document.head.appendChild(
script
);

});

}


/* =====================================================
NORMALIZE TEXT
===================================================== */

function normalizeText(text){

return String(text||"")

.replace(
/\u00a0/g,
" "
)

.replace(
/\r/g,
" "
)

.replace(
/[ \t]+/g,
" "
)

.replace(
/\n+/g,
" "
)

.trim();

}


/* =====================================================
QUESTION PARSER
===================================================== */

function parseMCQsFromPages(
pages
){

const questions=[];


for(
let p=0;
p<pages.length;
p++
){

const page=
pages[p];

const clean=
page.text;


const matches=[];

const questionRegex=
/(?:^|\s)(?:Question\s*)?Q?\.?\s*(\d{1,4})\s*[.)\-:]\s*/gi;


let match;


while(
(match=
questionRegex.exec(clean))!==null
){

matches.push({

number:Number(
match[1]
),

start:
match.index+
match[0].length

});

}


for(
let i=0;
i<matches.length;
i++
){

const current=
matches[i];


const next=
matches[i+1];


const blockEnd=
next
?next.start
:clean.length;


const block=
clean.slice(
current.start,
blockEnd
).trim();


const optionResult=
parseOptions(block);


if(!optionResult){

continue;

}


const questionText=
block.slice(
0,
optionResult.start
).trim();


if(!questionText){

continue;

}


const chapter=
detectChapter(clean);


const section=
detectSection(clean);


questions.push({

number:
current.number,

question:
cleanQuestion(
questionText
),

options:
optionResult.options,

answer:
null,

answerSource:
"Not detected",

sourceType:
"PDF",

pdfPage:
page.page,

pdfPageEnd:
page.page,

chapter:
chapter,

section:
section,

subject:
"Imported",

topic:
section||
chapter||
"PDF Import",

solution:
"",

explanation:
""

});

}

}


return questions;

}


/* =====================================================
OPTION PARSER
===================================================== */

function parseOptions(
block
){

const optionRegex=
/(?:^|\s)(?:\(?([A-D])\)?\s*[.)\-:])\s*/gi;


let matches=[];

let match;


while(
(match=
optionRegex.exec(block))!==null
){

matches.push({

letter:
match[1].toUpperCase(),

start:
match.index+
match[0].length,

markerStart:
match.index

});

}


if(
matches.length<2
){

return null;

}


const options=[];


for(
let i=0;
i<matches.length;
i++
){

const start=
matches[i].start;


const end=
matches[i+1]
?matches[i+1].markerStart
:block.length;


const value=
block.slice(
start,
end
).trim();


if(value){

options.push({

letter:
matches[i].letter,

text:
cleanOption(value)

});

}

}


const finalOptions=
options.slice(0,4);


const letters=
finalOptions.map(
function(x){

return x.letter;

});


if(
!letters.includes("A")||
!letters.includes("B")
){

return null;

}


return {

start:
matches[0].markerStart,

options:
finalOptions.map(
function(x){

return x.text;

})

};

}


/* =====================================================
CLEAN QUESTION
===================================================== */

function cleanQuestion(
text
){

return String(text||"")

.replace(
/^\s+/,
""
)

.replace(
/\s+/g,
" "
)

.trim();

}


/* =====================================================
CLEAN OPTION
===================================================== */

function cleanOption(
text
){

return String(text||"")

.replace(
/\s+/g,
" "
)

.trim();

}


/* =====================================================
CHAPTER DETECTION
===================================================== */

function detectChapter(
pageText
){

const patterns=[

/(?:chapter|chap\.?)\s*[:\-]?\s*(?:no\.?\s*)?(\d{1,3})\s*[:\-–]\s*([^|]{3,100})/i,

/(?:chapter)\s+(\d{1,3})\s+([^|]{3,100})/i

];


for(
const pattern of patterns
){

const match=
pageText.match(
pattern
);


if(match){

return (
"Chapter "+
match[1]+
": "+
match[2]
).trim();

}

}


return "";

}


/* =====================================================
SECTION DETECTION
===================================================== */

function detectSection(
pageText
){

const patterns=[

/(?:topic|section)\s*[:\-]\s*([^|]{3,100})/i

];


for(
const pattern of patterns
){

const match=
pageText.match(
pattern
);


if(match){

return match[1].trim();

}

}


return "";

}


/* =====================================================
ANSWER KEY DETECTION
===================================================== */

function detectAnswerKeyFromSections(
pages
){

const result={};


for(
const page of pages
){

const text=
page.text;


/*
Only inspect pages that appear
to contain an answer-key section.
*/

const isKeyPage=
/answer\s*key|answers?\s*(?:key|:)|correct\s*answers?/i
.test(text);


if(!isKeyPage){

continue;

}


const regex=
/(?:Q(?:uestion)?\.?\s*)?(\d{1,4})\s*[\.\):=\-]?\s*([A-D])(?=\s|$)/gi;


let match;


while(
(match=
regex.exec(text))!==null
){

const number=
Number(match[1]);


const letter=
match[2].toUpperCase();


if(
number>0 &&
number<10000
){

result[number]={

letter:
letter,

page:
page.page,

source:
"Detected from answer-key section"

};

}

}

}


return result;

}


/* =====================================================
APPLY ANSWER KEY
===================================================== */

function applyAnswerKey(){

importedQuestions.forEach(
function(q){

const key=
detectedAnswerKey[
q.number
];


if(!key){

return;

}


const index=
["A","B","C","D"]
.indexOf(
key.letter
);


if(
index>=0 &&
index<q.options.length
){

q.answer=
index;

q.answerSource=
"Detected from answer key • PDF page "+
key.page;

}

});

}


/* =====================================================
DUPLICATE REMOVAL
===================================================== */

function removeDuplicates(
list
){

const seen=
new Set();


return list.filter(
function(q){

const key=
q.question
.toLowerCase()
.replace(/\s+/g," ")
.trim();


if(
seen.has(key)
){

return false;

}


seen.add(key);

return true;

});

}


/* =====================================================
SUMMARY
===================================================== */

function renderSummary(){

summaryCard.classList.remove(
"hidden"
);


let answerDetected=0;

let answerNotDetected=0;

const pages=
new Set();


importedQuestions.forEach(
function(q){

pages.add(
q.pdfPage
);


if(
q.answer!==null
){

answerDetected++;

}else{

answerNotDetected++;

}

});


const keyDetected=
Object.keys(
detectedAnswerKey
).length>0;


summary.innerHTML=

"<div class='info'>"+

"<span class='badge'>Questions: "+
importedQuestions.length+
"</span>"+

"<span class='badge'>PDF pages: "+
pages.size+
"</span>"+

"<span class='badge'>Answers detected: "+
answerDetected+
"</span>"+

"<span class='badge'>Need verification: "+
answerNotDetected+
"</span>"+

"</div>"+

"<div class='info "+
(keyDetected
?"success-box"
:"warning-box")+
"'>"+

(
keyDetected

?

"🔑 Answer-key section detected. The detected answers will be used internally by the CBT. Correct answers will NOT be shown during the test."

:

"⚠️ No answer-key section was confidently detected. Verify every answer before starting the CBT."

)+

"</div>"+

"<div class='info'>"+
"📄 PDF page numbers and chapter/section metadata are stored with each question for the post-test source analysis layer."+
"</div>";

}


/* =====================================================
RENDER QUESTIONS
===================================================== */

function renderQuestions(){

preview.innerHTML="";

previewCard.classList.remove(
"hidden"
);


questionCount.textContent=
"Detected "+
importedQuestions.length+
" question(s). Verify every correct answer before starting the CBT.";


importedQuestions.forEach(
function(q,index){

const card=
document.createElement("div");


card.className=
"question";


let html=

"<div class='question-title'>"+
"Question "+
(index+1)+
(q.number
?" — PDF #"+q.number
:"")+
"</div>";


html+=

"<div style='line-height:1.6;font-weight:700'>"+
escapeHTML(q.question)+
"</div>";


q.options.forEach(
function(option,optionIndex){

html+=

"<div class='option'>"+
"<strong>"+
String.fromCharCode(
65+optionIndex
)+
".</strong> "+
escapeHTML(option)+
"</div>";

});


html+=

"<select class='answer-select' data-index='"+index+"'>"+
"<option value=''>Select correct answer</option>";


q.options.forEach(
function(option,optionIndex){

const selected=
q.answer===optionIndex
?" selected"
:"";


html+=

"<option value='"+optionIndex+"'"+
selected+
">Correct: "+
String.fromCharCode(
65+optionIndex
)+
" — "+
escapeHTML(option)+
"</option>";

});


html+=
"</select>";


html+=

"<div class='answer-source'>"+
"Answer source: "+
escapeHTML(q.answerSource)+
"</div>";


html+=

"<div class='meta'>"+
"📄 PDF page: "+
escapeHTML(q.pdfPage)+
(q.chapter
?"<br>📚 Chapter: "+
escapeHTML(q.chapter)
:"")+
(q.section
?"<br>📌 Section: "+
escapeHTML(q.section)
:"")+
"</div>";


card.innerHTML=
html;


preview.appendChild(
card
);

});

}


/* =====================================================
START CBT
===================================================== */

function startCBT(){

if(
importedQuestions.length===0
){

alert(
"No questions are available."
);

return;

}


const selects=
document.querySelectorAll(
".answer-select"
);


let missing=false;


selects.forEach(
function(select){

const index=
Number(select.dataset.index);


if(
select.value===""
){

missing=true;

return;

}


importedQuestions[index].answer=
Number(select.value);


importedQuestions[index].answerSource=
"Verified by user";

});


if(missing){

alert(
"Please select the correct answer for every question before starting the CBT."
);

return;

}


/*
Create clean objects for CBT.
*/

const finalQuestions=
importedQuestions.map(
function(q,index){

return {

id:
"pdf-"+
Date.now()+
"-"+
index,

question:
q.question,

options:
q.options,

answer:
q.answer,

subject:
q.subject||
"Imported",

topic:
q.topic||
"PDF Import",

solution:
q.solution||
"",

explanation:
q.explanation||
"",

source:
"PDF Import",

pdfPage:
q.pdfPage,

pdfPageEnd:
q.pdfPageEnd,

chapter:
q.chapter||
"",

section:
q.section||
"",

answerSource:
q.answerSource||
"Verified by user",

sourceType:
q.sourceType||
"PDF",

bookmarked:
false

};

});


/*
Primary CBT storage.
*/

localStorage.setItem(
"pdfCbtQuestions",
JSON.stringify(
finalQuestions
)
);


/*
Metadata.
*/

localStorage.setItem(
"pdfCbtImportedAt",
String(
Date.now()
)
);


localStorage.setItem(
"pdfCbtQuestionCount",
String(
finalQuestions.length
)
);


localStorage.setItem(
"pdfCbtAnswerKeyDetected",
JSON.stringify(
detectedAnswerKey
)
);


localStorage.setItem(
"pdfCbtSourceMetadata",
JSON.stringify({

fileName:
pdfFile.files[0]
?pdfFile.files[0].name
:"",

questionCount:
finalQuestions.length,

answerKeyDetected:
Object.keys(
detectedAnswerKey
).length>0,

importedAt:
Date.now()

})
);


/*
Compatibility key.
*/

localStorage.setItem(
"importedQuestions",
JSON.stringify(
finalQuestions
)
);


/*
Open existing CBT engine.
*/

window.location.href=
"cbt.html";

}


/* =====================================================
CLEAR
===================================================== */

function clearImport(){

importedQuestions=[];

detectedAnswerKey={};

pdfPages=[];

pdfFile.value="";

preview.innerHTML="";

previewCard.classList.add(
"hidden"
);

summaryCard.classList.add(
"hidden"
);

statusBox.classList.add(
"hidden"
);

questionCount.textContent="";

summary.innerHTML="";

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(
value
){

return String(
value??""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>
</html>
