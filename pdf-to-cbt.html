<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — PDF to CBT</title>

<style>
*{box-sizing:border-box}

font-family:Arial,sans-serif;

color:#0f172a

}

}

border:1px solid #e2e8f0;

}

}

}

}

color:#9a3412
}

color:#166534
}

display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#e0e7ff;
color:#3730a3;
font-size:12px;
font-weight:800;
margin:3px
}

border:2px solid #f59e0b
}

.verified{
border:2px solid #22c55e
}

@media(max-width:600px){
.container{
margin:15px auto
}

.actions{
display:grid;
grid-template-columns:1fr
}

.actions button{
width:100%
}

.header{
align-items:flex-start
}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="btn secondary"
type="button"
onclick="location.href='index.html'">
Dashboard
</button>

</div>
</header>

<div class="container">

<section class="hero">

<h1>📄 PDF → CBT</h1>

<p>
Import MCQs, detect answer keys, preserve PDF pages and chapters,
verify answers, and launch a proper CBT.
</p>

</section>

<section class="card">

<h2>📤 Upload Question PDF</h2>

<div class="upload">

<p>
Works best with text-based PDFs containing numbered MCQs
and A/B/C/D options.
</p>

<input
id="pdfFile"
type="file"
accept="application/pdf">

<label for="pdfFile">
Choose PDF
</label>

<div
id="status"
class="status hidden">
</div>

</div>
</section>

<section
id="summaryCard"
class="card hidden">

<h2>📊 Import Summary</h2>

<div id="summary"></div>

</section>

<section
id="previewCard"
class="card hidden">

<h2>📝 Imported Questions</h2>

<div
id="questionCount"
class="info">
</div>

<div id="preview"></div>

<div class="actions">

<button
class="btn primary"
type="button"
onclick="startCBT()">
🚀 Start CBT
</button>

<button
class="btn secondary"
type="button"
onclick="clearImport()">
Clear
</button>

</div>

</section>

</div>

<script>
"use strict";

/* =====================================================
STATE
===================================================== */

let importedQuestions=[];
let detectedAnswerKey={};
let pdfPages=[];

/* =====================================================
ELEMENTS
===================================================== */

const pdfFile=
document.getElementById("pdfFile");

const statusBox=
document.getElementById("status");

const previewCard=
document.getElementById("previewCard");

const preview=
document.getElementById("preview");

const questionCount=
document.getElementById("questionCount");

const summaryCard=
document.getElementById("summaryCard");

const summary=
document.getElementById("summary");

/* =====================================================
PDF UPLOAD
===================================================== */

pdfFile.addEventListener("change",async function(){

const file=pdfFile.files[0];

if(!file)return;

if(
file.type!=="application/pdf" &&
!file.name.toLowerCase().endsWith(".pdf")
){

showStatus(
"❌ Please select a PDF file.",
"warning"
);

return;
}

showStatus(
"📖 Reading PDF page-by-page...",
""
);

try{

await loadPDFLibrary();

const buffer=
await file.arrayBuffer();

const pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;

pdfPages=[];

let fullText="";

for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page=
await pdf.getPage(pageNumber);

const content=
await page.getTextContent();

const pageText=
content.items
.map(function(item){
return item.str||"";
})
.join(" ");

const cleanPage=
normalizeText(pageText);

pdfPages.push({
page:pageNumber,
text:cleanPage
});

fullText+="\n"+cleanPage;
}

if(
fullText.replace(/\s/g,"").length<100
){

showStatus(
"⚠️ This PDF appears to be scanned/image-only. Text extraction found too little text.",
"warning"
);

return;
}

/* Detect answer key first */

detectedAnswerKey=
detectAnswerKeyFromSections(pdfPages);

/* Detect questions */

importedQuestions=
parseMCQsFromPages(pdfPages);

/* Remove duplicates */

importedQuestions=
removeDuplicates(importedQuestions);

/* Apply answer key */

applyAnswerKey();

if(importedQuestions.length===0){

showStatus(
"⚠️ PDF loaded, but no clear MCQs were detected. Try a numbered MCQ PDF with A/B/C/D options.",
"warning"
);

previewCard.classList.add("hidden");
summaryCard.classList.add("hidden");

return;
}

showStatus(
"✅ "+
importedQuestions.length+
" question(s) detected. Answers detected automatically where possible.",
"success"
);

renderSummary();
renderQuestions();

}catch(error){

console.error(error);

showStatus(
"❌ Could not read this PDF. Please try another PDF.",
"warning"
);

}

});

/* =====================================================
STATUS
===================================================== */

function showStatus(message,type){

statusBox.classList.remove(
"hidden",
"warning",
"success"
);

statusBox.textContent=message;

if(type){
statusBox.classList.add(type);
}

}

/* =====================================================
LOAD PDF.JS
===================================================== */

function loadPDFLibrary(){

if(window.pdfjsLib){
return Promise.resolve();
}

return new Promise(function(resolve,reject){

const script=
document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

script.onload=function(){

if(window.pdfjsLib){

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

resolve();

}else{

reject(new Error("PDF library unavailable"));

}

};

script.onerror=function(){

reject(new Error("Could not load PDF library"));

};

document.head.appendChild(script);

});

}

/* =====================================================
NORMALIZE
===================================================== */

function normalizeText(text){

return String(text||"")
.replace(/\u00a0/g," ")
.replace(/\r/g," ")
.replace(/[ \t]+/g," ")
.replace(/\n+/g," ")
.trim();

}

/* =====================================================
QUESTION PARSER
===================================================== */

function parseMCQsFromPages(pages){

const questions=[];

for(let p=0;p<pages.length;p++){

const page=pages[p];

const clean=page.text;

const matches=[];

const questionRegex=
/(?:^|\s)(?:Question\s*)?Q?\.?\s*(\d{1,4})\s*[.)\-:]\s*/gi;

let match;

while(
(match=questionRegex.exec(clean))!==null
){

matches.push({

number:Number(match[1]),

start:
match.index+
match[0].length

});

}

for(let i=0;i<matches.length;i++){

const current=matches[i];

const next=matches[i+1];

const blockEnd=
next
?next.start
:clean.length;

const block=
clean.slice(
current.start,
blockEnd
).trim();

const optionResult=
parseOptions(block);

if(!optionResult)continue;

const questionText=
block.slice(
0,
optionResult.start
).trim();

if(!questionText)continue;

questions.push({

number:current.number,

question:
cleanQuestion(questionText),

options:
optionResult.options,

answer:null,

answerSource:
"Not detected — verification required",

sourceType:
"PDF",

pdfPage:
page.page,

pdfPageEnd:
page.page,

chapter:
detectChapter(clean),

section:
detectSection(clean),

subject:
"Imported",

topic:
detectSection(clean)||
detectChapter(clean)||
"PDF Import",

solution:"",
explanation:""

});

}

}

return questions;

}

/* =====================================================
OPTION PARSER
===================================================== */

function parseOptions(block){

const optionRegex=
/(?:^|\s)(?:\(?([A-D])\)?\s*[.)\-:])\s*/gi;

const matches=[];

let match;

while(
(match=optionRegex.exec(block))!==null
){

matches.push({

letter:
match[1].toUpperCase(),

start:
match.index+
match[0].length,

markerStart:
match.index

});

}

if(matches.length<2)return null;

const options=[];

for(let i=0;i<matches.length;i++){

const start=matches[i].start;

const end=
matches[i+1]
?matches[i+1].markerStart
:block.length;

const value=
block.slice(start,end).trim();

if(value){

options.push({

letter:matches[i].letter,

text:cleanOption(value)

});

}

}

const finalOptions=
options.slice(0,4);

const letters=
finalOptions.map(function(x){
return x.letter;
});

if(
!letters.includes("A")||
!letters.includes("B")
){

return null;
}

return {

start:matches[0].markerStart,

options:finalOptions.map(function(x){
return x.text;
})

};

}

/* =====================================================
CLEAN
===================================================== */

function cleanQuestion(text){

return String(text||"")
.replace(/\s+/g," ")
.trim();

}

function cleanOption(text){

return String(text||"")
.replace(/\s+/g," ")
.trim();

}

/* =====================================================
CHAPTER
===================================================== */

function detectChapter(pageText){

const patterns=[

/(?:chapter|chap\.?)\s*[:\-]?\s*(?:no\.?\s*)?(\d{1,3})\s*[:\-–]\s*([^|]{3,100})/i,

/(?:chapter)\s+(\d{1,3})\s+([^|]{3,100})/i

];

for(const pattern of patterns){

const match=pageText.match(pattern);

if(match){

return(
"Chapter "+
match[1]+
": "+
match[2]
).trim();

}

}

return "";

}

/* =====================================================
SECTION
===================================================== */

function detectSection(pageText){

const patterns=[

/(?:topic|section)\s*[:\-]\s*([^|]{3,100})/i

];

for(const pattern of patterns){

const match=pageText.match(pattern);

if(match){

return match[1].trim();

}

}

return "";

}

/* =====================================================
ANSWER KEY DETECTION
===================================================== */

function detectAnswerKeyFromSections(pages){

const result={};

for(const page of pages){

const text=page.text;

const isKeyPage=
/answer\s*key|answers?\s*(?:key|:)|correct\s*answers?/i
.test(text);

if(!isKeyPage)continue;

/*
Format examples handled:

1 A
2 B
3 C

1-A
2-B
3-C

1. A
2. B

Q1 A
Q2 B

Answer 1: A
*/

const regex=
/(?:Q(?:uestion)?\s*)?(\d{1,4})\s*(?:[\.\):=\-]|is)?\s*([A-D])(?=\s|$)/gi;

let match;

while(
(match=regex.exec(text))!==null
){

const number=Number(match[1]);

const letter=match[2].toUpperCase();

if(
number>0 &&
number<10000
){

result[number]={

letter:letter,

page:page.page,

source:
"Detected from answer-key section"

};

}

}

}

return result;

}

/* =====================================================
APPLY ANSWER KEY
===================================================== */

function applyAnswerKey(){

importedQuestions.forEach(function(q){

const key=
detectedAnswerKey[q.number];

if(!key)return;

const index=
["A","B","C","D"]
.indexOf(key.letter);

if(
index>=0 &&
index<q.options.length
){

q.answer=index;

q.answerSource=
"Automatically detected from answer key • PDF page "+
key.page;

}

});

}

/* =====================================================
DUPLICATES
===================================================== */

function removeDuplicates(list){

const seen=new Set();

return list.filter(function(q){

const key=
q.question
.toLowerCase()
.replace(/\s+/g," ")
.trim();

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}

/* =====================================================
SUMMARY
===================================================== */

function renderSummary(){

summaryCard.classList.remove("hidden");

let answerDetected=0;
let answerNotDetected=0;

const pages=new Set();

importedQuestions.forEach(function(q){

pages.add(q.pdfPage);

if(q.answer!==null){
answerDetected++;
}else{
answerNotDetected++;
}

});

const keyDetected=
Object.keys(detectedAnswerKey).length>0;

summary.innerHTML=

"<div class='info'>"+

"<span class='badge'>Questions: "+
importedQuestions.length+
"</span>"+

"<span class='badge'>PDF pages: "+
pages.size+
"</span>"+

"<span class='badge'>Answers detected: "+
answerDetected+
"</span>"+

"<span class='badge'>Need verification: "+
answerNotDetected+
"</span>"+

"</div>"+

"<div class='info "+
(keyDetected?"success-box":"warning-box")+
"'>"+

(
keyDetected

?

"🔑 Answer-key section detected. Detected answers are already accepted by the CBT. You can change any answer before starting."

:

"⚠️ No answer-key section was confidently detected. Questions without an answer must be verified before starting."

)+

"</div>"+

"<div class='info'>"+
"📄 PDF page, chapter and section information is preserved for CBT analysis."
+"</div>";

}

/* =====================================================
RENDER QUESTIONS
===================================================== */

function renderQuestions(){

preview.innerHTML="";

previewCard.classList.remove("hidden");

const missing=
importedQuestions.filter(function(q){
return q.answer===null;
}).length;

questionCount.innerHTML=
"Detected "+
importedQuestions.length+
" question(s). "+
(
missing===0
?"✅ All answers are ready. You can start CBT."
:"⚠️ "+missing+" question(s) need answer verification."
);

importedQuestions.forEach(function(q,index){

const card=
document.createElement("div");

card.className="question";

if(q.answer===null){
card.classList.add("verify");
}else{
card.classList.add("verified");
}

let html=

"<div class='question-title'>"+
"Question "+
(index+1)+
" — PDF #"+
q.number+
"</div>";

html+=

"<div style='line-height:1.6;font-weight:700'>"+
escapeHTML(q.question)+
"</div>";

q.options.forEach(function(option,optionIndex){

html+=

"<div class='option'>"+
"<strong>"+
String.fromCharCode(65+optionIndex)+
".</strong> "+
escapeHTML(option)+
"</div>";

});

html+=

"<select class='answer-select' data-index='"+index+"'>"+
"<option value=''>"+
(
q.answer===null
?"⚠️ Select correct answer"
:"✅ Answer "+String.fromCharCode(65+q.answer)+" already detected"
)+
"</option>";

q.options.forEach(function(option,optionIndex){

const selected=
q.answer===optionIndex
?" selected"
:"";

html+=

"<option value='"+optionIndex+"'"+
selected+
">Correct: "+
String.fromCharCode(65+optionIndex)+
" — "+
escapeHTML(option)+
"</option>";

});

html+="</select>";

html+=

"<div class='answer-source'>"+
"Answer source: "+
escapeHTML(q.answerSource)+
"</div>";

html+=

"<div class='meta'>"+
"📄 PDF page: "+
escapeHTML(q.pdfPage)+
(q.chapter
?"<br>📚 Chapter: "+
escapeHTML(q.chapter)
:"")+
(q.section
?"<br>📌 Section: "+
escapeHTML(q.section)
:"")+
"</div>";

card.innerHTML=html;

preview.appendChild(card);

});

}

/* =====================================================
FINAL START CBT
===================================================== */

function startCBT(){

if(
!importedQuestions||
importedQuestions.length===0
){

alert("No questions are available.");

return;
}

/*
Read any manual changes.
Detected answers remain valid.
*/

const selects=
document.querySelectorAll(".answer-select");

selects.forEach(function(select){

const index=
Number(select.dataset.index);

if(select.value!==""){

importedQuestions[index].answer=
Number(select.value);

importedQuestions[index].answerSource=
"Verified by user";

}

});

/*
Check only genuinely missing answers.
*/

const missingQuestions=
importedQuestions.filter(function(q){

return(
q.answer===null||
q.answer===undefined||
typeof q.answer!=="number"||
q.answer<0||
q.answer>=q.options.length
);

});

if(missingQuestions.length>0){

alert(
"⚠️ "+
missingQuestions.length+
" question(s) still need a correct answer. Please verify those questions."
);

return;
}

/*
Create final CBT questions.
*/

const finalQuestions=
importedQuestions.map(function(q,index){

return{

id:
"pdf-"+
Date.now()+
"-"+
index,

question:q.question,

options:q.options,

answer:q.answer,

subject:q.subject||"Imported",

topic:q.topic||"PDF Import",

solution:q.solution||"",

explanation:q.explanation||"",

source:"PDF Import",

sourceType:q.sourceType||"PDF",

pdfPage:q.pdfPage||"",

pdfPageEnd:
q.pdfPageEnd||
q.pdfPage||
"",

chapter:q.chapter||"",

section:q.section||"",

answerSource:
q.answerSource||"Verified",

bookmarked:false

};

});

/*
MAIN CBT STORAGE
*/

localStorage.setItem(
"pdfCbtQuestions",
JSON.stringify(finalQuestions)
);

/*
Compatibility storage
*/

localStorage.setItem(
"importedQuestions",
JSON.stringify(finalQuestions)
);

/*
Metadata
*/

localStorage.setItem(
"pdfCbtImportedAt",
String(Date.now())
);

localStorage.setItem(
"pdfCbtQuestionCount",
String(finalQuestions.length)
);

localStorage.setItem(
"pdfCbtAnswerKeyDetected",
JSON.stringify(detectedAnswerKey)
);

localStorage.setItem(
"pdfCbtSourceMetadata",
JSON.stringify({

fileName:
pdfFile.files[0]
?pdfFile.files[0].name
:"",

questionCount:
finalQuestions.length,

answerKeyDetected:
Object.keys(detectedAnswerKey).length>0,

importedAt:Date.now()

})
);

/*
Open CBT.
*/

window.location.href="cbt.html";

}

/* =====================================================
CLEAR
===================================================== */

function clearImport(){

importedQuestions=[];

detectedAnswerKey={};

pdfPages=[];

pdfFile.value="";

preview.innerHTML="";

previewCard.classList.add("hidden");

summaryCard.classList.add("hidden");

statusBox.classList.add("hidden");

questionCount.textContent="";

summary.innerHTML="";

}

/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
