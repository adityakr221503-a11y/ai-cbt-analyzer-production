<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — PDF to CBT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:15px 18px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{color:#4f46e5}

button{
font-family:inherit;
cursor:pointer;
touch-action:manipulation;
}

.btn{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.container{
max-width:1000px;
margin:22px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:20px;
}

.hero h1{margin:0 0 8px}

.hero p{
margin:0;
line-height:1.6;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.upload{
border:2px dashed #cbd5e1;
border-radius:14px;
padding:30px 20px;
text-align:center;
}

.upload input{display:none}

.upload label{
display:inline-block;
background:#4f46e5;
color:#fff;
padding:14px 18px;
border-radius:10px;
font-weight:800;
cursor:pointer;
}

.status{
margin-top:15px;
padding:13px;
border-radius:10px;
background:#eef2ff;
color:#3730a3;
font-weight:700;
line-height:1.5;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.question-title{
font-weight:800;
margin-bottom:10px;
}

.option{
margin:7px 0;
padding:10px;
background:#f8fafc;
border-radius:8px;
line-height:1.5;
}

.answer-select{
margin-top:12px;
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
background:#fff;
}

margin-top:8px;
font-size:13px;
font-weight:700;
color:#64748b;
}

.actions{
display:flex;
gap:10px;

margin-top:18px;
}

.actions button{
flex:1;
min-width:160px;
}

.info{
background:#f8fafc;
padding:14px;
border-radius:10px;

margin-bottom:12px;
}

.warning{
background:#fff7ed;
color:#9a3412;
}

.success{
background:#ecfdf5;
color:#166534;
}

.empty{
text-align:center;
color:#64748b;
padding:25px;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#e0e7ff;
color:#3730a3;
font-size:12px;
font-weight:800;
margin:3px;
}

@media(max-width:600px){

.container{
margin:15px auto;
}

display:grid;
grid-template-columns:1fr;
}

}

.header{

}

}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="btn secondary"
type="button"
onclick="location.href='index.html'">
Dashboard
</button>

</div>
</header>


<div class="container">

<section class="hero">

<h1>📄 PDF → CBT</h1>

<p>
Upload a question PDF, automatically detect MCQs and answer keys,
verify the imported questions, and launch a CBT.
</p>

</section>


<section class="card">

<h2>📤 Upload Question PDF</h2>

<div class="upload">

<p>
Works best with text-based PDFs containing numbered MCQs.
</p>

<input
id="pdfFile"
type="file"
accept="application/pdf">

<label for="pdfFile">
Choose PDF
</label>

<div
id="status"
class="status hidden">
</div>

</div>

</section>


<section
id="summaryCard"
class="card hidden">

<h2>📊 Import Summary</h2>

<div id="summary"></div>

</section>


<section
id="previewCard"
class="card hidden">

<h2>📝 Imported Questions</h2>

<div
id="questionCount"
class="info">
</div>

<div id="preview"></div>

<div class="actions">

<button
class="btn primary"
type="button"
onclick="startCBT()">
🚀 Start CBT
</button>

<button
class="btn secondary"
type="button"
onclick="clearImport()">
Clear
</button>

</div>

</section>

</div>


<script>

"use strict";


/* =========================================================
STATE
========================================================= */

let importedQuestions=[];
let detectedAnswerKey={};


/* =========================================================
ELEMENTS
========================================================= */

const pdfFile=document.getElementById("pdfFile");
const statusBox=document.getElementById("status");
const previewCard=document.getElementById("previewCard");
const preview=document.getElementById("preview");
const questionCount=document.getElementById("questionCount");
const summaryCard=document.getElementById("summaryCard");
const summary=document.getElementById("summary");


/* =========================================================
PDF UPLOAD
========================================================= */

pdfFile.addEventListener("change",async function(){

const file=pdfFile.files[0];

if(!file)return;

if(file.type!=="application/pdf"){

showStatus(
"❌ Please select a PDF file.",
"warning"
);

return;
}

showStatus(
"📖 Reading PDF and analysing questions...",
""
);

try{

await loadPDFLibrary();

const buffer=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument({
data:buffer
}).promise;

let pages=[];
let fullText="";

for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page=await pdf.getPage(pageNumber);

const content=await page.getTextContent();

const pageText=content.items
.map(item=>item.str||"")
.join(" ");

pages.push(pageText);

fullText+="\n"+pageText;

}

if(fullText.replace(/\s/g,"").length<100){

showStatus(
"⚠️ This PDF appears to be scanned/image-only. No usable text was extracted. OCR support is required for this type of PDF.",
"warning"
);

return;
}


/* Detect answer key before parsing questions. */

detectedAnswerKey=
detectAnswerKey(fullText);


/* Parse questions. */

importedQuestions=
parseMCQs(fullText);


/* Remove duplicates. */

importedQuestions=
removeDuplicates(importedQuestions);


/* Apply detected answer key. */

applyAnswerKey();


if(importedQuestions.length===0){

showStatus(
"⚠️ PDF loaded, but no clear MCQs were detected. Try a PDF with numbered questions and A/B/C/D options.",
"warning"
);

previewCard.classList.add("hidden");
summaryCard.classList.add("hidden");

return;
}


showStatus(
"✅ "+importedQuestions.length+
" question(s) detected. Please verify the answers below.",
"success"
);

renderSummary();
renderQuestions();

}catch(error){

console.error(error);

showStatus(
"❌ Could not read this PDF. Please try another PDF.",
"warning"
);

}

});


/* =========================================================
STATUS
========================================================= */

function showStatus(message,type){

statusBox.classList.remove("hidden");

statusBox.textContent=message;

statusBox.classList.remove(
"warning",
"success"
);

if(type){

statusBox.classList.add(type);

}

}


/* =========================================================
LOAD PDF.JS
========================================================= */

function loadPDFLibrary(){

if(window.pdfjsLib){

return Promise.resolve();

}

return new Promise(function(resolve,reject){

const script=document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

script.onload=function(){

if(window.pdfjsLib){

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

resolve();

}else{

reject(
new Error("PDF library unavailable")
);

}

};

script.onerror=function(){

reject(
new Error("Could not load PDF library")
);

};

document.head.appendChild(script);

});

}


/* =========================================================
NORMALIZE TEXT
========================================================= */

function normalizeText(text){

return String(text||"")
.replace(/\u00a0/g," ")
.replace(/\r/g," ")
.replace(/[ \t]+/g," ")
.replace(/\n+/g," ")
.trim();

}


/* =========================================================
QUESTION PARSER
========================================================= */

function parseMCQs(text){

const clean=normalizeText(text);

const questions=[];


/*
Supports:

1. Question
1) Question
Q1. Question
Q.1 Question
Question 1. Question
Question 1) Question
*/

const questionRegex=
/(?:^|\s)(?:Question\s*)?Q?\.?\s*(\d{1,4})\s*[.)\-:]\s*/gi;

let matches=[];
let match;

while((match=questionRegex.exec(clean))!==null){

matches.push({
number:Number(match[1]),
start:match.index+match[0].length
});

}


for(let i=0;i<matches.length;i++){

const current=matches[i];

const next=
matches[i+1];

const end=
next?next.start:clean.length;

const block=
clean.slice(current.start,end).trim();


const optionResult=
parseOptions(block);


if(!optionResult){

continue;

}


const questionText=
block.slice(
0,
optionResult.start
).trim();


if(!questionText){

continue;

}


questions.push({

number:current.number,

question:cleanQuestion(questionText),

options:optionResult.options,

answer:null,

answerSource:"Not detected",

subject:"Imported",

topic:"PDF Import",

solution:
"Review the original PDF answer key or solution."

});

}


return questions;

}


/* =========================================================
OPTION PARSER
========================================================= */

function parseOptions(block){

/*
Find A/B/C/D markers.

Allows:

A.
A)
(A)
A:
A -

and similar.
*/

const optionRegex=
/(?:^|\s)(?:\(?([A-D])\)?\s*[.)\-:])\s*/gi;

let matches=[];
let match;

while((match=optionRegex.exec(block))!==null){

matches.push({
letter:match[1].toUpperCase(),
start:match.index+match[0].length,
markerStart:match.index
});

}

if(matches.length<2){

return null;

}


const firstOptionStart=
matches[0].markerStart;


const options=[];

for(let i=0;i<matches.length;i++){

const start=matches[i].start;

const end=
matches[i+1]
?matches[i+1].markerStart
:block.length;

const value=
block.slice(start,end).trim();

if(value){

options.push({
letter:matches[i].letter,
text:cleanOption(value)
});

}

}


if(options.length<2){

return null;

}


/* Keep first four options only. */

const finalOptions=
options.slice(0,4);


/*
Require A and B for a normal MCQ.
*/

const letters=
finalOptions.map(x=>x.letter);

if(!letters.includes("A")||!letters.includes("B")){

return null;

}


return {

start:firstOptionStart,

options:finalOptions.map(x=>x.text)

};

}


/* =========================================================
CLEAN QUESTION
========================================================= */

function cleanQuestion(text){

return text
.replace(/^\s+/,"")
.replace(/\s+/g," ")
.trim();

}


/* =========================================================
CLEAN OPTION
========================================================= */

function cleanOption(text){

return text
.replace(/\s+/g," ")
.trim();

}


/* =========================================================
ANSWER KEY DETECTOR
========================================================= */

function detectAnswerKey(text){

const clean=normalizeText(text);

const result={};


/*
Formats supported:

1-A
1. A
1) A
1 A
Q1 A
Answer 1: A
Ans 1: A
*/

const regex=
/(?:Answer|Ans|Q)?\s*(\d{1,4})\s*[\.\):=\-]?\s*([A-D])(?=\s|$)/gi;

let match;

while((match=regex.exec(clean))!==null){

const number=Number(match[1]);

const letter=match[2].toUpperCase();

if(number>0){

result[number]=letter;

}

}


return result;

}


/* =========================================================
APPLY ANSWER KEY
========================================================= */

function applyAnswerKey(){

let detected=0;

importedQuestions.forEach(function(q){

const letter=
detectedAnswerKey[q.number];

if(!letter)return;

const index=
["A","B","C","D"].indexOf(letter);

if(index>=0 && index<q.options.length){

q.answer=index;

q.answerSource="Detected from PDF";

detected++;

}

});

return detected;

}


/* =========================================================
DUPLICATE REMOVAL
========================================================= */

function removeDuplicates(list){

const seen=new Set();

return list.filter(function(q){

const key=
q.question
.toLowerCase()
.replace(/\s+/g," ")
.trim();

if(seen.has(key)){

return false;

}

seen.add(key);

return true;

});

}


/* =========================================================
SUMMARY
========================================================= */

function renderSummary(){

summaryCard.classList.remove("hidden");

let answerDetected=0;

importedQuestions.forEach(function(q){

if(q.answer!==null){

answerDetected++;

}

});


const manual=
importedQuestions.length-answerDetected;


summary.innerHTML=
"<div class='info'>"+
"<span class='badge'>Questions: "+
importedQuestions.length+
"</span>"+
"<span class='badge'>Answers detected: "+
answerDetected+
"</span>"+
"<span class='badge'>Manual verification: "+
manual+
"</span>"+
"</div>"+

"<div class='info "+

(manual===0?"success":"warning")+

"'>"+

(manual===0

?"✅ An answer was detected for every imported question. Still verify the answers before starting."

:"⚠️ Some answers were not detected. Select the correct answer manually for those questions."

)+

"</div>";

}


/* =========================================================
RENDER QUESTIONS
========================================================= */

function renderQuestions(){

preview.innerHTML="";

previewCard.classList.remove("hidden");

questionCount.textContent=
"Detected "+
importedQuestions.length+
" question(s). Verify every answer before starting the CBT.";


importedQuestions.forEach(function(q,index){

const card=document.createElement("div");

card.className="question";


let html=
"<div class='question-title'>"+
"Question "+
(index+1)+
(q.number
?" — PDF #"+q.number
:"")+
"</div>";


html+=
"<div style='line-height:1.6;font-weight:700'>"+
escapeHTML(q.question)+
"</div>";


q.options.forEach(function(option,optionIndex){

html+=
"<div class='option'>"+
"<strong>"+
String.fromCharCode(65+optionIndex)+
".</strong> "+
escapeHTML(option)+
"</div>";

});


html+=
"<select class='answer-select' data-index='"+index+"'>"+
"<option value=''>Select correct answer</option>";


q.options.forEach(function(option,optionIndex){

const selected=
q.answer===optionIndex
?" selected"
:"";


html+=
"<option value='"+optionIndex+"'"+
selected+
">Correct: "+
String.fromCharCode(65+optionIndex)+
" — "+
escapeHTML(option)+
"</option>";

});


html+="</select>";


html+=
"<div class='answer-source'>"+
"Answer source: "+
escapeHTML(q.answerSource)+
"</div>";


card.innerHTML=html;

preview.appendChild(card);

});

}


/* =========================================================
START CBT
========================================================= */

function startCBT(){

if(importedQuestions.length===0){

alert("No questions are available.");

return;

}


const selects=
document.querySelectorAll(".answer-select");


let missing=false;


selects.forEach(function(select){

const index=
Number(select.dataset.index);


if(select.value===""){

missing=true;

return;

}


importedQuestions[index].answer=
Number(select.value);


/*
Manual verification now becomes authoritative.
*/

importedQuestions[index].answerSource=
"Verified by user";

});


if(missing){

alert(
"Please select the correct answer for every question before starting the CBT."
);

return;

}


/*
Normalize data for the existing CBT engine.
*/

const finalQuestions=
importedQuestions.map(function(q,index){

return {

id:
"pdf-"+Date.now()+"-"+index,

question:q.question,

options:q.options,

answer:q.answer,

subject:q.subject||"Imported",

topic:q.topic||"PDF Import",

solution:q.solution||"",

explanation:q.solution||"",

source:"PDF Import",

bookmarked:false

};

});


/*
Primary imported CBT storage.
*/

localStorage.setItem(
"pdfCbtQuestions",
JSON.stringify(finalQuestions)
);


/*
Metadata.
*/

localStorage.setItem(
"pdfCbtImportedAt",
String(Date.now())
);

localStorage.setItem(
"pdfCbtQuestionCount",
String(finalQuestions.length)
);


/*
Compatibility keys.
*/

localStorage.setItem(
"importedQuestions",
JSON.stringify(finalQuestions)
);


/*
Open the EXISTING CBT engine.
Do not change cbt.html.
*/

window.location.href="cbt.html";

}


/* =========================================================
CLEAR
========================================================= */

function clearImport(){

importedQuestions=[];
detectedAnswerKey={};

pdfFile.value="";

preview.innerHTML="";

previewCard.classList.add("hidden");

summaryCard.classList.add("hidden");

statusBox.classList.add("hidden");

questionCount.textContent="";

summary.innerHTML="";

}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
