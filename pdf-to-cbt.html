<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — PDF to CBT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:15px 18px;
}

.header{

gap:10px;
}

font-size:20px;
font-weight:800;

.logo span{color:#4f46e5}

button{
font-family:inherit;
cursor:pointer;

}

.btn{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:800;
}

background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.container{
max-width:1000px;
margin:22px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
line-height:1.6;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.upload{

.upload input{display:none}

.upload label{
display:inline-block;

color:#fff;
padding:14px 18px;

font-weight:800;

}

.status{
margin-top:15px;
padding:13px;
border-radius:10px;
background:#eef2ff;
color:#3730a3;
font-weight:700;
line-height:1.5;
}

.status.warning{
background:#fff7ed;
color:#9a3412;
}

.status.success{
background:#ecfdf5;
color:#166534;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;

}

.question-title{
font-weight:800;
margin-bottom:10px;
}

.option{
margin:7px 0;
padding:10px;
background:#f8fafc;
border-radius:8px;
line-height:1.5;
}

margin-top:12px;
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
background:#fff;
}

.answer-source{
margin-top:8px;
font-size:13px;
font-weight:700;
color:#64748b;
}

.answer-detected{
margin-top:10px;
padding:10px;
border-radius:9px;
background:#ecfdf5;
color:#166534;
font-weight:800;
}

.answer-missing{
margin-top:10px;
padding:10px;
border-radius:9px;
background:#fff7ed;
color:#9a3412;
font-weight:800;
}

.meta{
margin-top:10px;
padding:10px;
background:#f8fafc;
border-radius:9px;
font-size:13px;
color:#475569;
line-height:1.5;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

.actions button{
flex:1;

}

.hidden{display:none}

.info{
background:#f8fafc;
padding:14px;
border-radius:10px;
line-height:1.6;
margin-bottom:12px;
}

.warning-box{
background:#fff7ed;
color:#9a3412;
}

.success-box{
background:#ecfdf5;
color:#166534;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#e0e7ff;
color:#3730a3;
font-size:12px;
font-weight:800;
margin:3px;
}

@media(max-width:600px){

.container{
margin:15px auto;
}

.actions{
display:grid;
grid-template-columns:1fr;
}

.actions button{
width:100%;
}

.header{
align-items:flex-start;
}

}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="btn secondary"
type="button"
onclick="location.href='index.html'">
Dashboard
</button>

</div>
</header>

<div class="container">

<section class="hero">

<h1>📄 PDF → CBT</h1>

<p>
Import MCQs, automatically detect answer keys,
verify answers, preserve PDF page information,
and launch a proper CBT.
</p>

</section>

<section class="card">

<h2>📤 Upload Question PDF</h2>

<div class="upload">

<p>
Works best with text-based PDFs containing numbered MCQs.
</p>

<input
id="pdfFile"
type="file"
accept="application/pdf">

<label for="pdfFile">
Choose PDF
</label>

<div
id="status"
class="status hidden">
</div>

</div>

</section>

<section
id="summaryCard"
class="card hidden">

<h2>📊 Import Summary</h2>

<div id="summary"></div>

</section>

<section
id="previewCard"
class="card hidden">

<h2>📝 Imported Questions</h2>

<div
id="questionCount"
class="info">
</div>

<div id="preview"></div>

<div class="actions">

<button
class="btn primary"
type="button"
onclick="startCBT()">
🚀 Start CBT
</button>

<button
class="btn secondary"
type="button"
onclick="clearImport()">
Clear
</button>

</div>

</section>

</div>

<script>

"use strict";


/* =====================================================
STATE
===================================================== */

let importedQuestions=[];

let detectedAnswerKey={};

let pdfPages=[];


/* =====================================================
ELEMENTS
===================================================== */

const pdfFile=
document.getElementById("pdfFile");

const statusBox=
document.getElementById("status");

const previewCard=
document.getElementById("previewCard");

const preview=
document.getElementById("preview");

const questionCount=
document.getElementById("questionCount");

const summaryCard=
document.getElementById("summaryCard");

const summary=
document.getElementById("summary");


/* =====================================================
UPLOAD
===================================================== */

pdfFile.addEventListener(
"change",
async function(){

const file=pdfFile.files[0];

if(!file)return;

if(file.type!=="application/pdf"){

showStatus(
"❌ Please select a PDF file.",
"warning"
);

return;

}

showStatus(
"📖 Reading PDF page-by-page...",
""
);

try{

await loadPDFLibrary();

const buffer=
await file.arrayBuffer();

const pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;

pdfPages=[];

let fullText="";

for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page=
await pdf.getPage(pageNumber);

const content=
await page.getTextContent();

const pageText=
content.items
.map(function(item){
return item.str||"";
})
.join(" ");

const cleanPage=
normalizeText(pageText);

pdfPages.push({
page:pageNumber,
text:cleanPage
});

fullText+=
"\n"+cleanPage;

}

if(
fullText.replace(/\s/g,"").length<100
){

showStatus(
"⚠️ This PDF appears to be scanned/image-only. Text extraction found too little text.",
"warning"
);

return;

}


/* ANSWER KEY FIRST */

detectedAnswerKey=
detectAnswerKeyFromSections(
pdfPages
);


/* QUESTIONS */

importedQuestions=
parseMCQsFromPages(
pdfPages
);


/* DUPLICATES */

importedQuestions=
removeDuplicates(
importedQuestions
);


/* APPLY ANSWERS */

applyAnswerKey();


if(importedQuestions.length===0){

showStatus(
"⚠️ PDF loaded, but no clear MCQs were detected.",
"warning"
);

previewCard.classList.add("hidden");
summaryCard.classList.add("hidden");

return;

}


const detectedCount=
importedQuestions.filter(function(q){
return q.answer!==null;
}).length;


showStatus(
"✅ "+
importedQuestions.length+
" question(s) detected • "+
detectedCount+
" correct answer(s) detected.",
"success"
);

renderSummary();

renderQuestions();

}
catch(error){

console.error(error);

showStatus(
"❌ Could not read this PDF. Please try another PDF.",
"warning"
);

}

});


/* =====================================================
STATUS
===================================================== */

function showStatus(message,type){

statusBox.classList.remove(
"hidden",
"warning",
"success"
);

statusBox.textContent=message;

if(type){
statusBox.classList.add(type);
}

}


/* =====================================================
PDF.JS
===================================================== */

function loadPDFLibrary(){

if(window.pdfjsLib){
return Promise.resolve();
}

return new Promise(
function(resolve,reject){

const script=
document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

script.onload=function(){

if(window.pdfjsLib){

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

resolve();

}else{

reject(
new Error("PDF library unavailable")
);

}

};

script.onerror=function(){

reject(
new Error("Could not load PDF library")
);

};

document.head.appendChild(script);

});

}


/* =====================================================
NORMALIZE
===================================================== */

function normalizeText(text){

return String(text||"")
.replace(/\u00a0/g," ")
.replace(/\r/g," ")
.replace(/[ \t]+/g," ")
.replace(/\n+/g," ")
.trim();

}


/* =====================================================
QUESTION PARSER
===================================================== */

function parseMCQsFromPages(pages){

const questions=[];

for(let p=0;p<pages.length;p++){

const page=pages[p];

const clean=page.text;

const matches=[];

const questionRegex=
/(?:^|\s)(?:Question\s*)?Q?\.?\s*(\d{1,4})\s*[.)\-:]\s*/gi;

let match;

while(
(match=questionRegex.exec(clean))!==null
){

matches.push({
number:Number(match[1]),
start:
match.index+
match[0].length
});

}

for(let i=0;i<matches.length;i++){

const current=matches[i];

const next=matches[i+1];

const blockEnd=
next
?next.start
:clean.length;

const block=
clean.slice(
current.start,
blockEnd
).trim();

const optionResult=
parseOptions(block);

if(!optionResult)continue;

const questionText=
block.slice(
0,
optionResult.start
).trim();

if(!questionText)continue;

questions.push({

number:current.number,

question:cleanQuestion(questionText),

options:optionResult.options,

answer:null,

answerSource:"Not detected",

sourceType:"PDF",

pdfPage:page.page,

pdfPageEnd:page.page,

chapter:detectChapter(clean),

section:detectSection(clean),

subject:"Imported",

topic:
detectSection(clean)||
detectChapter(clean)||
"PDF Import",

solution:"",
explanation:""

});

}

}

return questions;

}


/* =====================================================
OPTIONS
===================================================== */

function parseOptions(block){

const optionRegex=
/(?:^|\s)(?:\(?([A-D])\)?\s*[.)\-:])\s*/gi;

let matches=[];

let match;

while(
(match=optionRegex.exec(block))!==null
){

matches.push({

letter:match[1].toUpperCase(),

start:
match.index+
match[0].length,

markerStart:match.index

});

}

if(matches.length<2)return null;

const options=[];

for(let i=0;i<matches.length;i++){

const start=matches[i].start;

const end=
matches[i+1]
?matches[i+1].markerStart
:block.length;

const value=
block.slice(start,end).trim();

if(value){

options.push({
letter:matches[i].letter,
text:cleanOption(value)
});

}

}

const finalOptions=
options.slice(0,4);

const letters=
finalOptions.map(function(x){
return x.letter;
});

if(
!letters.includes("A")||
!letters.includes("B")
){
return null;
}

return{

start:matches[0].markerStart,

options:
finalOptions.map(function(x){
return x.text;
})

};

}


/* =====================================================
ANSWER KEY DETECTION
===================================================== */

function detectAnswerKeyFromSections(pages){

const result={};

for(const page of pages){

const text=String(page.text||"");

const keyPage=
/answer\s*key|answer\s*keys|correct\s*answers?|solutions?\s*key/i
.test(text);

if(!keyPage)continue;


/*
Supports:

1-A 2-B
1. A 2. B
1) A 2) B
Q1 A
Q2 B
1:A
1 A
*/
const regex=
/(?:Q(?:uestion)?\s*)?(\d{1,4})\s*(?:[\.\)\:\-=\|]\s*|\s+)([A-D])\b/gi;

let match;

while(
(match=regex.exec(text))!==null
){

const number=Number(match[1]);

const letter=match[2].toUpperCase();

if(
number>0 &&
number<10000 &&
["A","B","C","D"].includes(letter)
){

result[number]={
letter:letter,
page:page.page,
source:
"Detected from answer-key section"
};

}

}

}


/*
Second compact pass.
*/

for(const page of pages){

const text=String(page.text||"");

if(
!/answer\s*key|correct\s*answers?|solutions?/i
.test(text)
){
continue;
}

const compact=
/(\d{1,4})\s*[-.:)]\s*([A-D])/gi;

let match;

while(
(match=compact.exec(text))!==null
){

const number=Number(match[1]);

const letter=match[2].toUpperCase();

if(
number>0 &&
number<10000 &&
!result[number]
){

result[number]={
letter:letter,
page:page.page,
source:
"Detected from answer-key section"
};

}

}

}

console.log(
"Detected answer key:",
result
);

return result;

}


/* =====================================================
APPLY ANSWER KEY
===================================================== */

function applyAnswerKey(){

importedQuestions.forEach(function(q){

const key=
detectedAnswerKey[q.number];

if(!key)return;

const index=
["A","B","C","D"]
.indexOf(key.letter);

if(
index>=0 &&
index<q.options.length
){

q.answer=index;

q.answerSource=
"✅ Detected from answer key • PDF page "+
key.page;

}

});

}


/* =====================================================
CHAPTER
===================================================== */

function detectChapter(pageText){

const patterns=[

/(?:chapter|chap\.?)\s*[:\-]?\s*(?:no\.?\s*)?(\d{1,3})\s*[:\-–]\s*([^|]{3,100})/i,

/(?:chapter)\s+(\d{1,3})\s+([^|]{3,100})/i

];

for(const pattern of patterns){

const match=pageText.match(pattern);

if(match){

return(
"Chapter "+
match[1]+
": "+
match[2]
).trim();

}

}

return "";

}


/* =====================================================
SECTION
===================================================== */

function detectSection(pageText){

const patterns=[
/(?:topic|section)\s*[:\-]\s*([^|]{3,100})/i
];

for(const pattern of patterns){

const match=
pageText.match(pattern);

if(match){
return match[1].trim();
}

}

return "";

}


/* =====================================================
DUPLICATES
===================================================== */

function removeDuplicates(list){

const seen=new Set();

return list.filter(function(q){

const key=
q.question
.toLowerCase()
.replace(/\s+/g," ")
.trim();

if(seen.has(key)){
return false;
}

seen.add(key);

return true;

});

}


/* =====================================================
SUMMARY
===================================================== */

function renderSummary(){

summaryCard.classList.remove("hidden");

let detected=0;
let missing=0;

const pages=new Set();

importedQuestions.forEach(function(q){

pages.add(q.pdfPage);

if(q.answer!==null){
detected++;
}else{
missing++;
}

});

const keyDetected=
Object.keys(detectedAnswerKey).length>0;

summary.innerHTML=

"<div class='info'>"+

"<span class='badge'>Questions: "+
importedQuestions.length+
"</span>"+

"<span class='badge'>PDF pages: "+
pages.size+
"</span>"+

"<span class='badge'>Answers detected: "+
detected+
"</span>"+

"<span class='badge'>Need verification: "+
missing+
"</span>"+

"</div>"+

"<div class='info "+
(keyDetected
?"success-box"
:"warning-box")+
"'>"+

(
keyDetected
?
"🔑 Answer-key section detected. Detected answers are attached to the questions and will be used by the CBT."
:
"⚠️ No answer-key section was confidently detected. Select the correct answer manually for unanswered questions."
)+

"</div>"+

"<div class='info'>"+
"📄 PDF page numbers are preserved for post-test source analysis."
+"</div>";

}


/* =====================================================
RENDER QUESTIONS
===================================================== */

function renderQuestions(){

preview.innerHTML="";

previewCard.classList.remove("hidden");

const detected=
importedQuestions.filter(function(q){
return q.answer!==null;
}).length;

const missing=
importedQuestions.length-detected;

questionCount.innerHTML=
"Detected "+
importedQuestions.length+
" question(s). "+
"<strong>"+
detected+
" correct answer(s) detected automatically.</strong> "+
(missing>0
?missing+" question(s) still need verification."
:"All correct answers are ready. You can start the CBT.");

importedQuestions.forEach(function(q,index){

const card=
document.createElement("div");

card.className="question";

let html=

"<div class='question-title'>"+
"Question "+
(index+1)+
" — PDF #"+
q.number+
"</div>"+

"<div style='line-height:1.6;font-weight:700'>"+
escapeHTML(q.question)+
"</div>";

q.options.forEach(function(option,optionIndex){

html+=

"<div class='option'>"+
"<strong>"+
String.fromCharCode(65+optionIndex)+
".</strong> "+
escapeHTML(option)+
"</div>";

});


if(q.answer!==null){

html+=

"<div class='answer-detected'>"+
"✅ Correct answer detected: "+
String.fromCharCode(65+q.answer)+
" — "+
escapeHTML(q.options[q.answer])+
"</div>";

}else{

html+=
"<div class='answer-missing'>"+
"⚠️ Correct answer not detected — please select it below."
+"</div>";

}


html+=

"<select class='answer-select' data-index='"+index+"'>"+

"<option value=''>"+
(q.answer===null
?"Select correct answer"
:"Keep detected answer")+
"</option>";

q.options.forEach(function(option,optionIndex){

const selected=
q.answer===optionIndex
?" selected"
:"";

html+=

"<option value='"+optionIndex+"'"+
selected+
">"+
String.fromCharCode(65+optionIndex)+
" — "+
escapeHTML(option)+
"</option>";

});

html+="</select>";

html+=

"<div class='answer-source'>"+
"Answer source: "+
escapeHTML(q.answerSource)+
"</div>";

html+=

"<div class='meta'>"+
"📄 PDF page: "+
escapeHTML(q.pdfPage)+
(q.chapter
?"<br>📚 Chapter: "+
escapeHTML(q.chapter)
:"")+
(q.section
?"<br>📌 Section: "+
escapeHTML(q.section)
:"")+
"</div>";

card.innerHTML=html;

preview.appendChild(card);

});

}


/* =====================================================
START CBT
===================================================== */

function startCBT(){

if(importedQuestions.length===0){

alert("No questions are available.");

return;

}


/*
Read manual changes.
Detected answers are
already preserved.
*/

const selects=
document.querySelectorAll(".answer-select");

selects.forEach(function(select){

const index=
Number(select.dataset.index);

if(select.value!==""){

importedQuestions[index].answer=
Number(select.value);

importedQuestions[index].answerSource=
"Verified by user";

}

});


/*
Check only questions that
still have no answer.
*/

const missing=
importedQuestions.filter(function(q){

return(
q.answer===null ||
q.answer===undefined ||
typeof q.answer!=="number" ||
q.answer<0 ||
q.answer>=q.options.length
);

});


if(missing.length>0){

alert(
"⚠️ "+
missing.length+
" question(s) still have no correct answer.\n\n"+
"Please select the correct answer for those questions before starting CBT."
);

return;

}


/*
Create final CBT questions.
*/

const importId=
Date.now();

const finalQuestions=
importedQuestions.map(function(q,index){

return{

id:
"pdf-"+importId+"-"+index,

question:q.question,

options:q.options,

answer:q.answer,

subject:q.subject||"Imported",

topic:q.topic||"PDF Import",

solution:q.solution||"",

explanation:q.explanation||"",

source:"PDF Import",

sourceType:"PDF",

pdfPage:q.pdfPage,

pdfPageEnd:q.pdfPageEnd,

chapter:q.chapter||"",

section:q.section||"",

answerSource:
q.answerSource||
"Verified by user",

bookmarked:false

};

});


/*
Primary CBT storage.
*/

localStorage.setItem(
"pdfCbtQuestions",
JSON.stringify(finalQuestions)
);


/*
Compatibility storage.
*/

localStorage.setItem(
"importedQuestions",
JSON.stringify(finalQuestions)
);


/*
Metadata.
*/

localStorage.setItem(
"pdfCbtImportedAt",
String(Date.now())
);

localStorage.setItem(
"pdfCbtQuestionCount",
String(finalQuestions.length)
);

localStorage.setItem(
"pdfCbtAnswerKeyDetected",
JSON.stringify(detectedAnswerKey)
);

localStorage.setItem(
"pdfCbtSourceMetadata",
JSON.stringify({

fileName:
pdfFile.files[0]
?pdfFile.files[0].name
:"",

questionCount:
finalQuestions.length,

answerKeyDetected:
Object.keys(detectedAnswerKey).length>0,

answersReady:true,

importedAt:Date.now()

})
);


/*
IMPORTANT:
Open the existing CBT engine.
*/

window.location.href="cbt.html";

}


/* =====================================================
CLEAR
===================================================== */

function clearImport(){

importedQuestions=[];

detectedAnswerKey={};

pdfPages=[];

pdfFile.value="";

preview.innerHTML="";

previewCard.classList.add("hidden");

summaryCard.classList.add("hidden");

statusBox.classList.add("hidden");

questionCount.textContent="";

summary.innerHTML="";

}

/*
======================================================
ESCAPE HTML
====================================================== */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
