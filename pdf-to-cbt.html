<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — CBT Test</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.timer{
background:#eef2ff;
color:#3730a3;
padding:9px 14px;
border-radius:9px;
font-weight:800;
min-width:78px;
text-align:center;
}

.timer.warning{
background:#fef3c7;
color:#92400e;
}

.timer.danger{
background:#fee2e2;
color:#991b1b;
}

.container{
max-width:1100px;
margin:20px auto;
padding:0 15px;
display:grid;
grid-template-columns:1fr 280px;
gap:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question-number{
color:#64748b;
font-weight:700;
margin-bottom:12px;
}

.question{
font-size:21px;
font-weight:800;
line-height:1.55;
margin-bottom:20px;
white-space:pre-wrap;
}

.option{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#fff;
border:2px solid #e2e8f0;
border-radius:11px;
text-align:left;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.option:hover{
border-color:#818cf8;
}

.option.selected{
border-color:#4f46e5;
background:#eef2ff;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

button{
font-family:inherit;
border:0;
border-radius:10px;
padding:13px;
font-weight:700;
cursor:pointer;
}

button:disabled{
opacity:.55;
cursor:not-allowed;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.warning{
background:#f59e0b;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.palette button{
background:#e2e8f0;
padding:10px 5px;
}

.palette button.answered{
background:#bbf7d0;
}

.palette button.review{
background:#fde68a;
}

.palette button.answered.review{
background:#86efac;
}

.palette button.current{
outline:3px solid #4f46e5;
}

#result{
display:none;
}

.score{
font-size:38px;
font-weight:800;
text-align:center;
margin:15px 0;
}

.summary-box{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin:20px 0;
}

.stat{
padding:15px;
background:#f8fafc;
border-radius:10px;
text-align:center;
}

.stat strong{
display:block;
font-size:22px;
}

.stat small{
color:#64748b;
}

.result-actions button{
width:100%;
margin-top:8px;
}

.review-item{
margin-top:15px;
padding:15px;
background:#f8fafc;
border-radius:10px;
}

.review-item.correct{
border-left:5px solid #16a34a;
}

.review-item.incorrect{
border-left:5px solid #dc2626;
}

.review-item.skipped{
border-left:5px solid #f59e0b;
}

.analysis{
margin-top:10px;
padding:14px;
background:#eef2ff;
border-radius:10px;
line-height:1.6;
}

.error-box{
background:#fee2e2;
color:#991b1b;
padding:15px;
border-radius:10px;
line-height:1.5;
}

.info-box{
background:#eef2ff;
color:#3730a3;
padding:14px;
border-radius:10px;
line-height:1.5;
margin-bottom:15px;
}

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

.question{
font-size:19px;
}

.summary-box{
grid-template-columns:1fr;
}

aside.card{
order:2;
}

}

@media(max-width:500px){

header{
padding:13px 15px;
}

.logo{
font-size:17px;
}

.card{
padding:17px;
}

.buttons{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<div id="timer" class="timer">
30:00
</div>

</div>

</header>

<div class="container">

<main class="card">

<section id="testScreen">

Loading PDF questions...
</div>

Loading...

Loading question...
</div>

<button
id="previousButton"

Previous
</button>

onclick="markReview()">
Mark Review
</button>

<button

onclick="clearAnswer()">
Clear
</button>

onclick="nextQuestion()">
Next
</button>

</div>

<button
id="retryButton"

style="display:none"
onclick="openRetry()">
🔄 Retry Mistakes
</button>

<button
class="secondary"
onclick="location.href='mistake.html'">
🧠 Mistake Bank
</button>

<button

onclick="location.href='index.html'">
🏠 Dashboard
</button>

</div>

<div id="review"></div>

</section>

</main>

<aside class="card">

<h3>Question Palette</h3>

<div id="palette" class="palette"></div>

<button
id="submitButton"
class="danger"
style="width:100%;margin-top:20px"
onclick="confirmSubmit()">
Submit Test
</button>

</aside>

</div>

<script>

"use strict";

/* =====================================================
   CBT ANALYZER PRO — STABLE ENGINE
===================================================== */

let questions = [];
let current = 0;
let answers = [];
let marked = [];
let submitted = false;

let timeLeft = 1800;
let timerInterval = null;

let testSource = "PDF Import";


/* =====================================================
   STORAGE KEYS
===================================================== */

const PDF_KEYS = [
"pdfCbtQuestions",
"pdfQuestions",
"cbtQuestions",
"importedQuestions",
"pdfQuestionBank",
"questionBank"
];


/* =====================================================
   FALLBACK
===================================================== */

const fallbackQuestions = [

{
subject:"Physics",
topic:"Units",
question:"What is the SI unit of force?",
options:["Joule","Newton","Watt","Pascal"],
answer:1,
solution:"The SI unit of force is newton."
},

{
subject:"Biology",
topic:"Cell Biology",
question:"Which organelle is known as the powerhouse of the cell?",
options:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],
answer:2,
solution:"Mitochondria are major sites of ATP production."
},

{
subject:"Chemistry",
topic:"Periodic Table",
question:"What is the chemical symbol of sodium?",
options:["So","Na","S","Sd"],
answer:1,
solution:"The symbol Na comes from natrium."
}

];


/* =====================================================
   SAFE NUMBER
===================================================== */

function toNumber(value){

if(typeof value === "number"){
return value;
}

if(typeof value === "string"){

const v = value.trim();

if(v === ""){
return NaN;
}

if(/^[A-Da-d]$/.test(v)){

return v.toUpperCase().charCodeAt(0)-65;

}

if(/^\d+$/.test(v)){

return Number(v);

}

}

return NaN;

}


/* =====================================================
   NORMALIZE ANSWER
===================================================== */

function normalizeAnswer(answer,options){

if(
answer === null ||
answer === undefined ||
answer === ""
){
return null;
}

let n = toNumber(answer);

if(!Number.isNaN(n)){

/* A-D / zero based */

if(
n >= 0 &&
n < options.length
){

return n;

}

/* 1-4 / one based */

if(
n >= 1 &&
n <= options.length
){

return n-1;

}

}


/* Exact option text */

const text =
String(answer)
.trim()
.toLowerCase();

const found =
options.findIndex(function(option){

return String(option)
.trim()
.toLowerCase() === text;

});

if(found >= 0){
return found;
}

return null;

}


/* =====================================================
   NORMALIZE QUESTION
===================================================== */

function normalizeQuestion(q,index){

if(
!q ||
typeof q !== "object"
){

return null;

}

const questionText =
String(
q.question ??
q.questionText ??
q.text ??
q.question_text ??
""
).trim();

if(!questionText){

return null;

}


/* OPTIONS */

let options = [];

if(Array.isArray(q.options)){

options = q.options;

}
else if(Array.isArray(q.choices)){

options = q.choices;

}
else if(Array.isArray(q.answers)){

options = q.answers;

}
else{

options = [
q.optionA,
q.optionB,
q.optionC,
q.optionD
];

}


options =
options
.filter(function(x){

return x !== undefined &&
x !== null &&
String(x).trim() !== "";

})
.map(function(x){

if(
typeof x === "object" &&
x.text !== undefined
){

return String(x.text).trim();

}

return String(x).trim();

});


if(options.length < 2){

return null;

}


/* ANSWER */

let rawAnswer =
q.answer;

if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correctAnswer;

}

if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correctIndex;

}

if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.answerIndex;

}

if(
rawAnswer === undefined ||
rawAnswer === null ||
rawAnswer === ""
){

rawAnswer = q.correct;

}


const answer =
normalizeAnswer(
rawAnswer,
options
);

if(answer === null){

console.warn(
"Invalid answer. Skipping:",
questionText
);

return null;

}


return {

id:
q.id ||
"pdf-"+Date.now()+"-"+index,

subject:
q.subject ||
q.subjectName ||
"PDF Import",

topic:
q.topic ||
q.chapter ||
q.section ||
"PDF Import",

question:
questionText,

options:
options,

answer:
answer,

solution:
String(
q.solution ??
q.explanation ??
q.detailedSolution ??
""
),

explanation:
String(
q.explanation ??
q.solution ??
""
),

pdfPage:
q.pdfPage ??
q.page ??
"",

chapter:
q.chapter ||
"",

section:
q.section ||
"",

answerSource:
q.answerSource ||
"PDF",

source:
q.source ||
"PDF Import",

bookmarked:
Boolean(q.bookmarked)

};

}
  /* =====================================================
   EXTRACT QUESTIONS FROM STORAGE
===================================================== */

function extractQuestions(data){

    /* Direct array */

    if(Array.isArray(data)){
        return data;
    }

    /* {questions:[...]} */

    if(
        data &&
        Array.isArray(data.questions)
    ){
        return data.questions;
    }

    /* {data:[...]} */

    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }

    /* {items:[...]} */

    if(
        data &&
        Array.isArray(data.items)
    ){
        return data.items;
    }

    /* {questionBank:[...]} */

    if(
        data &&
        Array.isArray(data.questionBank)
    ){
        return data.questionBank;
    }

    return [];
}


/* =====================================================
   LOAD PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

    console.log(
        "Starting PDF question loader..."
    );

    for(
        const key of PDF_KEYS
    ){

        let saved;

        try{

            saved =
                localStorage.getItem(key);

        }catch(error){

            console.error(
                "localStorage error:",
                error
            );

            continue;

        }


        if(!saved){

            continue;

        }


        console.log(
            "Found storage key:",
            key
        );


        try{

            const data =
                JSON.parse(saved);


            const imported =
                extractQuestions(data);


            if(
                !Array.isArray(imported) ||
                imported.length === 0
            ){

                console.warn(
                    "Empty question array:",
                    key
                );

                continue;

            }


            console.log(
                "Raw questions:",
                imported.length
            );


            const normalized =
                imported
                .map(function(q,index){

                    return normalizeQuestion(
                        q,
                        index
                    );

                })
                .filter(Boolean);


            if(
                normalized.length === 0
            ){

                console.warn(
                    "No valid questions after normalization:",
                    key
                );

                continue;

            }


            /* SUCCESS */

            questions =
                normalized;

            testSource =
                "PDF Import";


            console.log(
                "================================"
            );

            console.log(
                "PDF CBT LOADED SUCCESSFULLY"
            );

            console.log(
                "Storage:",
                key
            );

            console.log(
                "Questions:",
                questions.length
            );

            console.log(
                "================================"
            );


            return true;

        }catch(error){

            console.error(
                "JSON error in:",
                key,
                error
            );

        }

    }


    console.warn(
        "No valid PDF question bank found."
    );


    return false;

}


/* =====================================================
   INITIALIZE CBT
===================================================== */

function initialize(){

    console.log(
        "CBT Analyzer initialization started..."
    );


    /*
       IMPORTANT:
       PDF is loaded FIRST.
       No undefined pdfLoaded variable.
    */

    const pdfLoaded =
        loadPDFQuestions();


    /* -----------------------------------------------
       USE FALLBACK ONLY IF PDF DOES NOT EXIST
    ------------------------------------------------ */

    if(!pdfLoaded){

        console.warn(
            "PDF questions not found."
        );


        /*
           We still show a useful message
           instead of silently showing old
           demo questions.
        */

        showPDFError();

        return;

    }


    /* -----------------------------------------------
       SAFETY CHECK
    ------------------------------------------------ */

    if(
        !Array.isArray(questions) ||
        questions.length === 0
    ){

        showPDFError();

        return;

    }


    /* -----------------------------------------------
       RESET STATE
    ------------------------------------------------ */

    current = 0;

    submitted = false;


    answers =
        new Array(
            questions.length
        ).fill(null);


    marked =
        new Array(
            questions.length
        ).fill(false);


    /* -----------------------------------------------
       SOURCE BADGE
    ------------------------------------------------ */

    const badge =
        document.getElementById(
            "sourceBadge"
        );


    if(badge){

        badge.className =
            "info-box";

        badge.textContent =
            "📄 PDF CBT • " +
            questions.length +
            " Questions";

    }


    /* -----------------------------------------------
       RENDER
    ------------------------------------------------ */

    renderQuestion();

    renderPalette();

    startTimer();


    console.log(
        "CBT READY:",
        questions.length,
        "questions"
    );

}


/* =====================================================
   PDF ERROR SCREEN
===================================================== */

function showPDFError(){

    const sourceBadge =
        document.getElementById(
            "sourceBadge"
        );

    const questionNumber =
        document.getElementById(
            "questionNumber"
        );

    const question =
        document.getElementById(
            "question"
        );

    const options =
        document.getElementById(
            "options"
        );

    const palette =
        document.getElementById(
            "palette"
        );


    if(sourceBadge){

        sourceBadge.className =
            "error-box";

        sourceBadge.textContent =
            "⚠️ PDF CBT DATA NOT FOUND";

    }


    if(questionNumber){

        questionNumber.textContent =
            "Waiting for PDF questions";

    }


    if(question){

        question.textContent =
            "The PDF-to-CBT questions are not available in this browser.";

    }


    if(options){

        options.innerHTML =
            '<div class="error-box">' +

            '<b>What happened?</b><br><br>' +

            'The CBT page could not find the imported questions in localStorage.<br><br>' +

            '<b>Important:</b> PDF questions saved on another browser/device or another origin are not automatically available here.<br><br>' +

            'Go back to the PDF → CBT import page, import the PDF again, then open CBT.' +

            '</div>';

    }


    if(palette){

        palette.innerHTML = "";

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    if(submitButton){

        submitButton.disabled =
            true;

    }

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const timer =
        document.getElementById(
            "timer"
        );


    if(!timer){
        return;
    }


    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    timer.textContent =
        String(minutes)
        .padStart(2,"0")
        +
        ":" +
        String(seconds)
        .padStart(2,"0");


    timer.classList.remove(
        "warning",
        "danger"
    );


    if(
        timeLeft <= 300
    ){

        timer.classList.add(
            "warning"
        );

    }


    if(
        timeLeft <= 60
    ){

        timer.classList.remove(
            "warning"
        );

        timer.classList.add(
            "danger"
        );

    }

}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

    clearInterval(
        timerInterval
    );


    timeLeft = 1800;


    updateTimer();


    timerInterval =
        setInterval(function(){

            if(submitted){

                clearInterval(
                    timerInterval
                );

                return;

            }


            timeLeft--;


            updateTimer();


            if(
                timeLeft <= 0
            ){

                clearInterval(
                    timerInterval
                );

                submitTest();

            }

        },1000);

}


/* =====================================================
   RENDER QUESTION
===================================================== */
function renderQuestion(){

    if(submitted){
        return;
    }


    const q =
        questions[current];


    if(!q){

        console.error(
            "Question not found:",
            current
        );

        return;

    }


    /* QUESTION NUMBER */

    const number =
        document.getElementById(
            "questionNumber"
        );


    if(number){

        number.textContent =
            "Question " +
            (current + 1) +
            " of " +
            questions.length +
            " • " +
            (
                q.subject ||
                "PDF"
            );

    }


    /* QUESTION TEXT */

    const question =
        document.getElementById(
            "question"
        );


    if(question){

        question.textContent =
            q.question;

    }


    /* OPTIONS */

    const box =
        document.getElementById(
            "options"
        );


    if(!box){
        return;
    }


    box.innerHTML = "";


    q.options.forEach(
        function(option,index){

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option";


            if(
                answers[current] === index
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.textContent =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                option;


            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }


                    answers[current] =
                        index;


                    renderQuestion();

                };


            box.appendChild(
                button
            );

        }
    );


    /* NEXT BUTTON */

    const nextButton =
        document.getElementById(
            "nextButton"
        );


    if(nextButton){

        nextButton.textContent =
            current ===
            questions.length - 1
            ? "Finish"
            : "Next";

    }


    /* PREVIOUS BUTTON */

    const previousButton =
        document.getElementById(
            "previousButton"
        );


    if(previousButton){

        previousButton.disabled =
            current === 0;

    }


    renderPalette();

}

    else if(Array.isArray(q.choices)){
        options = q.choices;
    }
    else if(Array.isArray(q.answers)){
        options = q.answers;
    }
    else{

        options = [
            q.optionA,
            q.optionB,
            q.optionC,
            q.optionD
        ].filter(function(x){

            return x !== undefined &&
                   x !== null &&
                   String(x).trim() !== "";

        });

    }


    options = options
        .map(function(option){

            if(
                option &&
                typeof option === "object" &&
                option.text !== undefined
            ){
                return String(option.text).trim();
            }

            return String(option ?? "").trim();

        })
        .filter(function(option){

            return option !== "";

        });


    if(options.length < 2){
        return null;
    }


    /* Correct answer */

    let rawAnswer =
        q.answer ??
        q.correctAnswer ??
        q.correctIndex ??
        q.correct ??
        q.answerIndex;


    const answer =
        normalizeAnswer(
            rawAnswer,
            options
        );


    if(answer === null){

        console.warn(
            "Skipping question without valid answer:",
            questionText
        );

        return null;
    }


    return {

        id:
            q.id ||
            "pdf-" +
            Date.now() +
            "-" +
            index,

        subject:
            q.subject ||
            q.subjectName ||
            "PDF Import",

        topic:
            q.topic ||
            q.section ||
            q.chapter ||
            "PDF Import",

        question:
            questionText,

        options:
            options,

        answer:
            answer,

        solution:
            String(
                q.solution ??
                q.explanation ??
                q.detailedSolution ??
                ""
            ),

        explanation:
            String(
                q.explanation ??
                q.solution ??
                ""
            ),

        pdfPage:
            q.pdfPage ??
            q.page ??
            "",

        chapter:
            q.chapter ||
            "",

        section:
            q.section ||
            "",

        answerSource:
            q.answerSource ||
            "PDF",

        source:
            q.source ||
            "PDF Import",

        sourceType:
            "PDF",

        bookmarked:
            Boolean(q.bookmarked)

    };
}


/* =====================================================
   EXTRACT QUESTIONS FROM STORAGE
===================================================== */

function extractQuestions(data){

    /* Direct array */

    if(Array.isArray(data)){
        return data;
    }


    /* Common object formats */

    if(
        data &&
        Array.isArray(data.questions)
    ){
        return data.questions;
    }


    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }


    if(
        data &&
        Array.isArray(data.items)
    ){
        return data.items;
    }


    if(
        data &&
        Array.isArray(data.questionBank)
    ){
        return data.questionBank;
    }


    return [];
}


/* =====================================================
   LOAD PDF QUESTIONS
===================================================== */

function loadPDFQuestions(){

    console.log(
        "🔍 Searching localStorage for PDF CBT..."
    );


    /*
       IMPORTANT:
       The PDF importer must save the questions
       under pdfCbtQuestions.
    */

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if(!saved){

        console.warn(
            "❌ pdfCbtQuestions NOT FOUND"
        );

        return false;
    }


    try{

        const data =
            JSON.parse(saved);


        const imported =
            extractQuestions(data);


        console.log(
            "📦 Raw questions found:",
            imported.length
        );


        if(
            !Array.isArray(imported) ||
            imported.length === 0
        ){

            console.warn(
                "❌ Question array is empty"
            );

            return false;
        }


        const normalized =
            imported
                .map(function(q,index){

                    return normalizeQuestion(
                        q,
                        index
                    );

                })
                .filter(Boolean);


        console.log(
            "✅ Valid questions:",
            normalized.length
        );


        if(normalized.length === 0){

            console.error(
                "❌ PDF data exists but no valid questions could be created."
            );

            return false;
        }


        questions =
            normalized;


        console.log(
            "===================================="
        );

        console.log(
            "🎯 PDF CBT READY"
        );

        console.log(
            "Questions:",
            questions.length
        );

        console.log(
            "First question:",
            questions[0].question
        );

        console.log(
            "===================================="
        );


        return true;


    }catch(error){

        console.error(
            "❌ PDF JSON ERROR:",
            error
        );

        return false;
    }
}


/* =====================================================
   INITIALIZE CBT
===================================================== */

function initialize(){

    console.log(
        "🚀 CBT INITIALIZATION STARTED"
    );


    /*
       ALWAYS TRY PDF FIRST
    */

    const pdfLoaded =
        loadPDFQuestions();


    /*
       If PDF exists, NEVER replace it
       with fallback questions.
    */

    if(!pdfLoaded){

        console.warn(
            "⚠️ PDF questions not available."
        );


        /*
           For debugging, show fallback.
           This proves the CBT engine itself works.
        */

        questions =
            fallbackQuestions.map(function(q){

                return {
                    ...q,
                    options:[...q.options]
                };

            });

        console.log(
            "Using fallback:",
            questions.length
        );

    }


    /* Safety check */

    if(
        !Array.isArray(questions) ||
        questions.length === 0
    ){

        showFatalError(
            "No questions are available."
        );

        return;
    }


    /* Reset state */

    current = 0;

    answers =
        new Array(
            questions.length
        ).fill(null);

    marked =
        new Array(
            questions.length
        ).fill(false);

    submitted = false;

    timeLeft = 1800;


    /* Render */

    renderQuestion();

    renderPalette();

    startTimer();


    console.log(
        "🎯 CBT STARTED WITH",
        questions.length,
        "QUESTIONS"
    );
}


/* =====================================================
   FATAL ERROR
===================================================== */

function showFatalError(message){

    const number =
        document.getElementById(
            "questionNumber"
        );

    const question =
        document.getElementById(
            "question"
        );

    const options =
        document.getElementById(
            "options"
        );


    if(number){

        number.textContent =
            "CBT Error";

    }


    if(question){

        question.textContent =
            message;

    }


    if(options){

        options.innerHTML =
            "<div style='padding:15px;background:#fee2e2;color:#991b1b;border-radius:10px'>" +
            "Please go back to the PDF-to-CBT page and generate the test again." +
            "</div>";

    }


    console.error(
        "CBT FATAL ERROR:",
        message
    );
}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const timer =
        document.getElementById(
            "timer"
        );


    if(!timer){
        return;
    }


    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    timer.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");


    timer.classList.remove(
        "warning",
        "danger"
    );


    if(timeLeft <= 300){

        timer.classList.add(
            "warning"
        );

    }


    if(timeLeft <= 60){

        timer.classList.remove(
            "warning"
        );

        timer.classList.add(
            "danger"
        );

    }
}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

    clearInterval(
        timerInterval
    );


    updateTimer();


    timerInterval =
        setInterval(function(){

            if(submitted){

                clearInterval(
                    timerInterval
                );

                return;
            }


            timeLeft--;

            updateTimer();


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );

                submitTest();

            }

        },1000);
}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    initialize
);
</script>
  <script>

/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    if(submitted){
        return;
    }


    const q =
        questions[current];


    if(!q){
        return;
    }


    /* Question number */

    const number =
        document.getElementById(
            "questionNumber"
        );


    if(number){

        number.textContent =
            "Question " +
            (current + 1) +
            " of " +
            questions.length +
            " • " +
            (q.subject || "PDF");

    }


    /* Question */

    const question =
        document.getElementById(
            "question"
        );


    if(question){

        question.textContent =
            q.question;

    }


    /* Options */

    const box =
        document.getElementById(
            "options"
        );


    if(!box){
        return;
    }


    box.innerHTML = "";


    q.options.forEach(
        function(option,index){

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "option";


            if(
                answers[current] === index
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.textContent =
                String.fromCharCode(65 + index) +
                ". " +
                option;


            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }


                    answers[current] =
                        index;


                    renderQuestion();

                };


            box.appendChild(
                button
            );

        }
    );


    /* Next button */

    const next =
        document.getElementById(
            "nextButton"
        );


    if(next){

        next.textContent =
            current === questions.length - 1
            ? "Finish"
            : "Next";

    }


    renderPalette();
}


/* =====================================================
   QUESTION PALETTE
===================================================== */

function renderPalette(){

    const palette =
        document.getElementById(
            "palette"
        );


    if(!palette){
        return;
    }


    palette.innerHTML = "";


    questions.forEach(
        function(q,index){

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.textContent =
                index + 1;


            /* Answered */

            if(
                answers[index] !== null
            ){

                button.classList.add(
                    "answered"
                );

            }


            /* Review */

            if(
                marked[index]
            ){

                button.classList.add(
                    "review"
                );

            }


            /* Current */

            if(
                index === current
            ){

                button.classList.add(
                    "current"
                );

            }


            button.onclick =
                function(){

                    if(submitted){
                        return;
                    }


                    current =
                        index;


                    renderQuestion();

                };


            palette.appendChild(
                button
            );

        }
    );
}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    if(submitted){
        return;
    }


    if(
        current <
        questions.length - 1
    ){

        current++;

        renderQuestion();

    }else{

        submitTest();

    }
}


/* =====================================================
   PREVIOUS
===================================================== */

function previousQuestion(){

    if(submitted){
        return;
    }


    if(current > 0){

        current--;

        renderQuestion();

    }
}


/* =====================================================
   CLEAR ANSWER
===================================================== */

function clearAnswer(){

    if(submitted){
        return;
    }


    answers[current] =
        null;


    renderQuestion();
}


/* =====================================================
   MARK REVIEW
===================================================== */

function markReview(){

    if(submitted){
        return;
    }


    marked[current] =
        !marked[current];


    renderPalette();
}


/* =====================================================
   MISTAKE CLASSIFICATION
===================================================== */

function classifyMistake(q){

    const text =
        String(
            q.question || ""
        ).toLowerCase();


    if(
        text.includes("calculate") ||
        text.includes("numerical") ||
        text.includes("find the value") ||
        text.includes("value of") ||
        text.includes("velocity") ||
        text.includes("acceleration") ||
        text.includes("force")
    ){

        return {

            type:
                "🔢 Calculation Error",

            reason:
                "Recheck the formula, units and calculation steps."

        };
    }


    if(
        text.includes("which") ||
        text.includes("what is") ||
        text.includes("symbol") ||
        text.includes("unit") ||
        text.includes("known as") ||
        text.includes("called")
    ){

        return {

            type:
                "📚 Memory / Recall Gap",

            reason:
                "Revise the relevant factual information and test recall."

        };
    }


    return {

        type:
            "🧠 Concept Gap",

        reason:
            "Review the underlying concept and retry the question."

    };
}


/* =====================================================
   SAVE TEST HISTORY
===================================================== */

function saveHistory(
    correct,
    incorrect,
    skipped,
    score
){

    let history = [];


    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "cbtHistory"
                ) || "[]"
            );


        if(!Array.isArray(history)){

            history = [];

        }

    }catch(error){

        history = [];

    }


    const testRecord = {

        date:
            new Date().toLocaleString(),

        timestamp:
            Date.now(),

        score:
            score,

        correct:
            correct,

        incorrect:
            incorrect,

        wrong:
            incorrect,

        skipped:
            skipped,

        total:
            questions.length,

        source:
            "PDF CBT",

        questions:
            questions.map(
                function(q,index){

                    let status;


                    if(
                        answers[index] === null
                    ){

                        status =
                            "skipped";

                    }
                    else if(
                        answers[index] === q.answer
                    ){

                        status =
                            "correct";

                    }
                    else{

                        status =
                            "wrong";

                    }


                    let intelligence =
                        null;


                    if(status === "wrong"){

                        intelligence =
                            classifyMistake(q);

                    }


                    return {

                        id:
                            q.id,

                        question:
                            q.question,

                        options:
                            q.options,

                        subject:
                            q.subject,

                        topic:
                            q.topic,

                        status:
                            status,

                        selectedIndex:
                            answers[index],

                        selectedAnswer:
                            answers[index] === null
                            ? "Not answered"
                            : q.options[
                                answers[index]
                              ],

                        correctIndex:
                            q.answer,

                        correctAnswer:
                            q.options[
                                q.answer
                            ],

                        mistakeType:
                            intelligence
                            ? intelligence.type
                            : null,

                        mistakeReason:
                            intelligence
                            ? intelligence.reason
                            : null,

                        solution:
                            q.solution || "",

                        bookmarked:
                            Boolean(
                                marked[index]
                            ),

                        markedForReview:
                            Boolean(
                                marked[index]
                            ),

                        pdfPage:
                            q.pdfPage || "",

                        chapter:
                            q.chapter || "",

                        section:
                            q.section || ""

                    };

                }
            )

    };


    history.push(
        testRecord
    );


    localStorage.setItem(
        "cbtHistory",
        JSON.stringify(history)
    );


    console.log(
        "✅ Test history saved"
    );
}


/* =====================================================
   RETRY MISTAKES
===================================================== */

function openRetry(){

    const wrong = [];


    questions.forEach(
        function(q,index){

            if(
                answers[index] !== null &&
                answers[index] !== q.answer
            ){

                const intelligence =
                    classifyMistake(q);


                wrong.push({

                    id:
                        "retry-" +
                        Date.now() +
                        "-" +
                        index,

                    question:
                        q.question,

                    options:
                        q.options,

                    subject:
                        q.subject,

                    topic:
                        q.topic,

                    correctIndex:
                        q.answer,

                    correctAnswer:
                        q.options[q.answer],

                    solution:
                        q.solution || "",

                    selectedIndex:
                        answers[index],

                    selectedAnswer:
                        q.options[
                            answers[index]
                        ],

                    mistakeType:
                        intelligence.type,

                    mistakeReason:
                        intelligence.reason,

                    source:
                        "CBT",

                    pdfPage:
                        q.pdfPage || "",

                    chapter:
                        q.chapter || "",

                    section:
                        q.section || ""

                });

            }

        }
    );


    if(!wrong.length){

        alert(
            "There are no mistakes to retry."
        );

        return;
    }


    localStorage.setItem(
        "cbtAnalyzer.retryQueue",
        JSON.stringify(wrong)
    );


    localStorage.setItem(
        "cbtRetryQuestion",
        JSON.stringify(
            wrong[0]
        )
    );


    localStorage.setItem(
        "cbtRetryStartedAt",
        String(Date.now())
    );


    location.href =
        "retry.html";
}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    if(submitted){
        return;
    }


    let correct = 0;
    let incorrect = 0;
    let skipped = 0;


    questions.forEach(
        function(q,index){

            if(
                answers[index] === null
            ){

                skipped++;

            }
            else if(
                answers[index] === q.answer
            ){

                correct++;

            }
            else{

                incorrect++;

            }

        }
    );


    const score =
        (correct * 4) -
        incorrect;


    /* Save history BEFORE hiding screen */

    saveHistory(
        correct,
        incorrect,
        skipped,
        score
    );


    submitted = true;


    clearInterval(
        timerInterval
    );


    /* Hide CBT */

    const testScreen =
        document.getElementById(
            "testScreen"
        );


    if(testScreen){

        testScreen.style.display =
            "none";

    }


    /* Hide sidebar */

    const aside =
        document.querySelector(
            "aside"
        );


    if(aside){

        aside.style.display =
            "none";

    }


    /* Show result */

    const result =
        document.getElementById(
            "result"
        );


    if(result){

        result.style.display =
            "block";

    }


    /* Score */

    const scoreBox =
        document.getElementById(
            "score"
        );


    if(scoreBox){

        scoreBox.textContent =
            score +
            " / " +
            (questions.length * 4);

    }


    /* Summary */

    const summary =
        document.getElementById(
            "summary"
        );


    if(summary){

        summary.textContent =
            "Correct: " +
            correct +
            " | Incorrect: " +
            incorrect +
            " | Skipped: " +
            skipped;

    }


    /* Retry button */

    const retry =
        document.getElementById(
            "retryButton"
        );


    if(retry){

        if(incorrect > 0){

            retry.style.display =
                "block";


            retry.textContent =
                "🔄 Retry " +
                incorrect +
                " Mistake" +
                (
                    incorrect === 1
                    ? ""
                    : "s"
                );

        }else{

            retry.style.display =
                "none";

        }

    }


    generateReview();


    console.log(
        "🎯 TEST COMPLETED",
        {
            correct,
            incorrect,
            skipped,
            score
        }
    );
}


/* =====================================================
   REVIEW
===================================================== */

function generateReview(){

    const box =
        document.getElementById(
            "review"
        );


    if(!box){
        return;
    }


    box.innerHTML =
        "<h3>🧠 Question Analysis</h3>";


    questions.forEach(
        function(q,index){

            let status;


            if(
                answers[index] === null
            ){

                status =
                    "skipped";

            }
            else if(
                answers[index] === q.answer
            ){

                status =
                    "correct";

            }
            else{

                status =
                    "incorrect";

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "review-item " +
                status;


            item.innerHTML =
                "<strong>Q" +
                (index + 1) +
                ". " +
                escapeHTML(
                    q.question
                ) +
                "</strong>";


            item.innerHTML +=
                "<p>" +
                "<b>Your answer:</b> " +
                escapeHTML(
                    answers[index] === null
                    ? "Not answered"
                    : q.options[
                        answers[index]
                      ]
                ) +
                "<br>" +
                "<b>Correct answer:</b> " +
                escapeHTML(
                    q.options[q.answer]
                ) +
                "</p>";


            if(q.solution){

                item.innerHTML +=
                    '<div class="analysis">' +
                    "<b>💡 Solution</b><br>" +
                    escapeHTML(
                        q.solution
                    ) +
                    "</div>";

            }


            if(status === "incorrect"){

                const intelligence =
                    classifyMistake(q);


                item.innerHTML +=
                    '<div class="analysis">' +
                    "<b>" +
                    escapeHTML(
                        intelligence.type
                    ) +
                    "</b><br>" +
                    escapeHTML(
                        intelligence.reason
                    ) +
                    "</div>";

            }


            if(q.pdfPage){

                item.innerHTML +=
                    '<div class="analysis">' +
                    "📄 PDF Page: " +
                    escapeHTML(
                        q.pdfPage
                    ) +
                    "</div>";

            }


            box.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   SAFETY TEST

console.log(

);
