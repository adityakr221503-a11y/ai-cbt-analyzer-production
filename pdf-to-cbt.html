<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — PDF to CBT</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:15px 18px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:inherit;
cursor:pointer;
touch-action:manipulation;
}

.btn{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:800;
}

.primary{
background:#4f46e5;
color:#fff;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.container{
max-width:1000px;
margin:22px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:#fff;
border-radius:18px;
padding:25px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
line-height:1.6;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.upload{
border:2px dashed #cbd5e1;
border-radius:14px;
padding:30px 20px;
text-align:center;
}

.upload input{
display:none;
}

.upload label{
display:inline-block;
background:#4f46e5;
color:#fff;
padding:14px 18px;
border-radius:10px;
font-weight:800;
cursor:pointer;
}

.status{
margin-top:15px;
padding:13px;
border-radius:10px;
background:#eef2ff;
color:#3730a3;
font-weight:700;
line-height:1.5;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.question-title{
font-weight:800;
margin-bottom:10px;
}

.option{
margin:7px 0;
padding:10px;
background:#f8fafc;
border-radius:8px;
line-height:1.5;
}

.answer-select{
margin-top:12px;
width:100%;
padding:10px;
border:1px solid #cbd5e1;
border-radius:8px;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

.actions button{
flex:1;
min-width:160px;
}

.hidden{
display:none;
}

.empty{
text-align:center;
color:#64748b;
padding:25px;
}

.info{
background:#f8fafc;
padding:14px;
border-radius:10px;
line-height:1.6;
}

@media(max-width:600px){

.container{
margin:15px auto;
}

.actions{
display:grid;
grid-template-columns:1fr;
}

.actions button{
width:100%;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="btn secondary"
type="button"
onclick="location.href='index.html'">

Dashboard

</button>

</div>

</header>


<div class="container">

<section class="hero">

<h1>📄 PDF → CBT</h1>

<p>
Upload a question PDF, detect MCQs, review the questions,
select the correct answers, and launch them as a CBT.
</p>

</section>


<section class="card">

<h2>📤 Upload Question PDF</h2>

<div class="upload">

<p>
Choose a PDF containing multiple-choice questions.
</p>

<input
id="pdfFile"
type="file"
accept="application/pdf">

<label for="pdfFile">
Choose PDF
</label>

<div
id="status"
class="status hidden">
</div>

</div>

</section>


<section
id="previewCard"
class="card hidden">

<h2>📝 Imported Questions</h2>

<div
id="questionCount"
class="info">
</div>

<div id="preview"></div>

<div class="actions">

<button
class="btn primary"
type="button"
onclick="startCBT()">

🚀 Start CBT

</button>

<button
class="btn secondary"
type="button"
onclick="clearImport()">

Clear

</button>

</div>

</section>


</div>


<script>

"use strict";


/* =====================================
STATE
===================================== */

let importedQuestions=[];


/* =====================================
ELEMENTS
===================================== */

const pdfFile=
document.getElementById("pdfFile");

const statusBox=
document.getElementById("status");

const previewCard=
document.getElementById("previewCard");

const preview=
document.getElementById("preview");

const questionCount=
document.getElementById("questionCount");


/* =====================================
PDF LOAD
===================================== */

pdfFile.addEventListener(
"change",
async function(){

const file=
pdfFile.files[0];

if(!file){

return;

}

statusBox.classList.remove("hidden");

statusBox.textContent=
"📖 Reading PDF...";

try{

await loadPDFLibrary();

const buffer=
await file.arrayBuffer();

const pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;


let fullText="";


for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page=
await pdf.getPage(pageNumber);

const content=
await page.getTextContent();

const pageText=
content.items
.map(function(item){
return item.str;
})
.join(" ");

fullText+="\n"+pageText;

}


importedQuestions=
parseMCQs(fullText);


if(importedQuestions.length===0){

statusBox.textContent=
"⚠️ PDF loaded, but no clear MCQs were detected. Try a PDF with numbered questions and A/B/C/D options.";

previewCard.classList.add("hidden");

return;

}


statusBox.textContent=
"✅ "+importedQuestions.length+
" question(s) detected. Review them below.";

renderQuestions();


}catch(error){

console.error(error);

statusBox.textContent=
"❌ Could not read this PDF. Please try another PDF.";

}

});


/* =====================================
LOAD PDF.JS
===================================== */

function loadPDFLibrary(){

if(window.pdfjsLib){

return Promise.resolve();

}


return new Promise(
function(resolve,reject){

const script=
document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

script.onload=function(){

if(window.pdfjsLib){

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

resolve();

}else{

reject(
new Error("PDF library unavailable")
);

}

};

script.onerror=function(){

reject(
new Error("Could not load PDF library")
);

};

document.head.appendChild(script);

});

}


/* =====================================
PARSE MCQs
===================================== */

function parseMCQs(text){

const clean=
String(text||"")
.replace(/\r/g," ")
.replace(/\n+/g," ")
.replace(/\s+/g," ")
.trim();


const blocks=
clean.split(
/(?=(?:Question\s*)?\d+\s*[.)]\s*)/i
);


const questions=[];


blocks.forEach(
function(block){

const questionMatch=
block.match(
/^(?:Question\s*)?\d+\s*[.)]\s*(.*?)(?=\s+A\s*[.)]\s*)/i
);


if(!questionMatch){

return;

}


const questionText=
questionMatch[1].trim();


const optionText=
block.slice(
questionMatch[0].length
);


const options=[];


["A","B","C","D"].forEach(
function(letter){

const regex=
new RegExp(
"(?:^|\\s)"+
letter+
"\\s*[.)]\\s*(.*?)(?=\\s+[A-D]\\s*[.)]\\s*|$)",
"i"
);


const match=
optionText.match(regex);


if(match){

options.push(
match[1].trim()
);

}

});


if(
questionText &&
options.length>=2
){

questions.push({

question:questionText,

options:options,

answer:0,

subject:"Imported",

topic:"PDF Import",

solution:
"Review the original PDF answer key or solution."

});

}

});


return questions;

}


/* =====================================
RENDER QUESTIONS
===================================== */

function renderQuestions(){

preview.innerHTML="";

previewCard.classList.remove(
"hidden"
);


questionCount.textContent=
"Detected "+
importedQuestions.length+
" question(s). Please verify the correct answer for each question before starting the CBT.";


importedQuestions.forEach(
function(q,index){

const card=
document.createElement("div");

card.className=
"question";


let html=
"<div class='question-title'>"+
"Question "+
(index+1)+
"</div>";


html+=
"<div style='line-height:1.6;font-weight:700'>"+
escapeHTML(q.question)+
"</div>";


q.options.forEach(
function(option,optionIndex){

html+=
"<div class='option'>"+
"<strong>"+
String.fromCharCode(65+optionIndex)+
".</strong> "+
escapeHTML(option)+
"</div>";

});


html+=
"<select class='answer-select' data-index='"+index+"'>"+
"<option value=''>Select correct answer</option>";


q.options.forEach(
function(option,optionIndex){

html+=
"<option value='"+optionIndex+"'>"+
"Correct: "+
String.fromCharCode(65+optionIndex)+
" — "+
escapeHTML(option)+
"</option>";

});


html+=
"</select>";


card.innerHTML=html;

preview.appendChild(card);

});

}


/* =====================================
START CBT
===================================== */

function startCBT(){

if(
importedQuestions.length===0
){

alert(
"No questions are available."
);

return;

}


const selects=
document.querySelectorAll(
".answer-select"
);


let missing=false;


selects.forEach(
function(select){

const index=
Number(select.dataset.index);

if(select.value===""){

missing=true;

return;

}

importedQuestions[index].answer=
Number(select.value);

});


if(missing){

alert(
"Please select the correct answer for every question before starting the CBT."
);

return;

}


/*
Save imported questions.
*/

localStorage.setItem(
"pdfCbtQuestions",
JSON.stringify(
importedQuestions
)
);


/*
Also save import metadata.
*/

localStorage.setItem(
"pdfCbtImportedAt",
String(Date.now())
);


/*
Open existing CBT engine.
*/

window.location.href=
"cbt.html";

}


/* =====================================
CLEAR
===================================== */

function clearImport(){

importedQuestions=[];

pdfFile.value="";

preview.innerHTML="";

previewCard.classList.add(
"hidden"
);

statusBox.classList.add(
"hidden"
);

questionCount.textContent="";

}


/* =====================================
ESCAPE
===================================== */

function escapeHTML(value){

return String(
value??""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
