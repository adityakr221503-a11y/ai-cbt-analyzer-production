<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Test History</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.header{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

button{
  font-family:inherit;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.primary{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-weight:800;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:17px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:26px;
  margin-bottom:5px;
}

.stat span{
  color:#64748b;
  font-size:13px;
  font-weight:700;
}

.history-list{
  width:100%;
}

.test-button{
  display:block;
  width:100%;
  text-align:left;
  background:#fff;
  color:#0f172a;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:18px;
  margin-top:14px;
}

.test-button:hover{
  background:#f8fafc;
  border-color:#4f46e5;
}

.test-button:active{
  transform:scale(.99);
  background:#eef2ff;
}

.test-title{
  font-size:18px;
  font-weight:800;
}

.details{
  color:#64748b;
  margin-top:8px;
  line-height:1.6;
}

.open-text{
  display:inline-block;
  margin-top:12px;
  background:#eef2ff;
  color:#3730a3;
  padding:8px 11px;
  border-radius:8px;
  font-size:13px;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#64748b;
  line-height:1.6;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .container{
    margin:15px auto;
  }

  .card{
    padding:17px;
  }

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
type="button"
onclick="openCBT()">

➕ Take CBT

</button>

</div>

</header>


<div class="container">

<section class="card">

<h2>📊 Test History</h2>

<div class="stats">

<div class="stat">
<strong id="tests">0</strong>
<span>Tests</span>
</div>

<div class="stat">
<strong id="best">0</strong>
<span>Best Score</span>
</div>

<div class="stat">
<strong id="average">0</strong>
<span>Average Score</span>
</div>

<div class="stat">
<strong id="attempts">0</strong>
<span>Attempts</span>
</div>

</div>

</section>


<section class="card">

<h2>📜 Previous Tests</h2>

<div
id="history"
class="history-list">
</div>

</section>

</div>


<script>

"use strict";


/* =========================================
   STORAGE
========================================= */

const HISTORY_KEY = "cbtHistory";


/* =========================================
   SAFE HISTORY READER
========================================= */

function getHistory(){

  try{

    const raw =
      localStorage.getItem(HISTORY_KEY);

    if(!raw){
      return [];
    }

    const data =
      JSON.parse(raw);

    if(!Array.isArray(data)){
      return [];
    }

    return data;

  }catch(error){

    console.error(
      "History read error:",
      error
    );

    return [];

  }

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

  return String(
    value == null ? "" : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================
   OPEN CBT
========================================= */

function openCBT(){

  window.location.href =
    "cbt.html";

}


/* =========================================
   OPEN TEST DETAILS
========================================= */

function openTest(index){

  window.location.href =
    "test-details.html?test=" +
    encodeURIComponent(index);

}


/* =========================================
   LOAD HISTORY
========================================= */

function loadHistory(){

  const history =
    getHistory();


  document.getElementById(
    "tests"
  ).textContent =
    history.length;


  document.getElementById(
    "attempts"
  ).textContent =
    history.length;


  /* =====================================
     EMPTY
  ===================================== */

  if(history.length === 0){

    document.getElementById(
      "best"
    ).textContent = "0";

    document.getElementById(
      "average"
    ).textContent = "0";


    document.getElementById(
      "history"
    ).innerHTML = `

      <div class="empty">

        <div style="font-size:50px">
          📜
        </div>

        <h3>
          No tests completed yet
        </h3>

        <p>
          Complete your first CBT to see it here.
        </p>

        <button
          class="primary"
          type="button"
          onclick="openCBT()">

          📝 Start CBT

        </button>

      </div>

    `;

    return;

  }


  /* =====================================
     SCORE
  ===================================== */

  let best = 0;
  let totalScore = 0;


  history.forEach(
    function(test){

      if(!test){
        return;
      }

      const score =
        Number(test.score) || 0;


      if(score > best){
        best = score;
      }


      totalScore += score;

    }
  );


  document.getElementById(
    "best"
  ).textContent =
    best;


  document.getElementById(
    "average"
  ).textContent =
    Math.round(
      totalScore / history.length
    );


  /* =====================================
     RENDER
  ===================================== */

  const container =
    document.getElementById(
      "history"
    );


  container.innerHTML = "";


  /*
     Newest test first.
     actualIndex is the original
     localStorage array index.
  */

  for(
    let displayIndex = history.length - 1;
    displayIndex >= 0;
    displayIndex--
  ){

    const test =
      history[displayIndex];


    if(!test){
      continue;
    }


    const correct =
      Number(test.correct) || 0;


    const wrong =
      Number(
        test.incorrect ??
        test.wrong
      ) || 0;


    const skipped =
      Number(test.skipped) || 0;


    let totalQuestions =
      correct +
      wrong +
      skipped;


    if(
      Array.isArray(test.questions)
    ){

      totalQuestions =
        test.questions.length;

    }


    const score =
      Number(test.score) || 0;


    const date =
      test.date ||
      "Unknown date";


    /* =================================
       REAL BUTTON
    ================================= */

    const button =
      document.createElement(
        "button"
      );


    button.type = "button";

    button.className =
      "test-button";


    button.innerHTML = `

      <div class="test-title">

        📝 CBT Attempt #${displayIndex + 1}

      </div>


      <div class="details">

        📅 ${escapeHTML(date)}

      </div>


      <div class="details">

        🎯 Score:
        <strong>${score}</strong>

        &nbsp; • &nbsp;

        ✅ Correct:
        ${correct}

        &nbsp; • &nbsp;

        ❌ Wrong:
        ${wrong}

        &nbsp; • &nbsp;

        ⏭️ Skipped:
        ${skipped}

      </div>


      <div class="details">

        📚 Questions:
        ${totalQuestions}

      </div>


      <div class="open-text">

        👆 Tap to open full test details →

      </div>

    `;


    /*
       Direct click handler.
       No nested links.
       No dependency on event bubbling.
    */

    button.onclick =
      function(){

        openTest(
          displayIndex
        );

      };


    container.appendChild(
      button
    );

  }

}


/* =========================================
   START
========================================= */

loadHistory();

</script>

</body>
</html>
