<!doctype html>
<html lang="en">
<head>
<script src="./rankforge-core-v1.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankForge AI — New Questions</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}
main{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 22px #00000010}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
select,input,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccd3df;margin-top:6px}
button{cursor:pointer;font-weight:700}
textarea{min-height:280px;font-family:monospace}
small{color:#667085}
</style>
</head>
<body>
<main>
<h1>🤖 RankForge AI — New Questions</h1>
<p>AI questions are kept separate until validation and approval.</p>

<div class="card">
<div class="grid">
<label>Subject<select id="rfAISubject">
<option>Mixed</option><option>Physics</option><option>Chemistry</option><option>Biology</option>
</select></label>

<label>Difficulty<select id="rfAIDifficulty">
<option>Hard</option><option>Very Hard</option><option>Rank Booster</option>
</select></label>

<label>Count<select id="rfAICount">
<option>10</option><option>15</option><option>30</option><option>45</option><option>90</option>
</select></label>
</div>

<label>Chapter / Topic
<input id="rfAITopic" placeholder="e.g. Rotational Motion / Genetics / Electrochemistry">
</label>

<button onclick="generateSpec()">Generate AI Specification</button>
</div>

<div class="card">
<h3>Strict AI specification</h3>
<textarea id="rfAISpec" readonly></textarea>
<button onclick="navigator.clipboard?.writeText(document.getElementById('rfAISpec').value)">Copy Specification</button>
</div>

<div class="card">
<h3>AI JSON → Validate</h3>
<textarea id="rfAIJson" placeholder='Paste provider-generated JSON array here'></textarea>
<button onclick="validateAI()">Validate & Stage AI Questions</button>
<button onclick="approveAI()">Approve Staged Questions → AI Bank</button>
<p id="rfAIStatus"></p>
<div id="rfAIApproval"></div>
</div>
</main>

<script src="./rank-booster/ai-question-engine.js"></script>
<script src="./rank-booster/ai-new-question-module-v1.js"></script>\n<script src="./rankforge-master-pool-v2.js"></script>
<script>
function generateSpec(){
 const subject=document.getElementById("rfAISubject").value;
 const difficulty=document.getElementById("rfAIDifficulty").value;
 const count=Number(document.getElementById("rfAICount").value);
 const topic=document.getElementById("rfAITopic").value.trim();

 const spec={
   task:"Generate genuinely new NEET RankForge questions",
   subject,difficulty,count,topic,
   rules:[
    "NCERT-first and NEET-relevant",
    "Do not copy or reword existing questions",
    "Avoid near-duplicate solving paths",
    "Exactly one correct option",
    "Four clear options",
    "No unsupported facts",
    "No filler/basic questions",
    "Include concept/application/trap/inference where appropriate",
    "Return ONLY a JSON array"
   ],
   schema:{
    text:"string",
    options:["A","B","C","D"],
    correctIndex:0,
    subject,
    chapter:topic,
    topic,
    difficulty,
    explanation:"string",
    trapType:"string"
   }
 };
 document.getElementById("rfAISpec").value=JSON.stringify(spec,null,2);
}

function validateAI(){
 try{
   const raw=JSON.parse(document.getElementById("rfAIJson").value);
   const result=
     window.RankForgeAINewQuestionModuleV1.importAndValidate(raw);

   document.getElementById("rfAIStatus").textContent=
     `Validated: ${result.accepted} | Rejected: ${result.rejected} | Staged: ${result.staged}`;

   renderStaged();
 }catch(e){
   document.getElementById("rfAIStatus").textContent=
     "Validation error: "+e.message;
 }
}

function renderStaged(){
 const box=document.getElementById("rfAIApproval");
 const staged=
   window.RankForgeAINewQuestionModuleV1.getStaged();

 if(!staged.length){
   box.innerHTML="<small>No questions waiting for approval.</small>";
   return;
 }

 box.innerHTML=
   "<h4>Pending Approval ("+staged.length+")</h4>"+
   "<label><input type='checkbox' id='rfApproveAll' checked> Approve all staged questions</label>";
}

function approveAI(){
 try{
   const staged=
     window.RankForgeAINewQuestionModuleV1.getStaged();

   if(!staged.length){
     document.getElementById("rfAIStatus").textContent=
       "Nothing is waiting for approval.";
     return;
   }

   const result=
     window.RankForgeAINewQuestionModuleV1.approveAllStaged();

   document.getElementById("rfAIStatus").textContent=
     `Approved: ${result.approved} | AI Bank total: ${result.total}`;

   renderStaged();

   // Rebuild Master Pool V2 after explicit approval.
   if(window.RankForgeMasterPoolV2 &&
      typeof window.RankForgeMasterPoolV2.build==="function"){
     Promise.resolve(
       window.RankForgeMasterPoolV2.build()
     ).then(()=>{
       document.getElementById("rfAIStatus").textContent +=
         " | Master Pool V2 rebuilt";
     }).catch(()=>{});
   }
 }catch(e){
   document.getElementById("rfAIStatus").textContent=
     "Approval error: "+e.message;
 }
}

renderStaged();
</script>

<div id="rankforgeLectureFallback" style="display:block !important;visibility:visible !important;opacity:1 !important;"><a href="rankforge-lecture-module/pages/lectures.html" style="display:block !important;visibility:visible !important;opacity:1 !important;">🎓 <strong>AI Lectures</strong> — NCERT-first lectures, AI explanation and practice.</a></div>
</body>
</html>
