<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RankForge — offline</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4fb;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.c{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;max-width:420px;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{color:#6b7280;line-height:1.55}
button{font:inherit;font-weight:800;border:0;border-radius:12px;background:#4f46e5;color:#fff;padding:13px 20px;width:100%;margin-top:10px}
</style>
<link rel="stylesheet" href="./rf-theme.css">
<script src="./rf-shell.js"></script>
</head>
<body>
<div class="c">
  <h1>📡 You're offline</h1>
  <p>RankForge loads the latest version from the internet. Pages you opened before may still work from this device's cache.</p>
  <button onclick="location.reload()">Try again</button>
  <button style="background:#e5e7eb;color:#111827" onclick="history.length>1?history.back():location.reload()">Go back</button>
</div>
</body>
</html>
