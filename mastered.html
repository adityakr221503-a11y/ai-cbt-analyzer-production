<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Mastered</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
font-family:inherit;
cursor:pointer;
}

.back{
border:0;
background:#e2e8f0;
padding:11px 15px;
border-radius:10px;
font-weight:800;
}

.container{
max-width:1000px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#4f46e5;
color:white;
padding:28px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
line-height:1.5;
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.count{
font-size:42px;
font-weight:800;
color:#15803d;
}

.item{
border:1px solid #bbf7d0;
background:#f0fdf4;
border-radius:14px;
padding:17px;
margin-top:14px;
}

.badge{
display:inline-block;
background:#dcfce7;
color:#166534;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
margin-right:5px;
}

.question{
font-size:18px;
font-weight:800;
line-height:1.5;
margin-top:12px;
}

.info{
background:white;
padding:13px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
}

.correct{
color:#15803d;
font-weight:800;
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b;
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="back"
onclick="location.href='mistake.html'">

← Mistake Bank

</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>🏆 Mastered Questions</h1>

<p>
Questions you successfully mastered through the Retry Engine.
</p>

</div>


<div class="card">

<div>
Mastered Questions
</div>

<div
class="count"
id="count">
0
</div>

</div>


<div id="list"></div>

</div>


<script>

const KEY="cbtMasteryV2";


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function loadMastered(){

let data=[];

try{

data=JSON.parse(
localStorage.getItem(KEY)||"[]"
);

if(!Array.isArray(data)){
data=[];
}

}catch(error){

data=[];

}


document.getElementById("count").textContent=
data.length;


const list=document.getElementById("list");

list.innerHTML="";


if(!data.length){

list.innerHTML=`

<div class="card empty">

<div style="font-size:55px">
🔎
</div>

<h2>No Mastered Questions</h2>

<p>
No questions were found in
<strong>cbtMasteryV2</strong>.
</p>

</div>

`;

return;

}


data.forEach(function(q,index){

const answer=
q.correctAnswer||
(
Array.isArray(q.options)
?q.options[Number(q.correctIndex)]
:""
);

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<span class="badge">
🏆 Mastered ${index+1}
</span>

<span class="badge">
${escapeHTML(q.subject||"Unknown")}
</span>

<span class="badge">
${escapeHTML(q.topic||"Unknown")}
</span>

<div class="question">
${escapeHTML(q.question)}
</div>

<div class="info">

<strong class="correct">
✅ Correct Answer
</strong>

<br><br>

${escapeHTML(answer)}

${
q.solution
?
`
<br><br>
<strong>💡 Solution</strong>
<br><br>
${escapeHTML(q.solution)}
`
:""
}

</div>

`;

list.appendChild(div);

});

}


loadMastered();

</script>

</body>
</html>
