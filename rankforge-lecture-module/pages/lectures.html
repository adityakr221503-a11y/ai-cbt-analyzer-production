<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankForge Lectures</title>
<link rel="stylesheet" href="../components/lecture-module.css">
</head>
<body>

<main class="rf-lecture-app">
  <header class="hero">
    <div>
      <span class="badge">RANKFORGE</span>
      <h1>Lectures</h1>
      <p>Learn → Practice → Revise → Improve</p>
    </div>
  </header>

  <section class="stats">
    <div><b id="subjects">0</b><span>Subjects</span></div>
    <div><b id="chapters">0</b><span>Chapters</span></div>
    <div><b id="lectures">0</b><span>Lectures</span></div>
    <div><b id="progress">0%</b><span>Progress</span></div>
  </section>

  <section class="learning-tools">
    <div id="continueBox" class="continue-box"></div>

    <input
      id="lectureSearch"
      class="lecture-search"
      type="search"
      placeholder="Search lectures, chapters or subjects..."
      autocomplete="off"
    >

    <div id="subjectFilters" class="subject-filters"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>My Learning</h2>
      <span id="status">Ready</span>
    </div>
    <div id="lectureGrid" class="lecture-grid"></div>
  </section>
</main>

<script src="../data/lecture-data.js"></script>
<script src="../components/lecture-module.js"></script>
</body>
</html>
