function home(){if(E)clearInterval(E.iv);E=null;document.body.classList.remove('inx');$('main').innerHTML=`<section data-p="home"><div id="dash"></div></section><section data-p="create">${PH('🚀','Create','Turn PDFs, notes and topics into tests','#6366f1','#ec4899')}<div class="card"><h2><span class="nb">1</span>Turn a module or PDF into a CBT test</h2>

<div class="row"><label class="b">Choose PDF<input class="fi" type="file" multiple accept="application/pdf,.pdf"></label><label class="b g">Choose photos<input class="fi" type="file" multiple accept="image/*"></label><label class="b g">Take photo<input class="fi" type="file" accept="image/*" capture="environment"></label><label class="b g">Any file<input class="fi" type="file" multiple></label></div><div id="fn" class="mut"></div>
<textarea id="ak" rows="2" placeholder="Answer key (optional), for example 1-3 2-1 3-4 …" style="width:100%;margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit"></textarea><textarea id="pt" rows="4" placeholder="No file picker? Paste the questions here as text" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit"></textarea>
<label class="row">Explanations in <select id="lg"><option>Hinglish</option><option>English</option><option>Hindi</option></select></label><label class="row"><input id="sc" type="checkbox"> Scanner mode: run OCR on every page (slower, only for scanned papers)</label>
<div class="row"><button class="b" id="go">Build test</button><button class="b g" id="stop" hidden>Stop</button></div><div id="pg" class="mut"></div></div><div class="card"><h3><span class="nb">2</span>Source notes (NCERT or your own)</h3><p class="mut">Add text and the AI writes questions only from it, quoting the supporting line.</p><div class="row"><label class="b g">Choose PDF or text file<input id="kf" class="fx" type="file" accept=".pdf,.txt,application/pdf,text/plain"></label></div><textarea id="kt" rows="3" placeholder="or paste notes here" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit"></textarea><div class="row"><button class="b" id="ka">Add notes</button></div>${(S.kn||[]).map((k,i)=>`<div class="row"><span style="flex:1">${esc(k.n)} · ${Math.round(k.t.length/1000)}k characters</span><button class="b g" onclick="S.kn.splice(${i},1);keep();TAB='create';home()">Remove</button></div>`).join('')}</div><div class="card"><h3><span class="nb">★</span>Question banks (made from your PDFs, no AI)</h3><p class="mut">Pick subject, chapter and difficulty, then practise or take a timed test.</p><div id="bkx" class="mut">Looking for banks…</div></div><div class="card"><h2><span class="nb">3</span>Generate a test with AI</h2><div class="row"><select id="gs"><option>Mixed NEET</option><option>Physics</option><option>Chemistry</option><option>Botany</option><option>Zoology</option></select><select id="gd"><option>Easy (NCERT basics)</option><option selected>NEET standard</option><option>Elite (hard)</option></select><input id="gn" type="number" min="5" max="90" value="30" style="width:76px"></div><div class="row"><select id="fsrc"><option value="">Source: none (syllabus)</option><option value="all">Source: all my tests</option>${S.tests.map((t,i)=>`<option value="${i}">Source: ${esc(t.n).slice(0,30)}</option>`).join('')}${(S.kn||[]).map((k,i)=>`<option value="k${i}">Notes: ${esc(k.n).slice(0,28)}</option>`).join('')}</select><select id="fm"><option value="style">New questions in my papers’ style</option><option value="predict">Predict likely next questions</option><option value="syllabus">Syllabus and NCERT lines</option></select></div><input id="gt" placeholder="Topics, e.g. Thermodynamics, Kinetic theory" style="width:100%"><div class="row"><button class="b" id="gp">Generate &amp; practice</button><button class="b g" id="gx">Generate &amp; test</button><button class="b g" id="tt2">Teach me this topic</button><label class="b g">Doubt from photo<input id="ph" class="fx" type="file" accept="image/*"></label></div><p class="mut">AI-written questions can contain mistakes, so check answers you doubt.</p></div></section><section data-p="library">${PH('📚','Library','Your tests and question bank','#3b82f6','#06b6d4')}<div id="lib"></div><div id="qbk"></div></section><section data-p="practice">${PH('🔁','Practice','Mistakes, flashcards and adaptive sets','#14b8a6','#22c55e')}<div id="nbx"></div><div class="card"><h3>Revision tools</h3><div class="row"><button class="b g" id="fc">Flashcards</button><button class="b g" id="sp">Study plan</button><button class="b g" id="ad">Adaptive practice</button><button class="b g" id="rp">Revision PDF</button></div><div id="plan"></div></div><div class="card"><h3>Concept across exams</h3><div class="row"><input id="xm" placeholder="e.g. Electric field" style="flex:1;min-width:150px"><button class="b g" id="xb">Compare NEET and JEE</button></div><div id="xr"></div></div></section><section data-p="stats">${PH('📊','Analysis','Scores, gaps and records','#f59e0b','#ef4444')}<div class="card"><h3>Topic weightage</h3><p class="mut">Counts the topics across your source papers.</p><button class="b g" id="tb">Show weightage</button><div id="tr" class="mut"></div></div><div id="hx"></div></section><section data-p="more">${PH('⚙️','More','AI settings, goals and backup','#8b5cf6','#6366f1')}<details open class="card"><summary>AI settings (your own model)</summary><div class="row"><input id="cu" placeholder="Endpoint URL" style="flex:1;min-width:220px"><input id="cm" placeholder="Model" style="width:120px"><input id="ck" type="password" placeholder="API key (optional)" style="width:150px"></div><div class="row"><button class="b g" id="ta">Test AI</button><button class="b g" id="lm">Find Gemini models</button></div><div class="row" id="ml"></div><p class="mut">Gemini: keep the address above, paste your key, tap Find Gemini models, pick one, then tap Test AI. Other servers: any OpenAI-compatible address works. Settings stay in this browser.</p></details><div class="card"><b>Goals and tools</b><div class="row"><label class="mut">Daily goal <input id="dg" type="number" min="5" value="30" style="width:70px"></label><label class="mut">Target accuracy % <input id="ta2" type="number" min="30" max="100" value="85" style="width:70px"></label><label class="mut">Exam date <input id="ed" type="date"></label></div><div id="gl" class="mut"></div><div class="row"><button class="b g" id="bk">Backup</button><label class="b g">Restore<input id="rs" class="fx" type="file" accept=".json,application/json"></label></div><label class="mut"><input type="checkbox" id="sh"> Shuffle questions</label></div></section>`;
$('#go').onclick=build;$('#gp').onclick=()=>gen('practice');$('#gx').onclick=()=>gen('test');$('#tb').onclick=trend;$('#ad').onclick=adapt;$('#rp').onclick=rpdf;$('#xb').onclick=xmap;$('#ka').onclick=addNote;banks();$('#tt2').onclick=()=>{const t=$('#gt').value.trim();if(!t)return pg('Type a topic first.');teach(0,{q:'Teach the topic "'+t+'" as a full lesson for a NEET student: key ideas, a worked example, then ask one quick question at the end.',o:[],a:null,e:''})};

function kn(i,top){const k=(S.kn||[])[i];if(!k)return'';const ch=[];for(let p=0;p<k.t.length;p+=2500)ch.push(k.t.slice(p,p+2500));const w=[...wd(top||'')],sc=ch.map(c=>{const l=c.toLowerCase();return w.reduce((a,x)=>a+(l.includes(x)?1:0),0)});return ch.map((c,j)=>j).sort((a,b)=>sc[b]-sc[a]).slice(0,3).sort((a,b)=>a-b).map(j=>ch[j]).join('\n---\n')}

async function addNote(){const f=$('#kf').files[0],t=$('#kt').value.trim();let x=t,n=f?f.name:'Pasted notes';try{if(f&&/pdf$/i.test(f.name)){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;x='';for(let p=1;p<=d.numPages;p++)x+=(await(await d.getPage(p)).getTextContent()).items.map(i=>i.str).join(' ')+'\n'}else if(f)x=await f.text()}catch(e){return msg('Could not read that file.')}if(x.length<200)return msg('Not enough text found. For scanned notes, type or paste them.');S.kn=S.kn||[];S.kn.unshift({n,t:x.slice(0,300000)});keep();TAB='create';home();msg('Notes added.')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./examhall-standalone.html'}).catch(()=>{});
let CM={k:new Set(),w:new Set()},FG=[];
const ld=q=>Math.min(100,(q.c||[]).length*20+(q.pre||[]).length*8+(q.tr?15:0)+(q.d||0)*5);
function cmap(){const k=new Set(),w=new Set();S.hist.forEach(h=>{const t=S.tests.find(x=>x.id==h.tid);if(!t||!h.a)return;const qs=h.qi?h.qi.map(i=>t.qs[i]):t.qs;qs.forEach((q,i)=>{if(!q||!q.c||h.a[i]==null)return;q.c.forEach(c=>(h.a[i]===q.a?k:w).add(String(c).toLowerCase()))})});return{k,w}}
function pl(q){if(!q.pre||!q.pre.length)return'';return '<div class="mut">Needs first: '+q.pre.map(p=>{const l=String(p).toLowerCase();return esc(p)+(CM.w.has(l)?' (weak for you)':CM.k.has(l)?'':' (not practised yet)')}).join(', ')+'</div>'}
function fam(all){const g={};all.forEach(q=>{const c=q.c&&q.c[0]?String(q.c[0]).toLowerCase():'';if(c)(g[c]=g[c]||[]).push(q)});const l=Object.entries(g).filter(x=>x[1].length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,8);FG=l.map(x=>x[1]);return l.length?`<div class="card"><h3>Question families</h3><p class="mut">Questions that test the same concept.</p>${l.map(([k,v],i)=>`<div class="row"><span style="flex:1">${esc(k)} <span class="mut">${v.length} questions</span></span><button class="b g" onclick="famGo(${i})">Practise</button></div>`).join('')}</div>`:''}
function famGo(i){const qs=(FG[i]||[]).slice(0,30);start({id:'fam',tmp:1,n:'Question family',m:qs.length,p:4,x:1,qs},'practice')}
function syl(){const k=S.kn[+$('#sy').value],t=k.t.toLowerCase(),tp=[...new Set(S.tests.flatMap(x=>x.qs.map(q=>q.t)).filter(Boolean))],miss=tp.filter(x=>{const w=[...wd(x)];return w.length&&w.filter(z=>t.includes(z)).length/w.length<.5});$('#syr').innerHTML=`${tp.length-miss.length} of ${tp.length} topics were found in your syllabus text.${miss.length?'<br>Not found: '+miss.slice(0,15).map(esc).join(', '):''}`}
function shr(){const r=grade(E),t=E.t.n+': '+r.sc+'/'+r.mx+', accuracy '+r.ac+'% (ExamHall)';if(navigator.share)navigator.share({text:t}).catch(()=>{});else{if(navigator.clipboard)navigator.clipboard.writeText(t);msg('Result copied.')}}
const SC={Physics:'#3b82f6',Chemistry:'#f59e0b',Botany:'#22c55e',Zoology:'#ec4899',General:'#8b5cf6'},sj=s=>`<span class="chip" style="--c:${SC[s]||'#8b5cf6'}">${esc(s)}</span>`,PH=(i,t,d,a,b)=>`<div class="ph"><div class="pi" style="--c1:${a};--c2:${b}">${i}</div><div><h1>${t}</h1><p>${d}</p></div></div>`;
let BK={},BI=[];const SNC=new Map();
async function banks(){const el=$('#bkx');if(!el)return;try{const r=await fetch('banks/index.json',{cache:'no-store'});if(!r.ok)throw 0;BI=await r.json()}catch(e){el.textContent='No banks found yet. Build them from your PDFs with tools/bank-builder.py, then push the banks folder.';return}
 el.innerHTML=BI.map(b=>`<div class="row"><span style="flex:1"><b>${esc(b.name)}</b> <span class="mut">${b.count} questions · ${b.keyed} with PDF answers${b.ai?' · '+b.ai+' AI-filled':''}</span></span><button class="b" onclick="bkOpen('${esc(b.id)}')">Open</button></div>`).join('')+'<div id="bkg"></div>'}
async function bkOpen(id){if(!BK[id]){try{BK[id]=(await(await fetch('banks/'+id+'.json')).json()).questions}catch(e){return msg('Could not load that bank.')}}
 const qs=BK[id],su=[...new Set(qs.map(q=>q.s))],ch=[...new Set(qs.map(q=>q.ch))],lv=['Easy','Medium','Hard','Elite'];
 $('#bkg').innerHTML=`<div class="card"><div class="row"><select id="bs"><option value="">All subjects</option>${su.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="bc"><option value="">All chapters</option>${ch.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="row">${lv.map(l=>`<label class="mut"><input type="checkbox" class="bl" value="${l}" checked> ${l} (${qs.filter(q=>q.lvl==l).length})</label>`).join('')}</div><div class="row"><label class="mut">Questions <input id="bn" type="number" value="30" min="5" max="180" style="width:70px"></label><label class="mut"><input type="checkbox" id="bk2" checked> Only complete questions with answers</label><label class="mut"><input type="checkbox" id="bai"> Include AI-filled answers (unverified)</label></div><div class="row"><button class="b" onclick="bkGo('${esc(id)}','practice')">Practice</button><button class="b g" onclick="bkGo('${esc(id)}','test')">Timed test</button><button class="b g" onclick="bkLvl()">Pick my level</button></div><p class="mut">Levels are estimated from question style (statements, assertion-reason, matching, length), not official ratings.</p></div>`}
function bkLvl(){const h=S.hist.slice(0,5),av=h.length?h.reduce((a,b)=>a+b.ac,0)/h.length:60,on=av<50?['Easy','Medium']:av<75?['Medium','Hard']:['Hard','Elite'];document.querySelectorAll('.bl').forEach(c=>c.checked=on.includes(c.value));msg('Levels set from your recent accuracy ('+Math.round(av)+'%).')}
function bkGo(id,mode){const sv=$('#bs').value,cv=$('#bc').value,lv=[...document.querySelectorAll('.bl')].filter(c=>c.checked).map(c=>c.value),n=Math.min(180,Math.max(5,+$('#bn').value||30)),ok=$('#bk2').checked,ai=$('#bai').checked;
 const pool=BK[id].filter(q=>(!sv||q.s==sv)&&(!cv||q.ch==cv)&&lv.includes(q.lvl)&&(!ok||(q.a!=null&&!q.chk))&&(ai||!q.ai)&&q.o.length>=2);if(!pool.length)return msg('No questions match. Change the filters.');
 const qs=pool.sort(()=>Math.random()-.5).slice(0,n).map((q,i)=>({n:i+1,s:q.s,q:q.q,o:q.o,a:q.a,e:'',t:q.ch,lvl:q.lvl,ck:q.ai?'Answer filled by AI, not from the PDF key. Please check it.':''}));
 S.tests.unshift({id:Date.now(),n:id+': '+(cv||sv||'mixed')+' · '+lv.join('/'),qs,m:Math.ceil(qs.length*1.1),p:4,x:1});keep();start(S.tests[0],mode)}
function ncert(q){if(!(S.kn||[]).length)return'<div class="mut">Add NCERT chapters in Source notes to see the NCERT line here.</div>';const w=wd(q.q+' '+(q.a!=null&&q.o[q.a]?q.o[q.a]:''));let best='',bs=0,bn='';
 S.kn.forEach(k=>{const key=k.n+k.t.length;let sn=SNC.get(key);if(!sn){sn=k.t.split(/(?<=[.!?])\s+/).filter(x=>x.length>30&&x.length<400);SNC.set(key,sn)}sn.forEach(x=>{const ws=wd(x);let n=0;w.forEach(z=>ws.has(z)&&n++);if(n>bs){bs=n;best=x;bn=k.n}})});
 return bs>=3?`<div class="mut" style="border-left:3px solid var(--acc);padding-left:8px">NCERT (${esc(bn)}): ${esc(best)}</div>`:'<div class="mut">No matching NCERT line found in your notes.</div>'}
async function txs(i,b){const q=E.qs[i],k=qk(q);S.sol=S.sol||{};let t=S.sol[k];if(!t){b.textContent='Working…';try{const r=await AI.json(`Solve this NEET question step by step in ${LG()}. Question: ${q.q} Options: ${q.o.map((o,j)=>A[j]+') '+o).join(' | ')}. Correct answer: ${q.a==null?'work it out':A[q.a]}. Mention the relevant NCERT idea if you know it. Return ONLY JSON {"sol":"numbered steps as plain text"}`);t=cl(r.sol||'');S.sol[k]=t;keep()}catch(e){b.textContent='Text solution';return msg(cp(e))}b.textContent='Text solution'}
 const d=document.createElement('div');d.className='mut';d.style.whiteSpace='pre-wrap';d.textContent=t;b.parentNode.insertBefore(d,b.nextSibling)}
DL={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click()}};
home();
