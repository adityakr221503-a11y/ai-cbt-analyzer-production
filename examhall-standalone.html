function home(){if(E)clearInterval(E.iv);E=null;document.body.classList.remove('inx');$('main').innerHTML=`<section data-p="home"><div id="dash"></div></section><section data-p="create"><div class="card"><h2>Turn a module or PDF into a CBT test</h2>

><div id="tr" class="mut"></div></div><div id="hx"></div></section><section data-p="more"><details open class="card"><summary>AI settings (your own model)</summary><div class="row"><input id="cu" placeholder="Endpoint URL" style="flex:1;min-width:220px"><input id="cm" placeholder="Model" style="width:120px"><input id="ck" type="password" placeholder="API key (optional)" style="width:150px"></div><div class="row"><button class="b g" id="ta">Test AI</button><button class="b g" id="lm">Find Gemini models</button></div><div class="row" id="ml"></div><p class="mut">Gemini: keep the address above, paste your key, tap Find Gemini models, pick one, then tap Test AI. Other servers: any OpenAI-compatible address works. Settings stay in this browser.</p></details><div class="card"><b>Goals and tools</b><div class="row"><label class="mut">Daily goal <input id="dg" type="number" min="5" value="30" style="width:70px"></label><label class="mut">Target accuracy % <input id="ta2" type="number" min="30" max="100" value="85" style="width:70px"></label><label class="mut">Exam date <input id="ed" type="date"></label></div><div id="gl" class="mut"></div><div class="row"><button class="b g" id="bk">Backup</button><label class="b g">Restore<input id="rs" class="fx" type="file" accept=".json,application/json"></label></div><label class="mut"><input type="checkbox" id="sh"> Shuffle questions</label></div></section>`;

{const g=JSON.parse(localStorage.getItem('ehg')||'{}');$('#dg').value=g.d||30;$('#ta2').value=g.t||85;$('#ed').value=g.e||'';['dg','ta2','ed'].forEach(i=>$('#'+i).onchange=()=>{localStorage.setItem('ehg',JSON.stringify({d:+$('#dg').value,t:+$('#ta2').value,e:$('#ed').value}));gl()});gl()}$('#ph').onchange=e=>{const f=e.target.files[0];if(f)teach(0,{q:'The student sent a photo of a question. Read it, then teach the solution.',o:[],a:null,e:''},f)};$('#lg').value=localStorage.getItem('ehl')||'Hinglish';$('#lg').onchange=()=>localStorage.setItem('ehl',$('#lg').value);$('#ta').onclick=async()=>{sv();pg('Testing the AI…');try{const r=await AI.json('Return only this JSON: {"ok":true}');pg(r&&r.ok?'AI works with model '+$('#cm').value+'.':'AI replied in an unexpected form. Try Build test anyway.')}catch(e){pg(cp(e))}};

const P=()=>'Extract every multiple-choice question from this exam material, in order, exactly as printed, and do not skip any, even one that starts at the bottom of the previous page. Return ONLY a JSON array: [{"n":printed question number,"q":"question","o":["option A","option B","option C","option D"],"a":0,"e":"short explanation","t":"topic","s":"subject: Physics, Chemistry, Botany or Zoology"}]. a is the index (0-3) of the correct option: use the printed answer key if present, otherwise solve it yourself. Write the explanation e in '+LG()+'. Use plain Unicode text only, for example H₂O, x², √, with no HTML tags and no LaTeX. Ignore headers, footers and page numbers.';
const rx=t=>[...t.matchAll(/(?:^|\s)\d{1,3}[.)]\s+([\s\S]*?)(?=\s\d{1,3}[.)]\s|$)/g)].map(m=>{const s=m[1].split(/\s*\(?[A-Da-d1-4][).]\s+/);return{q:s[0].trim(),o:s.slice(1,5).map(x=>x.trim()),a:null,e:'',t:''}}).filter(q=>q.q&&q.o.length>=2);
async function ext(b,signal){if(!AI)return rx(b.t||'');const o={signal,modelTier:'default'};if(b.b)o.images=b.b;

async function build(){const fs=[...document.querySelectorAll('.fi')].flatMap(i=>[...i.files]),tx=$('#pt').value.trim();let J=null;if(tx[0]=='[')try{J=JSON.parse(tx)}catch(e){}if(!fs.length&&!tx)return pg('Choose a file or paste some text first.');

 try{const pages=[];

   const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
   for(let n=1;n<=d.numPages;n++){pg(`Opening ${f.name}: page ${n} of ${d.numPages}…`);const p=await d.getPage(n),t=(await p.getTextContent()).items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('');
    if(!scan&&t.trim().length>150)pages.push({t});else{const v=p.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;pages.push({b:await new Promise(r=>c.toBlob(r,'image/jpeg',.8))})}}}
  if(tx&&!J)pages.push({t:tx});const lim=AI?await AI.limits().catch(()=>({})):{},mx=lim.images?.maxCount||3,B=[];let cur=null;
  for(const p of pages){if(p.t){if(cur&&cur.t!=null&&cur.t.length<3500)cur.t+=p.t;else B.push(cur={t:p.t})}else{if(cur&&cur.b&&cur.b.length<mx)cur.b.push(p.b);else B.push(cur={b:[p.b]})}}
  if(B.some(b=>b.b)&&!lim.images)throw{code:'images_unavailable'};

  const w=async()=>{while(k<B.length){const i=k++;try{out[i]=await ext(B[i],ctl.signal)}catch(e){if(e.code=='cancelled')throw e;er=e;k=B.length;break}pg(`Read ${++done} of ${B.length} sections · ${out.flat().length} questions so far`)}};
  await Promise.all([w(),w(),w()]);
  const seen=new Set(),qs=[];for(const q of (J||out.flat()).filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length>1)){const key=(q.n||'')+'|'+q.q.slice(0,80).toLowerCase()+'|'+String(q.o[0]).slice(0,30);if(seen.has(key))continue;seen.add(key);qs.push({n:+q.n||0,s:cl(q.s)||'General',q:cl(q.q),o:q.o.slice(0,6).map(cl),a:Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length?q.a:null,e:cl(q.e),t:cl(q.t)||'General'})}
  if(!qs.length)throw er||{code:'none'};if(qs.filter(q=>q.n).length>qs.length*.8)qs.sort((a,b)=>(a.n||1e9)-(b.n||1e9));const got=new Set(qs.map(q=>q.n)),mis=[];for(let k=1;k<=Math.max(...qs.map(q=>q.n));k++)if(!got.has(k))mis.push(k);

  msg(er?'Stopped early ('+cp(er)+') but saved '+qs.length+' questions.':qs.length+' questions loaded.')
 }catch(e){pg(e.code=='cancelled'?'Stopped.':e.code=='none'?'No questions found. Try Scanner mode.':cp(e));const g=$('#go');if(g){g.disabled=false;$('#stop').hidden=true}}}

 if(!qs.length)return pg(er?cp(er):'No questions were generated. Try again.');
 S.tests.unshift({id:Date.now(),n:'AI: '+(top||sub).slice(0,40),qs,m:Math.ceil(qs.length*(dif.startsWith('Elite')?1.3:1)),p:4,x:1,ai:1});keep();if(er)msg('Stopped early: '+cp(er)+' Using '+qs.length+' questions.');start(S.tests[0],mode)}
let P0;
function ins(t,qs){document.body.classList.add('inx');$('main').innerHTML=`<div class="card"><h2>${esc(t.n)}</h2><p>${qs.length} questions · ${t.m} minutes</p><p>Marking: +${t.p} for a correct answer, −${t.x} for a wrong answer, 0 if left blank.</p><p>The test opens in full screen. Leaving the tab is recorded and shown in your result.</p><p class="mut">Palette: green answered, red not answered, purple marked for review.</p><div class="row"><button class="b" onclick="start(P0.t,P0.mode,P0.qs,1)">I am ready, start</button><button class="b g" onclick="home()">Back</button></div></div>`}
function dl(e){const d=new Date().toISOString().slice(0,10),n=e.a.filter(x=>x!=null).length,y=new Date(Date.now()-DAY).toISOString().slice(0,10);S.dy=S.dy||{d,n:0,st:0,last:''};if(S.dy.d!=d){S.dy.d=d;S.dy.n=0}S.dy.n+=n;if(S.dy.last!=d){S.dy.st=S.dy.last==y?S.dy.st+1:1;S.dy.last=d}}
function gl(){const g=JSON.parse(localStorage.getItem('ehg')||'{}'),d=new Date().toISOString().slice(0,10),y=S.dy||{},n=y.d==d?y.n:0,h=S.hist.slice(0,5),av=h.length?Math.round(h.reduce((a,b)=>a+b.ac,0)/h.length):0,x=g.e?Math.ceil((new Date(g.e)-Date.now())/DAY):null,st=(y.last==d||y.last==new Date(Date.now()-DAY).toISOString().slice(0,10))?y.st||0:0;$('#gl').textContent=`Streak ${st} days · today ${n}/${g.d||30} questions · last 5 tests average ${av}% (target ${g.t||85}%)${x!=null&&x>=0?' · '+x+' days to exam':''}`}
function bm(i){i=i??E.i;const q=E.qs[i];S.bm=S.bm||[];if(S.bm.some(m=>qk(m)==qk(q)))return msg('Already saved.');const note=window.prompt('Add a note (optional)')||'';S.bm.push({q:q.q,o:q.o,a:q.a,e:q.e,t:q.t,s:q.s,note});keep();msg('Saved to bookmarks.')}
function fcs(){const l=[...(S.bm||[]),...(S.mb||[])];if(!l.length)return msg('Bookmark a question or make a mistake first.');let k=0,f=0;document.body.insertAdjacentHTML('beforeend','<div class="ov" id="fo"></div>');
 const d=()=>{const c=l[k];$('#fo').innerHTML=`<div class="row"><b style="flex:1">Flashcard ${k+1} of ${l.length}</b><button class="b g" onclick="$('#fo').remove()">Close</button></div><div class="card" id="fk" style="min-height:200px;font-size:18px;white-space:pre-wrap"></div><div class="row"><button class="b g" id="fp">Previous</button><button class="b" id="ff">Flip</button><button class="b g" id="fn2">Next</button></div>`;
 $('#fk').textContent=f?'Answer: '+(c.a==null?'?':A[c.a]+'. '+c.o[c.a])+'\n\n'+(c.e||'')+(c.note?'\n\nNote: '+c.note:''):c.q+'\n\n'+c.o.map((o,j)=>A[j]+'. '+o).join('\n');
 $('#ff').onclick=()=>{f=!f;d()};$('#fp').onclick=()=>{k=(k+l.length-1)%l.length;f=0;d()};$('#fn2').onclick=()=>{k=(k+1)%l.length;f=0;d()}};d()}
async function sim(i){const q=E.qs[i];msg('Writing 5 similar questions…');try{const r=arr(await AI.json(`Create 5 new NEET MCQs that test the same concept as this question but with different wording or numbers. Question: ${q.q} Options: ${q.o.join(' | ')}. Exactly 4 options and one correct answer. Solve carefully. Explanation in ${LG()}. Plain Unicode text, no HTML or LaTeX. Return ONLY a JSON array: [{"q":"","o":["","","",""],"a":0,"e":"","t":"","s":""}]`));
 const qs=r.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>1).map(x=>({s:cl(x.s)||q.s,q:cl(x.q),o:x.o.slice(0,4).map(cl),a:Number.isInteger(x.a)?x.a:null,e:cl(x.e),t:cl(x.t)||q.t}));if(!qs.length)return msg('Could not make questions. Try again.');start({id:'sim',tmp:1,n:'Similar questions',m:qs.length,p:4,x:1,qs},'practice')}catch(e){msg(cp(e))}}
async function plan(){const g=JSON.parse(localStorage.getItem('ehg')||'{}'),w=wk().map(x=>x[0]).join(', ')||'not known yet',x=g.e?Math.ceil((new Date(g.e)-Date.now())/DAY):60;$('#plan').textContent='Making your plan…';
 try{const r=await AI.json(`Make a ${Math.min(14,Math.max(3,x))}-day NEET study plan. Days to exam: ${x}. Weak topics: ${w}. Daily question goal: ${g.d||30}. Write in ${LG()}. Return ONLY JSON {"plan":[{"day":"Day 1","tasks":"short tasks"}]}`);$('#plan').innerHTML=(r.plan||[]).map(p=>`<div class="row"><b>${esc(p.day)}</b><span class="mut" style="flex:1">${esc(p.tasks)}</span></div>`).join('')}catch(e){$('#plan').textContent=cp(e)}}
function bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='examhall-backup.json';a.click()}
function rst(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tests))throw 0;S=d;S.hist=S.hist||[];keep();home();msg('Backup restored.')}catch(x){msg('That file is not a valid backup.')}})}
const FM={style:'Study the SOURCE QUESTIONS below, then write NEW questions in the same style, pattern and difficulty. Never copy a source question.',predict:'Study the SOURCE QUESTIONS below, which are past papers. Find which chapters and question types appear most, then write new questions on the topics most likely to appear next in NEET, weighting by those trends.',syllabus:'Follow the official NTA NEET UG syllabus and NCERT textbooks, including NCERT line-based questions.'};
const fsrc=i=>{const q=(S.tests[i]||{qs:[]}).qs,st=Math.ceil(q.length/40)||1;return q.filter((_,k)=>k%st==0).map(x=>(x.t||'')+': '+x.q.slice(0,160)).join('\n')};
function trend(){const si=$('#fsrc').value,ts=si===''||si=='all'?S.tests:[S.tests[+si]],c={};ts.forEach(t=>t.qs.forEach(q=>{const k=(q.s||'General')+' · '+(q.t||'General');c[k]=(c[k]||0)+1}));const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12),m=e[0]?e[0][1]:1;$('#tr').innerHTML=e.length?'<b>Topic weightage in your papers</b>'+e.map(([k,v])=>`<div class="row" style="margin-bottom:2px"><span style="flex:1">${esc(k)}</span><span class="mut">${v}</span></div><div class="bar"><i style="width:${100*v/m}%"></i></div>`).join(''):'Load a PYQ or module test first.'}
let TAB='home';
function tab(n){TAB=n||TAB;document.querySelectorAll('[data-p]').forEach(e=>e.classList.toggle('on',e.dataset.p==TAB));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==TAB));if(TAB=='home'||TAB=='stats')lib();scrollTo(0,0)}
function dash(){const g=JSON.parse(localStorage.getItem('ehg')||'{}'),d=new Date().toISOString().slice(0,10),y=S.dy||{},n=y.d==d?y.n:0,goal=g.d||30,due=(S.mb||[]).filter(m=>m.due<=Date.now()).length,x=g.e?Math.ceil((new Date(g.e)-Date.now())/DAY):null,h=S.hist.slice(0,5),av=h.length?Math.round(h.reduce((a,b)=>a+b.ac,0)/h.length):0;
 $('#dash').innerHTML=`<div class="card hero"><div class="mut">${x!=null&&x>=0?x+' days to exam':'Your daily plan'}</div><h2 style="margin:.1em 0">Today ${n} of ${goal} questions</h2><div class="bar" style="background:rgba(255,255,255,.3)"><i style="width:${Math.min(100,100*n/goal)}%;background:#fff"></i></div><div class="row"><button class="b w" onclick="tab('create')">Create a test</button>${due?`<button class="b w" onclick="rev()">Revise ${due} due</button>`:''}${localStorage.getItem('ehr')?'<button class="b w" onclick="resume()">Resume test</button>':''}</div></div>
<div class="tile">${[['create','📄','Upload PDF','Turn a module into a CBT test'],['create','✨','AI test','Elite questions in a minute'],['practice','🔁','Revision',due+' due today'],['stats','📊','Analysis','Last 5 average '+av+'%']].map(t=>`<button class="tl" onclick="tab('${t[0]}')"><b>${t[1]}</b>${t[2]}<span class="mut">${t[3]}</span></button>`).join('')}</div>
${S.tests.length?'<h3>Recent tests</h3>'+S.tests.slice(0,3).map((t,i)=>`<div class="card"><b>${esc(t.n)}</b><div class="mut">${t.qs.length} questions</div><div class="row"><button class="b" onclick="start(S.tests[${i}],'test')">Test</button><button class="b g" onclick="start(S.tests[${i}],'practice')">Practice</button></div></div>`).join(''):'<div class="card"><b>Start here</b><p class="mut">Upload a PDF or generate a test with AI from the Create tab.</p></div>'}`}
addEventListener('unhandledrejection',e=>msg('Error: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason)));addEventListener('error',e=>msg('Error: '+e.message));

function preview(k){const y=scrollY||0;document.body.classList.add('inx');$('main').innerHTML='<div class="card" id="pvh"></div>'+PV.qs.map((x,i)=>`<div class="card" style="${x.a==null?'border-color:var(--bad)':''}"><div class="mut">Q${x.n||i+1} · ${esc(x.s)} · ${esc(x.t)}</div><p style="white-space:pre-wrap">${esc(x.q)}</p>${x.o.map((o,j)=>`<div class="mut">${A[j]}. ${esc(o)}</div>`).join('')}<div class="row"><label class="mut">Correct answer <select onchange="PV.qs[${i}].a=this.value===''?null:+this.value;pvHead()"><option value="">unknown</option>${x.o.map((o,j)=>`<option value="${j}" ${x.a===j?'selected':''}>${A[j]}</option>`).join('')}</select></label><button class="b g" onclick="PV.qs.splice(${i},1);preview(1)">Remove</button></div></div>`).join('');pvHead();scrollTo(0,k?y:0)}
