<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biology Universe — 7196 CBT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font:16px system-ui}
main{max-width:850px;margin:auto;padding:18px}
.card{background:#151d32;border:1px solid #2b3858;border-radius:16px;padding:18px;margin:12px 0}
button,select{padding:12px;border-radius:10px;border:1px solid #53658c;background:#202c47;color:white;font-size:16px}
button{cursor:pointer;margin:4px}.muted{color:#b6c3df}.opt{display:block;padding:12px;border:1px solid #465779;border-radius:10px;margin:8px 0}
.opt input{margin-right:10px}.good{color:#71e5a7}.bad{color:#ffb3b3}
</style>
<script>
/*
 RANKFORGE_7196_CANONICAL_RUNTIME_GUARD

 This page is the dedicated 7,196 Biology CBT.
 The canonical JSON is read-only.
*/
(function(){

  window.RankForgeBiology7196=true;
  window.RankForgeBiologySource="BIOLOGY_ACTIVE_BANK";
  window.RankForgeBiologyExpectedCount=7196;

  window.addEventListener("error",function(e){

    console.error(
      "[RankForge 7196] runtime error:",
      e.error || e.message
    );

  });

})();
</script>

</head><body>
<div id="rankforgeBackBar" style="padding:10px 16px;">
<button id="rankforgeBackButton" type="button"
style="padding:10px 16px;border:0;border-radius:10px;font-size:16px;">
← Back
</button>
</div>
<main>
<h1>Biology Universe · 7,196 CBT</h1>
<p class="muted">Separate viewer. Canonical bank is not modified.</p>
<div class="card" id="status">Loading local bank…</div>
<div class="card" id="setup" hidden>
<label>Questions <select id="count"><option>10</option><option>20</option><option>30</option><option>45</option><option>50</option><option>90</option><option>180</option></select></label>
<label>Minutes <select id="minutes"><option>10</option><option>20</option><option>30</option><option>45</option><option>60</option><option>90</option><option>180</option></select></label>
<button id="start">Start CBT</button>
</div>
<div id="test" hidden>
<div class="card"><b id="progress"></b><span style="float:right" id="timer"></span></div>
<div class="card"><h3 id="question"></h3><div id="options"></div></div>
<div class="card"><button id="prev">Previous</button><button id="next">Next</button><button id="submit">Submit Test</button></div>
</div><div id="result"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let bank=[],session=[],answers={},index=0,seconds=0,tick=null,submitted=false;

const norm=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");
const qKeys=["question","questiontext","questionstatement","stem","prompt","qtext"];
const optKeys=["options","choices","option","answers","answerchoices"];
const ansKeys=["correctIndex","correctanswer","correctoption","answerkey","correctanswerindex","answer"];
const solKeys=["solution","explanation","detailedsolution","answerexplanation","reasoning"];
function getField(o,keys){
  if(!o||typeof o!=="object")return undefined;
  for(const k of keys){const found=Object.keys(o).find(x=>norm(x)===norm(k));if(found&&o[found]!=null)return o[found];}
}
function findRecords(data){
  const seen=new Set(),candidates=[];
  function walk(x,depth=0){
    if(!x||typeof x!=="object"||depth>8||seen.has(x))return;
    seen.add(x);
    if(Array.isArray(x)){
      if(x.length&&x.some(v=>v&&typeof v==="object"&&!Array.isArray(v))){
        const objects=x.filter(v=>v&&typeof v==="object"&&!Array.isArray(v));
        const qCount=objects.filter(v=>getField(v,qKeys)!=null).length;
        if(qCount)candidates.push({rows:objects,score:qCount});
      }
      for(const v of x.slice(0,100000))walk(v,depth+1);
    }else for(const v of Object.values(x))walk(v,depth+1);
  }
  walk(data);
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]?.rows||[];
}
function textOf(v){
  if(v==null)return "";
  if(typeof v==="string"||typeof v==="number")return String(v);
  if(Array.isArray(v))return v.map(textOf).join("\n");
  if(typeof v==="object"){
    const t=getField(v,["text","value","label","content","optiontext"]);
    return t==null?JSON.stringify(v):textOf(t);
  }
  return "";
}
function normalizeRow(row){
  const question=textOf(getField(row,qKeys));
  const rawOpts=getField(row,optKeys);
  let options=[];
  if(Array.isArray(rawOpts)) options=rawOpts.map(textOf);
  else if(rawOpts&&typeof rawOpts==="object")
    options=Object.entries(rawOpts).map(([k,v])=>({key:k,text:textOf(v)}));
  else if(typeof rawOpts==="string"){
    try{const parsed=JSON.parse(rawOpts);if(Array.isArray(parsed))options=parsed.map(textOf)}catch{}
  }
  options=options.map((v,i)=>typeof v==="string"?{key:String(i),text:v}:v)
    .filter(o=>o.text?.trim());
  const answer=getField(row,ansKeys);
  const solution=getField(row,solKeys);
  return {raw:row,question,options,answer,solution:textOf(solution)};
}
function answerIndex(q){
  if(q.answer==null)return -1;
  const a=textOf(q.answer).trim();
  const n=Number(a);
  if(a!==""&&Number.isInteger(n)){
    if(n>=0&&n<q.options.length)return n;
    if(n>=1&&n<=q.options.length)return n-1;
  }
  const letter=a.toUpperCase().replace(/[^A-D]/g,"");
  if(letter.length===1){
    const i=letter.charCodeAt(0)-65;if(i<q.options.length)return i;
  }
  const idx=q.options.findIndex(o=>norm(o.text)===norm(a)||norm(o.key)===norm(a));
  return idx;
}
function showStatus(msg,err=false){
  $("status").hidden=false;$("status").textContent=msg;
  $("status").className="card "+(err?"bad":"");
}
async function init(){
  try{
    const r=await fetch("./biology-7196-bank-readonly.json",{cache:"no-store"});
    if(!r.ok)throw Error("HTTP "+r.status+" fetching local bank");
    const data=await r.json();
    const rows=findRecords(data);
    bank=rows.map(normalizeRow).filter(q=>q.question&&q.options.length>=2);
    if(!bank.length)throw Error("Question/option fields were not recognized. No questions were fabricated. See the schema printed in Termux.");
    $("setup").hidden=false;
    showStatus("Loaded "+bank.length+" recognizable questions from the protected-bank copy. Some answer/solution fields may need schema mapping if they are not recognized.");
  }catch(e){showStatus("Bank load failed: "+e.message,true)}
}
function render(){
  const q=session[index];$("progress").textContent=`Question ${index+1} / ${session.length}`;
  $("question").textContent=q.question;$("options").replaceChildren();
  q.options.forEach((o,i)=>{
    const label=document.createElement("label");label.className="opt";
    const input=document.createElement("input");input.type="radio";input.name="answer";input.value=i;
    input.checked=answers[index]===i;input.disabled=submitted;
    input.addEventListener("change",()=>answers[index]=i);
    label.append(input,document.createTextNode(o.text));$("options").append(label);
  });
  $("prev").disabled=index===0;$("next").disabled=index===session.length-1;
}
function start(){
  const n=Number($("count").value),mins=Number($("minutes").value);
  if(n>bank.length){showStatus(`Only ${bank.length} recognizable questions available.`,true);return}
  session=bank.slice().sort(()=>Math.random()-.5).slice(0,n);
  answers={};index=0;seconds=mins*60;submitted=false;
  $("setup").hidden=true;$("test").hidden=false;$("result").replaceChildren();render();
  clearInterval(tick);updateTimer();tick=setInterval(()=>{if(seconds>0){seconds--;updateTimer()}else submit()},1000);
}
function updateTimer(){$("timer").textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")}`}
function submit(){
  if(submitted)return;submitted=true;clearInterval(tick);
  let score=0,known=0,review=[];
  session.forEach((q,i)=>{
    const ci=answerIndex(q);
    if(ci>=0){known++;if(answers[i]===ci)score++}
    review.push({q,i,ci});
  });
  $("test").hidden=true;$("result").replaceChildren();
  const summary=document.createElement("div");summary.className="card";
  summary.innerHTML=`<h2>Result</h2><p>Score: ${score} / ${session.length}</p><p>Correct answers recognized: ${known} / ${session.length}</p>`;
  $("result").append(summary);
  review.forEach(({q,i,ci},j)=>{
    const card=document.createElement("div");card.className="card";
    const h=document.createElement("h3");h.textContent=`Q${j+1}. ${q.question}`;card.append(h);
    q.options.forEach((o,k)=>{
      const p=document.createElement("p");
      p.textContent=(k===ci?"✓ ":"")+(answers[i]===k?"Your answer: ":"")+o.text;
      if(k===ci)p.className="good";else if(answers[i]===k)p.className="bad";
      card.append(p);
    });
    const s=document.createElement("p");s.textContent=ci<0?"Correct answer field not recognized for this question.":(q.solution||"No explanation field recognized for this question.");
    s.className="muted";card.append(s);$("result").append(card);
  });
  const again=document.createElement("button");again.textContent="New Test";again.onclick=()=>location.reload();$("result").prepend(again);
}
$("start").onclick=start;$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<session.length-1){index++;render()}};$("submit").onclick=()=>{if(confirm("Submit this test?"))submit()};
init();
</script></main>
<script id="rankforge-back-navigation-v1">
(function(){
  const b=document.getElementById("rankforgeBackButton");
  if(!b)return;
  b.addEventListener("click",function(){
    if(history.length>1) history.back();
    else location.href="index.html";
  });
})();
</script>

</body></html>
