<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RankForge Biology CBT — 7196</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#07111f;
  color:#eef4ff;
}
header{
  padding:18px;
  background:#0c1b30;
  border-bottom:1px solid #223957;
  position:sticky;
  top:0;
  z-index:5;
}
h1{margin:0;font-size:22px}
.sub{opacity:.7;font-size:13px;margin-top:4px}

.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:#0d1d31;
  border:1px solid #223957;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

button,select{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #385477;
  background:#132944;
  color:white;
  font-size:15px;
}

button{cursor:pointer}

.primary{
  background:#1769aa;
  border-color:#2d8bd3;
}

.choice{
  text-align:left;
  margin-top:10px;
  background:#10243d;
}

.choice.selected{
  outline:2px solid #4ca3ff;
}

#quiz{display:none}

.question{
  font-size:19px;
  line-height:1.55;
  margin-bottom:18px;
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  opacity:.75;
  font-size:13px;
  margin-bottom:14px;
}

#result{display:none}

.stat{
  padding:12px;
  background:#10243d;
  border-radius:10px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <h1>🧬 RankForge Biology CBT</h1>
  <div class="sub">Protected Biology Universe bank • 7,196 questions</div>
</header>

<div class="wrap">

<section id="setup" class="card">
  <h2>Biology Universe</h2>
  <p id="bankStatus">Loading verified question bank...</p>

  <label>Questions per test</label>
  <select id="count">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30">30</option>
    <option value="50">50</option>
    <option value="90">90</option>
    <option value="180">180</option>
  </select>

  <button class="primary" id="startBtn" disabled>
    Start Biology CBT
  </button>
</section>

<section id="quiz" class="card">
  <div class="meta">
    <span id="progress"></span>
    <span id="timer"></span>
  </div>

  <div id="question" class="question"></div>
  <div id="choices"></div>

  <button class="primary" id="nextBtn">Next</button>
</section>

<section id="result" class="card">
  <h2>CBT Result</h2>
  <div id="resultText"></div>
  <button onclick="location.reload()">New Biology CBT</button>
</section>

</div>

<script>
(function(){

"use strict";

const BANK_URL="./data/BIOLOGY_ACTIVE_BANK.json";
let BANK=[];
let TEST=[];
let index=0;
let answers=[];
let seconds=0;
let timer=null;

const $=id=>document.getElementById(id);

function questionsFromBank(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.questions)) return data.questions;
  if(Array.isArray(data.items)) return data.items;
  return [];
}

function textOf(q){
  return q.question || q.question_text || q.text || q.stem || "";
}

function optionsOf(q){
  if(Array.isArray(q.options)) return q.options;
  if(Array.isArray(q.choices)) return q.choices;
  if(Array.isArray(q.answers)) return q.answers;
  return [
    q.option_a,q.option_b,q.option_c,q.option_d
  ].filter(x=>x!==undefined && x!==null && x!=="");
}

function correctOf(q){
  if(q.correctAnswer!==undefined) return q.correctAnswer;
  if(q.correct_answer!==undefined) return q.correct_answer;
  if(q.answer!==undefined) return q.answer;
  if(q.correct!==undefined) return q.correct;
  return null;
}

function normalizeAnswer(v){
  if(typeof v==="number") return v;
  if(typeof v!=="string") return v;
  const s=v.trim().toUpperCase();

  if(["A","B","C","D"].includes(s))
    return "ABCD".indexOf(s);

  if(/^[0-3]$/.test(s))
    return Number(s);

  return v.trim();
}

function isCorrect(q,selected){
  const c=normalizeAnswer(correctOf(q));

  if(typeof c==="number"){
    return c===selected;
  }

  const opts=optionsOf(q);
  if(typeof c==="string" && opts[selected]!==undefined){
    return String(opts[selected]).trim()===String(c).trim();
  }

  return false;
}

async function loadBank(){

  try{

    const r=await fetch(BANK_URL+"?v="+Date.now(),{
      cache:"no-store"
    });

    if(!r.ok)
      throw new Error("HTTP "+r.status);

    const data=await r.json();

    BANK=questionsFromBank(data);

    if(BANK.length!==7196)
      throw new Error("Expected 7196 questions, received "+BANK.length);

    $("bankStatus").textContent=
      "✓ 7,196 Biology questions verified and ready.";

    $("startBtn").disabled=false;

  }catch(e){

    console.error(e);

    $("bankStatus").textContent=
      "❌ Biology bank failed to load: "+e.message;
  }
}

function shuffle(a){
  const x=a.slice();

  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }

  return x;
}

function start(){

  const n=Math.min(
    Number($("count").value),
    BANK.length
  );

  TEST=shuffle(BANK).slice(0,n);
  index=0;
  answers=new Array(TEST.length).fill(null);

  seconds=TEST.length*60;

  $("setup").style.display="none";
  $("quiz").style.display="block";
  $("result").style.display="none";

  render();

  clearInterval(timer);

  timer=setInterval(()=>{
    seconds--;

    if(seconds<=0){
      seconds=0;
      finish();
    }

    updateTimer();

  },1000);
}

function updateTimer(){

  const m=Math.floor(seconds/60);
  const s=seconds%60;

  $("timer").textContent=
    "⏱ "+String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0");
}

function render(){

  const q=TEST[index];
  const opts=optionsOf(q);

  $("progress").textContent=
    "Question "+(index+1)+" / "+TEST.length;

  $("question").textContent=textOf(q);

  const box=$("choices");
  box.innerHTML="";

  opts.forEach((opt,i)=>{

    const b=document.createElement("button");

    b.className="choice";

    b.textContent=
      String.fromCharCode(65+i)+". "+String(opt);

    if(answers[index]===i)
      b.classList.add("selected");

    b.onclick=()=>{

      answers[index]=i;

      [...box.children].forEach(x=>
        x.classList.remove("selected")
      );

      b.classList.add("selected");
    };

    box.appendChild(b);
  });

  $("nextBtn").textContent=
    index===TEST.length-1 ? "Submit Test" : "Next";

  updateTimer();
}

function finish(){

  clearInterval(timer);

  let attempted=0;
  let correct=0;

  TEST.forEach((q,i)=>{

    if(answers[i]!==null){

      attempted++;

      if(isCorrect(q,answers[i]))
        correct++;
    }
  });

  const wrong=attempted-correct;
  const unattempted=TEST.length-attempted;

  $("quiz").style.display="none";
  $("result").style.display="block";

  $("resultText").innerHTML=
    '<div class="stat">Total: <b>'+TEST.length+
    '</b></div>'+
    '<div class="stat">Attempted: <b>'+attempted+
    '</b></div>'+
    '<div class="stat">Correct: <b>'+correct+
    '</b></div>'+
    '<div class="stat">Wrong: <b>'+wrong+
    '</b></div>'+
    '<div class="stat">Unattempted: <b>'+unattempted+
    '</b></div>';

  window.RANKFORGE_BIOLOGY_CBT_RESULT={
    total:TEST.length,
    attempted,
    correct,
    wrong,
    unattempted,
    questionIds:TEST.map(q=>q.id)
  };
}

$("startBtn").onclick=start;

$("nextBtn").onclick=()=>{

  if(index<TEST.length-1){
    index++;
    render();
  }else{
    finish();
  }
};

loadBank();

})();
</script>

</body>
</html>
