  }
  function begin(list, mode, retry) {

  function fmt(s) { s = Math.max(0, s); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }

    app.appendChild(bar);
  }
  function counts() { var a = 0, m = 0; Q.qs.forEach(function (_, i) { if (Q.ans[i] != null) a++; if (Q.mk[i]) m++; }); return { a: a, m: m, u: Q.qs.length - a }; }
  function openPalette() {

    var wrong = R.bad.concat(R.un);
    var acts = el("div", "noprint");
    if (R.bad.length) btn(acts, "Retry mistakes (" + R.bad.length + ")", function () { begin(R.bad.map(function (i) { return R.qs[i]; }), "practice", true); });
    btn(acts, "Save as PDF", function () { var t = document.title; document.title = "RankForge Tag Practice result"; window.print(); document.title = t; }, "ghost");
    link(acts, "Open Mistake Book", "mistake.html", "ghost"); btn(acts, "New tag practice", setup, "ghost"); app.appendChild(acts);
    if (wrong.length) {
      var rv = el("section", "rf-card"); rv.appendChild(el("div", "rf-eyebrow", "REVIEW (" + wrong.length + ")"));
      wrong.forEach(function (i) {
        var q = R.qs[i], a = R.ans[i], d = el("div", "rv"); d.appendChild(el("div", "", q.question));
        d.appendChild(el("div", a == null ? "rf-warn" : "rf-bad", a == null ? "Not answered" : "Your answer: " + String.fromCharCode(65 + a) + ". " + q.options[a]));
        d.appendChild(el("div", "rf-ok", "Correct: " + String.fromCharCode(65 + q.correctIndex) + ". " + q.options[q.correctIndex]));
        if (q.explanation) d.appendChild(el("div", "rf-mute", q.explanation)); if (q.ncertEvidence) d.appendChild(el("div", "ev", "NCERT: " + q.ncertEvidence)); rv.appendChild(d);
      });
      app.appendChild(rv);
    }
    window.scrollTo(0, 0);
  }
  load();
})();
</script>
