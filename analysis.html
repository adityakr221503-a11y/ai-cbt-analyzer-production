<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Performance Analysis</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:800
}

.logo span{
color:#4f46e5
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px
}

.hero{
background:linear-gradient(135deg,#4f46e5,#6366f1);
color:white;
padding:25px;
border-radius:18px;
margin-bottom:20px
}

.hero h1{
margin:0 0 8px
}

.hero p{
margin:0
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07)
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center
}

.stat strong{
display:block;
font-size:27px;
margin-bottom:5px
}

.stat small{
color:#64748b
}

.subject{
border:1px solid #e2e8f0;
border-radius:12px;
padding:15px;
margin-top:12px
}

.subject-title{
font-weight:800;
font-size:17px;
margin-bottom:10px
}

.bar{
height:12px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
margin-top:8px
}

.bar-fill{
height:100%;
background:#4f46e5;
border-radius:20px
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:8px;
font-size:14px
}

.insight{
padding:15px;
border-radius:11px;
background:#eef2ff;
margin-top:10px;
line-height:1.6
}

.empty{
text-align:center;
padding:45px 15px;
color:#64748b
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:700;
cursor:pointer
}

.primary{
background:#4f46e5;
color:white
}

.secondary{
background:#e2e8f0;
color:#0f172a
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
onclick="location.href='cbt.html'">

Take CBT

</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>📊 Performance Dashboard</h1>

<p>
Understand your strengths, weaknesses and progress.
</p>

</div>


<div class="card">

<h2>Overall Performance</h2>

<div class="stats">

<div class="stat">
<strong id="tests">0</strong>
<small>Tests</small>
</div>

<div class="stat">
<strong id="accuracy">0%</strong>
<small>Accuracy</small>
</div>

<div class="stat">
<strong id="correct">0</strong>
<small>Correct</small>
</div>

<div class="stat">
<strong id="wrong">0</strong>
<small>Wrong</small>
</div>

</div>

</div>


<div class="card">

<h2>📚 Subject Performance</h2>

<div id="subjects"></div>

</div>


<div class="card">

<h2>🧠 AI-Style Performance Insights</h2>

<div id="insights"></div>

</div>


<div class="card">

<button
class="secondary"
onclick="location.href='mistake.html'">

Open Mistake Bank

</button>

</div>

</div>


<script>

const history=
JSON.parse(
localStorage.getItem("cbtHistory") || "[]"
);


function calculate(){

if(history.length===0){

document.getElementById("subjects").innerHTML=
`
<div class="empty">
No test data available yet.<br><br>
Complete a CBT to generate your analysis.
</div>
`;

return;

}


let totalQuestions=0;
let totalCorrect=0;
let totalWrong=0;
let totalSkipped=0;

const subjects={};


history.forEach(test=>{

(test.questions || []).forEach(q=>{

totalQuestions++;

if(q.status==="correct"){
totalCorrect++;
}

if(q.status==="wrong"){
totalWrong++;
}

if(q.status==="skipped"){
totalSkipped++;
}


const subject=
q.subject || "General";


if(!subjects[subject]){

subjects[subject]={
total:0,
correct:0,
wrong:0,
skipped:0
};

}


subjects[subject].total++;


if(q.status==="correct"){
subjects[subject].correct++;
}

if(q.status==="wrong"){
subjects[subject].wrong++;
}

if(q.status==="skipped"){
subjects[subject].skipped++;
}

});

});


document.getElementById("tests")
.textContent=history.length;


document.getElementById("correct")
.textContent=totalCorrect;


document.getElementById("wrong")
.textContent=totalWrong;


const attempted=
totalCorrect+totalWrong;


const accuracy=
attempted===0
?
0
:
Math.round(
(totalCorrect/attempted)*100
);


document.getElementById("accuracy")
.textContent=
accuracy+"%";


renderSubjects(subjects);

generateInsights(
totalQuestions,
totalCorrect,
totalWrong,
totalSkipped,
accuracy,
subjects
);

}


function renderSubjects(subjects){

const box=
document.getElementById("subjects");

box.innerHTML="";


Object.keys(subjects)
.sort()
.forEach(subject=>{

const data=
subjects[subject];


const attempted=
data.correct+
data.wrong;


const accuracy=
attempted===0
?
0
:
Math.round(
(data.correct/attempted)*100
);


const item=
document.createElement("div");

item.className="subject";


item.innerHTML=

`
<div class="subject-title">
${subject}
</div>

<div class="row">
<span>Accuracy</span>
<strong>${accuracy}%</strong>
</div>

<div class="bar">
<div
class="bar-fill"
style="width:${accuracy}%">
</div>
</div>

<div class="row">
<span>Correct: ${data.correct}</span>
<span>Wrong: ${data.wrong}</span>
<span>Skipped: ${data.skipped}</span>
</div>
`;


box.appendChild(item);

});

}


function generateInsights(
total,
correct,
wrong,
skipped,
accuracy,
subjects
){

const box=
document.getElementById("insights");

box.innerHTML="";


let messages=[];


if(accuracy>=80){

messages.push(
"🔥 Strong performance. Your overall accuracy is currently high."
);

}
else if(accuracy>=60){

messages.push(
"📈 Your foundation is developing. Focus on reducing repeated mistakes."
);

}
else{

messages.push(
"🎯 Your biggest opportunity is improving accuracy through targeted mistake review."
);

}


if(wrong>correct){

messages.push(
"🧠 You currently have more wrong answers than correct answers. Review your Mistake Bank before taking another full test."
);

}


if(skipped>0){

messages.push(
"⏭️ You have skipped questions. Practice time management and attempt strategy."
);

}


let weakest=null;
let weakestAccuracy=101;


Object.keys(subjects)
.forEach(subject=>{

const d=subjects[subject];

const attempted=
d.correct+d.wrong;

if(attempted===0)return;

const acc=
(d.correct/attempted)*100;

if(acc<weakestAccuracy){

weakestAccuracy=acc;
weakest=subject;

}

});


if(weakest){

messages.push(
"📚 Focus area: "+weakest+
" currently has your lowest accuracy."
);

}


messages.forEach(message=>{

const div=
document.createElement("div");

div.className="insight";

div.textContent=message;

box.appendChild(div);

});

}


calculate();

</script>

</body>
</html>
