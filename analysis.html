<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Performance Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:linear-gradient(135deg,#4f46e5,#6366f1);
color:white;
padding:25px;
border-radius:18px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
opacity:.9;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:#f8fafc;
padding:18px;
border-radius:12px;
text-align:center;
}

.stat strong{
display:block;
font-size:27px;
margin-bottom:5px;
}

.stat small{
color:#64748b;
}

.subject{
border:1px solid #e2e8f0;
border-radius:12px;
padding:16px;
margin-top:12px;
}

.subject-title{
font-size:17px;
font-weight:800;
margin-bottom:10px;
}

.topic{
background:#f8fafc;
border-radius:10px;
padding:13px;
margin-top:10px;
}

.topic-title{
font-weight:700;
margin-bottom:8px;
}

.bar{
height:11px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
margin-top:7px;
}

.bar-fill{
height:100%;
background:#4f46e5;
border-radius:20px;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:8px;
font-size:14px;
}

.insight{
padding:15px;
border-radius:11px;
background:#eef2ff;
margin-top:10px;
line-height:1.6;
}

.focus{
border-left:5px solid #dc2626;
background:#fff7ed;
}

.strength{
border-left:5px solid #16a34a;
background:#ecfdf5;
}

.empty{
text-align:center;
padding:45px 15px;
color:#64748b;
}

button{
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:700;
cursor:pointer;
}

.primary{
background:#4f46e5;
color:white;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>


<body>


<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
onclick="location.href='cbt.html'">

Take CBT

</button>

</div>

</header>


<div class="container">


<div class="hero">

<h1>
📊 Performance Dashboard
</h1>

<p>
Understand your strengths, weaknesses and progress.
</p>

</div>


<!-- OVERALL -->

<div class="card">

<h2>
Overall Performance
</h2>

<div class="stats">

<div class="stat">

<strong id="tests">
0
</strong>

<small>
Tests
</small>

</div>


<div class="stat">

<strong id="accuracy">
0%
</strong>

<small>
Accuracy
</small>

</div>


<div class="stat">

<strong id="correct">
0
</strong>

<small>
Correct
</small>

</div>


<div class="stat">

<strong id="wrong">
0
</strong>

<small>
Wrong
</small>

</div>

</div>

</div>


<!-- SUBJECT -->

<div class="card">

<h2>
📚 Subject Performance
</h2>

<div id="subjects"></div>

</div>


<!-- TOPIC -->

<div class="card">

<h2>
🎯 Topic / Chapter Performance
</h2>

<div id="topics"></div>

</div>


<!-- INSIGHTS -->

<div class="card">

<h2>
🧠 Performance Insights
</h2>

<div id="insights"></div>

</div>


<div class="card">

<button
class="secondary"
onclick="location.href='mistake.html'">

Open Mistake Bank

</button>

</div>


</div>


<script>


const history=
JSON.parse(
localStorage.getItem(
"cbtHistory"
) || "[]"
);


/* =========================
MAIN CALCULATION
========================= */

function calculate(){

if(history.length===0){

showEmpty();

return;

}


let total=0;

let correct=0;

let wrong=0;

let skipped=0;


const subjects={};

const topics={};


history.forEach(
test=>{

(test.questions || [])
.forEach(q=>{

total++;


if(q.status==="correct"){
correct++;
}

if(q.status==="wrong"){
wrong++;
}

if(q.status==="skipped"){
skipped++;
}


const subject=
q.subject || "General";


const topic=
q.topic ||
"General";


/* SUBJECT */

if(!subjects[subject]){

subjects[subject]={
total:0,
correct:0,
wrong:0,
skipped:0
};

}


subjects[subject].total++;


if(q.status==="correct"){
subjects[subject].correct++;
}

if(q.status==="wrong"){
subjects[subject].wrong++;
}

if(q.status==="skipped"){
subjects[subject].skipped++;
}


/* TOPIC */

const topicKey=
subject+"|||"+topic;


if(!topics[topicKey]){

topics[topicKey]={
subject:subject,
topic:topic,
total:0,
correct:0,
wrong:0,
skipped:0
};

}


topics[topicKey].total++;


if(q.status==="correct"){
topics[topicKey].correct++;
}

if(q.status==="wrong"){
topics[topicKey].wrong++;
}

if(q.status==="skipped"){
topics[topicKey].skipped++;
}

});

});


const attempted=
correct+wrong;


const accuracy=
attempted===0
?
0
:
Math.round(
(correct/attempted)*100
);


document.getElementById(
"tests"
).textContent=
history.length;


document.getElementById(
"accuracy"
).textContent=
accuracy+"%";


document.getElementById(
"correct"
).textContent=
correct;


document.getElementById(
"wrong"
).textContent=
wrong;


renderSubjects(subjects);

renderTopics(topics);

generateInsights(
correct,
wrong,
skipped,
accuracy,
subjects,
topics
);

}


/* =========================
EMPTY
========================= */

function showEmpty(){

document.getElementById(
"subjects"
).innerHTML=
`
<div class="empty">

No test data available yet.

<br><br>

Complete a CBT to generate analysis.

</div>
`;

document.getElementById(
"topics"
).innerHTML="";

document.getElementById(
"insights"
).innerHTML="";

}


/* =========================
SUBJECTS
========================= */

function renderSubjects(subjects){

const box=
document.getElementById(
"subjects"
);

box.innerHTML="";


Object.keys(subjects)
.sort()
.forEach(subject=>{

const data=
subjects[subject];


const attempted=
data.correct+
data.wrong;


const accuracy=
attempted===0
?
0
:
Math.round(
(data.correct/attempted)*100
);


const item=
document.createElement(
"div"
);

item.className="subject";


item.innerHTML=

`
<div class="subject-title">
${subject}
</div>

<div class="row">

<span>
Accuracy
</span>

<strong>
${accuracy}%
</strong>

</div>

<div class="bar">

<div
class="bar-fill"
style="width:${accuracy}%">
</div>

</div>

<div class="row">

<span>
Correct: ${data.correct}
</span>

<span>
Wrong: ${data.wrong}
</span>

<span>
Skipped: ${data.skipped}
</span>

</div>
`;


box.appendChild(item);

});

}


/* =========================
TOPICS
========================= */

function renderTopics(topics){

const box=
document.getElementById(
"topics"
);

box.innerHTML="";


const list=
Object.values(topics)
.sort(
(a,b)=>{

const aAttempted=
a.correct+a.wrong;

const bAttempted=
b.correct+b.wrong;

const aAcc=
aAttempted===0
?
0
:
a.correct/aAttempted;

const bAcc=
bAttempted===0
?
0
:
b.correct/bAttempted;

return aAcc-bAcc;

}
);


list.forEach(data=>{

const attempted=
data.correct+
data.wrong;


const accuracy=
attempted===0
?
0
:
Math.round(
(data.correct/attempted)*100
);


const item=
document.createElement(
"div"
);

item.className="topic";


item.innerHTML=

`
<div class="topic-title">

${data.subject}
→
${data.topic}

</div>

<div class="row">

<span>
Accuracy
</span>

<strong>
${accuracy}%
</strong>

</div>

<div class="bar">

<div
class="bar-fill"
style="width:${accuracy}%">
</div>

</div>

<div class="row">

<span>
Correct: ${data.correct}
</span>

<span>
Wrong: ${data.wrong}
</span>

<span>
Skipped: ${data.skipped}
</span>

</div>
`;


box.appendChild(item);

});


if(list.length===0){

box.innerHTML=
`
<div class="empty">
No topic data available.
</div>
`;

}

}


/* =========================
INSIGHTS
========================= */

function generateInsights(
correct,
wrong,
skipped,
accuracy,
subjects,
topics
){

const box=
document.getElementById(
"insights"
);

box.innerHTML="";


let messages=[];


if(accuracy>=80){

messages.push({
type:"strength",
text:
"🔥 Strong performance. Your current accuracy is high."
});

}
else if(accuracy>=60){

messages.push({
type:"",
text:
"📈 Your foundation is developing. Focus on reducing repeated mistakes."
});

}
else{

messages.push({
type:"focus",
text:
"🎯 Accuracy needs attention. Use the Mistake Bank for targeted revision."
});

}


let weakestTopic=null;

let weakestAccuracy=101;


Object.values(topics)
.forEach(data=>{

const attempted=
data.correct+
data.wrong;


if(attempted===0)return;


const acc=
(data.correct/attempted)*100;


if(acc<weakestAccuracy){

weakestAccuracy=acc;

weakestTopic=data;

}

});


if(weakestTopic){

messages.push({

type:"focus",

text:
"📚 Focus topic: "
+
weakestTopic.subject
+
" → "
+
weakestTopic.topic
+
" ("
+
Math.round(weakestAccuracy)
+
"% accuracy)."

});

}


let strongestTopic=null;

let strongestAccuracy=-1;


Object.values(topics)
.forEach(data=>{

const attempted=
data.correct+
data.wrong;


if(attempted===0)return;


const acc=
(data.correct/attempted)*100;


if(acc>strongestAccuracy){

strongestAccuracy=acc;

strongestTopic=data;

}

});


if(strongestTopic){

messages.push({

type:"strength",

text:
"⭐ Strongest topic: "
+
strongestTopic.subject
+
" → "
+
strongestTopic.topic
+
" ("
+
Math.round(strongestAccuracy)
+
"% accuracy)."

});

}


if(skipped>0){

messages.push({

type:"",

text:
"⏭️ You have "
+
skipped
+
" skipped questions. Review time-management and question-selection strategy."

});

}


if(wrong>0){

messages.push({

type:"focus",

text:
"🧠 "
+
wrong
+
" questions are currently wrong. These are the highest-priority questions for Mistake Bank revision."

});

}


messages.forEach(message=>{

const div=
document.createElement(
"div"
);

div.className=
"insight "
+
message.type;

div.textContent=
message.text;

box.appendChild(div);

});

}


/* =========================
START
========================= */

calculate();

</script>

</body>
</html>
