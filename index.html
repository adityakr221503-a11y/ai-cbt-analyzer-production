<!DOCTYPE html>

<meta charset="UTF-8">

<title>CBT Analyzer Pro — Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#64748b;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  display:block;
  text-decoration:none;
  color:#0f172a;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}

.card:hover{
  border-color:#4f46e5;
  transform:translateY(-2px);
}

.icon{
  font-size:32px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 7px;
  font-size:19px;
}

.card p{
  margin:0;
  color:#64748b;
  line-height:1.5;
}

.primary{
  background:#eef2ff;
  border-color:#c7d2fe;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:24px;
  }

}

</style>




<style id="REVISION_SHEET_V2_CSS">
.revision-box{
  margin:16px 0;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(128,128,128,.18);
  background:var(--card,#fff);
}
.revision-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.revision-head strong{font-size:18px}
.revision-head small{opacity:.65}
.revision-subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.revision-subject{
  border:1px solid rgba(128,128,128,.2);
  border-radius:12px;
  padding:12px 8px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}
.revision-subject:hover{transform:translateY(-1px)}
.revision-chapters{
  display:none;
  margin-top:12px;
}
.revision-chapters.show{display:block}
.revision-back{
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  padding:5px 0 10px;
  font-weight:700;
}
.revision-chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}
.revision-chapter{
  padding:11px;
  border-radius:11px;
  border:1px solid rgba(128,128,128,.18);
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.revision-chapter b{display:block;font-size:13px}
.revision-chapter small{opacity:.6}
.revision-content{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,.18);
}
.revision-content.show{display:block}
.revision-points{
  margin:10px 0 0;
  padding-left:20px;
}
.revision-points li{margin:7px 0}
@media(max-width:600px){
  .revision-subjects{grid-template-columns:repeat(3,1fr)}
  .revision-chapter-grid{grid-template-columns:1fr 1fr}
}
</style>

</head>

const back=document.getElementById("revisionBack");

 if(!btn)return;

 const subject=btn.dataset.subject;
 const list=revisionData[subject]||[];

 subjects.style.display="none";
 chapters.classList.add("show");
 content.classList.remove("show");

 grid.innerHTML=list.map((x,i)=>`

 const subject=btn.dataset.subject;
 const item=revisionData[subject][Number(btn.dataset.index)];

 content.innerHTML=`

});

 chapters.classList.remove("show");
 subjects.style.display="grid";

/* REVISION_RANK_BOOSTER_V1 */
(function(){
  const KEY="cbtRevisionProgressV1";

  function progress(){
    try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}
  }

  function saveProgress(x){
    localStorage.setItem(KEY,JSON.stringify(x));
  }

  const oldRender=window.renderRevisionChapter;

  window.revisionRB={
    search:"",
    subject:"",
    chapter:"",
    render:function(subject,chapter){
      this.subject=subject;
      this.chapter=chapter;

      const data=revisionData?.[subject]?.[chapter];
      if(!data)return;

      const box=document.querySelector("#revisionContent");
      if(!box)return;

      const p=progress();
      const id=subject+"::"+chapter;
      const done=!!p[id];

      const all=[
        ...(data.ncert||[]),
        ...(data.traps||[]),
        ...(data.concepts||[]),
        ...(data.formulas||[])
      ];

      const q=this.search.trim().toLowerCase();
      const filtered=q
        ? all.filter(x=>String(x).toLowerCase().includes(q))
        : all;

      box.innerHTML=`
        <div class="revision-rb-head">
          <div>
            <h2>📖 ${chapter}</h2>
            <div style="opacity:.75">${subject} • ${all.length} revision points</div>
          </div>
          <div>
            <button onclick="revisionRB.toggleDone()">
              ${done?"↩️ Revise Again":"✅ Mark Revised"}
            </button>
          </div>
        </div>

        <input
          id="revisionSearch"
          value="${this.search.replace(/"/g,"&quot;")}"
          placeholder="🔎 Search this chapter..."
          oninput="revisionRB.search=this.value;revisionRB.render('${subject.replace(/'/g,"\\'")}','${chapter.replace(/'/g,"\\'")}')"
          style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin:12px 0"
        >

        ${this.section("⭐ NCERT High-Yield",data.ncert,filtered)}
        ${this.section("⚠️ NEET Traps & Exceptions",data.traps,filtered)}
        ${this.section("🧠 Must Remember",data.concepts,filtered)}
        ${data.formulas?.length?this.section("⚡ Formulas / Facts",data.formulas,filtered):""}

        <button onclick="revisionRB.render('${subject.replace(/'/g,"\\'")}','${chapter.replace(/'/g,"\\'")}')">
          🔁 Refresh Revision
        </button>
      `;
    },

    section:function(title,items,filtered){
      if(!items?.length)return"";

      const shown=items.filter(x=>filtered.includes(x));
      if(!shown.length)return"";

      return `
        <div class="revision-rb-section">
          <h3>${title}</h3>
          ${shown.map((x,i)=>`
            <div class="revision-point">
              <span>${i+1}.</span> ${x}
            </div>
          `).join("")}
        </div>
      `;
    },

    toggleDone:function(){
      const p=progress();
      const id=this.subject+"::"+this.chapter;

      if(p[id]) delete p[id];
      else p[id]=Date.now();

      saveProgress(p);
      this.render(this.subject,this.chapter);
      this.updateProgress();
    },

    updateProgress:function(){
      const el=document.querySelector("#revisionProgressRB");
      if(!el)return;

      const p=progress();
      const total=Object.values(revisionData)
        .reduce((n,x)=>n+Object.keys(x).length,0);

      const done=Object.keys(p).length;

      el.innerHTML=`📊 Revision Progress: <b>${done}</b> / ${total} chapters revised`;
    }
  };

  const style=document.createElement("style");
  style.id="REVISION_RANK_BOOSTER_CSS";
  style.textContent=`
    .revision-rb-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:10px;
    }
    .revision-rb-section{
      margin:14px 0;
      padding:14px;
      border-radius:14px;
      background:rgba(127,127,127,.08);
    }
    .revision-point{
      padding:9px 4px;
      border-bottom:1px solid rgba(127,127,127,.15);
      line-height:1.5;
    }
    .revision-point:last-child{border-bottom:0}
    #revisionSearch{
      font-size:15px;
    }
  `;
  document.head.appendChild(style);

  const progressBox=document.createElement("div");
  progressBox.id="revisionProgressRB";
  progressBox.style.cssText="margin:8px 0 14px;padding:10px;border-radius:10px;background:rgba(127,127,127,.08)";

  const section=document.querySelector("#revisionSheet");
  if(section){
    const first=section.querySelector("h2,h3");
    if(first) first.parentNode.insertBefore(progressBox,first);
    else section.prepend(progressBox);
  }

  revisionRB.updateProgress();

  /*
    Hook chapter opening buttons.
    Existing V2 buttons use data-subject/data-index.
  */
  document.addEventListener("click",function(e){
    const btn=e.target.closest("[data-index]");
    if(!btn)return;

    const subject=btn.dataset.subject;
    const index=Number(btn.dataset.index);

    if(subject && revisionData[subject]){
      const chapter=Object.keys(revisionData[subject])[index];
      if(chapter){
        setTimeout(()=>revisionRB.render(subject,chapter),0);
      }
    }
  });
})();

      "Biodiversity and Conservation":["Biodiversity occurs at genetic, species and ecosystem levels.","Habitat loss is a major threat to biodiversity.","In-situ conservation protects organisms in their natural habitats."],
      "Environmental Issues":["Air, water and soil pollution can affect ecosystems and human health.","Greenhouse gases contribute to climate change.","Waste management reduces environmental impacts."]
    }
  };

  Object.keys(extra).forEach(subject=>{
    if(!revisionData[subject]) revisionData[subject]={};
    Object.keys(extra[subject]).forEach(ch=>{
      if(!revisionData[subject][ch]){
        revisionData[subject][ch]={
          ncert:extra[subject][ch],
          traps:["Read NCERT wording carefully.","Do not confuse closely related terms or exceptions."],
          concepts:["NCERT core concept","Definitions and key facts","NEET application"],
          formulas:[]
        };
      }
    });
  });

  console.log("Full Revision content loaded:",Object.keys(revisionData));
})();
</script>

<script>
(function(){
  const KEY="cbtRevisionWeakV1";

  function read(key,fallback){
    try{
      const x=JSON.parse(localStorage.getItem(key)||"null");
      return x==null?fallback:x;
    }catch(e){
      return fallback;
    }
  }

  function history(){
    const h=read("cbtHistory",[]);
    return Array.isArray(h)?h:[];
  }

  function questionsFromTest(test){
    if(Array.isArray(test?.questions)) return test.questions;
    if(Array.isArray(test?.questionResults)) return test.questionResults;
    if(Array.isArray(test?.results)) return test.results;
    return [];
  }

  function analyse(){
    const map={};

    history().forEach(test=>{
      questionsFromTest(test).forEach(q=>{
        const subject=String(q.subject||"").trim();
        const chapter=String(q.chapter||"").trim();

        if(!subject || !chapter) return;

        const key=subject+"::"+chapter;

        if(!map[key]){
          map[key]={
            subject,
            chapter,
            attempts:0,
            wrong:0,
            last:0
          };
        }

        const x=map[key];
        x.attempts++;

        const selected=
          q.userAnswer ??
          q.selectedAnswer ??
          q.selected ??
          q.user_answer;

        const correct=
          q.correctAnswer ??
          q.answer ??
          q.correct;

        if(
          selected!==undefined &&
          correct!==undefined &&
          String(selected).trim()!==String(correct).trim()
        ){
          x.wrong++;
        }

        const t=Date.parse(
          test.timestamp ||
          test.createdAt ||
          test.date ||
          ""
        );

        if(Number.isFinite(t) && t>x.last)
          x.last=t;
      });
    });

    return Object.values(map).map(x=>{
      x.accuracy=x.attempts
        ? Math.round(((x.attempts-x.wrong)/x.attempts)*100)
        : 100;

      const days=x.last
        ? (Date.now()-x.last)/86400000
        : 999;

      x.due=days>=3;
      x.priority=
        (x.wrong*5)+
        (x.accuracy<75?8:0)+
        (x.accuracy<50?8:0)+
        (x.due?4:0);

      return x;
    }).sort((a,b)=>b.priority-a.priority);
  }

  function openChapter(subject,chapter){
    if(window.revisionRB &&
       typeof window.revisionRB.render==="function"){
      window.revisionRB.search="";
      window.revisionRB.render(subject,chapter);
      return;
    }

    const buttons=document.querySelectorAll(
      "#revisionSheet [data-subject]"
    );

    for(const b of buttons){
      if(
        b.dataset.subject===subject &&
        b.textContent.includes(chapter)
      ){
        b.click();
        return;
      }
    }

    alert("Revision chapter is not available yet.");
  }

  function render(){
    const sheet=document.querySelector("#revisionSheet");
    if(!sheet)return;

    let box=document.querySelector("#revisionWeakEngine");

    if(!box){
      box=document.createElement("div");
      box.id="revisionWeakEngine";
      box.className="revision-weak-engine";

      sheet.prepend(box);
    }

    const data=analyse();

    localStorage.setItem(KEY,JSON.stringify({
      updatedAt:Date.now(),
      chapters:data
    }));

    const weak=data
      .filter(x=>x.wrong>0 || x.accuracy<75 || x.due)
      .slice(0,8);

    box.innerHTML=`
      <h3>🎯 Weak & Due Revision</h3>
      <div style="opacity:.75;margin-bottom:10px">
        CBT mistakes ke basis par priority chapters
      </div>

      ${
        weak.length
        ? weak.map((x,i)=>`
          <div class="revision-weak-row">
            <div>
              <b>${i+1}. ${x.chapter}</b>
              <small>
                ${x.subject} •
                ${x.accuracy}% accuracy •
                ${x.wrong} mistakes
                ${x.due?" • 🔔 Due":""}
              </small>
            </div>

            <button
              type="button"
              onclick='revisionWeak.open(${JSON.stringify(x.subject)},${JSON.stringify(x.chapter)})'>
              📖 Revise
            </button>
          </div>
        `).join("")
        : `
          <div class="revision-weak-empty">
            🎉 Abhi koi urgent weak/due chapter nahi mila.
          </div>
        `
      }

      <button
        type="button"
        onclick="revisionWeak.refresh()"
        style="margin-top:10px">
        🔄 Recalculate
      </button>
    `;
  }

  window.revisionWeak={
    open:openChapter,
    refresh:render,
    analyse:analyse
  };

  document.addEventListener("DOMContentLoaded",render);
  window.addEventListener("storage",render);

  setTimeout(render,500);
  setTimeout(render,1500);
})();
</script>

<script>
(function(){
  const QUEUE_KEY="cbtRevisionRetryQueueV1";
  const RETRY_KEY="cbtRetryQuestion";

  function read(key,fallback){
    try{
      const x=JSON.parse(localStorage.getItem(key)||"null");
      return x==null?fallback:x;
    }catch(e){return fallback}
  }

  function getHistory(){
    const h=read("cbtHistory",[]);
    return Array.isArray(h)?h:[];
  }

  function getQuestions(test){
    if(Array.isArray(test?.questions))return test.questions;
    if(Array.isArray(test?.questionResults))return test.questionResults;
    if(Array.isArray(test?.results))return test.results;
    return [];
  }

  function mistakes(){
    const out=[];

    getHistory().forEach(test=>{
      getQuestions(test).forEach(q=>{
        const selected=
          q.userAnswer ??
          q.selectedAnswer ??
          q.selected ??
          q.user_answer;

        const correct=
          q.correctAnswer ??
          q.answer ??
          q.correct;

        if(
          selected===undefined ||
          correct===undefined ||
          String(selected).trim()===String(correct).trim()
        )return;

        out.push({
          id:q.id || q.questionId || crypto.randomUUID(),
          subject:q.subject||"Unknown",
          chapter:q.chapter||"Unknown",
          topic:q.topic||"",
          question:q.question||q.text||"",
          options:Array.isArray(q.options)?q.options:[],
          correctAnswer:correct,
          explanation:q.explanation||"",
          selectedAnswer:selected,
          mistakeReason:q.mistakeReason||"Review needed",
          source:q.source||"CBT"
        });
      });
    });

    const seen=new Set();

    return out.reverse().filter(q=>{
      const key=q.id+"|"+q.question;
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    });
  }

  function render(){
    const sheet=document.querySelector("#revisionSheet");
    if(!sheet)return;

    let box=document.querySelector("#revisionMistakeLoop");

    if(!box){
      box=document.createElement("div");
      box.id="revisionMistakeLoop";
      box.className="revision-loop-card";
      sheet.prepend(box);
    }

    const data=mistakes().slice(0,10);

    box.innerHTML=`
      <h3>🔁 Mistake → Revision → Retry</h3>
      <div style="opacity:.75;margin-bottom:10px">
        Recent wrong questions ko revise karke direct retry karo.
      </div>

      ${
        data.length
        ? data.map((q,i)=>`
          <div class="revision-loop-row">
            <b>${i+1}. ${q.question||"Question"}</b>

            <span class="revision-loop-meta">
              ${q.subject} • ${q.chapter}
              ${q.topic?" • "+q.topic:""}
            </span>

            <div class="revision-loop-actions">
              <button
                type="button"
                onclick='revisionLoop.revise(${JSON.stringify(q.subject)},${JSON.stringify(q.chapter)})'>
                📖 Revise Chapter
              </button>

              <button
                type="button"
                onclick='revisionLoop.retry(${JSON.stringify(q)})'>
                🎯 Retry Question
              </button>
            </div>
          </div>
        `).join("")
        : `
          <div style="text-align:center;opacity:.75;padding:10px">
            🎉 No recent mistakes found.
          </div>
        `
      }
    `;
  }

  window.revisionLoop={
    revise:function(subject,chapter){
      if(window.revisionRB &&
         typeof window.revisionRB.render==="function"){
        window.revisionRB.search="";
        window.revisionRB.render(subject,chapter);
        return;
      }

      const buttons=document.querySelectorAll(
        "#revisionSheet [data-subject]"
      );

      for(const b of buttons){
        if(
          b.dataset.subject===subject &&
          b.textContent.includes(chapter)
        ){
          b.click();
          return;
        }
      }
    },

    retry:function(q){
      const retry={
        ...q,
        retrySource:"Revision Mistake Loop",
        retryStartedAt:Date.now()
      };

      localStorage.setItem(RETRY_KEY,JSON.stringify(retry));

      const queue=read(QUEUE_KEY,[]);
      queue.unshift(retry);

      localStorage.setItem(
        QUEUE_KEY,
        JSON.stringify(queue.slice(0,50))
      );

      if(typeof window.location!=="undefined"){
        window.location.href="./retry.html";
      }
    },

    refresh:render,
    mistakes:mistakes
  };

  document.addEventListener("DOMContentLoaded",render);
  window.addEventListener("storage",render);

  setTimeout(render,700);
  setTimeout(render,1800);
})();
</script>

<script>
(function(){

  const MASTERY_KEY="cbtMasteryV2";
  const HISTORY_KEY="cbtHistory";
  const RETRY_KEY="cbtRetryQuestion";
  const RETRY_QUEUE="cbtAnalyzer.retryQueue";
  const REVISION_KEY="cbtRevisionProgressV1";
  const MASTER_LOOP_KEY="rankerMasterLoopV1";

  function read(key,fallback){
    try{
      const x=JSON.parse(localStorage.getItem(key)||"null");
      return x==null?fallback:x;
    }catch(e){return fallback}
  }

  function write(key,value){
    localStorage.setItem(key,JSON.stringify(value));
  }

  function history(){
    const h=read(HISTORY_KEY,[]);
    return Array.isArray(h)?h:[];
  }

  function testsQuestions(test){
    if(Array.isArray(test?.questions))return test.questions;
    if(Array.isArray(test?.questionResults))return test.questionResults;
    if(Array.isArray(test?.results))return test.results;
    return [];
  }

  function allAttempts(){
    const out=[];

    history().forEach(test=>{
      testsQuestions(test).forEach(q=>{
        out.push({
          ...q,
          testTime:test.timestamp||
                   test.createdAt||
                   test.date||
                   0
        });
      });
    });

    return out;
  }

  function answer(q){
    return q.userAnswer ??
           q.selectedAnswer ??
           q.selected ??
           q.user_answer;
  }

  function correct(q){
    return q.correctAnswer ??
           q.answer ??
           q.correct;
  }

  function isCorrect(q){
    const a=answer(q);
    const c=correct(q);

    if(a===undefined || c===undefined)return false;

    return String(a).trim()===String(c).trim();
  }

  function questionId(q){
    return String(
      q.id ||
      q.questionId ||
      q.question ||
      q.text ||
      ""
    ).trim();
  }

  function mistakeList(){
    const map=new Map();

    allAttempts().forEach(q=>{
      const id=questionId(q);
      if(!id || isCorrect(q))return;

      if(!map.has(id)){
        map.set(id,{
          id,
          subject:q.subject||"Unknown",
          chapter:q.chapter||"Unknown",
          topic:q.topic||"",
          question:q.question||q.text||"",
          options:Array.isArray(q.options)?q.options:[],
          correctAnswer:correct(q),
          selectedAnswer:answer(q),
          explanation:q.explanation||"",
          source:q.source||"CBT",
          mistakeReason:q.mistakeReason||"Review needed",
          lastAttempt:q.testTime||Date.now()
        });
      }
    });

    return [...map.values()];
  }

  function stats(){

    const attempts=allAttempts();

    let total=0;
    let correctCount=0;
    let wrongCount=0;

    const chapters={};
    const questions={};

    attempts.forEach(q=>{

      total++;

      const ok=isCorrect(q);

      if(ok)correctCount++;
      else wrongCount++;

      const subject=q.subject||"Unknown";
      const chapter=q.chapter||"Unknown";
      const key=subject+"::"+chapter;

      if(!chapters[key]){
        chapters[key]={
          subject,
          chapter,
          attempts:0,
          correct:0,
          wrong:0,
          last:0
        };
      }

      chapters[key].attempts++;

      if(ok)chapters[key].correct++;
      else chapters[key].wrong++;

      const t=Date.parse(q.testTime||"");
      if(Number.isFinite(t) && t>chapters[key].last)
        chapters[key].last=t;

      const id=questionId(q);

      if(id){
        if(!questions[id]){
          questions[id]={
            id,
            attempts:0,
            correct:0,
            wrong:0,
            question:q.question||q.text||"",
            subject,
            chapter,
            last:0
          };
        }

        questions[id].attempts++;
        if(ok)questions[id].correct++;
        else questions[id].wrong++;

        if(Number.isFinite(t) && t>questions[id].last)
          questions[id].last=t;
      }
    });

    Object.values(chapters).forEach(x=>{
      x.accuracy=x.attempts
        ?Math.round(x.correct/x.attempts*100)
        :0;

      const days=x.last
        ?(Date.now()-x.last)/86400000
        :999;

      x.due=days>=3;

      x.priority=
        x.wrong*5+
        (x.accuracy<75?8:0)+
        (x.accuracy<50?8:0)+
        (x.due?4:0);
    });

    return{
      total,
      correct:correctCount,
      wrong:wrongCount,
      accuracy:total
        ?Math.round(correctCount/total*100)
        :0,
      chapters:Object.values(chapters)
        .sort((a,b)=>b.priority-a.priority),
      questions:Object.values(questions)
    };
  }

  function mastery(){

    const m=read(MASTERY_KEY,{});

    if(Array.isArray(m)){
      return new Set(
        m.map(x=>String(x.id||x.questionId||x))
      );
    }

    return new Set(
      Object.keys(m).filter(k=>m[k])
    );
  }

  function retryQueue(){

    const q=read(RETRY_QUEUE,[]);
    return Array.isArray(q)?q:[];
  }

  function markMastered(q){

    const id=questionId(q);
    if(!id)return;

    let m=read(MASTERY_KEY,{});

    if(Array.isArray(m)){
      if(!m.some(x=>String(x.id||x.questionId||x)===id)){
        m.push({
          id,
          masteredAt:Date.now(),
          question:q.question||"",
          subject:q.subject||"",
          chapter:q.chapter||""
        });
      }
    }else{
      m[id]={
        mastered:true,
        masteredAt:Date.now(),
        subject:q.subject||"",
        chapter:q.chapter||""
      };
    }

    write(MASTERY_KEY,m);
  }

  function processRetry(){

    const q=read(RETRY_KEY,null);
    if(!q)return;

    /*
      Retry page can set one of these flags after
      a correct retry. Existing systems remain untouched.
    */
    const result=
      q.retryCorrect ??
      q.isCorrectRetry ??
      q.retryResult;

    if(result===true){
      markMastered(q);

      const queue=retryQueue().filter(x=>
        questionId(x)!==questionId(q)
      );

      write(RETRY_QUEUE,queue);

      localStorage.removeItem(RETRY_KEY);
    }
  }

  function revisionProgress(){

    const p=read(REVISION_KEY,{});

    if(!p || typeof p!=="object")return{};

    return p;
  }

  function dueChapters(st){

    return st.chapters
      .filter(x=>
        x.wrong>0 ||
        x.accuracy<75 ||
        x.due
      )
      .slice(0,8);
  }

  function openRevision(subject,chapter){

    if(window.revisionRB &&
       typeof window.revisionRB.render==="function"){

      window.revisionRB.search="";
      window.revisionRB.render(subject,chapter);
      return;
    }

    const buttons=document.querySelectorAll(
      "#revisionSheet [data-subject]"
    );

    for(const b of buttons){

      if(
        b.dataset.subject===subject &&
        b.textContent.includes(chapter)
      ){
        b.click();
        return;
      }
    }
  }

  function retryQuestion(q){

    const item={
      ...q,
      retrySource:"Ranker Master Loop",
      retryStartedAt:Date.now()
    };

    localStorage.setItem(
      RETRY_KEY,
      JSON.stringify(item)
    );

    const queue=retryQueue();

    queue.unshift(item);

    write(
      RETRY_QUEUE,
      queue.slice(0,50)
    );

    window.location.href="./retry.html";
  }

  function render(){

    const sheet=document.querySelector("#revisionSheet");

    if(!sheet)return;

    let box=document.querySelector("#rankerMasterLoop");

    if(!box){

      box=document.createElement("div");

      box.id="rankerMasterLoop";
      box.className="master-loop";

      sheet.prepend(box);
    }

    const st=stats();
    const mistakes=mistakeList();
    const mastered=mastery();
    const progress=revisionProgress();

    const due=dueChapters(st);

    const revisedCount=Object.keys(progress).length;

    const masteredCount=mastered.size;

    const topMistakes=mistakeFix(mistakes,mastered);

    box.innerHTML=`
      <h3>🏆 Ranker Master Loop</h3>

      <div class="master-loop-grid">

        <div class="master-loop-stat">
          <b>${st.total}</b>
          Questions
        </div>

        <div class="master-loop-stat">
          <b>${st.accuracy}%</b>
          Accuracy
        </div>

        <div class="master-loop-stat">
          <b>${mistakes.length}</b>
          Active Mistakes
        </div>

        <div class="master-loop-stat">
          <b>${masteredCount}</b>
          Mastered
        </div>

      </div>

      <div style="margin:8px 0">
        📚 Chapters Revised:
        <b>${revisedCount}</b>
      </div>

      <h4>🎯 Weak / Due Chapters</h4>

      ${
        due.length
        ?due.map((x,i)=>`
          <div class="master-loop-row">

            <b>${i+1}. ${x.chapter}</b>

            <span class="master-loop-meta">
              ${x.subject} •
              ${x.accuracy}% accuracy •
              ${x.wrong} mistakes
              ${x.due?" • 🔔 Due":""}
            </span>

            <div class="master-loop-actions">

              <button
                type="button"
                onclick='rankerMasterLoop.revise(${JSON.stringify(x.subject)},${JSON.stringify(x.chapter)})'>
                📖 Revise
              </button>

            </div>

          </div>
        `).join("")
        :`<div class="master-loop-meta">
          🎉 No urgent weak chapter.
        </div>`
      }

      <h4>🔁 Active Mistakes</h4>

      ${
        topMistakes.length
        ?topMistakes.slice(0,5).map((q,i)=>`
          <div class="master-loop-row">

            <b>${i+1}. ${escapeHTML(q.question||"Question")}</b>

            <span class="master-loop-meta">
              ${escapeHTML(q.subject)} •
              ${escapeHTML(q.chapter)}
            </span>

            <div class="master-loop-actions">

              <button
                type="button"
                onclick='rankerMasterLoop.revise(${JSON.stringify(q.subject)},${JSON.stringify(q.chapter)})'>
                📖 Revise
              </button>

              <button
                type="button"
                onclick='rankerMasterLoop.retry(${JSON.stringify(q)})'>
                🎯 Retry
              </button>

            </div>

          </div>
        `).join("")
        :`<div class="master-loop-meta">
          🎉 No active mistakes.
        </div>`
      }

      <button
        type="button"
        onclick="rankerMasterLoop.refresh()">
        🔄 Recalculate
      </button>
    `;
  }

  function mistakeFix(list,mastered){
    return list.filter(q=>!mastered.has(questionId(q)));
  }

  function escapeHTML(x){
    return String(x)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  window.rankerMasterLoop={
    stats,
    mistakes:mistakeList,

    revise:function(subject,chapter){
      openRevision(subject,chapter);
    },

    retry:function(q){
      retryQuestion(q);
    },

    refresh:function(){
      render();
    },

    markMastered:function(q){
      markMastered(q);
      render();
    }
  };

  /*
    Do not disturb the existing CBT engine.
    This layer only reads its stored results.
  */

  processRetry();

  document.addEventListener(
    "DOMContentLoaded",
    render
  );

  window.addEventListener(
    "storage",
    render
  );

  setTimeout(render,500);
  setTimeout(render,1500);
  setTimeout(render,3000);

})();
</script>
