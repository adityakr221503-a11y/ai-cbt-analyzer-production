<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#64748b;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  display:block;
  text-decoration:none;
  color:#0f172a;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}

.card:hover{
  border-color:#4f46e5;
  transform:translateY(-2px);
}

.icon{
  font-size:32px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 7px;
  font-size:19px;
}

.card p{
  margin:0;
  color:#64748b;
  line-height:1.5;
}

.primary{
  background:#eef2ff;
  border-color:#c7d2fe;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:24px;
  }

}

</style>




<style id="REVISION_SHEET_V2_CSS">
.revision-box{
  margin:16px 0;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(128,128,128,.18);
  background:var(--card,#fff);
}
.revision-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.revision-head strong{font-size:18px}
.revision-head small{opacity:.65}
.revision-subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.revision-subject{
  border:1px solid rgba(128,128,128,.2);
  border-radius:12px;
  padding:12px 8px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}
.revision-subject:hover{transform:translateY(-1px)}
.revision-chapters{
  display:none;
  margin-top:12px;
}
.revision-chapters.show{display:block}
.revision-back{
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  padding:5px 0 10px;
  font-weight:700;
}
.revision-chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}
.revision-chapter{
  padding:11px;
  border-radius:11px;
  border:1px solid rgba(128,128,128,.18);
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.revision-chapter b{display:block;font-size:13px}
.revision-chapter small{opacity:.6}
.revision-content{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,.18);
}
.revision-content.show{display:block}
.revision-points{
  margin:10px 0 0;
  padding-left:20px;
}
.revision-points li{margin:7px 0}
@media(max-width:600px){
  .revision-subjects{grid-template-columns:repeat(3,1fr)}
  .revision-chapter-grid{grid-template-columns:1fr 1fr}
}
</style>

</head>

<body>

<section class="revision-box" id="revisionSheet">
  <div class="revision-head">
    <div>
      <strong>📚 Revision</strong>
      <small>Quick chapter-wise revision</small>
    </div>
  </div>

  <div class="revision-subjects" id="revisionSubjects">
    <button class="revision-subject" data-subject="Physics">⚡ Physics</button>
    <button class="revision-subject" data-subject="Chemistry">🧪 Chemistry</button>
    <button class="revision-subject" data-subject="Biology">🧬 Biology</button>
  </div>

  <div class="revision-chapters" id="revisionChapters">
    <button class="revision-back" id="revisionBack">← Subjects</button>
    <div id="revisionChapterGrid" class="revision-chapter-grid"></div>
  </div>

  <div class="revision-content" id="revisionContent"></div>
</section>


<script id="REVISION_SHEET_V2_JS">
(function(){

const revisionData={

Physics:[
["Units & Measurements","Units, dimensions, errors and significant figures"],
["Motion in a Straight Line","Kinematics graphs, equations and common traps"],
["Motion in a Plane","Vectors, projectile motion and relative motion"],
["Laws of Motion","Newton's laws, friction and connected bodies"],
["Work, Energy & Power","Work-energy theorem, power and collisions"],
["System of Particles & COM","Centre of mass, momentum and impulse"],
["Rotational Motion","Torque, angular momentum and moment of inertia"],
["Gravitation","Gravitational field, potential, satellites and escape velocity"],
["Mechanical Properties of Solids","Stress, strain, elasticity and Young's modulus"],
["Mechanical Properties of Fluids","Pressure, viscosity, Bernoulli and surface tension"],
["Thermal Properties of Matter","Heat, expansion, calorimetry and heat transfer"],
["Thermodynamics","Laws of thermodynamics, processes and PV diagrams"],
["Kinetic Theory","Gas laws, RMS speed and degrees of freedom"],
["Oscillations","SHM equations, energy and time period"],
["Waves","Wave motion, sound and standing waves"],
["Electrostatics","Charge, electric field, potential and capacitors"],
["Current Electricity","Resistance, circuits, Kirchhoff and cells"],
["Moving Charges & Magnetism","Magnetic force, Biot-Savart and Ampere law"],
["Magnetism & Matter","Magnetic properties, earth magnetism and materials"],
["Electromagnetic Induction","Faraday law, Lenz law and inductance"],
["Alternating Current","AC circuits, reactance, impedance and resonance"],
["Electromagnetic Waves","Spectrum, properties and applications"],
["Ray Optics","Mirrors, lenses, refraction and optical instruments"],
["Wave Optics","Interference, diffraction and polarization"],
["Dual Nature","Photoelectric effect and matter waves"],
["Atoms","Bohr model and atomic spectra"],
["Nuclei","Radioactivity, binding energy and nuclear reactions"],
["Semiconductor Electronics","Diodes, transistors and logic gates"]
],

Chemistry:[
["Some Basic Concepts of Chemistry","Mole concept, stoichiometry and concentration"],
["Structure of Atom","Quantum numbers, orbitals and electronic configuration"],
["Classification of Elements","Periodic trends and exceptions"],
["Chemical Bonding","VSEPR, hybridization, MOT and hydrogen bonding"],
["Thermodynamics","Enthalpy, entropy, Gibbs energy and spontaneity"],
["Equilibrium","Chemical equilibrium, ionic equilibrium and pH"],
["Redox Reactions","Oxidation number and balancing redox reactions"],
["Solutions","Concentration terms, Raoult law and colligative properties"],
["Electrochemistry","Cells, Nernst equation, conductance and electrolysis"],
["Chemical Kinetics","Rate law, order, half-life and Arrhenius equation"],
["Surface Chemistry","Adsorption, colloids and catalysis"],
["Periodic Table & p-Block","Trends, compounds and NCERT exceptions"],
["d- and f-Block Elements","Transition metals, colours, oxidation states"],
["Coordination Compounds","Nomenclature, isomerism, CFT and magnetic properties"],
["General Organic Chemistry","Electronic effects, acidity/basicity and intermediates"],
["Hydrocarbons","Alkanes, alkenes, alkynes and aromatic compounds"],
["Haloalkanes & Haloarenes","SN1, SN2, elimination and reactions"],
["Alcohols, Phenols & Ethers","Preparation, reactions and acidity"],
["Aldehydes, Ketones & Carboxylic Acids","Carbonyl chemistry and named reactions"],
["Amines","Basicity, preparation and diazonium chemistry"],
["Biomolecules","Carbohydrates, proteins, vitamins and nucleic acids"],
["Polymers","Classification, monomers and important polymers"],
["Chemistry in Everyday Life","Drugs, detergents and daily-life chemistry"]
],

Biology:[
["The Living World","Taxonomy, nomenclature and biodiversity"],
["Biological Classification","Kingdoms, major groups and characteristics"],
["Plant Kingdom","Algae, bryophytes, pteridophytes, gymnosperms and angiosperms"],
["Animal Kingdom","Animal phyla, symmetry and classification"],
["Morphology of Flowering Plants","Root, stem, leaf, flower, fruit and seed"],
["Anatomy of Flowering Plants","Tissues and internal structure"],
["Structural Organisation in Animals","Animal tissues and cockroach"],
["Cell: The Unit of Life","Cell organelles, membranes and transport"],
["Biomolecules","Carbohydrates, proteins, lipids, enzymes and nucleic acids"],
["Cell Cycle & Cell Division","Mitosis, meiosis and chromosome behaviour"],
["Transport in Plants","Xylem, phloem, transpiration and pressure flow"],
["Mineral Nutrition","Essential elements, deficiency and nitrogen metabolism"],
["Photosynthesis","Light reaction, Calvin cycle and photorespiration"],
["Respiration in Plants","Glycolysis, Krebs cycle and ETS"],
["Plant Growth & Development","Hormones, growth movements and photoperiodism"],
["Digestion & Absorption","Digestive system, enzymes and absorption"],
["Breathing & Exchange of Gases","Mechanism, transport of gases and regulation"],
["Body Fluids & Circulation","Blood, heart, cardiac cycle and ECG"],
["Excretory Products & Elimination","Nephron, urine formation and osmoregulation"],
["Locomotion & Movement","Muscles, bones and joints"],
["Neural Control & Coordination","Neuron, CNS, reflexes and sense organs"],
["Chemical Coordination & Integration","Endocrine glands and hormones"],
["Reproduction in Organisms","Life cycles and reproductive phases"],
["Sexual Reproduction in Flowering Plants","Pollination, fertilisation and seed formation"],
["Human Reproduction","Male/female reproductive systems and gametogenesis"],
["Reproductive Health","Contraception, STIs and reproductive technologies"],
["Principles of Inheritance & Variation","Mendelism, linkage, crossing over and pedigree"],
["Molecular Basis of Inheritance","DNA, replication, transcription, translation"],
["Evolution","Evidence, theories and Hardy-Weinberg principle"],
["Human Health & Disease","Pathogens, immunity, vaccines and disorders"],
["Strategies for Enhancement in Food Production","Plant breeding, animal husbandry and microbes"],
["Microbes in Human Welfare","Industrial products, antibiotics and sewage treatment"],
["Biotechnology: Principles & Processes","rDNA technology, vectors and PCR"],
["Biotechnology & Its Applications","GM crops, insulin, gene therapy and DNA fingerprinting"],
["Organisms & Populations","Population interactions and adaptations"],
["Ecosystem","Energy flow, productivity and ecological pyramids"],
["Biodiversity & Conservation","Levels, hotspots, threats and conservation"],
["Environmental Issues","Pollution, climate change, ozone depletion and waste"]
]
};

const subjects=document.getElementById("revisionSubjects");
const chapters=document.getElementById("revisionChapters");
const grid=document.getElementById("revisionChapterGrid");
const back=document.getElementById("revisionBack");
const content=document.getElementById("revisionContent");

if(!subjects||!chapters||!grid)return;

subjects.addEventListener("click",function(e){
 const btn=e.target.closest("[data-subject]");
 if(!btn)return;

 const subject=btn.dataset.subject;
 const list=revisionData[subject]||[];

 subjects.style.display="none";
 chapters.classList.add("show");
 content.classList.remove("show");

 grid.innerHTML=list.map((x,i)=>`
   <button class="revision-chapter" data-index="${i}" data-subject="${subject}">
     <b>${x[0]}</b>
     <small>Quick Revision →</small>
   </button>
 `).join("");
});

grid.addEventListener("click",function(e){
 const btn=e.target.closest(".revision-chapter");
 if(!btn)return;

 const subject=btn.dataset.subject;
 const item=revisionData[subject][Number(btn.dataset.index)];

 content.innerHTML=`
   <b>📖 ${subject} — ${item[0]}</b>
   <div style="margin-top:7px;opacity:.75">${item[1]}</div>
   <ul class="revision-points">
     <li>⭐ NCERT high-yield points</li>
     <li>⚠️ Common NEET traps & exceptions</li>
     <li>🧠 Important concepts to remember</li>
     <li>📝 Practice mistakes from this chapter</li>
   </ul>
 `;

 content.classList.add("show");
 content.scrollIntoView({behavior:"smooth",block:"nearest"});
});

back.addEventListener("click",function(){
 chapters.classList.remove("show");
 subjects.style.display="grid";
 content.classList.remove("show");
});

})();
</script>




</body>
</html>
