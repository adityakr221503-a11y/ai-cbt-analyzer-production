<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#64748b;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  display:block;
  text-decoration:none;
  color:#0f172a;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}

.card:hover{
  border-color:#4f46e5;
  transform:translateY(-2px);
}

.icon{
  font-size:32px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 7px;
  font-size:19px;
}

.card p{
  margin:0;
  color:#64748b;
  line-height:1.5;
}

.primary{
  background:#eef2ff;
  border-color:#c7d2fe;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:24px;
  }

}

</style>




<style id="REVISION_SHEET_V2_CSS">
.revision-box{
  margin:16px 0;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(128,128,128,.18);
  background:var(--card,#fff);
}
.revision-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.revision-head strong{font-size:18px}
.revision-head small{opacity:.65}
.revision-subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.revision-subject{
  border:1px solid rgba(128,128,128,.2);
  border-radius:12px;
  padding:12px 8px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}
.revision-subject:hover{transform:translateY(-1px)}
.revision-chapters{
  display:none;
  margin-top:12px;
}
.revision-chapters.show{display:block}
.revision-back{
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  padding:5px 0 10px;
  font-weight:700;
}
.revision-chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}
.revision-chapter{
  padding:11px;
  border-radius:11px;
  border:1px solid rgba(128,128,128,.18);
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.revision-chapter b{display:block;font-size:13px}
.revision-chapter small{opacity:.6}
.revision-content{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,.18);
}
.revision-content.show{display:block}
.revision-points{
  margin:10px 0 0;
  padding-left:20px;
}
.revision-points li{margin:7px 0}
@media(max-width:600px){
  .revision-subjects{grid-template-columns:repeat(3,1fr)}
  .revision-chapter-grid{grid-template-columns:1fr 1fr}
}
</style>

const chapters=document.getElementById("revisionChapters");
const grid=document.getElementById("revisionChapterGrid");
const back=document.getElementById("revisionBack");
const content=document.getElementById("revisionContent");

if(!subjects||!chapters||!grid)return;

subjects.addEventListener("click",function(e){
 const btn=e.target.closest("[data-subject]");
 if(!btn)return;

 const subject=btn.dataset.subject;
 const list=revisionData[subject]||[];

 subjects.style.display="none";
 chapters.classList.add("show");
 content.classList.remove("show");

 grid.innerHTML=list.map((x,i)=>`
   <button class="revision-chapter" data-index="${i}" data-subject="${subject}">

});

 if(!btn)return;

 const subject=btn.dataset.subject;
 const item=revisionData[subject][Number(btn.dataset.index)];

 content.innerHTML=`
   <b>📖 ${subject} — ${item[0]}</b>
   <div style="margin-top:7px;opacity:.75">${item[1]}</div>

});

 chapters.classList.remove("show");
 subjects.style.display="grid";

});

/* REVISION_RANK_BOOSTER_V1 */
(function(){
  const KEY="cbtRevisionProgressV1";

  function progress(){
    try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}
  }

  function saveProgress(x){
    localStorage.setItem(KEY,JSON.stringify(x));
  }

  const oldRender=window.renderRevisionChapter;

  window.revisionRB={
    search:"",
    subject:"",
    chapter:"",
    render:function(subject,chapter){
      this.subject=subject;
      this.chapter=chapter;

      const data=revisionData?.[subject]?.[chapter];
      if(!data)return;

      const box=document.querySelector("#revisionContent");
      if(!box)return;

      const p=progress();
      const id=subject+"::"+chapter;
      const done=!!p[id];

      const all=[
        ...(data.ncert||[]),
        ...(data.traps||[]),
        ...(data.concepts||[]),
        ...(data.formulas||[])
      ];

      const q=this.search.trim().toLowerCase();
      const filtered=q
        ? all.filter(x=>String(x).toLowerCase().includes(q))
        : all;

      box.innerHTML=`
        <div class="revision-rb-head">
          <div>
            <h2>📖 ${chapter}</h2>
            <div style="opacity:.75">${subject} • ${all.length} revision points</div>
          </div>
          <div>
            <button onclick="revisionRB.toggleDone()">
              ${done?"↩️ Revise Again":"✅ Mark Revised"}
            </button>
          </div>
        </div>

        <input
          id="revisionSearch"
          value="${this.search.replace(/"/g,"&quot;")}"
          placeholder="🔎 Search this chapter..."
          oninput="revisionRB.search=this.value;revisionRB.render('${subject.replace(/'/g,"\\'")}','${chapter.replace(/'/g,"\\'")}')"
          style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin:12px 0"
        >

        ${this.section("⭐ NCERT High-Yield",data.ncert,filtered)}
        ${this.section("⚠️ NEET Traps & Exceptions",data.traps,filtered)}
        ${this.section("🧠 Must Remember",data.concepts,filtered)}
        ${data.formulas?.length?this.section("⚡ Formulas / Facts",data.formulas,filtered):""}

        <button onclick="revisionRB.render('${subject.replace(/'/g,"\\'")}','${chapter.replace(/'/g,"\\'")}')">
          🔁 Refresh Revision
        </button>
      `;
    },

    section:function(title,items,filtered){
      if(!items?.length)return"";

      const shown=items.filter(x=>filtered.includes(x));
      if(!shown.length)return"";

      return `
        <div class="revision-rb-section">
          <h3>${title}</h3>
          ${shown.map((x,i)=>`
            <div class="revision-point">
              <span>${i+1}.</span> ${x}
            </div>
          `).join("")}
        </div>
      `;
    },

    toggleDone:function(){
      const p=progress();
      const id=this.subject+"::"+this.chapter;

      if(p[id]) delete p[id];
      else p[id]=Date.now();

      saveProgress(p);
      this.render(this.subject,this.chapter);
      this.updateProgress();
    },

    updateProgress:function(){
      const el=document.querySelector("#revisionProgressRB");
      if(!el)return;

      const p=progress();
      const total=Object.values(revisionData)
        .reduce((n,x)=>n+Object.keys(x).length,0);

      const done=Object.keys(p).length;

      el.innerHTML=`📊 Revision Progress: <b>${done}</b> / ${total} chapters revised`;
    }
  };

  const style=document.createElement("style");
  style.id="REVISION_RANK_BOOSTER_CSS";
  style.textContent=`
    .revision-rb-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:10px;
    }
    .revision-rb-section{
      margin:14px 0;
      padding:14px;
      border-radius:14px;
      background:rgba(127,127,127,.08);
    }
    .revision-point{
      padding:9px 4px;
      border-bottom:1px solid rgba(127,127,127,.15);
      line-height:1.5;
    }
    .revision-point:last-child{border-bottom:0}
    #revisionSearch{
      font-size:15px;
    }
  `;
  document.head.appendChild(style);

  const progressBox=document.createElement("div");
  progressBox.id="revisionProgressRB";
  progressBox.style.cssText="margin:8px 0 14px;padding:10px;border-radius:10px;background:rgba(127,127,127,.08)";

  const section=document.querySelector("#revisionSheet");
  if(section){
    const first=section.querySelector("h2,h3");
    if(first) first.parentNode.insertBefore(progressBox,first);
    else section.prepend(progressBox);
  }

  revisionRB.updateProgress();

  /*
    Hook chapter opening buttons.
    Existing V2 buttons use data-subject/data-index.
  */
  document.addEventListener("click",function(e){
    const btn=e.target.closest("[data-index]");
    if(!btn)return;

    const subject=btn.dataset.subject;
    const index=Number(btn.dataset.index);

    if(subject && revisionData[subject]){
      const chapter=Object.keys(revisionData[subject])[index];
      if(chapter){
        setTimeout(()=>revisionRB.render(subject,chapter),0);
      }
    }
  });
})();

      "Organisms and Populations":["Populations interact with both biotic and abiotic components.","Adaptations help organisms survive in their environments.","Population size changes through births, deaths, immigration and emigration."],
      "Ecosystem":["An ecosystem contains living organisms and their physical environment.","Energy flows through trophic levels.","Decomposers recycle nutrients."],
      "Biodiversity and Conservation":["Biodiversity occurs at genetic, species and ecosystem levels.","Habitat loss is a major threat to biodiversity.","In-situ conservation protects organisms in their natural habitats."],
      "Environmental Issues":["Air, water and soil pollution can affect ecosystems and human health.","Greenhouse gases contribute to climate change.","Waste management reduces environmental impacts."]
    }
  };

  Object.keys(extra).forEach(subject=>{
    if(!revisionData[subject]) revisionData[subject]={};
    Object.keys(extra[subject]).forEach(ch=>{
      if(!revisionData[subject][ch]){
        revisionData[subject][ch]={
          ncert:extra[subject][ch],
          traps:["Read NCERT wording carefully.","Do not confuse closely related terms or exceptions."],
          concepts:["NCERT core concept","Definitions and key facts","NEET application"],
          formulas:[]
        };
      }
    });
  });

  console.log("Full Revision content loaded:",Object.keys(revisionData));
})();
</script>





<!-- REVISION_WEAK_ENGINE_V1 -->
<style id="REVISION_WEAK_ENGINE_CSS">
.revision-weak-engine{
  margin:12px 0 18px;
  padding:14px;
  border-radius:16px;
  background:rgba(127,127,127,.08);
}
.revision-weak-engine h3{
  margin:0 0 8px;
}
.revision-weak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid rgba(127,127,127,.15);
}
.revision-weak-row:last-child{
  border-bottom:0;
}
.revision-weak-row small{
  display:block;
  opacity:.7;
  margin-top:3px;
}
.revision-weak-empty{
  padding:10px;
  text-align:center;
  opacity:.75;
}
</style>

<script>
(function(){
  const KEY="cbtRevisionWeakV1";

  function read(key,fallback){
    try{
      const x=JSON.parse(localStorage.getItem(key)||"null");
      return x==null?fallback:x;
    }catch(e){
      return fallback;
    }
  }

  function history(){
    const h=read("cbtHistory",[]);
    return Array.isArray(h)?h:[];
  }

  function questionsFromTest(test){
    if(Array.isArray(test?.questions)) return test.questions;
    if(Array.isArray(test?.questionResults)) return test.questionResults;
    if(Array.isArray(test?.results)) return test.results;
    return [];
  }

  function analyse(){
    const map={};

    history().forEach(test=>{
      questionsFromTest(test).forEach(q=>{
        const subject=String(q.subject||"").trim();
        const chapter=String(q.chapter||"").trim();

        if(!subject || !chapter) return;

        const key=subject+"::"+chapter;

        if(!map[key]){
          map[key]={
            subject,
            chapter,
            attempts:0,
            wrong:0,
            last:0
          };
        }

        const x=map[key];
        x.attempts++;

        const selected=
          q.userAnswer ??
          q.selectedAnswer ??
          q.selected ??
          q.user_answer;

        const correct=
          q.correctAnswer ??
          q.answer ??
          q.correct;

        if(
          selected!==undefined &&
          correct!==undefined &&
          String(selected).trim()!==String(correct).trim()
        ){
          x.wrong++;
        }

        const t=Date.parse(
          test.timestamp ||
          test.createdAt ||
          test.date ||
          ""
        );

        if(Number.isFinite(t) && t>x.last)
          x.last=t;
      });
    });

    return Object.values(map).map(x=>{
      x.accuracy=x.attempts
        ? Math.round(((x.attempts-x.wrong)/x.attempts)*100)
        : 100;

      const days=x.last
        ? (Date.now()-x.last)/86400000
        : 999;

      x.due=days>=3;
      x.priority=
        (x.wrong*5)+
        (x.accuracy<75?8:0)+
        (x.accuracy<50?8:0)+
        (x.due?4:0);

      return x;
    }).sort((a,b)=>b.priority-a.priority);
  }

  function openChapter(subject,chapter){
    if(window.revisionRB &&
       typeof window.revisionRB.render==="function"){
      window.revisionRB.search="";
      window.revisionRB.render(subject,chapter);
      return;
    }

    const buttons=document.querySelectorAll(
      "#revisionSheet [data-subject]"
    );

    for(const b of buttons){
      if(
        b.dataset.subject===subject &&
        b.textContent.includes(chapter)
      ){
        b.click();
        return;
      }
    }

    alert("Revision chapter is not available yet.");
  }

  function render(){
    const sheet=document.querySelector("#revisionSheet");
    if(!sheet)return;

    let box=document.querySelector("#revisionWeakEngine");

    if(!box){
      box=document.createElement("div");
      box.id="revisionWeakEngine";
      box.className="revision-weak-engine";

      sheet.prepend(box);
    }

    const data=analyse();

    localStorage.setItem(KEY,JSON.stringify({
      updatedAt:Date.now(),
      chapters:data
    }));

    const weak=data
      .filter(x=>x.wrong>0 || x.accuracy<75 || x.due)
      .slice(0,8);

    box.innerHTML=`
      <h3>🎯 Weak & Due Revision</h3>
      <div style="opacity:.75;margin-bottom:10px">
        CBT mistakes ke basis par priority chapters
      </div>

      ${
        weak.length
        ? weak.map((x,i)=>`
          <div class="revision-weak-row">
            <div>
              <b>${i+1}. ${x.chapter}</b>
              <small>
                ${x.subject} •
                ${x.accuracy}% accuracy •
                ${x.wrong} mistakes
                ${x.due?" • 🔔 Due":""}
              </small>
            </div>

            <button
              type="button"
              onclick='revisionWeak.open(${JSON.stringify(x.subject)},${JSON.stringify(x.chapter)})'>
              📖 Revise
            </button>
          </div>
        `).join("")
        : `
          <div class="revision-weak-empty">
            🎉 Abhi koi urgent weak/due chapter nahi mila.
          </div>
        `
      }

      <button
        type="button"
        onclick="revisionWeak.refresh()"
        style="margin-top:10px">
        🔄 Recalculate
      </button>
    `;
  }

  window.revisionWeak={
    open:openChapter,
    refresh:render,
    analyse:analyse
  };

  document.addEventListener("DOMContentLoaded",render);
  window.addEventListener("storage",render);

  setTimeout(render,500);
  setTimeout(render,1500);
})();
</script>

<script id="MAIN_DASHBOARD_PRESENTATION_CLEANUP_V4">
(function(){
  var BLOCKS = [
    "basicSmartHistoryV1",
    "revisionMistakeLoop",
    "rankerMasterLoop"
  ];

  var HEADINGS = [
    "Weak / Due Chapters",
    "Weak & Due Chapters",
    "Active Mistakes",
    "Mistake → Revision → Retry",
    "Mistake -> Revision -> Retry",
    "Ranker Master Loop"
  ];

  function norm(v){
    return String(v || "")
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase();
  }

  function removeIds(){
    BLOCKS.forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.remove();
    });

    document.querySelectorAll(
      ".revision-loop-card,.master-loop"
    ).forEach(function(el){
      el.remove();
    });
  }

  function removeHeadingBlocks(){
    var wanted=HEADINGS.map(norm);

    document.querySelectorAll(
      "h1,h2,h3,h4,h5,h6"
    ).forEach(function(h){
      var text=norm(h.textContent);

      if(!wanted.some(function(x){
        return text === x || text.indexOf(x) === 0;
      })) return;

      var box=h;

      for(var i=0;i<8 && box.parentElement;i++){
        box=box.parentElement;

        var cls=norm(box.className);

        if(
          cls.indexOf("card") !== -1 ||
          cls.indexOf("panel") !== -1 ||
          cls.indexOf("loop") !== -1 ||
          box.tagName === "SECTION"
        ){
          box.remove();
          return;
        }
      }

      if(h.parentElement){
        h.parentElement.remove();
      }
    });
  }

  function clean(){
    removeIds();
    removeHeadingBlocks();
  }

  function boot(){
    clean();

    var observer=new MutationObserver(function(){
      clean();
    });

    if(document.body){
      observer.observe(document.body,{
        childList:true,
        subtree:true
      });
    }

    setTimeout(function(){
      observer.disconnect();
      clean();
    },12000);
  }

  if(document.readyState==="loading"){
    document.addEventListener(
      "DOMContentLoaded",
      boot,
      {once:true}
    );
  }else{
    boot();
  }
})();
</script>
