<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:18px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.hero{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#64748b;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.card{
  display:block;
  text-decoration:none;
  color:#0f172a;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:2px solid transparent;
  transition:.15s;
  cursor:pointer;
}

.card:hover{
  border-color:#4f46e5;
  transform:translateY(-2px);
}

.icon{
  font-size:32px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 7px;
  font-size:19px;
}

.card p{
  margin:0;
  color:#64748b;
  line-height:1.5;
}

.primary{
  background:#eef2ff;
  border-color:#c7d2fe;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat-label{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:24px;
  }

}

</style>




<style id="REVISION_SHEET_V2_CSS">
.revision-box{
  margin:16px 0;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(128,128,128,.18);
  background:var(--card,#fff);
}
.revision-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.revision-head strong{font-size:18px}
.revision-head small{opacity:.65}
.revision-subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.revision-subject{
  border:1px solid rgba(128,128,128,.2);
  border-radius:12px;
  padding:12px 8px;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}
.revision-subject:hover{transform:translateY(-1px)}
.revision-chapters{
  display:none;
  margin-top:12px;
}
.revision-chapters.show{display:block}
.revision-back{
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  padding:5px 0 10px;
  font-weight:700;
}
.revision-chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}
.revision-chapter{
  padding:11px;
  border-radius:11px;
  border:1px solid rgba(128,128,128,.18);
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.revision-chapter b{display:block;font-size:13px}
.revision-chapter small{opacity:.6}
.revision-content{
  display:none;
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,.18);
}
.revision-content.show{display:block}
.revision-points{
  margin:10px 0 0;
  padding-left:20px;
}
.revision-points li{margin:7px 0}
@media(max-width:600px){
  .revision-subjects{grid-template-columns:repeat(3,1fr)}
  .revision-chapter-grid{grid-template-columns:1fr 1fr}
}
</style>

</head>

<body>

<section class="revision-box" id="revisionSheet">
  <div class="revision-head">
    <div>
      <strong>📚 Revision</strong>
      <small>Quick chapter-wise revision</small>
    </div>
  </div>

  <div class="revision-subjects" id="revisionSubjects">
    <button class="revision-subject" data-subject="Physics">⚡ Physics</button>
    <button class="revision-subject" data-subject="Chemistry">🧪 Chemistry</button>
    <button class="revision-subject" data-subject="Biology">🧬 Biology</button>
  </div>

  <div class="revision-chapters" id="revisionChapters">
    <button class="revision-back" id="revisionBack">← Subjects</button>
    <div id="revisionChapterGrid" class="revision-chapter-grid"></div>
  </div>

  <div class="revision-content" id="revisionContent"></div>
</section>


<script id="REVISION_SHEET_V2_JS">
(function(){

const revisionData={
 Physics:{
  "Units and Measurements":{
   ncert:["SI base units are metre, kilogram, second, ampere, kelvin, mole and candela.","Dimensions are useful for checking physical equations and converting units.","Significant figures indicate the precision of a measurement."],
   traps:["Accuracy and precision are different.","A dimensionally correct equation is not necessarily physically correct."],
   concepts:["SI units","Dimensions","Errors","Significant figures"],
   formulas:["Percentage error = (absolute error / measured value) × 100"]
  },
  "Motion in a Straight Line":{
   ncert:["Distance is a scalar quantity while displacement is a vector quantity.","Slope of a position-time graph gives velocity.","Slope of a velocity-time graph gives acceleration."],
   traps:["Distance cannot be negative.","Zero displacement does not mean zero distance."],
   concepts:["Displacement","Velocity","Acceleration","Graphs"],
   formulas:["v=u+at","s=ut+½at²","v²=u²+2as"]
  },
  "Laws of Motion":{
   ncert:["Newton's second law relates net force and acceleration.","Action and reaction forces act on different bodies.","Friction opposes relative motion or its tendency."],
   traps:["Action-reaction forces do not cancel because they act on different bodies.","Normal reaction is not always equal to mg."],
   concepts:["Newton's laws","Free body diagram","Friction","Normal reaction"],
   formulas:["F_net=ma","f≤μN","f_limiting=μN"]
  },
  "Work, Energy and Power":{
   ncert:["Work depends on the component of force along displacement.","Kinetic energy depends on the square of velocity.","Power is the rate of doing work."],
   traps:["Work can be positive, negative or zero.","A force can do zero work even when the object is moving."],
   concepts:["Work-energy theorem","Kinetic energy","Potential energy","Power"],
   formulas:["W=Fs cosθ","K=½mv²","P=W/t"]
  }
 },
 Chemistry:{
  "Some Basic Concepts of Chemistry":{
   ncert:["One mole contains 6.022×10²³ entities.","Molar mass connects mass with amount of substance.","The limiting reagent determines the maximum amount of product."],
   traps:["Balance the equation before using mole ratios.","Molarity uses solution volume whereas molality uses solvent mass."],
   concepts:["Mole concept","Stoichiometry","Limiting reagent","Concentration"],
   formulas:["n=mass/molar mass","M=moles/volume(L)"]
  },
  "Structure of Atom":{
   ncert:["Electrons occupy quantised energy levels.","Atomic number is the number of protons.","Orbitals are described by quantum numbers."],
   traps:["Orbit and orbital are different concepts.","No two electrons can have the same four quantum numbers."],
   concepts:["Quantum numbers","Electronic configuration","Atomic spectra"],
   formulas:["E_n∝−1/n²"]
  },
  "Chemical Bonding and Molecular Structure":{
   ncert:["Ionic bonding involves electrostatic attraction between oppositely charged ions.","Covalent bonding involves sharing of electron pairs.","VSEPR theory helps predict molecular shape."],
   traps:["Lone pairs affect molecular geometry.","Lewis structure must satisfy the relevant electron-count rules."],
   concepts:["Lewis structures","VSEPR","Hybridisation","Molecular orbitals"],
   formulas:["Formal charge=valence e⁻−nonbonding e⁻−½(bonding e⁻)"]
  },
  "Thermodynamics":{
   ncert:["Internal energy is a state function.","Enthalpy change represents heat change at constant pressure.","Gibbs energy is used to assess spontaneity."],
   traps:["Exothermic does not automatically mean spontaneous.","State functions do not depend on path."],
   concepts:["First law","Enthalpy","Entropy","Gibbs energy"],
   formulas:["ΔG=ΔH−TΔS"]
  }
 },
 Biology:{
  "The Living World":{
   ncert:["Species is the basic unit of classification.","Binomial nomenclature gives a scientific name using genus and species.","Taxonomic aids help in identification and classification."],
   traps:["Genus is written first in a binomial name.","Scientific names follow standard nomenclature rules."],
   concepts:["Species","Taxonomic hierarchy","Binomial nomenclature","Taxonomic aids"],
   formulas:[]
  },
  "Cell: The Unit of Life":{
   ncert:["The cell is the basic structural and functional unit of life.","Prokaryotic cells lack a membrane-bound nucleus.","Mitochondria and chloroplasts contain their own genetic material."],
   traps:["Prokaryotes contain ribosomes.","Cell wall and plasma membrane are different structures."],
   concepts:["Prokaryotic cells","Eukaryotic cells","Cell organelles","Endomembrane system"],
   formulas:[]
  },
  "Biomolecules":{
   ncert:["Major biomolecules include carbohydrates, proteins, lipids and nucleic acids.","Proteins are polymers of amino acids.","DNA and RNA are nucleic acids."],
   traps:["Lipids are generally not considered true polymers.","Protein structure depends on interactions among amino-acid residues."],
   concepts:["Proteins","Carbohydrates","Lipids","Nucleic acids"],
   formulas:[]
  },
  "Human Reproduction":{
   ncert:["Spermatogenesis occurs in seminiferous tubules.","Oogenesis begins during fetal life.","Fertilisation normally occurs at the ampullary-isthmic junction of the oviduct."],
   traps:["Ovulation releases a secondary oocyte.","Implantation occurs in the uterine endometrium."],
   concepts:["Gametogenesis","Menstrual cycle","Fertilisation","Implantation"],
   formulas:[]
  }
 }
};

const subjects=document.getElementById("revisionSubjects");
const chapters=document.getElementById("revisionChapters");
const grid=document.getElementById("revisionChapterGrid");
const back=document.getElementById("revisionBack");
const content=document.getElementById("revisionContent");

if(!subjects||!chapters||!grid)return;

subjects.addEventListener("click",function(e){
 const btn=e.target.closest("[data-subject]");
 if(!btn)return;

 const subject=btn.dataset.subject;
 const list=revisionData[subject]||[];

 subjects.style.display="none";
 chapters.classList.add("show");
 content.classList.remove("show");

 grid.innerHTML=list.map((x,i)=>`
   <button class="revision-chapter" data-index="${i}" data-subject="${subject}">
     <b>${x[0]}</b>
     <small>Quick Revision →</small>
   </button>
 `).join("");
});

grid.addEventListener("click",function(e){
 const btn=e.target.closest(".revision-chapter");
 if(!btn)return;

 const subject=btn.dataset.subject;
 const item=revisionData[subject][Number(btn.dataset.index)];

 content.innerHTML=`
   <b>📖 ${subject} — ${item[0]}</b>
   <div style="margin-top:7px;opacity:.75">${item[1]}</div>
   <ul class="revision-points">
     <li>⭐ NCERT high-yield points</li>
     <li>⚠️ Common NEET traps & exceptions</li>
     <li>🧠 Important concepts to remember</li>
     <li>📝 Practice mistakes from this chapter</li>
   </ul>
 `;

 content.classList.add("show");
 content.scrollIntoView({behavior:"smooth",block:"nearest"});
});

back.addEventListener("click",function(){
 chapters.classList.remove("show");
 subjects.style.display="grid";
 content.classList.remove("show");
});

})();

/* REVISION_FULL_NCERT_CONTENT */
(function(){
  const extra={
    Physics:{

      "Plant Growth and Development":["Auxin, gibberellins, cytokinins, ethylene and ABA are major plant hormones.","Growth involves irreversible increase in size.","Photoperiodism relates flowering responses to day/night duration."],

  Object.keys(extra).forEach(subject=>{
    if(!revisionData[subject]) revisionData[subject]={};
    Object.keys(extra[subject]).forEach(ch=>{
      if(!revisionData[subject][ch]){
        revisionData[subject][ch]={
          ncert:extra[subject][ch],
          traps:["Read NCERT wording carefully.","Do not confuse closely related terms or exceptions."],
          concepts:["NCERT core concept","Definitions and key facts","NEET application"],
          formulas:[]
        };
      }

  console.log("Full Revision content loaded:",Object.keys(revisionData));

</script>




</body>
</html>
