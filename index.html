<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Dashboard</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
-webkit-tap-highlight-color:transparent;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:21px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.header-badge{
background:#eef2ff;
color:#3730a3;
padding:8px 11px;
border-radius:9px;
font-size:12px;
font-weight:800;
}

.container{
max-width:1100px;
margin:25px auto;
padding:0 15px;
}

/* HERO */

.hero{
background:#4f46e5;
color:#fff;
border-radius:20px;
padding:28px;
margin-bottom:20px;
box-shadow:0 5px 18px rgba(79,70,229,.18);
}

.hero h1{
margin:0 0 8px;
font-size:28px;
}

.hero p{
margin:0;
opacity:.92;
line-height:1.6;
}

.hero-actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:22px;
}

.hero-button{
border:0;
border-radius:11px;
padding:14px;
font-weight:800;
font-size:15px;
cursor:pointer;
}

.start{
background:#fff;
color:#3730a3;
}

.mistakes{
background:#312e81;
color:#fff;
}

/* CARDS */

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.card h2{
margin-top:0;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
width:100%;
border:0;
background:#f8fafc;
border-radius:13px;
padding:17px;
text-align:center;
font-family:Arial,sans-serif;
color:#0f172a;
cursor:pointer;
}

.stat:active{
transform:scale(.97);
background:#eef2ff;
}

.stat strong{
display:block;
font-size:29px;
margin-bottom:5px;
}

.stat span{
font-size:13px;
color:#64748b;
font-weight:600;
}

/* QUICK ACTIONS */

.actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.action{
border:0;
background:#f8fafc;
border-radius:13px;
padding:18px 10px;
font-weight:800;
cursor:pointer;
font-size:14px;
}

.action:active{
transform:scale(.97);
background:#eef2ff;
}

.action-icon{
display:block;
font-size:27px;
margin-bottom:8px;
}

/* PERFORMANCE */

.performance{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.performance-box{
background:#f8fafc;
border-radius:13px;
padding:18px;
}

.performance-box h3{
margin-top:0;
}

.progress{
height:10px;
background:#e2e8f0;
border-radius:20px;
overflow:hidden;
margin:12px 0;
}

.progress-bar{
height:100%;
width:0%;
background:#4f46e5;
transition:.4s;
}

/* SUBJECT */

.subject-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.subject{
background:#f8fafc;
border-radius:13px;
padding:17px;
}

.subject strong{
display:block;
font-size:20px;
margin-bottom:6px;
}

.subject small{
color:#64748b;
}

/* HISTORY */

.history-item{
border:1px solid #e2e8f0;
border-radius:12px;
padding:15px;
margin-top:10px;
}

.history-top{
display:flex;
justify-content:space-between;
gap:10px;
font-weight:800;
}

.history-score{
color:#4f46e5;
}

.history-details{
margin-top:8px;
color:#64748b;
font-size:14px;
line-height:1.6;
}

.empty{
text-align:center;
padding:30px;
color:#64748b;
line-height:1.6;
}

/* FOOTER */

.footer{
text-align:center;
padding:15px;
color:#94a3b8;
font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr;
}

.actions{
grid-template-columns:1fr 1fr;
}

.subject-grid{
grid-template-columns:1fr;
}

.performance{
grid-template-columns:1fr;
}

}

@media(max-width:600px){

.container{
margin:15px auto;
}

.hero{
padding:21px;
}

.hero h1{
font-size:24px;
}

.hero-actions{
grid-template-columns:1fr;
}

.card{
padding:17px;
}

}

</style>
</head>
