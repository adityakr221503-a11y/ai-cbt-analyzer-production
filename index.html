<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI CBT Analyzer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:22px 16px}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;opacity:.9}
main{max-width:1000px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}
.tabs button{border:0;padding:11px 14px;border-radius:10px;background:white;font-weight:bold;white-space:nowrap}
.tabs button.active{background:#5b5bd6;color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:white;border-radius:16px;padding:17px;margin-bottom:16px;box-shadow:0 5px 20px #0000000d}
.stat b{display:block;font-size:28px;margin-top:7px}
.muted{color:#667085;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:10px;background:#e9ecf2;border-radius:20px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.question{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0}
.bad{color:#b42318;background:#fff1f2}
.good{color:#047857;background:#ecfdf5}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
button{cursor:pointer}
.primary{background:#5b5bd6;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:bold}
.secondary{background:#eef2ff;color:#4338ca;border:0;border-radius:9px;padding:10px 14px;font-weight:bold}
textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-family:monospace}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none}
.empty{text-align:center;color:#667085;padding:30px}
