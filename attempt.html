<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Attempt Analysis</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.summary{
  display:grid;
  grid-template-columns:
  repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#f8fafc;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.stat small{
  color:#64748b;
}

.question{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:20px;
  margin-top:15px;
}

.question.wrong{
  border-left:5px solid #dc2626;
}

.question.correct{
  border-left:5px solid #16a34a;
}

.question.skipped{
  border-left:5px solid #f59e0b;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}

.badge.wrong{
  background:#fee2e2;
  color:#991b1b;
}

.badge.correct{
  background:#dcfce7;
  color:#166534;
}

.badge.skipped{
  background:#fef3c7;
  color:#92400e;
}

.question-text{
  font-size:17px;
  font-weight:700;
  line-height:1.6;
  margin-bottom:15px;
}

.answer{
  padding:12px;
  border-radius:9px;
  margin-top:8px;
}

.your{
  background:#fff7ed;
}

.correct-answer{
  background:#ecfdf5;
}

.reason{
  background:#eef2ff;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
}

.solution{
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
  line-height:1.6;
}

.bookmark{
  background:#fef3c7;
  color:#92400e;
  padding:5px 8px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#4f46e5;
  color:#fff;
}

@media(max-width:700px){

  .summary{
    grid-template-columns:
    1fr 1fr;
  }

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="primary"
onclick="location.href='history.html'">

← History

</button>

</div>

</header>


<div class="container">

<div class="card">

<h1 id="title">
CBT Attempt Analysis
</h1>

<p id="date">
</p>

<div class="summary">

<div class="stat">

<strong id="score">
0
</strong>

<small>Score</small>

</div>


<div class="stat">

<strong id="correct">
0
</strong>

<small>Correct</small>

</div>


<div class="stat">

<strong id="incorrect">
0
</strong>

<small>Incorrect</small>

</div>


<div class="stat">

<strong id="skipped">
0
</strong>

<small>Skipped</small>

</div>

</div>

</div>


<div class="card">

<h2>
🧠 Question Analysis
</h2>

<div id="questions">

</div>

</div>

</div>


<script>

const test =
JSON.parse(
localStorage.getItem(
"selectedCBTAttempt"
) || "null"
);


if(!test){

document.getElementById(
"questions"
).innerHTML =

`
<div class="empty">

<h3>
No attempt selected
</h3>

<p>
Return to Test History and select
an attempt.
</p>

</div>
`;

}
else{

loadAttempt();

}


function loadAttempt(){

document.getElementById(
"title"
).textContent =

test.title ||
"CBT Attempt Analysis";


document.getElementById(
"date"
).textContent =

"📅 " +
(test.date || "Unknown date");


document.getElementById(
"score"
).textContent =

test.score ?? 0;


document.getElementById(
"correct"
).textContent =

test.correct ?? 0;


document.getElementById(
"incorrect"
).textContent =

test.incorrect ?? 0;


document.getElementById(
"skipped"
).textContent =

test.skipped ?? 0;


const questions =
test.questions || [];


const container =
document.getElementById(
"questions"
);


if(questions.length === 0){

container.innerHTML =

`
<div class="empty">

<h3>
Question-level analysis isn't available
for this attempt yet.
</h3>

<p>
Your CBT must save its question data
when the test is submitted.
</p>

</div>
`;

return;

}


questions.forEach(
(question,index) => {

let status =
"skipped";

if(question.selectedAnswer !== null &&
question.selectedAnswer !== undefined &&
question.selectedAnswer !== ""){

if(
String(question.selectedAnswer) ===
String(question.correctAnswer)
){

status = "correct";

}
else{

status = "wrong";

}

}


const card =
document.createElement("div");


card.className =
"question " + status;


let html = "";


html +=
`
<div class="badge ${status}">
${status.toUpperCase()}
</div>
`;


if(question.bookmarked){

html +=
`
<span class="bookmark">
🔖 BOOKMARKED
</span>
`;

}


html +=
`
<div class="question-text">

Q${index + 1}.
${question.question || "Question text unavailable"}

</div>
`;


html +=
`
<div class="answer your">

<strong>Your Answer:</strong><br>

${question.selectedAnswer ??
"Not Attempted"}

</div>
`;


html +=
`
<div class="answer correct-answer">

<strong>Correct Answer:</strong><br>

${question.correctAnswer ??
"Not available"}

</div>
`;


if(status === "wrong"){

html +=
`
<div class="reason">

<strong>🧠 Mistake Reason</strong>

<br><br>

${question.mistakeReason ||
"Review this question and identify why the incorrect option was selected."}

</div>
`;

}


html +=
`
<div class="solution">

<strong>💡 Solution</strong>

<br><br>

${question.solution ||
"Solution not available for this attempt."}

</div>
`;


if(question.subject){

html +=
`
<div class="details">

📚 Subject:
${question.subject}

</div>
`;

}


card.innerHTML =
html;


container.appendChild(card);

});

}

</script>

</body>

</html>
