<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Retry Mistakes - RankForge AI</title>
<link rel="stylesheet" href="./rankforge-premium.css">
</head>
<body class="rf-page">
<header class="rf-top"><a class="rf-back" href="mistake.html" aria-label="Back">&larr;</a><div><h1>Retry Mistakes</h1><p>Mistake &rarr; Fix &rarr; Retest &rarr; Master</p></div><span class="rf-pill" id="pill">-</span></header>
<main class="rf-wrap" id="app"></main>
<nav class="rf-nav" aria-label="Main"><a href="index.html"><span>🏠</span>Home</a><a href="mistake.html"><span>🧠</span>Mistakes</a><a href="retry.html" class="on"><span>🔁</span>Retry</a><a href="cbt.html"><span>📝</span>Tests</a><a href="analysis.html"><span>📊</span>Progress</a></nav>
<script src="./rf-fixpack-v1.js"></script>
<script src="./rankforge-canonical-v1.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app"), pill = document.getElementById("pill");
  var S = { q: [], i: 0, ok: 0, bad: 0, mastered: 0, locked: false };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function stat(n, label) { var d = el("div", "rf-stat"); d.appendChild(el("b", "", String(n))); d.appendChild(el("span", "", label)); return d; }
  function btn(label, fn, ghost) { var b = el("button", "rf-btn" + (ghost ? " ghost" : ""), label); b.type = "button"; b.addEventListener("click", fn); app.appendChild(b); }
  function link(label, href, ghost) { var a = el("a", "rf-btn" + (ghost ? " ghost" : ""), label); a.href = href; app.appendChild(a); }
  function intro() {
    clear();
    var act = RFData.active(), usable = act.map(RFData.retryable).filter(Boolean);
    var masteredN = RFData.mastered().filter(function (x) { return x && x.question; }).length;
    pill.textContent = act.length + " active";
    var hero = el("section", "rf-card rf-hero");
    hero.appendChild(el("div", "rf-eyebrow", "FIX \u2192 RETEST \u2192 MASTER"));
    hero.appendChild(el("h2", "", usable.length ? "Retry " + usable.length + " mistake" + (usable.length > 1 ? "s" : "") : "No mistakes to retry"));
    hero.appendChild(el("p", "rf-mute", usable.length ? "Answer each question again. Get it right and it moves to Mastered." : "Take a test or a practice session first. Wrong answers show up here automatically."));
    app.appendChild(hero);
    var g = el("div", "rf-grid2"); g.appendChild(stat(act.length, "Active mistakes")); g.appendChild(stat(masteredN, "Mastered")); app.appendChild(g);
    if (act.length - usable.length > 0) app.appendChild(el("p", "rf-note", (act.length - usable.length) + " mistake(s) cannot be retried here because their options were not saved."));
    if (usable.length) {
      var id = new URLSearchParams(location.search).get("id");
      var one = id ? usable.filter(function (x) { return x.id === id; }) : [];
      if (one.length) btn("Retry this question", function () { begin(one); });
      btn("Start retry (" + Math.min(usable.length, 20) + ")", function () { begin(shuffle(usable).slice(0, 20)); });
      if (usable.length > 20) btn("Retry all " + usable.length, function () { begin(shuffle(usable)); }, true);
    } else {
      link("Take a CBT test", "cbt.html"); link("Stable practice", "rankforge-stable-practice.html", true);
    }
    link("Open Mistake Book", "mistake.html", true);
  }
  function begin(list) { S.q = list; S.i = 0; S.ok = 0; S.bad = 0; S.mastered = 0; show(); }
  function show() {
    if (S.i >= S.q.length) { summary(); return; }
    clear(); S.locked = false;
    var q = S.q[S.i];
    pill.textContent = (S.i + 1) + " / " + S.q.length;
    var bar = el("div", "rf-bar"), f = el("i"); f.style.width = (S.i / S.q.length * 100) + "%"; bar.appendChild(f); app.appendChild(bar);
    var card = el("section", "rf-card");
    if (q.topic) card.appendChild(el("span", "rf-chip", q.topic));
    card.appendChild(el("div", "rf-q", q.question)); app.appendChild(card);
    var box = el("div");
    q.options.forEach(function (t, i) {
      var b = el("button", "rf-opt"); b.type = "button";
      b.appendChild(el("b", "", String.fromCharCode(65 + i))); b.appendChild(el("span", "", t));
      b.addEventListener("click", function () { pick(i, b, box); });
      box.appendChild(b);
    });
    app.appendChild(box);
    var fb = el("div"); fb.id = "fb"; app.appendChild(fb);
  }
  function pick(i, b, box) {
    if (S.locked) return; S.locked = true;
    var q = S.q[S.i], good = i === q.correctIndex;
    box.children[q.correctIndex].classList.add("ok"); if (!good) b.classList.add("bad");
    RFData.recordRetry(q, good);
    if (good) { S.ok++; if (RFData.markMastered(q)) S.mastered++; } else S.bad++;
    var c = el("section", "rf-card");
    c.appendChild(el("b", good ? "rf-ok" : "rf-bad", good ? "\u2705 Correct - moved to Mastered" : "\u274C Not yet - it stays in your Mistake Book"));
    if (q.explanation) c.appendChild(el("p", "rf-mute", q.explanation));
    var last = S.i === S.q.length - 1;
    var n = el("button", "rf-btn", last ? "See result" : "Next \u2192"); n.type = "button";
    n.style.marginTop = "12px";
    n.addEventListener("click", function () { S.i++; show(); window.scrollTo(0, 0); });
    c.appendChild(n); document.getElementById("fb").appendChild(c);
    c.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function summary() {
    clear(); pill.textContent = "Done";
    var hero = el("section", "rf-card rf-hero");
    hero.appendChild(el("div", "rf-eyebrow", "RETRY COMPLETE"));
    hero.appendChild(el("h2", "", S.ok + " of " + S.q.length + " correct"));
    hero.appendChild(el("p", "rf-mute", S.mastered + " question" + (S.mastered === 1 ? "" : "s") + " moved to Mastered."));
    app.appendChild(hero);
    var g = el("div", "rf-grid2"); g.appendChild(stat(S.ok, "Correct")); g.appendChild(stat(S.bad, "Still to fix")); app.appendChild(g);
    var left = RFData.active().map(RFData.retryable).filter(Boolean).length;
    if (left) btn("Retry remaining (" + left + ")", intro);
    link("Open Mistake Book", "mistake.html", true); link("Home", "index.html", true);
  }
  intro();
})();
</script>
<script src="./rf-nav-v1.js"></script>
</body></html>
