<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Retry Mistakes</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.container{
max-width:900px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#16a34a;
color:#fff;
padding:24px;
border-radius:18px;
margin-bottom:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-bottom:18px;
}

.qno{
font-weight:800;
color:#16a34a;
margin-bottom:10px;
}

.qtext{
font-size:17px;
font-weight:700;
line-height:1.5;
margin-bottom:15px;
}

.option{
display:block;
width:100%;
text-align:left;
background:#f8fafc;
border:1px solid #cbd5e1;
padding:13px;
margin:8px 0;
border-radius:9px;
cursor:pointer;
font-size:15px;
}

.option.selected{
border:2px solid #4f46e5;
background:#eef2ff;
}

.submit{
width:100%;
background:#4f46e5;
color:#fff;
border:0;
border-radius:10px;
padding:15px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.result{
text-align:center;
}

.score{
font-size:40px;
font-weight:800;
color:#4f46e5;
}

.mastered{
background:#dcfce7;
border-left:5px solid #16a34a;
padding:14px;
border-radius:10px;
margin-top:12px;
}

.still{
background:#fee2e2;
border-left:5px solid #dc2626;
padding:14px;
border-radius:10px;
margin-top:12px;
}

.back{
background:#e2e8f0;
color:#0f172a;
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:700;
cursor:pointer;
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b;
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="back"
onclick="location.href='mistake.html'">

Mistake Bank

</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>🔄 Retry Mistakes</h1>

<p>
Turn previous mistakes into mastered questions.
</p>

</div>

<div id="app"></div>

</div>


<script>

let questions=[];
let answers={};
let submitted=false;


/* LOAD QUESTIONS */

try{

questions=
JSON.parse(
localStorage.getItem(
"cbtRetryQuestions"
) || "[]"
);

if(!Array.isArray(questions)){
questions=[];
}

}catch(e){

questions=[];

}


/* RENDER */

render();


function render(){

const app=
document.getElementById("app");

app.innerHTML="";


if(questions.length===0){

app.innerHTML=
`
<div class="card empty">

<h2>🎉 No Questions to Retry</h2>

<p>
There are no active mistakes available.
</p>

<button
class="back"
onclick="location.href='mistake.html'">

← Mistake Bank

</button>

</div>
`;

return;

}


questions.forEach(
function(q,index){

const card=
document.createElement("div");

card.className="question";

const qno=
document.createElement("div");

qno.className="qno";

qno.textContent=
"Question "
+
(index+1)
+
" of "
+
questions.length;

card.appendChild(qno);


const text=
document.createElement("div");

text.className="qtext";

text.textContent=
q.question ||
q.text ||
q.questionText ||
"Question unavailable";

card.appendChild(text);


const options=
getOptions(q);


options.forEach(
function(option,optIndex){

const button=
document.createElement("button");

button.className="option";

button.textContent=
getOptionText(option);

button.onclick=
function(){

selectAnswer(
index,
optIndex,
card
);

};

card.appendChild(button);

});


app.appendChild(card);

});


const submit=
document.createElement("button");

submit.className="submit";

submit.textContent=
"Submit Retry Test";

submit.onclick=
submitTest;

app.appendChild(submit);

}


/* OPTIONS */

function getOptions(q){

const options=
q.options ||
q.choices ||
q.answers ||
[];

if(Array.isArray(options)){
return options;
}

if(
typeof options==="object" &&
options!==null
){

return Object.values(options);

}

return [];

}


/* OPTION TEXT */

function getOptionText(option){

if(
typeof option==="object" &&
option!==null
){

return(
option.text ||
option.label ||
option.value ||
JSON.stringify(option)
);

}

return String(option);

}


/* SELECT */

function selectAnswer(
questionIndex,
optionIndex,
card
){

if(submitted)return;

answers[questionIndex]=
optionIndex;

const buttons=
card.querySelectorAll(
".option"
);

buttons.forEach(
function(button,index){

button.classList.remove(
"selected"
);

if(index===optionIndex){

button.classList.add(
"selected"
);

}

});

}


/* CORRECT ANSWER */

function getCorrectIndex(q){

if(
typeof q.correctIndex==="number"
){

return q.correctIndex;

}

if(
typeof q.answerIndex==="number"
){

return q.answerIndex;

}

if(
typeof q.correctOption==="number"
){

return q.correctOption;

}

if(
typeof q.correct==="number"
){

return q.correct;

}


const answer=
q.correctAnswer ??
q.answer;


if(typeof answer==="string"){

const value=
answer.trim().toUpperCase();


if(
["A","B","C","D","E"].includes(value)
){

return value.charCodeAt(0)-65;

}


const options=
getOptions(q);


for(
let i=0;
i<options.length;
i++
){

if(
getOptionText(options[i])
.trim()
.toLowerCase()
===
answer
.trim()
.toLowerCase()
){

return i;

}

}

}

return null;

}


/* SUBMIT */

function submitTest(){

if(submitted)return;

submitted=true;

let correct=0;
let wrong=0;
let skipped=0;

const masteredIds=[];
const stillWrongIds=[];


questions.forEach(
function(q,index){

const id=
q.retryQuestionId ||
createQuestionId(q);


const selected=
answers[index];


if(selected===undefined){

skipped++;

stillWrongIds.push(id);

return;

}


const correctIndex=
getCorrectIndex(q);


if(
correctIndex!==null &&
Number(selected)===
Number(correctIndex)
){

correct++;

masteredIds.push(id);

}else{

wrong++;

stillWrongIds.push(id);

}

});


/* SAVE MASTERED */

let mastered=[];

try{

mastered=
JSON.parse(
localStorage.getItem(
"cbtMasteredQuestions"
) || "[]"
);

if(!Array.isArray(mastered)){
mastered=[];
}

}catch(e){

mastered=[];

}


masteredIds.forEach(
function(id){

if(!mastered.includes(id)){

mastered.push(id);

}

});


localStorage.setItem(
"cbtMasteredQuestions",
JSON.stringify(mastered)
);


/* SAVE RETRY RESULT */

let retryHistory=[];

try{

retryHistory=
JSON.parse(
localStorage.getItem(
"retryHistory"
) || "[]"
);

if(!Array.isArray(retryHistory)){
retryHistory=[];
}

}catch(e){

retryHistory=[];

}


retryHistory.push({

date:
new Date().toLocaleString(),

total:
questions.length,

correct:
correct,

wrong:
wrong,

skipped:
skipped,

mastered:
masteredIds.length,

stillWrong:
stillWrongIds.length

});


localStorage.setItem(
"retryHistory",
JSON.stringify(
retryHistory
)
);


/* UPDATE ACTIVE RETRY SET */

const active=
questions.filter(
function(q,index){

const id=
q.retryQuestionId ||
createQuestionId(q);

return !masteredIds.includes(id);

});


localStorage.setItem(
"cbtRetryQuestions",
JSON.stringify(active)
);


/* SHOW RESULT */

showResult(
correct,
wrong,
skipped,
masteredIds.length
);

}


/* ID */

function createQuestionId(q){

return(
String(
q.question ||
q.text ||
q.questionText ||
""
)
.trim()
.toLowerCase()
);

}


/* RESULT */

function showResult(
correct,
wrong,
skipped,
mastered
){

const total=
questions.length;

const accuracy=
total===0
?
0
:
Math.round(
(correct/total)*100
);


const app=
document.getElementById("app");


app.innerHTML=
`
<div class="card result">

<h2>🔄 Retry Complete</h2>

<div class="score">
${correct}/${total}
</div>

<p>
Accuracy: <strong>${accuracy}%</strong>
</p>

<div class="mastered">

✅ <strong>
${mastered}
question(s) mastered
</strong>

<br>

These questions will no longer appear
in the active Mistake Bank.

</div>


<div class="still">

❌ <strong>
${wrong}
question(s) still need practice
</strong>

<br>

These remain available for another retry.

</div>


<p>
⏭️ Skipped: ${skipped}
</p>

<br>

<button
class="back"
onclick="location.href='mistake.html'">

🧠 Open Mistake Bank

</button>

<br><br>

<button
class="back"
onclick="location.href='analysis.html'">

📊 Open Dashboard

</button>

</div>
`;

}

</script>

</body>
</html>
