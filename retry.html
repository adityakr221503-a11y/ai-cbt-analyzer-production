<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Retry</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a;
  -webkit-tap-highlight-color:transparent;
}

header{
  background:#fff;
  border-bottom:1px solid #e2e8f0;
  padding:16px 20px;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:#4f46e5;
}

.back,
.primary,
.secondary,
.option,
.big-button{
  font-family:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

.back{
  border:0;
  background:#e2e8f0;
  padding:11px 15px;
  border-radius:10px;
  font-weight:700;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero{
  background:#4f46e5;
  color:#fff;
  padding:22px;
  border-radius:16px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 8px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0;
}

.badge{
  background:#eef2ff;
  color:#3730a3;
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}

.question-number{
  color:#64748b;
  font-weight:700;
  margin-bottom:12px;
}

.question{
  font-size:20px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:20px;
}

.option{
  display:block;
  width:100%;
  border:2px solid #e2e8f0;
  background:#fff;
  padding:16px;
  margin:10px 0;
  border-radius:12px;
  text-align:left;
  font-size:16px;
  font-weight:600;
  color:#0f172a;
  -webkit-user-select:none;
  user-select:none;
}

.option:active{
  transform:scale(.99);
}

.option.selected{
  border-color:#4f46e5;
  background:#eef2ff;
  color:#312e81;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.primary{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:14px;
  border-radius:10px;
  font-weight:800;
  font-size:15px;
}

.secondary{
  border:0;
  background:#e2e8f0;
  color:#0f172a;
  padding:14px;
  border-radius:10px;
  font-weight:800;
  font-size:15px;
}

.result{
  display:none;
}

.result-box{
  padding:20px;
  border-radius:14px;
  background:#f8fafc;
  text-align:center;
}

.result-score{
  font-size:42px;
  font-weight:900;
  margin:10px 0;
}

.success{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.5;
}

.failure{
  background:#fff7ed;
  border:1px solid #fed7aa;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.5;
}

.solution{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:16px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.6;
}

.original{
  background:#f8fafc;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.5;
}

.big-button{
  width:100%;
  border:0;
  background:#4f46e5;
  color:white;
  padding:15px;
  border-radius:10px;
  font-weight:800;
  font-size:16px;
  margin-top:15px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#64748b;
  line-height:1.6;
}

@media(max-width:600px){
  .actions{
    grid-template-columns:1fr;
  }

  .question{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
type="button"
class="back"
id="backButton">
← Mistake Bank
</button>

</div>
</header>

<div class="container">

<div id="retryScreen">

<div class="hero">
<h1>🔄 Retry Mistake</h1>
<p>
Answer the question again without looking at your previous answer.
</p>
</div>

<div class="card">

<div
class="question-number"
id="questionNumber">
Retry Question
</div>

<div
class="meta"
id="meta">
</div>

<div
class="question"
id="question">
Loading question...
</div>

<div id="options"></div>

<div class="actions">

<button
type="button"
class="secondary"
id="clearButton">
Clear Answer
</button>

<button
type="button"
class="primary"
id="submitButton">
Submit Retry
</button>

</div>

</div>
</div>

<div
id="result"
class="result">

<div class="card">

<h2>🔄 Retry Result</h2>

<div class="result-box">

<div
class="result-score"
id="resultScore">
</div>

<div id="resultMessage"></div>

</div>

<div id="originalInfo"></div>

<div id="solutionBox"></div>

<button
type="button"
class="big-button"
id="returnButton">

← Return to Mistake Bank

</button>

</div>

</div>

</div>

<script>

const RETRY_KEY="cbtRetryQuestion";
const MASTERY_KEY="cbtMasteryV2";

let retryQuestion=null;
let selectedAnswer=null;
let submitted=false;


/* =========================
NORMALIZE
========================= */

function normalize(value){

return String(value||"")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =========================
LOAD
========================= */

function loadRetryQuestion(){

let raw=null;

try{

raw=localStorage.getItem(RETRY_KEY);

}catch(error){

showNoQuestion();
return;

}

if(!raw){

showNoQuestion();
return;

}

try{

retryQuestion=JSON.parse(raw);

}catch(error){

showNoQuestion();
return;

}

if(
!retryQuestion ||
typeof retryQuestion!=="object" ||
!retryQuestion.question ||
!Array.isArray(retryQuestion.options) ||
retryQuestion.options.length===0
){

showNoQuestion();
return;

}

renderRetryQuestion();

}


/* =========================
NO QUESTION
========================= */

function showNoQuestion(){

document.getElementById("retryScreen").innerHTML=`

<div class="card">

<div class="empty">

<h2>⚠️ No Retry Question</h2>

<p>
Please return to Mistake Bank and select a mistake to retry.
</p>

<button
type="button"
class="big-button"
onclick="goBack()">

← Return to Mistake Bank

</button>

</div>

</div>

`;

}


/* =========================
RENDER
========================= */

function renderRetryQuestion(){

document.getElementById("questionNumber").textContent=
"🔄 Retry • "+
(retryQuestion.subject||"Question");

const meta=document.getElementById("meta");

meta.innerHTML="";

addBadge(retryQuestion.subject);
addBadge(retryQuestion.topic);
addBadge(retryQuestion.mistakeType);

document.getElementById("question").textContent=
retryQuestion.question;

renderOptions();

}


/* =========================
BADGE
========================= */

function addBadge(text){

if(!text)return;

const badge=document.createElement("span");

badge.className="badge";

badge.textContent=text;

document.getElementById("meta").appendChild(badge);

}


/* =========================
OPTIONS
========================= */

function renderOptions(){

const box=document.getElementById("options");

box.innerHTML="";

retryQuestion.options.forEach(function(option,index){

const button=document.createElement("button");

button.type="button";

button.className="option";

button.textContent=
String.fromCharCode(65+index)+". "+option;

if(selectedAnswer===index){

button.classList.add("selected");

}

button.addEventListener("click",function(){

if(submitted)return;

selectedAnswer=index;

renderOptions();

});

box.appendChild(button);

});

}


/* =========================
CLEAR
========================= */

function clearSelection(){

if(submitted)return;

selectedAnswer=null;

renderOptions();

}


/* =========================
SUBMIT
========================= */

function submitRetry(){

if(submitted)return;

if(selectedAnswer===null){

alert("Please select an answer first.");

return;

}

const correctIndex=
getCorrectIndex();

const correct=
selectedAnswer===correctIndex;

submitted=true;

saveRetry(correct);

if(correct){

markMastered();

removeFromActiveMistakes();

}

showResult(correct,correctIndex);

}


/* =========================
CORRECT INDEX
========================= */

function getCorrectIndex(){

const index=Number(
retryQuestion.correctIndex
);

if(
Number.isInteger(index) &&
index>=0 &&
index<retryQuestion.options.length
){

return index;

}

/*
Fallback:
If the original question only contains
correctAnswer, find its option index.
*/

const correctAnswer=
normalize(
retryQuestion.correctAnswer
);

const found=
retryQuestion.options.findIndex(
function(option){

return normalize(option)===correctAnswer;

}
);

return found>=0 ? found : -1;

}


/* =========================
SAVE RETRY
========================= */

function saveRetry(correct){

let data=[];

try{

const parsed=
JSON.parse(
localStorage.getItem(MASTERY_KEY)||"[]"
);

if(Array.isArray(parsed)){
data=parsed;
}

}catch(error){

data=[];

}

data.push({

type:"retry",

question:retryQuestion.question,

questionKey:normalize(
retryQuestion.question
),

subject:retryQuestion.subject||"Unknown",

topic:retryQuestion.topic||"Unknown",

correct:correct,

selectedIndex:selectedAnswer,

date:new Date().toLocaleString()

});

localStorage.setItem(
MASTERY_KEY,
JSON.stringify(data)
);


/* Legacy retry history */

let retryHistory=[];

try{

const parsed=
JSON.parse(
localStorage.getItem("retryHistory")||"[]"
);

if(Array.isArray(parsed)){
retryHistory=parsed;
}

}catch(error){

retryHistory=[];

}

retryHistory.push({

date:new Date().toLocaleString(),

total:1,

correct:correct?1:0,

wrong:correct?0:1,

skipped:0,

mastered:correct?1:0

});

localStorage.setItem(
"retryHistory",
JSON.stringify(retryHistory)
);

}


/* =========================
MASTERED
========================= */

function markMastered(){

let data=[];

try{

const parsed=
JSON.parse(
localStorage.getItem(MASTERY_KEY)||"[]"
);

if(Array.isArray(parsed)){
data=parsed;
}

}catch(error){

data=[];

}

const key=
normalize(retryQuestion.question);

const exists=
data.some(function(item){

return item &&
item.type==="mastery" &&
normalize(item.question)===key;

});

if(!exists){

data.push({

type:"mastery",

question:retryQuestion.question,

questionKey:key,

subject:retryQuestion.subject||"Unknown",

topic:retryQuestion.topic||"Unknown",

date:new Date().toLocaleString(),

source:"real-retry"

});

}

localStorage.setItem(
MASTERY_KEY,
JSON.stringify(data)
);


/* Legacy mastered storage */

let mastered=[];

try{

const parsed=
JSON.parse(
localStorage.getItem(
"cbtMasteredQuestions"
)||"[]"
);

if(Array.isArray(parsed)){
mastered=parsed;
}

}catch(error){

mastered=[];

}

const oldExists=
mastered.some(function(item){

const text=
typeof item==="string"
?item
:item &&
(item.question||item.text||item.questionText);

return normalize(text)===key;

});

if(!oldExists){

mastered.push({

question:retryQuestion.question,

subject:retryQuestion.subject||"Unknown",

topic:retryQuestion.topic||"Unknown",

masteredAt:new Date().toLocaleString(),

source:"real-retry"

});

}

localStorage.setItem(
"cbtMasteredQuestions",
JSON.stringify(mastered)
);

localStorage.setItem(
"cbtMasteryUpdatedAt",
String(Date.now())
);

}


/* =========================
REMOVE ACTIVE MISTAKE
========================= */

function removeFromActiveMistakes(){

const key=
normalize(retryQuestion.question);

try{

const history=
JSON.parse(
localStorage.getItem("cbtHistory")||"[]"
);

if(!Array.isArray(history))return;

history.forEach(function(test){

if(
!test ||
!Array.isArray(test.questions)
)return;

test.questions.forEach(function(q){

if(
q &&
normalize(
q.question||q.text||q.questionText
)===key
){

q.mastered=true;
q.masteredAt=
new Date().toLocaleString();

}

});

});

localStorage.setItem(
"cbtHistory",
JSON.stringify(history)
);

}catch(error){

console.error(
"Could not update history:",
error
);

}

}


/* =========================
RESULT
========================= */

function showResult(correct,correctIndex){

document.getElementById(
"retryScreen"
).style.display="none";

document.getElementById(
"result"
).style.display="block";

const score=
document.getElementById("resultScore");

const message=
document.getElementById("resultMessage");

if(correct){

score.textContent="🏆 Correct";

message.className="success";

message.innerHTML=
"<strong>Excellent!</strong><br>"+
"This question is now marked as mastered.";

}else{

score.textContent="❌ Incorrect";

message.className="failure";

message.innerHTML=
"<strong>Not mastered yet.</strong><br>"+
"This mistake remains active. Review the solution and try again later.";

}

const selectedText=
retryQuestion.options[selectedAnswer]||
"Unknown";

const correctText=
correctIndex>=0
?retryQuestion.options[correctIndex]
:(retryQuestion.correctAnswer||"Unknown");

document.getElementById(
"originalInfo"
).innerHTML=`

<div class="original">

<strong>Question</strong>

<p>${escapeHTML(
retryQuestion.question
)}</p>

<strong>Your retry answer:</strong>

<p>${escapeHTML(
selectedText
)}</p>

<strong>Correct answer:</strong>

<p>${escapeHTML(
correctText
)}</p>

</div>

`;

document.getElementById(
"solutionBox"
).innerHTML=`

<div class="solution">

<strong>💡 Solution</strong>

<p>${escapeHTML(
retryQuestion.solution||
"Review the original solution carefully."
)}</p>

${
retryQuestion.mistakeReason
?
`
<strong>🧠 Previous Mistake Reason</strong>
<p>${escapeHTML(
retryQuestion.mistakeReason
)}</p>
`
:""
}

</div>

`;

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
BACK
========================= */

function goBack(){

location.href="mistake.html";

}


/* =========================
BUTTONS
========================= */

document.getElementById(
"backButton"
).addEventListener(
"click",
goBack
);

document.getElementById(
"clearButton"
).addEventListener(
"click",
clearSelection
);

document.getElementById(
"submitButton"
).addEventListener(
"click",
submitRetry
);

document.getElementById(
"returnButton"
).addEventListener(
"click",
goBack
);


/* =========================
START
========================= */

loadRetryQuestion();

</script>

</body>
</html>
