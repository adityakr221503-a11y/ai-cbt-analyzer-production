<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CBT Analyzer Pro — Retry Mistakes</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
padding:16px 20px;
border-bottom:1px solid #e2e8f0;
}

.header{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

.container{
max-width:900px;
margin:25px auto;
padding:0 15px;
}

.hero{
background:#16a34a;
color:#fff;
padding:24px;
border-radius:18px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-bottom:18px;
}

.qno{
font-weight:800;
color:#16a34a;
margin-bottom:10px;
}

.qtext{
font-size:17px;
font-weight:700;
line-height:1.5;
margin-bottom:15px;
}

.option{
display:block;
width:100%;
text-align:left;
background:#f8fafc;
border:1px solid #cbd5e1;
padding:13px;
margin:8px 0;
border-radius:9px;
cursor:pointer;
font-size:15px;
}

.option.selected{
border:2px solid #4f46e5;
background:#eef2ff;
}

.option.correct{
background:#dcfce7;
border-color:#16a34a;
}

.option.wrong{
background:#fee2e2;
border-color:#dc2626;
}

.submit{
width:100%;
background:#4f46e5;
color:#fff;
border:0;
border-radius:10px;
padding:15px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.back{
background:#e2e8f0;
color:#0f172a;
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:700;
cursor:pointer;
}

.result{
text-align:center;
}

.score{
font-size:40px;
font-weight:800;
color:#4f46e5;
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b;
}

.info{
background:#eef2ff;
padding:14px;
border-radius:10px;
margin-bottom:18px;
}

@media(max-width:600px){
.container{
padding:0 10px;
}
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="back"
onclick="location.href='mistake.html'">

Mistake Bank

</button>

</div>

</header>


<div class="container">

<div class="hero">

<h1>🔄 Retry Mistakes</h1>

<p>
Practice questions you previously got wrong.
</p>

</div>


<div id="app">

<div class="card empty">
Loading retry questions...
</div>

</div>

</div>


<script>

/* =====================================
LOAD RETRY QUESTIONS
===================================== */

let questions=[];

let selectedAnswers={};

let submitted=false;


try{

const saved=
localStorage.getItem(
"cbtRetryQuestions"
);

if(saved){

questions=
JSON.parse(saved);

}

if(!Array.isArray(questions)){

questions=[];

}

}catch(error){

questions=[];

}


/* =====================================
START
===================================== */

render();


/* =====================================
RENDER TEST
===================================== */

function render(){

const app=
document.getElementById("app");


app.innerHTML="";


if(questions.length===0){

app.innerHTML=
`
<div class="card empty">

<h2>🎉 No Mistakes Available</h2>

<p>
Complete a CBT and save some wrong questions first.
</p>

<button
class="back"
onclick="location.href='mistake.html'">

← Back to Mistake Bank

</button>

</div>
`;

return;

}


const info=
document.createElement("div");

info.className="info";

info.innerHTML=
`
<strong>${questions.length}</strong>
mistake question(s) ready for retry.
`;

app.appendChild(info);


questions.forEach(
function(question,index){

renderQuestion(
question,
index,
app
);

});


const submit=
document.createElement("button");

submit.className="submit";

submit.textContent=
"Submit Retry Test";

submit.onclick=
submitTest;

app.appendChild(submit);

}


/* =====================================
QUESTION
===================================== */

function renderQuestion(
question,
index,
app
){

const card=
document.createElement("div");

card.className="question";


const number=
document.createElement("div");

number.className="qno";

number.textContent=
"Question "
+
(index+1)
+
" of "
+
questions.length;


card.appendChild(number);


const text=
document.createElement("div");

text.className="qtext";

text.textContent=
getQuestionText(question);

card.appendChild(text);


const options=
getOptions(question);


if(options.length===0){

const noOptions=
document.createElement("div");

noOptions.className="empty";

noOptions.textContent=
"Options are not available for this saved question.";

card.appendChild(noOptions);

}else{

options.forEach(
function(option,optionIndex){

const button=
document.createElement("button");

button.className="option";

button.textContent=
getOptionText(option);


button.onclick=
function(){

selectAnswer(
index,
optionIndex,
card
);

};


card.appendChild(button);

});

}


app.appendChild(card);

}


/* =====================================
GET QUESTION TEXT
===================================== */

function getQuestionText(q){

return (

q.question ||

q.text ||

q.questionText ||

q.title ||

"Question text unavailable"

);

}


/* =====================================
GET OPTIONS
===================================== */

function getOptions(q){

let options=
q.options ||
q.choices ||
q.answers ||
[];


if(Array.isArray(options)){

return options;

}


if(
typeof options==="object" &&
options!==null
){

return Object.values(options);

}


return [];

}


/* =====================================
OPTION TEXT
===================================== */

function getOptionText(option){

if(
typeof option==="object" &&
option!==null
){

return (

option.text ||

option.label ||

option.value ||

JSON.stringify(option)

);

}

return String(option);

}


/* =====================================
SELECT ANSWER
===================================== */

function selectAnswer(
questionIndex,
optionIndex,
card
){

if(submitted)return;


selectedAnswers[
questionIndex
]=optionIndex;


const buttons=
card.querySelectorAll(
".option"
);


buttons.forEach(
function(button,index){

button.classList.remove(
"selected"
);

if(index===optionIndex){

button.classList.add(
"selected"
);

}

});

}


/* =====================================
FIND CORRECT ANSWER
===================================== */

function getCorrectIndex(q){

if(
typeof q.correctIndex==="number"
){

return q.correctIndex;

}


if(
typeof q.answerIndex==="number"
){

return q.answerIndex;

}


if(
typeof q.correctOption==="number"
){

return q.correctOption;

}


if(
typeof q.correct==="number"
){

return q.correct;

}


/* Numeric strings */

if(
q.correctIndex!==undefined &&
!isNaN(Number(q.correctIndex))
){

return Number(q.correctIndex);

}


/* Answer can be A/B/C/D */

const answer=
q.correctAnswer ??
q.answer;


if(typeof answer==="string"){

const value=
answer.trim().toUpperCase();


if(
["A","B","C","D","E"].includes(value)
){

return value.charCodeAt(0)-65;

}


const options=
getOptions(q);


for(
let i=0;
i<options.length;
i++
){

if(
getOptionText(options[i])
.trim()
.toLowerCase()
===
answer
.trim()
.toLowerCase()
){

return i;

}

}

}


return null;

}


/* =====================================
CHECK ANSWER
===================================== */

function isCorrect(
q,
selected
){

const correct=
getCorrectIndex(q);


if(correct===null){

return false;

}


return Number(selected)===Number(correct);

}


/* =====================================
SUBMIT
===================================== */

function submitTest(){

if(submitted)return;


submitted=true;


let correct=0;
let wrong=0;
let skipped=0;


questions.forEach(
function(q,index){

const selected=
selectedAnswers[index];


if(selected===undefined){

skipped++;

return;

}


if(
isCorrect(q,selected)
){

correct++;

}else{

wrong++;

}

});


saveRetryResult(
correct,
wrong,
skipped
);


showResult(
correct,
wrong,
skipped
);

}


/* =====================================
SAVE RETRY RESULT
===================================== */

function saveRetryResult(
correct,
wrong,
skipped
){

let retryHistory=[];


try{

retryHistory=
JSON.parse(
localStorage.getItem(
"retryHistory"
) || "[]"
);

if(!Array.isArray(retryHistory)){

retryHistory=[];

}

}catch(e){

retryHistory=[];

}


retryHistory.push({

date:
new Date().toLocaleString(),

total:
questions.length,

correct:
correct,

wrong:
wrong,

skipped:
skipped,

accuracy:
questions.length===0
?
0
:
Math.round(
(correct/questions.length)*100
)

});


localStorage.setItem(
"retryHistory",
JSON.stringify(
retryHistory
)
);

}


/* =====================================
RESULT
===================================== */

function showResult(
correct,
wrong,
skipped
){

const total=
questions.length;


const accuracy=
total===0
?
0
:
Math.round(
(correct/total)*100
);


const app=
document.getElementById("app");


app.innerHTML=
`
<div class="card result">

<h2>🔄 Retry Complete</h2>

<div class="score">
${correct}/${total}
</div>

<p>
<strong>Accuracy: ${accuracy}%</strong>
</p>

<p>✅ Correct: ${correct}</p>

<p>❌ Wrong: ${wrong}</p>

<p>⏭️ Skipped: ${skipped}</p>

<br>

<button
class="back"
onclick="location.href='mistake.html'">

🧠 Back to Mistake Bank

</button>

<br><br>

<button
class="back"
onclick="location.href='analysis.html'">

📊 Open Performance Dashboard

</button>

</div>
`;

}


/* =====================================
ESCAPE
===================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
