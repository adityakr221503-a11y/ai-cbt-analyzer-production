<script>

let retryQuestions = [];
let currentIndex = 0;
let selectedAnswer = null;
let submitted = false;

function normalize(value){
    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");
}

function getHistory(){
    try{
        const data = JSON.parse(
            localStorage.getItem("cbtHistory") || "[]"
        );
        return Array.isArray(data) ? data : [];
    }catch(e){
        return [];
    }
}

function getMastered(){
    try{
        const data = JSON.parse(
            localStorage.getItem("cbtMasteryV2") || "[]"
        );

        if(!Array.isArray(data)) return new Set();

        return new Set(
            data
                .filter(x => x && x.question)
                .map(x => normalize(x.question))
        );
    }catch(e){
        return new Set();
    }
}


/* =====================================================
   IMPORTANT:
   LOAD THE QUESTION SELECTED BY "PRACTICE AGAIN"
===================================================== */

function getDirectRetryQuestion(){

    try{

        const raw =
            localStorage.getItem("cbtRetryQuestion");

        if(!raw){
            return null;
        }

        const q = JSON.parse(raw);

        if(
            !q ||
            !q.question ||
            !Array.isArray(q.options)
        ){
            return null;
        }

        return {

            id:
                q.id ||
                "retry-" + Date.now(),

            question:
                q.question,

            options:
                q.options,

            subject:
                q.subject || "Unknown",

            topic:
                q.topic || "Unknown",

            correctIndex:
                Number(q.correctIndex),

            correctAnswer:
                q.correctAnswer ||
                q.options[Number(q.correctIndex)] ||
                "",

            solution:
                q.solution ||
                "Solution not available.",

            mistakeType:
                q.mistakeType ||
                "Not Classified",

            mistakeReason:
                q.mistakeReason ||
                ""

        };

    }catch(e){

        console.error(
            "Direct retry question error:",
            e
        );

        return null;

    }

}


/* =====================================================
   BUILD RETRY LIST
===================================================== */

function buildRetryQuestions(){

    retryQuestions = [];

    const direct =
        getDirectRetryQuestion();

    /*
       Practice Again has priority.
    */

    if(direct){

        retryQuestions.push(direct);

        return;
    }


    /*
       Otherwise load active mistakes.
    */

    const history = getHistory();

    const mastered = getMastered();

    const map = new Map();


    history.forEach(function(test){

        if(
            !test ||
            !Array.isArray(test.questions)
        ){
            return;
        }


        test.questions.forEach(function(q){

            if(
                !q ||
                !q.question
            ){
                return;
            }


            if(
                q.status !== "wrong" ||
                q.mastered === true ||
                q.masteryStatus === "Mastered"
            ){
                return;
            }


            const key =
                normalize(q.question);


            if(mastered.has(key)){
                return;
            }


            map.set(key,{

                id:
                    q.id ||
                    "retry-" + key,

                question:
                    q.question,

                options:
                    Array.isArray(q.options)
                    ? q.options
                    : [],

                subject:
                    q.subject || "Unknown",

                topic:
                    q.topic || "Unknown",

                correctIndex:
                    Number(q.correctIndex),

                correctAnswer:
                    q.correctAnswer ||
                    (
                        Array.isArray(q.options)
                        ? q.options[
                            Number(q.correctIndex)
                          ]
                        : ""
                    ),

                solution:
                    q.solution ||
                    "Solution not available.",

                mistakeType:
                    q.mistakeType ||
                    "Not Classified",

                mistakeReason:
                    q.mistakeReason ||
                    ""

            });

        });

    });


    retryQuestions =
        Array.from(map.values());

}


/* =====================================================
   SHOW / HIDE
===================================================== */

function showRetry(){

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("empty")
        .style.display = "none";

    document.getElementById("resultCard")
        .style.display = "none";

    document.getElementById("retryCard")
        .style.display = "block";

}


function showEmpty(){

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("retryCard")
        .style.display = "none";

    document.getElementById("resultCard")
        .style.display = "none";

    document.getElementById("empty")
        .style.display = "block";

}


/* =====================================================
   RENDER
===================================================== */

function renderQuestion(){

    if(!retryQuestions.length){

        showEmpty();
        return;

    }


    if(
        currentIndex >= retryQuestions.length
    ){

        location.href = "mistake.html";
        return;

    }


    const q =
        retryQuestions[currentIndex];


    selectedAnswer = null;
    submitted = false;


    showRetry();


    document.getElementById("subject")
        .textContent =
        q.subject;


    document.getElementById("topic")
        .textContent =
        q.topic;


    document.getElementById("question")
        .textContent =
        q.question;


    document.getElementById("progressBar")
        .style.width =
        (
            ((currentIndex + 1) /
            retryQuestions.length) * 100
        ) + "%";


    const options =
        document.getElementById("options");

    options.innerHTML = "";


    q.options.forEach(function(option,index){

        const button =
            document.createElement("button");


        button.type = "button";

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;


        button.onclick = function(){

            if(submitted) return;

            selectedAnswer = index;


            document
                .querySelectorAll(".option")
                .forEach(function(btn,i){

                    btn.classList.toggle(
                        "selected",
                        i === index
                    );

                });

        };


        options.appendChild(button);

    });


    const check =
        document.getElementById("checkButton");

    check.disabled = false;

    check.textContent =
        "Check Answer";

}


/* =====================================================
   CHECK
===================================================== */

function checkAnswer(){

    if(submitted) return;


    if(selectedAnswer === null){

        alert(
            "Please select an answer first."
        );

        return;

    }


    submitted = true;


    const q =
        retryQuestions[currentIndex];


    const correctIndex =
        Number(q.correctIndex);


    const correct =
        selectedAnswer === correctIndex;


    document
        .querySelectorAll(".option")
        .forEach(function(button,index){

            button.disabled = true;


            if(index === correctIndex){

                button.classList.add(
                    "correct"
                );

            }


            if(
                index === selectedAnswer &&
                !correct
            ){

                button.classList.add(
                    "wrong"
                );

            }

        });


    saveRetryAttempt(
        q,
        correct
    );


    if(correct){

        markMastered(q);

        showSuccess(q);

    }else{

        showFailure(q);

    }

}


/* =====================================================
   SAVE RETRY
===================================================== */

function saveRetryAttempt(q,correct){

    let attempts = [];

    try{

        attempts =
            JSON.parse(
                localStorage.getItem(
                    "cbtRetryHistory"
                ) || "[]"
            );

        if(!Array.isArray(attempts)){
            attempts = [];
        }

    }catch(e){

        attempts = [];

    }


    attempts.push({

        question:
            q.question,

        subject:
            q.subject,

        topic:
            q.topic,

        selectedIndex:
            selectedAnswer,

        selectedAnswer:
            q.options[selectedAnswer] || "",

        correctIndex:
            q.correctIndex,

        correctAnswer:
            q.correctAnswer,

        correct:
            correct,

        date:
            new Date().toISOString()

    });


    localStorage.setItem(
        "cbtRetryHistory",
        JSON.stringify(attempts)
    );

}


/* =====================================================
   MASTERED — FINAL FIX
===================================================== */

function markMastered(q){

    const key =
        normalize(q.question);


    /* SAVE MASTERY */

    let mastery = [];

    try{

        mastery =
            JSON.parse(
                localStorage.getItem(
                    "cbtMasteryV2"
                ) || "[]"
            );

        if(!Array.isArray(mastery)){
            mastery = [];
        }

    }catch(e){

        mastery = [];

    }


    const exists =
        mastery.some(function(item){

            return (
                item &&
                item.question &&
                normalize(item.question) === key
            );

        });


    if(!exists){

        mastery.push({

            type:
                "mastery",

            id:
                q.id,

            question:
                q.question,

            options:
                q.options,

            subject:
                q.subject,

            topic:
                q.topic,

            correctIndex:
                Number(q.correctIndex),

            correctAnswer:
                q.correctAnswer,

            solution:
                q.solution,

            mistakeType:
                q.mistakeType,

            mistakeReason:
                q.mistakeReason,

            masteredAt:
                new Date().toISOString(),

            source:
                "Retry Engine"

        });

    }


    localStorage.setItem(
        "cbtMasteryV2",
        JSON.stringify(mastery)
    );


    /* UPDATE HISTORY */

    const history =
        getHistory();


    history.forEach(function(test){

        if(
            !test ||
            !Array.isArray(test.questions)
        ){
            return;
        }


        test.questions.forEach(function(question){

            if(
                question &&
                question.question &&
                normalize(question.question) === key
            ){

                /*
                 IMPORTANT:
                 WRONG → MASTERED
                */

                question.status =
                    "mastered";

                question.mastered =
                    true;

                question.masteryStatus =
                    "Mastered";

                question.retryMastered =
                    true;

                question.retryCorrect =
                    true;

                question.masteredAt =
                    new Date().toISOString();

            }

        });

    });


    localStorage.setItem(
        "cbtHistory",
        JSON.stringify(history)
    );


    /*
       REMOVE DIRECT RETRY TARGET
       AFTER SUCCESS
    */

    localStorage.removeItem(
        "cbtRetryQuestion"
    );


    localStorage.setItem(
        "cbtLastMasteryStatus",
        "mastered"
    );

}


/* =====================================================
   SUCCESS
===================================================== */

function showSuccess(q){

    document.getElementById("retryCard")
        .style.display = "none";


    document.getElementById("resultCard")
        .style.display = "block";


    document.getElementById("resultIcon")
        .textContent = "🏆";


    document.getElementById("resultTitle")
        .textContent =
        "Mastery Achieved!";


    document.getElementById("resultMessage")
        .innerHTML =
        "Excellent! You answered the question correctly on retry.";


    document.getElementById("resultDetails")
        .innerHTML = `

        <div class="solution">

        <strong>🏆 Mastered</strong>

        <br><br>

        This question is now saved in
        <strong>Mastered Questions</strong>.

        <br><br>

        <strong>Solution:</strong>

        <br><br>

        ${escapeHTML(q.solution)}

        </div>

        `;


    const next =
        document.getElementById("nextButton");


    next.style.display = "block";

    next.textContent =
        currentIndex <
        retryQuestions.length - 1
        ?
        "🔄 Retry Next Mistake"
        :
        "🧠 Back to Mistake Bank";

}


/* =====================================================
   FAILURE
===================================================== */

function showFailure(q){

    document.getElementById("retryCard")
        .style.display = "none";


    document.getElementById("resultCard")
        .style.display = "block";


    document.getElementById("resultIcon")
        .textContent = "🔁";


    document.getElementById("resultTitle")
        .textContent =
        "Not Mastered Yet";


    document.getElementById("resultMessage")
        .innerHTML =
        "The question remains in your Mistake Bank. Review the concept and try again later.";


    document.getElementById("resultDetails")
        .innerHTML = `

        <div class="solution failure">

        <strong>❌ Correct Answer</strong>

        <br><br>

        ${escapeHTML(q.correctAnswer)}

        <br><br>

        <strong>💡 Solution</strong>

        <br><br>

        ${escapeHTML(q.solution)}

        </div>

        `;


    const next =
        document.getElementById("nextButton");


    next.style.display = "block";

    next.textContent =
        currentIndex <
        retryQuestions.length - 1
        ?
        "🔄 Try Next Mistake"
        :
        "🧠 Back to Mistake Bank";

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    if(
        currentIndex <
        retryQuestions.length - 1
    ){

        currentIndex++;

        renderQuestion();

    }else{

        location.href =
            "mistake.html";

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

buildRetryQuestions();

if(retryQuestions.length){

    renderQuestion();

}else{

    showEmpty();

}

</script>
