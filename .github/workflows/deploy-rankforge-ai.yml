name: Deploy RankForge AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "rankforge-ai-worker/**"
      - ".github/workflows/deploy-rankforge-ai.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: rankforge-ai-worker
          command: deploy

      - name: Deployment complete
        run: |
          echo "======================================"
          echo "✅ RANKFORGE AI WORKER DEPLOYED"
          echo "======================================"
