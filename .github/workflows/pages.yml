name: RankForge checks

# Pages is served from the main branch, so this workflow never deploys.
# It only runs the repo health check so a broken push is visible straight away.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify RankForge
        run: node tools/verify.js
