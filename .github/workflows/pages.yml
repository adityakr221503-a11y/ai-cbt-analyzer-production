name: Deploy RankForge Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify (syntax, links, protected bank, learning loop)
        run: node tools/verify.js

      - name: Build site (app files only)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git*' --exclude='.github' --exclude='_site' --exclude='node_modules' \
            --exclude='tools' --exclude='server' --exclude='android' --exclude='.cloudflare-dist' \
            --exclude='.rankforge-web' --exclude='rankforge-ai-worker' --exclude='rankforge-local-ai' \
            --exclude='rankforge-lecture-security/server' \
            --exclude='*.md' --exclude='*.sh' --exclude='*.py' --exclude='*.txt' \
            --exclude='package*.json' --exclude='wrangler.jsonc' --exclude='capacitor.config.json'
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
