name: RankForge Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/rankforge-android.yml"
      - "capacitor.config.json"
      - "package.json"
      - "*.html"
      - "*.js"
      - "*.css"
      - "data/**"
      - ".rankforge-web/**"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo
          echo "Installed SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null \
            | head -80 || true

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify RankForge App ID
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'com.adityakumar.rankforge' \
            capacitor.config.json

          echo "[PASS] Capacitor App ID = com.adityakumar.rankforge"

      - name: Verify Biology 7,196 bank
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="96e0924b0f35de055eec14ac06c25c7f24b9631bce50126a24175684f5eca336"

          if [ -f "data/BIOLOGY_ACTIVE_BANK.json" ]; then
            ACTUAL="$(sha256sum data/BIOLOGY_ACTIVE_BANK.json | awk '{print $1}')"

            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "[FAIL] Biology bank SHA mismatch."
              exit 1
            fi

            echo "[PASS] Biology bank exact."
          else
            echo "[INFO] Biology bank not present in repository root."
            echo "[INFO] Continuing with repository web assets."
          fi

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install

      - name: Ensure Capacitor Android platform
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "android/app/build.gradle" ]; then
            echo "[INFO] Android platform is not committed."
            echo "[INFO] Generating Android platform from Capacitor config..."
            npx cap add android
          else
            echo "[PASS] Android platform already present."
          fi

          test -f "android/app/build.gradle"
          test -f "android/gradlew"

          echo "[PASS] Android platform ready"

      - name: Prepare RankForge web assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d ".rankforge-web" ]; then
            mkdir -p ".rankforge-web"

            find . -maxdepth 1 \
              -type f \
              \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" \) \
              -exec cp -f {} ".rankforge-web/" \;

            [ -d "data" ] && cp -R data ".rankforge-web/" || true
          fi

          test -f ".rankforge-web/index.html"

          echo "[PASS] RankForge web assets prepared"

      - name: Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'com.adityakumar.rankforge' \
            android/app/build.gradle

          if grep -q 'proguard-android.txt' android/app/build.gradle; then
            echo "[FAIL] Obsolete ProGuard configuration detected."
            exit 1
          fi

          echo "[PASS] Android Gradle configuration"

      - name: Build RankForge Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "[PASS] APK created"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload RankForge APK
        uses: actions/upload-artifact@v4
        with:
          name: RankForge-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
