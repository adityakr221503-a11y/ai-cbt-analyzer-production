name: RankForge Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Android wrapper
        run: |
          mkdir -p android-wrapper/www
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='android-wrapper' \
            ./ android-wrapper/www/

      - name: Create Capacitor package
        working-directory: android-wrapper
        run: |
          cat > package.json <<'JSON'
          {
            "name": "rankforge-android",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.rankforge.ai",
            "appName": "RankForge AI",
            "webDir": "www"
          }
          JSON

          npm install
          npx cap add android
          npx cap sync android

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android-wrapper/rankforge-upload.jks

            python3 - <<'PY'
from pathlib import Path

p = Path("android-wrapper/android/app/build.gradle")
s = p.read_text()

if "rankforge-upload.jks" not in s:
    s = s.replace(
        "android {",
        """android {
    signingConfigs {
        release {
            storeFile file("../../rankforge-upload.jks")
            storePassword System.getenv("KS_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
""",
        1
    )

    s = s.replace(
        "buildTypes {",
        """buildTypes {
        release {
            signingConfig signingConfigs.release
        }
""",
        1
    )

    p.write_text(s)
PY
          else
            echo "No signing secrets configured; building release AAB."
          fi

      - name: Build Release AAB
        working-directory: android-wrapper/android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rankforge-android-aab
          path: android-wrapper/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup signing key
        if: always()
        run: rm -f android-wrapper/rankforge-upload.jks
