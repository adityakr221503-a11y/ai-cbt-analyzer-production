name: RankForge Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.rankforge-web/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'rankforge-version.json'
      - '.github/workflows/rankforge-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RankForge
        uses: actions/checkout@v4

      - name: Verify protected Biology bank
        shell: bash
        run: |
          set -e
          BANK="$HOME/BIOLOGY_ACTIVE_BANK.json"

          if [ ! -f "data/BIOLOGY_ACTIVE_BANK.json" ]; then
            echo "Canonical bank not in repository root data/"
            echo "Checking BIOLOGY_UNIVERSE source..."
          fi

          FOUND=""
          for f in \
            "data/BIOLOGY_ACTIVE_BANK.json" \
            "BIOLOGY_UNIVERSE/data/BIOLOGY_ACTIVE_BANK.json"
          do
            if [ -f "$f" ]; then
              FOUND="$f"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "Protected bank is not part of repository; continuing."
            echo "The build does NOT regenerate or modify the bank."
            exit 0
          fi

          EXPECTED="96e0924b0f35de055eec14ac06c25c7f24b9631bce50126a24175684f5eca336"
          ACTUAL="$(sha256sum "$FOUND" | awk '{print $1}')"

          echo "Bank: $FOUND"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"
          echo "BIOLOGY BANK INTEGRITY PASS"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -80

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android platform
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          echo "Android API 36 ready"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        run: |
          if [ -d ".rankforge-web" ]; then
            echo ".rankforge-web already exists"
          else
            mkdir -p .rankforge-web

            for f in *.html *.js *.css manifest.json sw.js rankforge-version.json rankforge-update.json; do
              [ -f "$f" ] && cp -f "$f" .rankforge-web/ || true
            done

            [ -d data ] && cp -R data .rankforge-web/ || true
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify application ID
        run: |
          grep -R "com.adityakumar.rankforge" android/app \
            || (echo "Wrong application ID" && exit 1)

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload RankForge APK
        uses: actions/upload-artifact@v4
        with:
          name: RankForge-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
