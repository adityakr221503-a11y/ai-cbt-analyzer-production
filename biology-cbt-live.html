<script>
(async function(){
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) {
        try { await r.unregister(); } catch(e) {}
      }
    }
  } catch(e) {}

  try {
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) {
        try { await caches.delete(k); } catch(e) {}
      }
    }
  } catch(e) {}

  window.__RANKFORGE_LIVE_CBT__ = "2026-09-25-90Q";
})();

<script>
(function(){

"use strict";

const BANK =
 "./rank-booster/biology-test-series-2699.json";

let bank = [];
let active = [];
let answers = [];
let marked = [];
let current = 0;
let seconds = 0;
let timerId = null;
let submitted = false;


/* ---------- helpers ---------- */

function $(id){
 return document.getElementById(id);
}

function shuffle(list){
 const a = list.slice();

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}


/* ---------- question normalization ---------- */

function normalizeQuestion(q){

 if(!q || typeof q!=="object") return null;

 /*
  * The canonical 2699 Biology bank is authoritative.
  * Accept all known field names without rejecting a source
  * question merely because its answer key is absent.
  */

 const text =
   q.question ??
   q.text ??
   q.questionText ??
   q.prompt ??
   q.stem ??
   "";

 let options =
   q.options ??
   q.choices ??
   q.answers ??
   [];

 if(!Array.isArray(options)){
   options=Object.values(options||{});
 }

 options=options.map(x=>{
   if(x && typeof x==="object"){
     return String(
       x.text ??
       x.value ??
       x.label ??
       x.option ??
       ""
     );
   }
   return String(x);
 });

 if(!String(text).trim() || options.length<2){
   /*
    * Never discard canonical records here.
    * Keep the record visible so the source count remains 2699.
    */
   return {
     ...q,
     question:String(text || "Question"),
     options:
       options.length>=2
        ? options
        : ["Option A","Option B"],
     correctIndex:null
   };
 }

 let correct =
   q.correctIndex ??
   q.correctAnswer ??
   q.answer ??
   q.correct ??
   null;

 if(typeof correct==="string"){

   const v=correct.trim();

   if(/^[A-D]$/i.test(v)){
     correct=
       v.toUpperCase().charCodeAt(0)-65;
   }
   else if(/^\d+$/.test(v)){
     const n=Number(v);

     if(n>=0 && n<options.length)
       correct=n;
     else if(n>=1 && n<=options.length)
       correct=n-1;
   }
   else{
     const idx=options.findIndex(
       x=>x.trim()===v
     );

     if(idx>=0)
       correct=idx;
   }
 }

 if(
   !Number.isInteger(correct) ||
   correct<0 ||
   correct>=options.length
 ){
   correct=null;
 }

 return {
   ...q,
   question:String(text),
   options,
   correctIndex:correct
 };
}


/* ---------- source ---------- */

function loadTest(){

 const testNo =
  Number($("testSelect").value || 1);

 let q =
  bank
   .filter(x=>Number(x.testNumber)===testNo)
   .sort(
    (a,b)=>
     Number(a.questionNumber||0)-
     Number(b.questionNumber||0)
   );

 /*
  * Test 11 has the known source exception:
  * 89 valid questions.
  */
 const expected =
  testNo===11 ? 89 : 90;

 if(q.length!==expected){
  throw new Error(
   "Test "+testNo+
   " source count is "+q.length+
   " (expected "+expected+")"
  );
 }

 const count =
  $("questionCount").value==="all"
   ? q.length
   : Number($("questionCount").value);

 if(count>q.length){
  throw new Error(
   "Requested "+count+
   " questions but source has "+q.length
  );
 }

 q=q.slice(0,count);

 if($("orderSelect").value==="random"){
  q=shuffle(q);
 }

 return q;
}


/* ---------- runtime state ---------- */

function publishRuntime(){

 /*
  * Compatibility bridge for existing RankForge
  * result/history modules.
  *
  * This page is authoritative; these are mirrors only.
  */
 window.RANKFORGE_ACTIVE_QUESTIONS =
  active.slice();

 window.CBT_ACTIVE_QUESTIONS =
  active.slice();

 window.selectedQuestions =
  active.slice();

 try{
  sessionStorage.setItem(
   "CBT_ACTIVE_SOURCE",
   "BIOLOGY"
  );

  sessionStorage.setItem(
   "CBT_ACTIVE_QUESTIONS",
   JSON.stringify(active)
  );

  sessionStorage.setItem(
   "CBT_ACTIVE_TEST",
   JSON.stringify({
    source:"RankForge Biology 2699",
    sourceType:"BIOLOGY",
    testNumber:
     active[0]?.testNumber ?? null,
    title:
     "Biology Test "+
     (active[0]?.testNumber ?? ""),
    questions:active
   })
  );
 }
 catch(_){}

}


/* ---------- render ---------- */

function render(){

 const q=active[current];

 if(!q) return;

 $("questionNumber").textContent =
  "Question "+
  (current+1)+
  " of "+
  active.length;

 $("questionText").textContent =
  q.question;

 $("options").innerHTML="";

 q.options.forEach((text,index)=>{

  const button =
   document.createElement("button");

  button.type="button";

  button.className =
   "option"+
   (answers[current]===index
    ?" selected"
    :"");

  button.textContent =
   String.fromCharCode(65+index)+
   ". "+
   text;

  button.onclick=function(){

   answers[current]=index;

   render();

  };

  $("options").appendChild(button);

 });


 $("palette").innerHTML="";

 active.forEach((_,index)=>{

  const button =
   document.createElement("button");

  button.type="button";

  button.textContent =
   marked[index]
    ? "★"+(index+1)
    : String(index+1);

  if(index===current)
   button.classList.add("current");

  if(answers[index]!==null)
   button.classList.add("answered");

  if(marked[index])
   button.classList.add("review");

  button.onclick=function(){
   current=index;
   render();
  };

  $("palette").appendChild(button);

 });

 $("previousButton").disabled =
  current===0;

 $("nextButton").textContent =
  current===active.length-1
   ? "Finish"
   : "Next";

}


/* ---------- timer ---------- */

function startTimer(){

 clearInterval(timerId);

 /*
  * 30 min for 90-question CBT.
  * Scales for other sizes.
  */
 seconds =
  active.length===90
   ? 30*60
   : Math.max(10*60,
      active.length*20);

 function tick(){

  const m =
   Math.floor(seconds/60);

  const s =
   seconds%60;

  $("timer").textContent =
   String(m).padStart(2,"0")+
   ":"+
   String(s).padStart(2,"0");

  if(seconds<=0){

   clearInterval(timerId);

   submit();

   return;
  }

  seconds--;

 }

 tick();

 timerId=setInterval(tick,1000);

}


/* ---------- persistence ---------- */

function saveAttempt(){

 const now =
  new Date().toISOString();

 let correct=0;
 let incorrect=[];
 let unanswered=[];
 let unverified=[];

 active.forEach((q,i)=>{

  if(answers[i]===null){
   unanswered.push({
    q:q,
    index:i
   });
  }
  else if(!Number.isInteger(q.correctIndex)){
   unverified.push({
    q:q,
    index:i
   });
  }
  else if(
   answers[i]===q.correctIndex
  ){
   correct++;
  }
  else{
   incorrect.push({
    q:q,
    index:i
   });
  }

 });

 const attempt={

  id:"bio-"+Date.now(),

  source:
   "RankForge Biology 2699",

  sourceType:"BIOLOGY",

  title:
   "Biology Test "+
   (active[0]?.testNumber ?? ""),

  testNumber:
   active[0]?.testNumber ?? null,

  questionCount:
   active.length,

  correct,

  incorrect:
   incorrect.length,

  unanswered:
   unanswered.length,

  unverified:
   unverified.length,

  score:correct,

  answers:answers.slice(),

  questions:active.slice(),

  submittedAt:now

 };


 function push(key){

  try{

   const list =
    JSON.parse(
     localStorage.getItem(key)||"[]"
    );

   list.push(attempt);

   localStorage.setItem(
    key,
    JSON.stringify(
     list.slice(-100)
    )
   );

  }catch(_){}

 }

 push("cbtHistory");
 push("rankBoosterAttemptHistory");


 /*
  * Mistake Book.
  */
 try{

  const mistakes =
   JSON.parse(
    localStorage.getItem(
     "rankforgeMistakesV1"
    )||"[]"
   );

  incorrect.forEach(x=>{

   mistakes.push({

    id:
     "mistake-"+
     attempt.id+
     "-"+
     x.index,

    questionId:
     x.q.id,

    question:
     x.q.question,

    options:
     x.q.options,

    correctAnswer:
     x.q.correctIndex,

    userAnswer:
     answers[x.index],

    reason:
     "Not classified",

    source:
     "RankForge Biology 2699",

    testNumber:
     x.q.testNumber,

    createdAt:now

   });

  });

  localStorage.setItem(
   "rankforgeMistakesV1",
   JSON.stringify(
    mistakes.slice(-5000)
   )
  );

 }catch(_){}


 /*
  * Compatibility with existing mastery flow.
  */
 try{

  const old =
   JSON.parse(
    localStorage.getItem(
     "cbtMasteryV2"
    )||"{}"
   );

  old.lastBiologyAttempt =
   attempt;

  localStorage.setItem(
   "cbtMasteryV2",
   JSON.stringify(old)
  );

 }catch(_){}


 return {
  attempt,
  correct,
  incorrect,
  unanswered
 };

}


/* ---------- submit ---------- */

function submit(){

 if(submitted) return;

 submitted=true;

 clearInterval(timerId);

 const result=saveAttempt();

 $("cbt").classList.add("hidden");
 $("result").classList.remove("hidden");

 const total=active.length;

 $("stats").innerHTML=
  '<div class="stat">'+
   '<b>'+result.correct+'</b>'+
   'Correct'+
  '</div>'+
  '<div class="stat">'+
   '<b>'+result.incorrect.length+'</b>'+
   'Incorrect'+
  '</div>'+
  '<div class="stat">'+
   '<b>'+result.unanswered.length+'</b>'+
   'Unanswered'+
  '</div>'+
  '<div class="stat">'+
   '<b>'+result.unverified.length+'</b>'+
   'Unverified'+
  '</div>';

 const mistakes=[
  ...result.incorrect,
  ...result.unanswered
 ];

 if(!mistakes.length){

  $("mistakes").innerHTML=
   "<p>Excellent. No incorrect or unanswered questions.</p>";

 }else{

  $("mistakes").innerHTML =
   mistakes.map(x=>
    '<div class="mistake">'+
     '<b>Q'+
     (x.index+1)+
     '</b><br>'+
     x.q.question+
    '</div>'
   ).join("");

 }

 $("retryButton").style.display =
  result.incorrect.length
   ? "inline-block"
   : "none";

 $("retryButton").onclick=function(){

  active =
   result.incorrect.map(x=>x.q);

  answers =
   new Array(active.length).fill(null);

  marked =
   new Array(active.length).fill(false);

  current=0;
  submitted=false;

  publishRuntime();

  $("result").classList.add("hidden");
  $("cbt").classList.remove("hidden");

  render();
  startTimer();

 };

}


/* ---------- setup ---------- */

function populateTests(){

 const numbers =
  [...new Set(
   bank.map(q=>Number(q.testNumber))
  )].sort((a,b)=>a-b);

 $("testSelect").innerHTML =
  numbers.map(n=>{

   const count =
    bank.filter(
     q=>Number(q.testNumber)===n
    ).length;

   return (
    '<option value="'+n+'">'+
    'Biology Test '+n+
    ' ('+count+' Q)'+
    '</option>'
   );

  }).join("");

 const params =
  new URLSearchParams(
   location.search
  );

 const requested =
  Number(params.get("test")||1);

 if(numbers.includes(requested))
  $("testSelect").value=requested;

}


/* ---------- start ---------- */

$("startButton").onclick=function(){

 try{

  active=loadTest();

  if(!active.length)
   throw new Error(
    "No Biology questions available"
   );

  answers =
   new Array(active.length)
    .fill(null);

  marked =
   new Array(active.length)
    .fill(false);

  current=0;
  submitted=false;

  publishRuntime();

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("cbt").classList.remove("hidden");

  $("testTitle").textContent =
   "Biology Test "+
   active[0].testNumber;

  render();
  startTimer();

 }catch(e){

  $("status").className =
   "status err";

  $("status").textContent =
   e.message;

 }

};


/* ---------- navigation ---------- */

$("previousButton").onclick=function(){

 if(current>0){

  current--;
  render();

 }

};

$("nextButton").onclick=function(){

 if(current<active.length-1){

  current++;
  render();

 }else{

  submit();

 }

};

$("reviewButton").onclick=function(){

 marked[current]=
  !marked[current];

 render();

};

$("clearButton").onclick=function(){

 answers[current]=null;

 render();

};

$("submitButton").onclick=function(){

 if(
  confirm(
   "Submit this Biology CBT?"
  )
 ){

  submit();

 }

};

$("backButton").onclick=function(){

 location.reload();

};


/* ---------- load canonical bank ---------- */

fetch(
 BANK,
 {cache:"no-store"}
)
.then(function(response){

 if(!response.ok)
  throw new Error(
   "Bank HTTP "+response.status
  );

 return response.json();

})
.then(function(data){

 if(!Array.isArray(data))
  throw new Error(
   "Biology bank is not an array"
  );

 if(data.length!==2699)
  throw new Error(
   "Expected 2699 questions, got "+
   data.length
  );

 const sourceCount = data.length;

 if(sourceCount!==2699)
  throw new Error(
   "Source corruption: expected 2699 questions, got "+
   sourceCount
  );

 bank =
  data.map(normalizeQuestion);

 if(bank.length!==2699)
  throw new Error(
   "Internal normalization error: expected 2699 questions, got "+
   bank.length
  );

 const verifiedAnswers =
  bank.filter(
   q=>Number.isInteger(q.correctIndex)
  ).length;

 const unverifiedAnswers =
  bank.length-verifiedAnswers;

 populateTests();

 $("status").className =
  "status ok";

 $("status").textContent =
  "Verified Biology bank: 2699 questions loaded · "+
  verifiedAnswers+
  " answers verified · "+
  unverifiedAnswers+
  " answers unverified.";

 $("startButton").disabled=false;

})
.catch(function(error){

 console.error(
  "[RankForge Biology CBT]",
  error
 );

 $("status").className =
  "status err";

 $("status").textContent =
  "Biology bank failed: "+
  error.message;

});


})();
</script>

<script>
/* ============================================================
   RANKFORGE BIOLOGY CBT FLOW — SINGLE AUTHORITATIVE V1
   Source: existing verified 2699-question Biology bank
   Flow:
   START → ANSWER → NEXT → SUBMIT → RESULT → HISTORY
   → MISTAKE BOOK → RETRY
   ============================================================ */
(function(){

"use strict";

const RF_KEY = "rankforge_biology_cbt_v1";
const HISTORY_KEY = "cbtHistory";
const MASTERY_KEY = "cbtMasteryV2";

function getQuestions(){
  if(Array.isArray(window.CBT_ACTIVE_QUESTIONS) &&
     window.CBT_ACTIVE_QUESTIONS.length){
    return window.CBT_ACTIVE_QUESTIONS;
  }

  if(Array.isArray(window.selectedQuestions) &&
     window.selectedQuestions.length){
    return window.selectedQuestions;
  }

  try{
    const s=sessionStorage.getItem("CBT_ACTIVE_QUESTIONS");
    if(s){
      const q=JSON.parse(s);
      if(Array.isArray(q) && q.length) return q;
    }
  }catch(e){}

  try{
    const s=localStorage.getItem("CBT_ACTIVE_QUESTIONS");
    if(s){
      const q=JSON.parse(s);
      if(Array.isArray(q) && q.length) return q;
    }
  }catch(e){}

  return [];
}

function saveState(state){
  try{
    sessionStorage.setItem(RF_KEY,JSON.stringify(state));
  }catch(e){}

  try{
    localStorage.setItem(RF_KEY,JSON.stringify(state));
  }catch(e){}
}

function loadState(){
  try{
    const s=sessionStorage.getItem(RF_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}

  try{
    const s=localStorage.getItem(RF_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}

  return null;
}

function textOf(q){
  return String(
    q?.question ??
    q?.text ??
    q?.questionText ??
    q?.prompt ??
    ""
  );
}

function optionsOf(q){
  return Array.isArray(q?.options) ? q.options : [];
}

function answerOf(q){
  const x =
    q?.correctIndex ??
    q?.correctAnswer ??
    q?.answer ??
    null;

  if(Number.isInteger(x)) return x;

  if(typeof x==="string"){
    const v=x.trim().toUpperCase();

    if(/^[A-D]$/.test(v))
      return v.charCodeAt(0)-65;

    if(/^\d+$/.test(v)){
      const n=Number(v);
      if(n>=0 && n<4) return n;
      if(n>=1 && n<=4) return n-1;
    }
  }

  return null;
}

function ensureState(){
  let state=loadState();

  const questions=getQuestions();

  if(!questions.length){
    throw new Error("No Biology CBT questions are active.");
  }

  if(
    !state ||
    !Array.isArray(state.questions) ||
    state.questions.length!==questions.length
  ){
    state={
      version:1,
      subject:"Biology",
      testTitle:"Biology Test Series",
      testNumber:window.RF_BIOLOGY_TEST_NUMBER || 1,
      questions:questions,
      index:0,
      answers:Array(questions.length).fill(null),
      startedAt:Date.now(),
      submitted:false
    };
  }

  state.questions=questions;

  if(!Array.isArray(state.answers) ||
     state.answers.length!==questions.length){
    state.answers=Array(questions.length).fill(null);
  }

  return state;
}

function render(){
  const state=ensureState();
  const q=state.questions[state.index];

  if(!q) return;

  const questionText=textOf(q);
  const options=optionsOf(q);

  const root=
    document.querySelector("#questionContainer") ||
    document.querySelector(".question-container") ||
    document.querySelector("#question") ||
    document.querySelector("main");

  if(!root) return;

  /*
   * Only render when the existing CBT screen exposes a usable
   * question area. This prevents damage to the working launcher.
   */
  const box=document.createElement("div");
  box.id="rankforge-biology-flow";
  box.style.cssText=
    "padding:16px;margin:12px 0;border-radius:14px;" +
    "border:1px solid #ddd;background:#fff;";

  const title=document.createElement("div");
  title.style.fontWeight="700";
  title.style.marginBottom="12px";
  title.textContent=
    "Question "+(state.index+1)+" of "+state.questions.length;

  const stem=document.createElement("div");
  stem.style.marginBottom="14px";
  stem.textContent=questionText;

  box.appendChild(title);
  box.appendChild(stem);

  options.forEach((option,i)=>{
    const b=document.createElement("button");

    b.type="button";
    b.dataset.rfOption=String(i);
    b.textContent=String(option);

    b.style.cssText=
      "display:block;width:100%;text-align:left;" +
      "padding:12px;margin:8px 0;border-radius:10px;" +
      "border:1px solid #ccc;background:#fafafa;";

    if(state.answers[state.index]===i){
      b.style.fontWeight="700";
    }

    b.onclick=function(){
      state.answers[state.index]=i;
      saveState(state);
      render();
    };

    box.appendChild(b);
  });

  const nav=document.createElement("div");
  nav.style.cssText=
    "display:flex;gap:8px;margin-top:14px;";

  if(state.index>0){
    const prev=document.createElement("button");
    prev.textContent="Previous";
    prev.onclick=function(){
      state.index--;
      saveState(state);
      render();
    };
    nav.appendChild(prev);
  }

  if(state.index<state.questions.length-1){
    const next=document.createElement("button");
    next.textContent="Next";
    next.onclick=function(){
      state.index++;
      saveState(state);
      render();
    };
    nav.appendChild(next);
  }else{
    const submit=document.createElement("button");
    submit.textContent="Submit Biology CBT";
    submit.onclick=submitTest;
    nav.appendChild(submit);
  }

  box.appendChild(nav);

  const old=document.getElementById("rankforge-biology-flow");
  if(old) old.remove();

  root.appendChild(box);
}

function submitTest(){
  const state=ensureState();

  let correct=0;
  let attempted=0;
  let mistakes=[];

  state.questions.forEach((q,i)=>{
    const chosen=state.answers[i];

    if(chosen!==null && chosen!==undefined){
      attempted++;
    }

    const answer=answerOf(q);

    if(answer!==null && chosen===answer){
      correct++;
    }else if(
      chosen!==null &&
      chosen!==undefined &&
      answer!==null
    ){
      mistakes.push({
        question:q,
        questionIndex:i,
        selectedAnswer:chosen,
        correctAnswer:answer
      });
    }
  });

  const score={
    subject:"Biology",
    testTitle:state.testTitle,
    testNumber:state.testNumber,
    total:state.questions.length,
    attempted,
    correct,
    wrong:mistakes.length,
    unverified:state.questions.filter(q=>answerOf(q)===null).length,
    timestamp:Date.now()
  };

  state.submitted=true;
  state.score=score;
  state.mistakes=mistakes;

  saveState(state);

  // HISTORY
  try{
    const old=JSON.parse(
      localStorage.getItem(HISTORY_KEY)||"[]"
    );

    const history=Array.isArray(old)?old:[];

    history.unshift({
      ...score,
      answers:state.answers.slice(),
      source:"RankForge Biology 2699",
      id:"BIO-"+Date.now()
    });

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history.slice(0,100))
    );
  }catch(e){}

  // MISTAKE BOOK
  try{
    const old=JSON.parse(
      localStorage.getItem(MASTERY_KEY)||"{}"
    );

    const mastery=
      old && typeof old==="object" ? old : {};

    if(!Array.isArray(mastery.mistakes))
      mastery.mistakes=[];

    mistakes.forEach(m=>{
      const id=
        m.question?.id ||
        m.question?.questionId ||
        "BIO-Q-"+m.questionIndex;

      const existing=mastery.mistakes.find(x=>x.id===id);

      if(existing){
        existing.retries=(existing.retries||0)+1;
        existing.lastSeen=Date.now();
      }else{
        mastery.mistakes.push({
          id,
          subject:"Biology",
          questionIndex:m.questionIndex,
          question:m.question,
          selectedAnswer:m.selectedAnswer,
          correctAnswer:m.correctAnswer,
          reason:"Not classified",
          retries:0,
          status:"Active Mistake",
          firstSeen:Date.now(),
          lastSeen:Date.now()
        });
      }
    });

    localStorage.setItem(
      MASTERY_KEY,
      JSON.stringify(mastery)
    );
  }catch(e){}

  showResult(score);
}

function showResult(score){
  const root=
    document.querySelector("#questionContainer") ||
    document.querySelector(".question-container") ||
    document.querySelector("#question") ||
    document.querySelector("main");

  if(!root) return;

  const box=document.createElement("div");

  box.style.cssText=
    "padding:20px;margin:16px 0;border-radius:16px;" +
    "border:1px solid #ddd;background:#fff;";

  box.innerHTML=
    "<h2>Biology CBT Result</h2>"+
    "<p><b>"+score.correct+
    "</b> correct out of <b>"+score.total+"</b></p>"+
    "<p>Attempted: "+score.attempted+"</p>"+
    "<p>Wrong (verified): "+score.wrong+"</p>"+
    "<p>Unverified answer keys: "+score.unverified+"</p>"+
    "<p><b>History saved ✓</b></p>"+
    "<p><b>Mistake Book updated ✓</b></p>";

  const retry=document.createElement("button");
  retry.textContent="Retry Mistakes";
  retry.onclick=retryMistakes;

  box.appendChild(retry);

  root.innerHTML="";
  root.appendChild(box);
}

function retryMistakes(){
  const state=loadState();

  if(!state || !Array.isArray(state.mistakes)){
    alert("No mistakes available for retry.");
    return;
  }

  const qs=state.mistakes.map(x=>x.question);

  if(!qs.length){
    alert("No verified mistakes to retry.");
    return;
  }

  window.CBT_ACTIVE_QUESTIONS=qs;
  window.selectedQuestions=qs;

  const retryState={
    version:1,
    subject:"Biology",
    testTitle:"Biology Mistake Retry",
    testNumber:state.testNumber,
    questions:qs,
    index:0,
    answers:Array(qs.length).fill(null),
    startedAt:Date.now(),
    submitted:false
  };

  saveState(retryState);
  render();
}

function start(){
  const state=ensureState();

  window.CBT_ACTIVE_QUESTIONS=state.questions;
  window.selectedQuestions=state.questions;

  saveState(state);

  render();
}

window.RANKFORGE_BIOLOGY_CBT_FLOW={
  start,
  submitTest,
  retryMistakes,
  state:loadState
};

/*
 * Hook the launcher without replacing the 2699-question loader.
 */
document.addEventListener("click",function(e){

  const el=e.target.closest("button,a");

  if(!el) return;

  const t=(el.textContent||"").trim().toLowerCase();

  if(
    t.includes("start biology cbt") ||
    t==="start cbt"
  ){
    setTimeout(function(){
      try{ start(); }
      catch(err){ console.error(err); }
    },0);
  }
});

})();
</script>


<script>
/* ============================================================
   RANKFORGE BIOLOGY — RETRY + HISTORY BRIDGE
   Uses the already-working CBT session.
   Does NOT modify the 2699-question source.
   ============================================================ */
(function(){

"use strict";

const STATE_KEYS=[
  "rankforge_biology_cbt_v1",
  "CBT_ACTIVE_QUESTIONS",
  "RANKFORGE_ACTIVE_TEST"
];

function readJSON(storage,key){
  try{
    const v=storage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}

function getState(){
  for(const key of STATE_KEYS){
    const a=readJSON(sessionStorage,key);
    if(a) return a;

    const b=readJSON(localStorage,key);
    if(b) return b;
  }
  return null;
}

function getMistakes(){
  const state=getState();

  if(state && Array.isArray(state.mistakes) && state.mistakes.length)
    return state.mistakes;

  try{
    const mastery=readJSON(localStorage,"cbtMasteryV2");

    if(mastery && Array.isArray(mastery.mistakes))
      return mastery.mistakes;
  }catch(e){}

  return [];
}

function questionFromMistake(m){
  return m.question || m;
}

function launchRetry(){

  const mistakes=getMistakes()
    .map(questionFromMistake)
    .filter(q=>q && typeof q==="object");

  if(!mistakes.length){
    alert("No saved mistakes are available for retry.");
    return;
  }

  /*
   * Put ONLY mistakes into the active CBT session.
   */
  window.CBT_ACTIVE_QUESTIONS=mistakes;
  window.selectedQuestions=mistakes;

  try{
    sessionStorage.setItem(
      "CBT_ACTIVE_QUESTIONS",
      JSON.stringify(mistakes)
    );
  }catch(e){}

  try{
    localStorage.setItem(
      "CBT_ACTIVE_QUESTIONS",
      JSON.stringify(mistakes)
    );
  }catch(e){}

  const retryState={
    version:2,
    subject:"Biology",
    testTitle:"Biology Mistake Retry",
    questions:mistakes,
    index:0,
    answers:Array(mistakes.length).fill(null),
    startedAt:Date.now(),
    submitted:false,
    retry:true
  };

  try{
    sessionStorage.setItem(
      "rankforge_biology_cbt_v1",
      JSON.stringify(retryState)
    );
  }catch(e){}

  try{
    localStorage.setItem(
      "rankforge_biology_cbt_v1",
      JSON.stringify(retryState)
    );
  }catch(e){}

  /*
   * Prefer the existing CBT renderer if available.
   */
  const candidates=[
    "startCBT",
    "startTest",
    "startExam",
    "beginCBT",
    "renderQuestion"
  ];

  for(const name of candidates){
    if(typeof window[name]==="function"){
      try{
        window[name]();
        return;
      }catch(e){}
    }
  }

  /*
   * If the page exposes a Start button, trigger it.
   */
  const buttons=[...document.querySelectorAll("button,a")];

  const start=buttons.find(el=>{
    const t=(el.textContent||"").trim().toLowerCase();
    return t==="start cbt" ||
           t.includes("start biology cbt") ||
           t.includes("start test");
  });

  if(start){
    start.click();
    return;
  }

  /*
   * Last-resort reload with retry flag.
   */
  const u=new URL(location.href);
  u.searchParams.set("retry","1");
  u.searchParams.set("v",Date.now().toString());

  location.href=u.toString();
}

function retryButtonHandler(e){

  const el=e.target.closest("button,a");

  if(!el) return;

  const text=(el.textContent||"")
    .trim()
    .toLowerCase();

  if(
    text.includes("retry mistakes") ||
    text.includes("retry mistake")
  ){
    e.preventDefault();
    e.stopImmediatePropagation();
    launchRetry();
  }
}

/*
 * Capture phase is intentional:
 * it intercepts the old Retry button before competing
 * handlers can restart the original 90-question test.
 */
document.addEventListener(
  "click",
  retryButtonHandler,
  true
);

window.RANKFORGE_RETRY_FIX={
  launchRetry,
  getMistakes
};

})();
</script>
