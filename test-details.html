<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Analyzer Pro — Test Details</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#0f172a;
}

header{
background:#fff;
border-bottom:1px solid #e2e8f0;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo span{
color:#4f46e5;
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:800;
font-family:inherit;
cursor:pointer;
touch-action:manipulation;
}

.back{
background:#e2e8f0;
color:#0f172a;
}

.primary{
background:#4f46e5;
color:white;
}

.container{
max-width:1000px;
margin:22px auto;
padding:0 15px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:18px;
box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.hero{
background:#4f46e5;
color:#fff;
border-radius:18px;
padding:24px;
margin-bottom:18px;
}

.hero h1{
margin:0 0 8px;
}

.hero p{
margin:0;
line-height:1.6;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.stat{
background:#f8fafc;
border-radius:12px;
padding:15px;
text-align:center;
}

.stat strong{
display:block;
font-size:24px;
margin-bottom:5px;
}

.stat span{
font-size:13px;
color:#64748b;
font-weight:700;
}

.question{
border:1px solid #e2e8f0;
border-radius:14px;
padding:18px;
margin-top:14px;
}

.question.correct{
border-left:6px solid #16a34a;
}

.question.wrong{
border-left:6px solid #dc2626;
}

.question.skipped{
border-left:6px solid #64748b;
}

.qtop{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}

.badge{
display:inline-block;
padding:6px 9px;
border-radius:8px;
font-size:12px;
font-weight:800;
background:#eef2ff;
color:#3730a3;
}

.correctBadge{
background:#dcfce7;
color:#166534;
}

.wrongBadge{
background:#fee2e2;
color:#991b1b;
}

.skippedBadge{
background:#e2e8f0;
color:#475569;
}

.qtext{
font-size:18px;
font-weight:800;
line-height:1.6;
margin:15px 0;
}

.info{
background:#f8fafc;
border-radius:10px;
padding:13px;
line-height:1.7;
}

.green{
color:#15803d;
font-weight:800;
}

.red{
color:#b91c1c;
font-weight:800;
}

.empty{
text-align:center;
padding:40px 15px;
color:#64748b;
line-height:1.6;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr;
}

.container{
margin:15px auto;
}

.card{
padding:17px;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
CBT Analyzer <span>Pro</span>
</div>

<button
class="back"
type="button"
onclick="goDashboard()">

← Dashboard

</button>

</div>

</header>


<div class="container">

<div id="content"></div>

</div>


<script>

"use strict";


const HISTORY_KEY="cbtHistory";


/* =========================
   DASHBOARD
========================= */

function goDashboard(){

window.location.href="index.html";

}


/* =========================
   READ HISTORY
========================= */

function readHistory(){

try{

const raw=
localStorage.getItem(
HISTORY_KEY
);

if(!raw){
return [];
}

const data=
JSON.parse(raw);

return Array.isArray(data)
?data
:[];

}catch(error){

console.error(error);

return [];

}

}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(value){

return String(
value==null
?""
:value
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   GET TEST INDEX
========================= */

function getTestIndex(){

const params=
new URLSearchParams(
window.location.search
);

const value=
Number(
params.get("test")
);

if(
Number.isInteger(value)
){

return value;

}

return -1;

}


/* =========================
   GET USER ANSWER
========================= */

function getUserAnswer(q){

if(
q.selectedAnswer!==undefined &&
q.selectedAnswer!==null &&
String(q.selectedAnswer)!==""
){

return q.selectedAnswer;

}


if(
q.selectedIndex!==undefined &&
Array.isArray(q.options)
){

const index=
Number(q.selectedIndex);

if(
index>=0 &&
index<q.options.length
){

return q.options[index];

}

}


if(
q.userAnswer!==undefined &&
q.userAnswer!==null
){

return q.userAnswer;

}


return "Not answered";

}


/* =========================
   GET CORRECT ANSWER
========================= */

function getCorrectAnswer(q){

if(
q.correctAnswer!==undefined &&
q.correctAnswer!==null &&
String(q.correctAnswer)!==""
){

return q.correctAnswer;

}


if(
q.correctIndex!==undefined &&
Array.isArray(q.options)
){

const index=
Number(q.correctIndex);

if(
index>=0 &&
index<q.options.length
){

return q.options[index];

}

}


if(
q.answerIndex!==undefined &&
Array.isArray(q.options)
){

const index=
Number(q.answerIndex);

if(
index>=0 &&
index<q.options.length
){

return q.options[index];

}

}


return "Not available";

}


/* =========================
   QUESTION STATUS
========================= */

function getStatus(q){

if(
q.status==="correct" ||
q.correct===true ||
q.isCorrect===true
){

return "correct";

}


if(
q.status==="wrong" ||
q.correct===false ||
q.isCorrect===false
){

return "wrong";

}


return "skipped";

}


/* =========================
   RENDER
========================= */

function render(){

const history=
readHistory();

const index=
getTestIndex();

const content=
document.getElementById(
"content"
);


/* TEST DOES NOT EXIST */

if(
index<0 ||
index>=history.length
){

content.innerHTML=`

<div class="card empty">

<div style="font-size:55px">
🔎
</div>

<h2>
Test Not Found
</h2>

<p>
The selected test could not be found.
</p>

<button
class="primary"
type="button"
onclick="goDashboard()">

← Back to Dashboard

</button>

</div>

`;

return;

}


/* =========================
   TEST
========================= */

const test=
history[index];


const questions=
Array.isArray(test.questions)
?test.questions
:[];


let correct=
Number(test.correct)||0;


let wrong=
Number(
test.incorrect ??
test.wrong
)||0;


let skipped=
Number(test.skipped)||0;


/* =========================
   RECALCULATE
========================= */

if(
questions.length>0
){

correct=0;
wrong=0;
skipped=0;


questions.forEach(
function(q){

const status=
getStatus(q);


if(
status==="correct"
){

correct++;

}

else if(
status==="wrong"
){

wrong++;

}

else{

skipped++;

}

}

);

}


const total=
questions.length ||
(
correct+
wrong+
skipped
);


const score=
test.score!==undefined
?test.score
:(correct*4)-wrong;


const accuracy=
total>0
?Math.round(
(correct/total)*100
)
:0;


/* =========================
   HEADER
========================= */

let html=`

<div class="hero">

<h1>
📋 CBT Test Details
</h1>

<p>
Test #${index+1}
&nbsp; • &nbsp;
📅 ${escapeHTML(
test.date||
test.createdAt||
"Unknown date"
)}
</p>

</div>


<div class="card">

<h2>
📊 Test Summary
</h2>


<div class="stats">

<div class="stat">

<strong>
${escapeHTML(score)}
</strong>

<span>
Score
</span>

</div>


<div class="stat">

<strong>
${correct}
</strong>

<span>
Correct
</span>

</div>


<div class="stat">

<strong>
${wrong}
</strong>

<span>
Wrong
</span>

</div>


<div class="stat">

<strong>
${accuracy}%
</strong>

<span>
Accuracy
</span>

</div>

</div>

</div>


<div class="card">

<h2>
📝 Question-by-Question Review
</h2>

`;


/* =========================
   NO QUESTIONS
========================= */

if(
questions.length===0
){

html+=`

<div class="empty">

<div style="font-size:50px">
📭
</div>

<h3>
No question details saved
</h3>

<p>
This older test contains the score,
but individual question data was not saved.
</p>

</div>

`;

}


/* =========================
   QUESTIONS
========================= */

else{


questions.forEach(
function(q,i){

const status=
getStatus(q);


let className=
"question "+
status;


let badgeClass=
"badge ";


let badgeText="";


if(
status==="correct"
){

badgeClass+=
"correctBadge";

badgeText=
"✅ Correct";

}

else if(
status==="wrong"
){

badgeClass+=
"wrongBadge";

badgeText=
"❌ Wrong";

}

else{

badgeClass+=
"skippedBadge";

badgeText=
"⏭️ Skipped";

}


const userAnswer=
getUserAnswer(q);


const correctAnswer=
getCorrectAnswer(q);


html+=`

<div class="${className}">


<div class="qtop">

<span class="badge">

Question ${i+1}

</span>


<span class="${badgeClass}">

${badgeText}

</span>

</div>


<div class="qtext">

${escapeHTML(
q.question
)}

</div>


<div class="info">


<strong>
Your Answer:
</strong>

<br>


<span class="${
status==="correct"
?"green"
:
status==="wrong"
?"red"
:""
}">

${escapeHTML(
userAnswer
)}

</span>


<br><br>


<strong>
Correct Answer:
</strong>

<br>


<span class="green">

${escapeHTML(
correctAnswer
)}

</span>


${
q.subject
?

`

<br><br>

<strong>
Subject:
</strong>

${escapeHTML(
q.subject
)}

`

:""
}


${
q.topic
?

`

<br>

<strong>
Topic:
</strong>

${escapeHTML(
q.topic
)}

`

:""
}


${
q.solution ||
q.explanation
?

`

<br><br>

<strong>
Solution:
</strong>

<br>

${escapeHTML(
q.solution||
q.explanation
)}

`

:""
}


</div>

</div>

`;

}

);

}


/* =========================
   BACK
========================= */

html+=`

</div>


<div class="card">

<button
class="primary"
type="button"
style="width:100%"
onclick="goDashboard()">

← Back to Dashboard

</button>

</div>

`;


content.innerHTML=
html;

}


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
